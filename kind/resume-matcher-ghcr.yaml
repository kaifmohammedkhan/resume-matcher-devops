apiVersion: v1
kind: ServiceAccount
metadata:
  name: resume-matcher-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-matcher-ghcr
  labels:
    app: resume-matcher-ghcr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-matcher-ghcr
  template:
    metadata:
      labels:
        app: resume-matcher-ghcr
    spec:
      serviceAccountName: resume-matcher-sa
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: ghcr-secret

      initContainers:
        - name: wait-for-db
          image: postgres:15
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done;

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"

      containers:
        - name: resume-matcher-ghcr
          image: ghcr.io/kaifmohammedkhan/resume-matcher-devops:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: secret-volume
              mountPath: /app/secrets
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

      volumes:
        - name: uploads
          emptyDir: {}

        - name: logs
          emptyDir: {}

        - name: config-volume
          configMap:
            name: resume-config

        - name: secret-volume
          secret:
            secretName: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: resume-matcher-ghcr-service
  labels:
    app: resume-matcher-ghcr
spec:
  selector:
    app: resume-matcher-ghcr
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
  type: NodePort