# -------------------------
# PostgreSQL Secret + ConfigMap
# -------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
type: Opaque
stringData:
  DB_USER: resume
  DB_PASSWORD: resume123
  DB_NAME: resume_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-config
  namespace: default
data:
  DB_TYPE: postgres
---
# -------------------------
# PostgreSQL Deployment + Service
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
spec:
  selector:
    app: db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30082
  type: NodePort
---
# -------------------------
# Resume Matcher Deployment + Service
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-matcher
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-matcher
  template:
    metadata:
      labels:
        app: resume-matcher
    spec:
      containers:
        - name: resume-matcher
          image: kaifmohammedkhan123/resume-matcher-devops
          imagePullPolicy: Always
          ports:
            - containerPort: 3000   # app UI
            - containerPort: 51113  # metrics endpoint
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: API_KEY
            - name: GOOGLE_CX_ID
              valueFrom:
                secretKeyRef:
                  name: google-cx-id
                  key: CX_ID
            - name: DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: resume-config
                  key: DB_TYPE
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: uploads
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: resume-matcher-service
  namespace: default
spec:
  selector:
    app: resume-matcher
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
    - name: metrics
      protocol: TCP
      port: 51113
      targetPort: 51113
  type: NodePort
---
# -------------------------
# Prometheus ServiceMonitor
# -------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resume-matcher-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: resume-matcher
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s