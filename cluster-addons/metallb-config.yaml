# metallb-config.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  namespace: metallb-system
  name: kind-pool
spec:
  addresses:
  - 172.18.255.200-172.18.255.250   # ✅ reserved range for LoadBalancer IPs
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  namespace: metallb-system
  name: kind-advertisement
spec:
  ipAddressPools:
  - kind-pool
