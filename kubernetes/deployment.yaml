apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-matcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-matcher
  template:
    metadata:
      labels:
        app: resume-matcher
    spec:
      containers:
        - name: resume-matcher
          image: resume-matcher:latest
          ports:
            - containerPort: 3000
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-creds
                  key: apiKey
            - name: GOOGLE_CX_ID
              valueFrom:
                secretKeyRef:
                  name: google-creds
                  key: cxId