apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-matcher-ghcr
  labels:
    app: resume-matcher-ghcr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: resume-matcher-ghcr
  template:
    metadata:
      labels:
        app: resume-matcher-ghcr
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-db
          image: postgres:15
          command: ['sh', '-c', 'until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done;']
      containers:
        - name: resume-matcher-ghcr
          image: ghcr.io/kaifmohammedkhan/resume-matcher-devops@sha256:93bf1ae503bf73fff15bde879f4b326e718e01c60315468abd6a594e3987cef0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: API_KEY
            - name: GOOGLE_CX_ID
              valueFrom:
                secretKeyRef:
                  name: google-cx-id
                  key: CX_ID
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: secret-volume
              mountPath: /app/secrets
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: uploads
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: config-volume
          configMap:
            name: resume-config
        - name: secret-volume
          secret:
            secretName: db-secret