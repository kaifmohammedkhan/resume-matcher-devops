apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-matcher-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/upstream-vhost: "resume.devops.local"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-matcher-service
                port:
                  number: 3000