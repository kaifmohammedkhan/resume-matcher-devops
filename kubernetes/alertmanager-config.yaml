apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: resume-matcher-email-config
  namespace: default
  labels:
    release: monitoring
spec:
  route:
    receiver: 'email-notifications'
    groupBy: ['alertname']
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 1h
    matchers:
      - name: alertname
        value: ResumeMatcherZeroReplicas
  receivers:
  - name: 'email-notifications'
    emailConfigs:
    - to: 'kaifkhanmohammed718@gmail.com'
      from: 'kaifkhanmohammed718@gmail.com'
      smarthost: 'smtp.gmail.com:587'
      authUsername:
        name: alertmanager-smtp-credentials
        key: smtp-username
      authPassword:
        name: alertmanager-smtp-credentials
        key: smtp-password
      requireTLS: true
      sendResolved: true