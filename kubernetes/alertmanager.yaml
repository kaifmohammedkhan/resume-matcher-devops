apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring-kube-prometheus-alertmanager
  namespace: monitoring
  labels:
    release: monitoring
spec:
  replicas: 1
  secrets:
    - alertmanager-smtp-credentials

  config: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    - equal:
      - namespace
      source_matchers:
      - alertname = InfoInhibitor
      target_matchers:
      - severity = info
    - target_matchers:
      - alertname = InfoInhibitor
    receivers:
    - name: "null"
    - name: "email-notifications"
      email_configs:
      - to: "kaifkhanmohammed718@gmail.com"
        from: "kaifkhanmohammed718@gmail.com"
        smarthost: "smtp.gmail.com:587"
        auth_username: "kaifkhanmohammed718@gmail.com"
        auth_password:
          name: alertmanager-smtp-credentials
          key: smtp-password
        require_tls: true
        send_resolved: true
    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: "null"
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname = "Watchdog"
        receiver: "null"
      - matchers:
        - alertname = "ResumeMatcherZeroReplicas"
        receiver: "email-notifications"
        group_wait: 10s
        repeat_interval: 1h
    templates:
    - /etc/alertmanager/config/*.tmpl