apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring-kube-prometheus-alertmanager
  namespace: monitoring
  labels:
    release: monitoring
spec:
  replicas: 1
  # Tells the operator to mount your script's SMTP secret into the pod
  secrets:
    - alertmanager-smtp-credentials

  # 👇 Add these two blocks so the operator discovers your AlertmanagerConfig
  alertmanagerConfigSelector:
    matchLabels:
      release: monitoring
      
  alertmanagerConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring