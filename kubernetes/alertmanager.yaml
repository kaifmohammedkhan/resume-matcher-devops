apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring-kube-prometheus-alertmanager
  namespace: monitoring
  labels:
    release: monitoring
spec:
  replicas: 1
  # This tells the operator to mount your script's secret into the pod
  secrets:
    - alertmanager-smtp-credentials
  configStatic: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'your-alerts-email@gmail.com'
      smtp_auth_username: 'your-alerts-email@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp-credentials/smtp-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'resume-matcher-email-receiver'

    receivers:
    - name: 'resume-matcher-email-receiver'
      email_configs:
      - to: 'your-alerts-email@gmail.com'
        send_resolved: true