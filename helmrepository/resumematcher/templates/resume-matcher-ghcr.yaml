apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-app-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumematcher-service-app
spec:
  replicas: {{ .Values.app.replicas | default 1 }}
  selector:
    matchLabels:
      app: resumematcher-service-app
  template:
    metadata:
      labels:
        app: resumematcher-service-app
    spec:
      serviceAccountName: {{ .Release.Name }}-app-sa
      automountServiceAccountToken: false

      imagePullSecrets:
        {{- toYaml .Values.app.imagePullSecrets | nindent 8 }}

      initContainers:
        - name: db-migrator
          image: postgres:15-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h {{ .Release.Name }}-db -p 5432; do echo "waiting for db..."; sleep 2; done;
              psql -h {{ .Release.Name }}-db -U $DB_USER -d $DB_NAME <<EOF
              ...
              EOF
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbSecretName | quote }}
                  key: DB_NAME
            - name: PGPASSWORD
              value: "$(DB_PASSWORD)"

      containers:
        - name: resumematcher-service-app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy | quote }}

          ports:
            - containerPort: {{ .Values.app.ports.http | default 3000 }}
              protocol: TCP
            - containerPort: {{ .Values.app.ports.metrics | default 9090 }}
              protocol: TCP

          env:
            # ... unchanged ...

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: uploads
          emptyDir: {}
        - name: logs
          emptyDir: {}