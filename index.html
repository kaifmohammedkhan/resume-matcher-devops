<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Matcher</title>
    <meta name="description" content="Upload your resume and get matched with real-time job openings using AI." />
    <meta name="theme-color" content="#192230" />

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" content="Resume Matcher" />
    <meta property="og:description" content="AI-powered resume scanning and job matching platform." />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:type" content="website" />
  </head>

  <body class="bg-dark text-white font-sans">
    <div id="root"></div>

    <!-- ✅ React App Entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ✅ API Test Hook -->
    <script type="module">
      (async () => {
        try {
          const res = await fetch('/api/resumes');
          const data = await res.json();
          console.log('📄 Resumes from backend:', data);
        } catch (err) {
          console.error('❌ Failed to fetch resumes:', err);
        }
      })();
    </script>
  </body>
</html>
