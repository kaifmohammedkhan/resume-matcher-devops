name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD JEST COVERAGE
      # ============================================================
      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONARSCANNER SECURELY
      # ============================================================
      - name: Install SonarScanner CLI (secure)
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip \
            -o sonar-scanner.zip

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip.sha256 \
            -o sonar-scanner.zip.sha256

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud Analysis"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Sonar URL: $SONAR_HOST"
          echo "============================================================"

          if [ ! -f "coverage/lcov.info" ]; then
            echo "❌ coverage/lcov.info was not found."
            echo "Available coverage files:"
            find coverage -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "✅ Coverage report found:"
          ls -lh coverage/lcov.info

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=false

      # ============================================================
      # WAIT FOR SONARCLOUD BACKGROUND ANALYSIS
      #
      # SonarScanner uploads the analysis asynchronously.
      # Give SonarCloud time to process it before querying APIs.
      # ============================================================
      - name: Wait for SonarCloud Analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "Waiting for SonarCloud Background Processing"
          echo "============================================================"

          CE_RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --user "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            "$SONAR_HOST/api/ce/component")

          echo "$CE_RESPONSE" > sonar-ce.json

          STATUS=$(jq -r '.current.status // empty' sonar-ce.json)
          TASK_ID=$(jq -r '.current.id // empty' sonar-ce.json)

          echo "Current analysis status: ${STATUS:-UNKNOWN}"
          echo "Task ID: ${TASK_ID:-UNKNOWN}"

          if [ -z "$TASK_ID" ]; then
            echo "⚠️ No active background task was returned."
            echo "Continuing with existing SonarCloud data."
            exit 0
          fi

          for i in $(seq 1 30); do

            TASK_RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --user "$SONAR_TOKEN:" \
              "$SONAR_HOST/api/ce/task?id=$TASK_ID")

            echo "$TASK_RESPONSE" > sonar-task.json

            TASK_STATUS=$(jq -r '.task.status // empty' sonar-task.json)

            echo "SonarCloud task status: $TASK_STATUS"

            if [ "$TASK_STATUS" = "SUCCESS" ]; then
              echo "✅ SonarCloud analysis completed successfully."
              break
            fi

            if [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELED" ]; then
              echo "⚠️ SonarCloud background task ended with status: $TASK_STATUS"
              jq '.' sonar-task.json || true
              break
            fi

            sleep 5

            if [ "$i" -eq 30 ]; then
              echo "⚠️ Timed out waiting for SonarCloud processing."
              echo "Continuing with available SonarCloud data."
            fi

          done

      # ============================================================
      # FETCH ACTIVE SONARCLOUD ISSUES
      # ============================================================
      - name: Fetch SonarCloud Issues
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud Issues API"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "============================================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output sonar-issues.json \
            --write-out "%{http_code}" \
            --user "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "statuses=OPEN,REOPENED" \
            --data-urlencode "ps=500" \
            "$SONAR_HOST/api/issues/search")

          echo "SonarCloud Issues HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SonarCloud Issues API failed:"
            cat sonar-issues.json
            exit 1
          fi

          echo "✅ SonarCloud Issues API succeeded."

          ISSUE_COUNT=$(jq '.issues | length' sonar-issues.json)

          echo "Active issues returned: $ISSUE_COUNT"

      # ============================================================
      # FETCH PROJECT COVERAGE / MEASURES
      # ============================================================
      - name: Fetch SonarCloud Project Measures
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud Measures API"
          echo "============================================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output sonar-measures.json \
            --write-out "%{http_code}" \
            --user "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "metricKeys=coverage,new_coverage,uncovered_lines,uncovered_conditions,new_uncovered_lines,new_uncovered_conditions,lines_to_cover,new_lines_to_cover,conditions_to_cover,new_conditions_to_cover" \
            "$SONAR_HOST/api/measures/component")

          echo "SonarCloud Measures HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SonarCloud Measures API failed:"
            cat sonar-measures.json
            exit 1
          fi

          echo "✅ SonarCloud Measures API succeeded."

          echo "Project measures:"
          jq '.' sonar-measures.json

      # ============================================================
      # FETCH FILE-BY-FILE COVERAGE
      # ============================================================
      - name: Fetch SonarCloud File Coverage
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud Component Tree API"
          echo "============================================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output sonar-components.json \
            --write-out "%{http_code}" \
            --user "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "metricKeys=coverage,new_coverage,uncovered_lines,new_uncovered_lines,uncovered_conditions,new_uncovered_conditions,lines_to_cover,new_lines_to_cover,conditions_to_cover,new_conditions_to_cover" \
            --data-urlencode "ps=500" \
            "$SONAR_HOST/api/measures/component_tree")

          echo "SonarCloud Component Tree HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SonarCloud Component Tree API failed:"
            cat sonar-components.json
            exit 1
          fi

          echo "✅ SonarCloud Component Tree API succeeded."

          COMPONENT_COUNT=$(jq '.components | length' sonar-components.json)

          echo "Files returned: $COMPONENT_COUNT"

      # ============================================================
      # GENERATE REAL-TIME HTML INFOGRAPHIC REPORT
      # ============================================================
      - name: Generate SonarCloud Infographic Report
        if: always()
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          cat > generate-sonar-report.js <<'NODE'
          const fs = require("fs");

          function readJson(file, fallback) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return fallback;
            }
          }

          const issuesData = readJson("sonar-issues.json", { issues: [] });
          const measuresData = readJson("sonar-measures.json", { component: { measures: [] } });
          const componentsData = readJson("sonar-components.json", { components: [] });

          const issues = Array.isArray(issuesData.issues)
            ? issuesData.issues
            : [];

          const measures = Array.isArray(measuresData.component?.measures)
            ? measuresData.component.measures
            : [];

          const components = Array.isArray(componentsData.components)
            ? componentsData.components
            : [];

          function getMeasure(metric) {
            const item = measures.find(m => m.metric === metric);
            return item ? item.value : null;
          }

          function number(value, fallback = 0) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : fallback;
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function formatPercent(value) {
            if (value === null || value === undefined || value === "") {
              return "N/A";
            }

            const parsed = Number(value);

            if (!Number.isFinite(parsed)) {
              return "N/A";
            }

            return `${parsed.toFixed(1)}%`;
          }

          function getMetric(component, metric) {
            const item = component.measures?.find(m => m.metric === metric);
            return item ? item.value : null;
          }

          const highIssues = issues.filter(i => i.severity === "HIGH");
          const mediumIssues = issues.filter(i => i.severity === "MEDIUM");
          const blockerIssues = issues.filter(i => i.severity === "BLOCKER");

          const totalIssues = issues.length;

          const overallCoverage = getMeasure("coverage");
          const newCoverage = getMeasure("new_coverage");

          const uncoveredLines = number(
            getMeasure("uncovered_lines"),
            0
          );

          const uncoveredConditions = number(
            getMeasure("uncovered_conditions"),
            0
          );

          const newUncoveredLines = number(
            getMeasure("new_uncovered_lines"),
            0
          );

          const newUncoveredConditions = number(
            getMeasure("new_uncovered_conditions"),
            0
          );

          const newLinesToCover = number(
            getMeasure("new_lines_to_cover"),
            0
          );

          const newConditionsToCover = number(
            getMeasure("new_conditions_to_cover"),
            0
          );

          const repository = process.env.REPOSITORY;
          const branch = process.env.BRANCH;
          const commit = process.env.COMMIT;
          const shortCommit = commit.substring(0, 7);

          const sonarHost = process.env.SONAR_HOST || "https://sonarcloud.io";

          const sonarDashboard =
            `${sonarHost}/dashboard?id=${encodeURIComponent(process.env.SONAR_PROJECT_KEY)}`;

          const issueUrl = (issue) => {
            if (issue.key) {
              return `${sonarHost}/project/issues?id=${encodeURIComponent(process.env.SONAR_PROJECT_KEY)}&open=${encodeURIComponent(issue.key)}`;
            }

            return sonarDashboard;
          };

          /*
           * Sort files:
           *
           * 1. Highest uncovered new lines
           * 2. Highest uncovered new conditions
           * 3. Lowest new-code coverage
           */
          const fileRows = components
            .map(component => {
              const newCoverageValue = getMetric(component, "new_coverage");

              const uncoveredNewLines = number(
                getMetric(component, "new_uncovered_lines"),
                0
              );

              const uncoveredNewConditions = number(
                getMetric(component, "new_uncovered_conditions"),
                0
              );

              const overallCoverageValue = getMetric(component, "coverage");

              const overallUncoveredLines = number(
                getMetric(component, "uncovered_lines"),
                0
              );

              const newLines = number(
                getMetric(component, "new_lines_to_cover"),
                0
              );

              const newConditions = number(
                getMetric(component, "new_conditions_to_cover"),
                0
              );

              /*
               * SonarCloud can return no new-code metric when the file
               * has no new code. Keep this as N/A instead of inventing
               * a percentage.
               */
              let calculatedNewCoverage = newCoverageValue;

              if (
                (calculatedNewCoverage === null ||
                 calculatedNewCoverage === undefined) &&
                newLines > 0
              ) {
                calculatedNewCoverage =
                  ((newLines - uncoveredNewLines) / newLines) * 100;
              }

              return {
                path: component.path || component.name || "Unknown",
                newCoverage: calculatedNewCoverage,
                uncoveredNewLines,
                uncoveredNewConditions,
                overallCoverage: overallCoverageValue,
                overallUncoveredLines
              };
            })
            .sort((a, b) => {
              if (b.uncoveredNewLines !== a.uncoveredNewLines) {
                return b.uncoveredNewLines - a.uncoveredNewLines;
              }

              if (
                b.uncoveredNewConditions !==
                a.uncoveredNewConditions
              ) {
                return (
                  b.uncoveredNewConditions -
                  a.uncoveredNewConditions
                );
              }

              const ac =
                a.newCoverage === null ||
                a.newCoverage === undefined
                  ? -1
                  : Number(a.newCoverage);

              const bc =
                b.newCoverage === null ||
                b.newCoverage === undefined
                  ? -1
                  : Number(b.newCoverage);

              return ac - bc;
            });

          const fileTable = fileRows.length
            ? fileRows.map(file => `
                <tr>
                  <td class="file-name">
                    ${escapeHtml(file.path)}
                  </td>

                  <td>
                    <span class="${
                      file.newCoverage !== null &&
                      Number(file.newCoverage) < 50
                        ? "danger"
                        : file.newCoverage !== null &&
                          Number(file.newCoverage) < 80
                        ? "warning"
                        : "good"
                    }">
                      ${formatPercent(file.newCoverage)}
                    </span>
                  </td>

                  <td class="${
                    file.uncoveredNewLines > 0
                      ? "danger-text"
                      : "good-text"
                  }">
                    ${file.uncoveredNewLines}
                  </td>

                  <td class="${
                    file.uncoveredNewConditions > 0
                      ? "danger-text"
                      : "good-text"
                  }">
                    ${file.uncoveredNewConditions}
                  </td>

                  <td>
                    ${formatPercent(file.overallCoverage)}
                  </td>

                  <td>
                    ${file.overallUncoveredLines}
                  </td>
                </tr>
              `).join("")
            : `
              <tr>
                <td colspan="6" class="empty">
                  No file-level coverage data returned by SonarCloud.
                </td>
              </tr>
            `;

          function issueTable(issueList, emptyText) {
            if (!issueList.length) {
              return `
                <tr>
                  <td colspan="6" class="empty">
                    ✓ ${emptyText}
                  </td>
                </tr>
              `;
            }

            return issueList.map(issue => `
              <tr>
                <td>
                  <span class="severity ${String(issue.severity).toLowerCase()}">
                    ${escapeHtml(issue.severity)}
                  </span>
                </td>

                <td>
                  ${escapeHtml(issue.rule || "N/A")}
                </td>

                <td class="message">
                  ${escapeHtml(issue.message || "N/A")}
                </td>

                <td class="file-name">
                  ${escapeHtml(
                    issue.component
                      ? issue.component.replace(
                          `${process.env.SONAR_PROJECT_KEY}:`,
                          ""
                        )
                      : "N/A"
                  )}
                </td>

                <td>
                  ${escapeHtml(issue.line || "N/A")}
                </td>

                <td>
                  <a
                    class="review-link"
                    href="${escapeHtml(issueUrl(issue))}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Review
                  </a>
                </td>
              </tr>
            `).join("");
          }

          const html = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              SonarCloud Security & Coverage Report
            </title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 32px;
                background: #0b1220;
                color: #e8eefc;
                font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              .container {
                max-width: 1500px;
                margin: auto;
              }

              .header {
                background: linear-gradient(
                  135deg,
                  #17233b,
                  #101827
                );

                border: 1px solid #33435f;
                border-radius: 18px;
                padding: 28px;
                margin-bottom: 20px;
              }

              h1 {
                margin: 0 0 8px;
                font-size: 28px;
              }

              h2 {
                margin-top: 0;
                font-size: 19px;
              }

              .subtitle {
                color: #9fb0cc;
                margin-bottom: 18px;
              }

              .metadata {
                display: flex;
                flex-wrap: wrap;
                gap: 22px;
                color: #bdd0ee;
                font-size: 13px;
              }

              .metadata strong {
                color: white;
              }

              a {
                color: #65b8ff;
              }

              .dashboard {
                display: grid;
                grid-template-columns:
                  repeat(6, minmax(0, 1fr));

                gap: 14px;
                margin-bottom: 20px;
              }

              .card {
                background: #151f32;
                border: 1px solid #33435f;
                border-radius: 16px;
                padding: 20px;
                min-height: 115px;
              }

              .card-label {
                text-transform: uppercase;
                letter-spacing: .08em;
                font-size: 11px;
                color: #9fb0cc;
              }

              .card-value {
                font-size: 29px;
                font-weight: 800;
                margin-top: 14px;
              }

              .high {
                color: #ff6b81;
              }

              .medium {
                color: #ffb52e;
              }

              .blocker {
                color: #bb7cff;
              }

              .cyan {
                color: #52ddff;
              }

              .green {
                color: #73e69b;
              }

              .section {
                background: #101a2b;
                border: 1px solid #33435f;
                border-radius: 18px;
                padding: 22px;
                margin-bottom: 20px;
              }

              .section-description {
                color: #9fb0cc;
                margin-top: -10px;
                margin-bottom: 20px;
                font-size: 13px;
              }

              .severity-bar {
                height: 18px;
                width: 100%;
                border-radius: 999px;
                overflow: hidden;
                background: #202c42;
                display: flex;
              }

              .severity-high {
                background: #ff647a;
              }

              .severity-medium {
                background: #ffb52e;
              }

              .severity-blocker {
                background: #b875ff;
              }

              .legend {
                display: flex;
                gap: 20px;
                margin-top: 14px;
                color: #aabbd5;
                font-size: 12px;
              }

              .legend span::before {
                content: "";
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 6px;
              }

              .legend .lh::before {
                background: #ff647a;
              }

              .legend .lm::before {
                background: #ffb52e;
              }

              .legend .lb::before {
                background: #b875ff;
              }

              .coverage-grid {
                display: grid;
                grid-template-columns:
                  repeat(5, minmax(0, 1fr));

                gap: 12px;
              }

              .coverage-box {
                background: #172238;
                border: 1px solid #2e3e5a;
                border-radius: 14px;
                padding: 18px;
              }

              .coverage-title {
                color: #94a8c6;
                font-size: 12px;
              }

              .coverage-number {
                font-size: 24px;
                font-weight: 800;
                margin-top: 9px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
              }

              th {
                background: #1b273d;
                color: #b8c8df;
                text-align: left;
                padding: 12px;
                border-bottom: 1px solid #34445e;
              }

              td {
                padding: 12px;
                border-bottom: 1px solid #26364f;
                vertical-align: top;
              }

              tr:hover {
                background: #162238;
              }

              .file-name {
                font-family:
                  ui-monospace,
                  SFMono-Regular,
                  Menlo,
                  Monaco,
                  Consolas,
                  monospace;

                color: #d5e2f6;
              }

              .message {
                max-width: 500px;
              }

              .severity {
                font-weight: 800;
              }

              .severity.high {
                color: #ff6b81;
              }

              .severity.medium {
                color: #ffb52e;
              }

              .severity.blocker {
                color: #bb7cff;
              }

              .danger {
                color: #ff6b81;
                font-weight: 800;
              }

              .warning {
                color: #ffb52e;
                font-weight: 800;
              }

              .good {
                color: #73e69b;
                font-weight: 800;
              }

              .danger-text {
                color: #ff6b81;
                font-weight: 700;
              }

              .good-text {
                color: #73e69b;
              }

              .review-link {
                display: inline-block;
                padding: 5px 10px;
                border-radius: 7px;
                background: #1c3554;
                text-decoration: none;
                font-weight: 700;
              }

              .empty {
                text-align: center;
                color: #73e69b;
                padding: 25px;
              }

              .footer {
                text-align: center;
                color: #7285a4;
                font-size: 12px;
                padding: 20px;
              }

              @media (max-width: 1100px) {
                .dashboard {
                  grid-template-columns:
                    repeat(3, minmax(0, 1fr));
                }

                .coverage-grid {
                  grid-template-columns:
                    repeat(2, minmax(0, 1fr));
                }
              }

              @media (max-width: 700px) {
                body {
                  padding: 14px;
                }

                .dashboard {
                  grid-template-columns: 1fr 1fr;
                }

                .coverage-grid {
                  grid-template-columns: 1fr;
                }

                table {
                  display: block;
                  overflow-x: auto;
                }
              }
            </style>
          </head>

          <body>

            <div class="container">

              <div class="header">

                <h1>
                  SonarCloud Security & Coverage Report
                </h1>

                <div class="subtitle">
                  Security issues, severity distribution and uncovered new code.
                </div>

                <div class="metadata">

                  <span>
                    Repository:
                    <strong>
                      ${escapeHtml(repository)}
                    </strong>
                  </span>

                  <span>
                    Branch:
                    <strong>
                      ${escapeHtml(branch)}
                    </strong>
                  </span>

                  <span>
                    Commit:
                    <strong>
                      ${escapeHtml(shortCommit)}
                    </strong>
                  </span>

                  <span>
                    <a
                      href="${escapeHtml(sonarDashboard)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Open SonarCloud
                    </a>
                  </span>

                </div>

              </div>


              <!-- ================================================= -->
              <!-- SECURITY SUMMARY -->
              <!-- ================================================= -->

              <div class="dashboard">

                <div class="card">
                  <div class="card-label">
                    High Severity
                  </div>

                  <div class="card-value high">
                    ${highIssues.length}
                  </div>
                </div>


                <div class="card">
                  <div class="card-label">
                    Medium Severity
                  </div>

                  <div class="card-value medium">
                    ${mediumIssues.length}
                  </div>
                </div>


                <div class="card">
                  <div class="card-label">
                    Blocker
                  </div>

                  <div class="card-value blocker">
                    ${blockerIssues.length}
                  </div>
                </div>


                <div class="card">
                  <div class="card-label">
                    Total Active Issues
                  </div>

                  <div class="card-value">
                    ${totalIssues}
                  </div>
                </div>


                <div class="card">
                  <div class="card-label">
                    Overall Coverage
                  </div>

                  <div class="card-value cyan">
                    ${formatPercent(overallCoverage)}
                  </div>
                </div>


                <div class="card">
                  <div class="card-label">
                    New Code Coverage
                  </div>

                  <div class="card-value green">
                    ${formatPercent(newCoverage)}
                  </div>
                </div>

              </div>


              <!-- ================================================= -->
              <!-- SEVERITY DISTRIBUTION -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  Security Severity Distribution
                </h2>

                <div class="section-description">
                  Active OPEN and REOPENED SonarCloud issues.
                </div>

                ${
                  totalIssues > 0
                    ? `
                      <div class="severity-bar">

                        <div
                          class="severity-high"
                          style="width:${(
                            highIssues.length /
                            totalIssues *
                            100
                          ).toFixed(2)}%"
                        ></div>

                        <div
                          class="severity-medium"
                          style="width:${(
                            mediumIssues.length /
                            totalIssues *
                            100
                          ).toFixed(2)}%"
                        ></div>

                        <div
                          class="severity-blocker"
                          style="width:${(
                            blockerIssues.length /
                            totalIssues *
                            100
                          ).toFixed(2)}%"
                        ></div>

                      </div>
                    `
                    : `
                      <div class="severity-bar"></div>
                    `
                }

                <div class="legend">

                  <span class="lh">
                    High: ${highIssues.length}
                  </span>

                  <span class="lm">
                    Medium: ${mediumIssues.length}
                  </span>

                  <span class="lb">
                    Blocker: ${blockerIssues.length}
                  </span>

                </div>

              </div>


              <!-- ================================================= -->
              <!-- COVERAGE -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  Coverage Overview
                </h2>

                <div class="coverage-grid">

                  <div class="coverage-box">
                    <div class="coverage-title">
                      Overall Coverage
                    </div>

                    <div class="coverage-number cyan">
                      ${formatPercent(overallCoverage)}
                    </div>
                  </div>


                  <div class="coverage-box">
                    <div class="coverage-title">
                      Coverage on New Code
                    </div>

                    <div class="coverage-number green">
                      ${formatPercent(newCoverage)}
                    </div>
                  </div>


                  <div class="coverage-box">
                    <div class="coverage-title">
                      Uncovered Lines
                    </div>

                    <div class="coverage-number">
                      ${uncoveredLines}
                    </div>
                  </div>


                  <div class="coverage-box">
                    <div class="coverage-title">
                      Uncovered Conditions
                    </div>

                    <div class="coverage-number">
                      ${uncoveredConditions}
                    </div>
                  </div>


                  <div class="coverage-box">
                    <div class="coverage-title">
                      Uncovered New Lines
                    </div>

                    <div class="coverage-number ${
                      newUncoveredLines > 0
                        ? "danger"
                        : "good"
                    }">
                      ${newUncoveredLines}
                    </div>
                  </div>

                </div>

              </div>


              <!-- ================================================= -->
              <!-- HIGH ISSUES -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  🔴 High Severity Issues
                </h2>

                <div class="section-description">
                  ${highIssues.length}
                  active high-severity issue(s).
                </div>

                <table>

                  <thead>
                    <tr>
                      <th>Severity</th>
                      <th>Rule</th>
                      <th>Message</th>
                      <th>File</th>
                      <th>Line</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${issueTable(
                      highIssues,
                      "No active high-severity issues found."
                    )}
                  </tbody>

                </table>

              </div>


              <!-- ================================================= -->
              <!-- MEDIUM ISSUES -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  🟠 Medium Severity Issues
                </h2>

                <div class="section-description">
                  ${mediumIssues.length}
                  active medium-severity issue(s).
                </div>

                <table>

                  <thead>
                    <tr>
                      <th>Severity</th>
                      <th>Rule</th>
                      <th>Message</th>
                      <th>File</th>
                      <th>Line</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${issueTable(
                      mediumIssues,
                      "No active medium-severity issues found."
                    )}
                  </tbody>

                </table>

              </div>


              <!-- ================================================= -->
              <!-- BLOCKER ISSUES -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  🟣 Blocker Issues
                </h2>

                <div class="section-description">
                  ${blockerIssues.length}
                  active blocker issue(s).
                </div>

                <table>

                  <thead>
                    <tr>
                      <th>Severity</th>
                      <th>Rule</th>
                      <th>Message</th>
                      <th>File</th>
                      <th>Line</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${issueTable(
                      blockerIssues,
                      "No active blocker issues found."
                    )}
                  </tbody>

                </table>

              </div>


              <!-- ================================================= -->
              <!-- FILE-BY-FILE NEW CODE COVERAGE -->
              <!-- ================================================= -->

              <div class="section">

                <h2>
                  📊 New Code Coverage by File
                </h2>

                <div class="section-description">
                  Files are sorted by uncovered new lines,
                  then uncovered new conditions,
                  then lowest new-code coverage.
                  Values are retrieved directly from SonarCloud.
                </div>

                <table>

                  <thead>
                    <tr>
                      <th>File</th>
                      <th>New Code Coverage</th>
                      <th>Uncovered New Lines</th>
                      <th>Uncovered New Conditions</th>
                      <th>Overall Coverage</th>
                      <th>Overall Uncovered Lines</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${fileTable}
                  </tbody>

                </table>

              </div>


              <!-- ================================================= -->
              <!-- FOOTER -->
              <!-- ================================================= -->

              <div class="footer">

                Generated automatically by GitHub Actions
                → SonarCloud Security Analysis

                <br>

                Repository:
                ${escapeHtml(repository)}
                |
                Branch:
                ${escapeHtml(branch)}
                |
                Commit:
                ${escapeHtml(shortCommit)}
                |
                Run:
                #${escapeHtml(process.env.RUN_NUMBER)}

              </div>

            </div>

          </body>
          </html>
          `;

          fs.writeFileSync(
            "sonar-summary.html",
            html,
            "utf8"
          );

          console.log(
            "✅ SonarCloud infographic report generated."
          );

          console.log(
            `High: ${highIssues.length}`
          );

          console.log(
            `Medium: ${mediumIssues.length}`
          );

          console.log(
            `Blocker: ${blockerIssues.length}`
          );

          console.log(
            `Total issues: ${totalIssues}`
          );

          console.log(
            `Overall coverage: ${formatPercent(overallCoverage)}`
          );

          console.log(
            `New code coverage: ${formatPercent(newCoverage)}`
          );

          console.log(
            `Uncovered new lines: ${newUncoveredLines}`
          );

          console.log(
            `Uncovered new conditions: ${newUncoveredConditions}`
          );

          console.log(
            `Files returned: ${fileRows.length}`
          );
          NODE

          node generate-sonar-report.js

      # ============================================================
      # UPLOAD SONARCLOUD REPORT
      # ============================================================
      - name: Upload SonarCloud Infographic Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html
          if-no-files-found: warn

      # ============================================================
      # UPLOAD RAW SONARCLOUD DATA FOR DEBUGGING / AUDIT
      # ============================================================
      - name: Upload SonarCloud API Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-api-data
          path: |
            sonar-issues.json
            sonar-measures.json
            sonar-components.json
            sonar-ce.json
            sonar-task.json
          if-no-files-found: ignore