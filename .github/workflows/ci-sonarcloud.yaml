      # ============================================================
      # GENERATE REAL SONARCLOUD REPORT
      # ============================================================
      - name: Generate SonarCloud HTML Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "============================================================"
          echo "Generating SonarCloud HTML report"
          echo "============================================================"

          node generate-sonar-report.mjs

          test -f sonar-summary.html

          echo ""
          echo "Report created:"
          ls -lh sonar-summary.html

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================
      - name: Upload SonarCloud HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html
          if-no-files-found: warn

      # ============================================================
      # UPLOAD RAW SONAR CONFIG / LCOV FOR DEBUGGING
      # ============================================================
      - name: Upload Sonar debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis-debug
          path: |
            sonar-project.properties
            coverage/lcov.info
          if-no-files-found: warn