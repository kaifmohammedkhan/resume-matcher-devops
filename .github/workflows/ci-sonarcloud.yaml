name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Verify coverage report
        run: |
          echo "============================================================"
          echo "Coverage files"
          echo "============================================================"
          find coverage -maxdepth 3 -type f -print || true
          echo "============================================================"

          if [ ! -f "coverage/lcov.info" ]; then
            echo "ERROR: coverage/lcov.info was not found."
            exit 1
          fi

          echo "Found coverage/lcov.info"

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip \
            -o sonar-scanner.zip

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip.sha256 \
            -o sonar-scanner.zip.sha256

          echo "Verifying SonarScanner checksum..."

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          set -e

          echo "============================================================"
          echo "Running SonarCloud Analysis"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Sonar URL: $SONAR_HOST"
          echo "============================================================"

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.branch.name="${GITHUB_REF_NAME}" \
            -Dsonar.qualitygate.wait=false

      # ============================================================
      # VERIFY SONAR TASK FILE
      # ============================================================
      - name: Verify Sonar analysis task
        if: always()
        run: |
          echo "============================================================"
          echo "SonarScanner task information"
          echo "============================================================"

          if [ -f ".scannerwork/report-task.txt" ]; then
            cat .scannerwork/report-task.txt
          else
            echo "WARNING: .scannerwork/report-task.txt was not found."
          fi

      # ============================================================
      # WAIT FOR SONARCLOUD ANALYSIS
      # ============================================================
      - name: Wait for SonarCloud analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          set -e

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "No Sonar task file found."
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "Could not find ceTaskUrl."
            exit 1
          fi

          echo "SonarCloud Compute Engine task:"
          echo "$CE_TASK_URL"

          echo "Waiting for SonarCloud analysis to complete..."

          for i in $(seq 1 30); do

            RESPONSE=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              -sS \
              -u "$SONAR_TOKEN:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // empty')

            echo "Attempt $i/30 - status: $STATUS"

            case "$STATUS" in

              SUCCESS)
                echo "SonarCloud analysis completed successfully."
                exit 0
                ;;

              FAILED|CANCELED)
                echo "SonarCloud analysis failed."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              PENDING|IN_PROGRESS)
                sleep 10
                ;;

              *)
                echo "Unexpected SonarCloud task response:"
                echo "$RESPONSE"
                sleep 10
                ;;

            esac

          done

          echo "Timed out waiting for SonarCloud analysis."
          exit 1

      # ============================================================
      # CREATE ESM SONARCLOUD REPORT GENERATOR
      # ============================================================
      - name: Create SonarCloud report generator
        if: always()
        run: |
          cat > generate-sonar-report.mjs <<'EOF'
          import fs from "node:fs";

          const SONAR_TOKEN = process.env.SONAR_TOKEN;
          const SONAR_HOST = process.env.SONAR_HOST || "https://sonarcloud.io";
          const SONAR_PROJECT_KEY = process.env.SONAR_PROJECT_KEY;
          const SONAR_ORG = process.env.SONAR_ORG;
          const BRANCH = process.env.GITHUB_REF_NAME || "main";
          const REPOSITORY = process.env.GITHUB_REPOSITORY || "unknown";
          const COMMIT = process.env.GITHUB_SHA || "";

          if (!SONAR_TOKEN) {
            throw new Error("SONAR_TOKEN is missing");
          }

          if (!SONAR_PROJECT_KEY) {
            throw new Error("SONAR_PROJECT_KEY is missing");
          }

          if (!SONAR_ORG) {
            throw new Error("SONAR_ORG is missing");
          }

          const baseUrl = SONAR_HOST.replace(/\/+$/, "");

          function buildUrl(path, params = {}) {
            const url = new URL(`${baseUrl}${path}`);

            for (const [key, value] of Object.entries(params)) {
              if (
                value !== undefined &&
                value !== null &&
                value !== ""
              ) {
                url.searchParams.set(key, String(value));
              }
            }

            return url.toString();
          }

          async function sonarApi(path, params = {}) {
            const url = buildUrl(path, params);

            console.log("");
            console.log("============================================================");
            console.log("SonarCloud API");
            console.log("============================================================");
            console.log(`Endpoint: ${path}`);
            console.log(`Project: ${SONAR_PROJECT_KEY}`);
            console.log(`Organization: ${SONAR_ORG}`);
            console.log(`Branch: ${BRANCH}`);
            console.log("============================================================");

            const response = await fetch(url, {
              headers: {
                Authorization:
                  `Basic ${Buffer.from(`${SONAR_TOKEN}:`).toString("base64")}`,
                Accept: "application/json",
              },
            });

            const text = await response.text();

            if (!response.ok) {
              console.error("");
              console.error("============================================================");
              console.error("SONARCLOUD API ERROR");
              console.error("============================================================");
              console.error(`HTTP status: ${response.status}`);
              console.error(`URL: ${url}`);
              console.error("Response:");
              console.error(text);
              console.error("============================================================");

              throw new Error(
                `SonarCloud API returned HTTP ${response.status}`
              );
            }

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(
                `SonarCloud returned non-JSON response: ${text}`
              );
            }
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function number(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
          }

          function formatPercent(value) {
            if (value === undefined || value === null || value === "") {
              return "N/A";
            }

            const parsed = Number(value);

            if (!Number.isFinite(parsed)) {
              return "N/A";
            }

            return `${parsed.toFixed(1)}%`;
          }

          // ==========================================================
          // FETCH PROJECT MEASURES
          // ==========================================================

          const measuresResponse = await sonarApi(
            "/api/measures/component",
            {
              component: SONAR_PROJECT_KEY,
              metricKeys: [
                "coverage",
                "new_coverage",
                "lines_to_cover",
                "uncovered_lines",
                "conditions_to_cover",
                "uncovered_conditions",
                "new_lines_to_cover",
                "new_uncovered_lines",
                "new_conditions_to_cover",
                "new_uncovered_conditions",
              ].join(","),
              branch: BRANCH,
            }
          );

          const measures = {};

          for (const metric of measuresResponse.component?.measures || []) {
            measures[metric.metric] = metric.value;
          }

          // ==========================================================
          // FETCH FILE-LEVEL COVERAGE
          // ==========================================================

          const treeResponse = await sonarApi(
            "/api/measures/component_tree",
            {
              component: SONAR_PROJECT_KEY,
              metricKeys: [
                "coverage",
                "new_coverage",
                "uncovered_lines",
                "new_uncovered_lines",
                "uncovered_conditions",
                "new_uncovered_conditions",
                "lines_to_cover",
                "new_lines_to_cover",
                "conditions_to_cover",
                "new_conditions_to_cover",
              ].join(","),
              branch: BRANCH,
              qualifiers: "FIL",
              ps: 500,
            }
          );

          const files = [];

          for (const component of treeResponse.components || []) {
            const values = {};

            for (const metric of component.measures || []) {
              values[metric.metric] = metric.value;
            }

            files.push({
              path: component.path || component.key || "Unknown",
              coverage: values.coverage,
              newCoverage: values.new_coverage,
              uncoveredLines: number(values.uncovered_lines),
              newUncoveredLines: number(values.new_uncovered_lines),
              uncoveredConditions: number(values.uncovered_conditions),
              newUncoveredConditions: number(
                values.new_uncovered_conditions
              ),
              linesToCover: number(values.lines_to_cover),
              newLinesToCover: number(values.new_lines_to_cover),
              conditionsToCover: number(values.conditions_to_cover),
              newConditionsToCover: number(
                values.new_conditions_to_cover
              ),
            });
          }

          // ==========================================================
          // FETCH ACTIVE ISSUES
          // ==========================================================

          const issuesResponse = await sonarApi(
            "/api/issues/search",
            {
              componentKeys: SONAR_PROJECT_KEY,
              branch: BRANCH,
              statuses: "OPEN,REOPENED",
              ps: 500,
              organization: SONAR_ORG,
            }
          );

          const issues = issuesResponse.issues || [];

          const highIssues = issues.filter(
            issue => issue.severity === "HIGH"
          );

          const mediumIssues = issues.filter(
            issue => issue.severity === "MEDIUM"
          );

          const blockerIssues = issues.filter(
            issue => issue.severity === "BLOCKER"
          );

          // ==========================================================
          // SORT FILES BY UNCOVERED NEW LINES
          // ==========================================================

          files.sort((a, b) => {
            if (b.newUncoveredLines !== a.newUncoveredLines) {
              return b.newUncoveredLines - a.newUncoveredLines;
            }

            return (
              b.newUncoveredConditions -
              a.newUncoveredConditions
            );
          });

          // ==========================================================
          // ISSUE TABLE
          // ==========================================================

          function issueTable(issueList) {
            if (!issueList.length) {
              return `
                <div class="empty">
                  ✓ No active issues found.
                </div>
              `;
            }

            return `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Severity</th>
                      <th>Rule</th>
                      <th>Message</th>
                      <th>File</th>
                      <th>Line</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${issueList.map(issue => `
                      <tr>
                        <td>
                          <span class="badge ${escapeHtml(
                            issue.severity.toLowerCase()
                          )}">
                            ${escapeHtml(issue.severity)}
                          </span>
                        </td>

                        <td>
                          ${escapeHtml(issue.rule || "N/A")}
                        </td>

                        <td>
                          ${escapeHtml(issue.message || "N/A")}
                        </td>

                        <td>
                          ${escapeHtml(
                            issue.component
                              ?.replace(`${SONAR_PROJECT_KEY}:`, "")
                              || "N/A"
                          )}
                        </td>

                        <td>
                          ${escapeHtml(issue.line || "N/A")}
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `;
          }

          // ==========================================================
          // COVERAGE FILE TABLE
          // ==========================================================

          function coverageTable() {
            if (!files.length) {
              return `
                <div class="empty">
                  No file-level coverage data returned by SonarCloud.
                </div>
              `;
            }

            return `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>File</th>
                      <th>New Code Coverage</th>
                      <th>Uncovered New Lines</th>
                      <th>Uncovered New Conditions</th>
                      <th>Overall Coverage</th>
                      <th>Overall Uncovered Lines</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${files.map(file => `
                      <tr>
                        <td class="file">
                          ${escapeHtml(file.path)}
                        </td>

                        <td class="${
                          file.newUncoveredLines > 0
                            ? "danger-text"
                            : "success-text"
                        }">
                          ${formatPercent(file.newCoverage)}
                        </td>

                        <td>
                          ${file.newUncoveredLines}
                        </td>

                        <td>
                          ${file.newUncoveredConditions}
                        </td>

                        <td>
                          ${formatPercent(file.coverage)}
                        </td>

                        <td>
                          ${file.uncoveredLines}
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `;
          }

          const highCount = highIssues.length;
          const mediumCount = mediumIssues.length;
          const blockerCount = blockerIssues.length;
          const totalIssues = issues.length;

          const overallCoverage = measures.coverage;
          const newCoverage = measures.new_coverage;

          const uncoveredLines = number(
            measures.uncovered_lines
          );

          const uncoveredConditions = number(
            measures.uncovered_conditions
          );

          const newUncoveredLines = number(
            measures.new_uncovered_lines
          );

          const newUncoveredConditions = number(
            measures.new_uncovered_conditions
          );

          // ==========================================================
          // HTML
          // ==========================================================

          const html = `
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              SonarCloud Security & Coverage Report
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 32px;
                background: #0b1220;
                color: #f8fafc;
                font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              .container {
                max-width: 1400px;
                margin: auto;
              }

              .hero {
                background: #111b2e;
                border: 1px solid #334155;
                border-radius: 18px;
                padding: 28px;
                margin-bottom: 20px;
              }

              h1 {
                margin: 0 0 8px;
                font-size: 28px;
              }

              h2 {
                margin-top: 0;
              }

              .subtitle {
                color: #93c5fd;
              }

              .metadata {
                margin-top: 18px;
                color: #bfdbfe;
                font-size: 13px;
              }

              .metadata span {
                margin-right: 25px;
              }

              .cards {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(190px, 1fr));
                gap: 14px;
                margin-bottom: 20px;
              }

              .card {
                background: #111b2e;
                border: 1px solid #334155;
                border-radius: 15px;
                padding: 20px;
              }

              .card-label {
                font-size: 12px;
                color: #93c5fd;
                text-transform: uppercase;
                letter-spacing: .06em;
              }

              .card-value {
                font-size: 30px;
                font-weight: 800;
                margin-top: 10px;
              }

              .high {
                color: #ff647c;
              }

              .medium {
                color: #ffb11b;
              }

              .blocker {
                color: #b184ff;
              }

              .success-text {
                color: #7ee787;
              }

              .danger-text {
                color: #ff647c;
                font-weight: 700;
              }

              .section {
                background: #111b2e;
                border: 1px solid #334155;
                border-radius: 18px;
                padding: 22px;
                margin-bottom: 20px;
              }

              .severity-bar {
                height: 18px;
                background: #1e293b;
                border-radius: 999px;
                overflow: hidden;
                display: flex;
                margin: 20px 0;
              }

              .severity-high {
                background: #ff647c;
              }

              .severity-medium {
                background: #ffb11b;
              }

              .severity-blocker {
                background: #b184ff;
              }

              .legend {
                display: flex;
                gap: 22px;
                font-size: 13px;
                color: #cbd5e1;
              }

              .legend span::before {
                content: "";
                display: inline-block;
                width: 9px;
                height: 9px;
                border-radius: 50%;
                margin-right: 6px;
              }

              .legend-high::before {
                background: #ff647c;
              }

              .legend-medium::before {
                background: #ffb11b;
              }

              .legend-blocker::before {
                background: #b184ff;
              }

              .table-wrap {
                overflow-x: auto;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
                font-size: 13px;
              }

              th {
                background: #1e293b;
                color: #bfdbfe;
                text-align: left;
                padding: 12px;
                border-bottom: 1px solid #334155;
                white-space: nowrap;
              }

              td {
                padding: 12px;
                border-bottom: 1px solid #263449;
                vertical-align: top;
              }

              tr:hover {
                background: #162238;
              }

              .file {
                color: #93c5fd;
                font-family: monospace;
                white-space: nowrap;
              }

              .badge {
                display: inline-block;
                padding: 4px 9px;
                border-radius: 999px;
                font-weight: 700;
                font-size: 11px;
              }

              .badge.high {
                background: rgba(255, 100, 124, .15);
                color: #ff647c;
              }

              .badge.medium {
                background: rgba(255, 177, 27, .15);
                color: #ffb11b;
              }

              .badge.blocker {
                background: rgba(177, 132, 255, .15);
                color: #b184ff;
              }

              .empty {
                padding: 18px;
                border-radius: 10px;
                background: #0f172a;
                color: #7ee787;
              }

              .coverage-grid {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(190px, 1fr));
                gap: 14px;
              }

              .metric {
                background: #0f172a;
                border: 1px solid #263449;
                border-radius: 12px;
                padding: 16px;
              }

              .metric-label {
                color: #93c5fd;
                font-size: 12px;
              }

              .metric-value {
                font-size: 25px;
                font-weight: 800;
                margin-top: 8px;
              }

              .footer {
                color: #64748b;
                font-size: 12px;
                text-align: center;
                margin-top: 30px;
              }

              @media(max-width: 700px) {
                body {
                  padding: 14px;
                }

                h1 {
                  font-size: 22px;
                }
              }

            </style>
          </head>

          <body>

            <div class="container">

              <div class="hero">

                <h1>
                  SonarCloud Security & Coverage Report
                </h1>

                <div class="subtitle">
                  Real-time security issues, severity distribution
                  and uncovered new code.
                </div>

                <div class="metadata">

                  <span>
                    Repository:
                    <strong>
                      ${escapeHtml(REPOSITORY)}
                    </strong>
                  </span>

                  <span>
                    Branch:
                    <strong>
                      ${escapeHtml(BRANCH)}
                    </strong>
                  </span>

                  <span>
                    Commit:
                    <strong>
                      ${escapeHtml(COMMIT.substring(0, 7))}
                    </strong>
                  </span>

                  <span>
                    <a
                      href="https://sonarcloud.io/dashboard?id=${encodeURIComponent(
                        SONAR_PROJECT_KEY
                      )}"
                      target="_blank"
                      style="color:#60a5fa;"
                    >
                      Open SonarCloud
                    </a>
                  </span>

                </div>

              </div>

              <div class="cards">

                <div class="card">
                  <div class="card-label">
                    High Severity
                  </div>

                  <div class="card-value high">
                    ${highCount}
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Medium Severity
                  </div>

                  <div class="card-value medium">
                    ${mediumCount}
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Blocker
                  </div>

                  <div class="card-value blocker">
                    ${blockerCount}
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Total Active Issues
                  </div>

                  <div class="card-value">
                    ${totalIssues}
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Overall Coverage
                  </div>

                  <div class="card-value">
                    ${formatPercent(overallCoverage)}
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    New Code Coverage
                  </div>

                  <div class="card-value success-text">
                    ${formatPercent(newCoverage)}
                  </div>
                </div>

              </div>

              <div class="section">

                <h2>
                  Security Severity Distribution
                </h2>

                <p class="subtitle">
                  Active OPEN and REOPENED SonarCloud issues.
                </p>

                <div class="severity-bar">

                  ${
                    totalIssues > 0
                      ? `
                        <div
                          class="severity-high"
                          style="width:${(
                            highCount / totalIssues * 100
                          ).toFixed(2)}%"
                        ></div>

                        <div
                          class="severity-medium"
                          style="width:${(
                            mediumCount / totalIssues * 100
                          ).toFixed(2)}%"
                        ></div>

                        <div
                          class="severity-blocker"
                          style="width:${(
                            blockerCount / totalIssues * 100
                          ).toFixed(2)}%"
                        ></div>
                      `
                      : ""
                  }

                </div>

                <div class="legend">

                  <span class="legend-high">
                    High: ${highCount}
                  </span>

                  <span class="legend-medium">
                    Medium: ${mediumCount}
                  </span>

                  <span class="legend-blocker">
                    Blocker: ${blockerCount}
                  </span>

                </div>

              </div>

              <div class="section">

                <h2>
                  Coverage Overview
                </h2>

                <div class="coverage-grid">

                  <div class="metric">
                    <div class="metric-label">
