name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD REAL JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ============================================================
      # VERIFY COVERAGE
      # ============================================================
      - name: Verify LCOV coverage
        run: |
          set -e

          echo "============================================================"
          echo "Checking Jest coverage"
          echo "============================================================"

          if [ ! -f "coverage/lcov.info" ]; then
            echo "ERROR: coverage/lcov.info was not found."
            echo ""
            echo "Contents of workspace:"
            find . -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

          echo "LCOV file found:"
          ls -lh coverage/lcov.info

          echo ""
          echo "LCOV record count:"
          grep -c "^SF:" coverage/lcov.info || true

          echo ""
          echo "First LCOV records:"
          head -30 coverage/lcov.info

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        shell: bash
        run: |
          set -e

          SONAR_SCANNER_VERSION="5.0.1.3006"
          SONAR_SCANNER_ZIP="sonar-scanner-cli-${SONAR_SCANNER_VERSION}.zip"
          SONAR_SCANNER_URL="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SONAR_SCANNER_ZIP}"
          SONAR_SCANNER_SHA_URL="${SONAR_SCANNER_URL}.sha256"

          echo "============================================================"
          echo "Installing SonarScanner"
          echo "============================================================"
          echo "Version: ${SONAR_SCANNER_VERSION}"

          curl --fail --show-error --silent --location \
            --proto '=https' \
            --tlsv1.2 \
            "$SONAR_SCANNER_URL" \
            --output "$SONAR_SCANNER_ZIP"

          curl --fail --show-error --silent --location \
            --proto '=https' \
            --tlsv1.2 \
            "$SONAR_SCANNER_SHA_URL" \
            --output "${SONAR_SCANNER_ZIP}.sha256"

          echo "Verifying SonarScanner checksum..."

          EXPECTED_SHA=$(awk '{print $1}' "${SONAR_SCANNER_ZIP}.sha256")
          ACTUAL_SHA=$(sha256sum "$SONAR_SCANNER_ZIP" | awk '{print $1}')

          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: SonarScanner checksum verification failed."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Checksum verified."

          unzip -q "$SONAR_SCANNER_ZIP" -d "$HOME"

          rm -f \
            "$SONAR_SCANNER_ZIP" \
            "${SONAR_SCANNER_ZIP}.sha256"

          echo "$HOME/sonar-scanner-${SONAR_SCANNER_VERSION}/bin" >> "$GITHUB_PATH"

          echo "SonarScanner installed successfully."

      # ============================================================
      # VERIFY SONAR CONFIGURATION
      # ============================================================
      - name: Verify SonarCloud configuration
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud configuration"
          echo "============================================================"

          if [ ! -f "sonar-project.properties" ]; then
            echo "ERROR: sonar-project.properties not found."
            exit 1
          fi

          if [ -z "$SONAR_HOST" ]; then
            echo "ERROR: SONAR_HOST secret is not configured."
            exit 1
          fi

          if [ -z "$SONAR_ORG" ]; then
            echo "ERROR: SONAR_ORG secret is not configured."
            exit 1
          fi

          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "ERROR: SONAR_PROJECT_KEY secret is not configured."
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN secret is not configured."
            exit 1
          fi

          echo "Found sonar-project.properties."

          echo ""
          echo "SonarCloud values from repository secrets:"
          echo "SONAR_HOST: ${SONAR_HOST}"
          echo "SONAR_ORG: ${SONAR_ORG}"
          echo "SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY}"
          echo "SONAR_TOKEN: configured"

          echo ""
          echo "Values configured in sonar-project.properties:"
          grep -E \
            '^(sonar.projectKey|sonar.organization|sonar.host.url|sonar.sources|sonar.javascript.lcov.reportPaths|sonar.tests|sonar.test.inclusions|sonar.exclusions)' \
            sonar-project.properties || true

          echo ""
          echo "Scanner will explicitly use repository secrets for:"
          echo "  - sonar.host.url"
          echo "  - sonar.organization"
          echo "  - sonar.projectKey"
          echo "  - sonar.token"

      # ============================================================
      # VERIFY SONARCLOUD PROJECT ACCESS
      # ============================================================
      - name: Verify SonarCloud project access
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Verifying SonarCloud project access"
          echo "============================================================"

          SONAR_HOST="${SONAR_HOST%/}"

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST}/api/projects/search?projects=${SONAR_PROJECT_KEY}&organization=${SONAR_ORG}" \
            -o /tmp/sonar-project.json
          then
            echo "ERROR: Unable to authenticate with SonarCloud."
            echo ""
            echo "Check:"
            echo "  1. SONAR_TOKEN is valid."
            echo "  2. SONAR_ORG is the correct SonarCloud organization key."
            echo "  3. SONAR_PROJECT_KEY is the exact SonarCloud project key."
            echo "  4. SONAR_HOST points to the correct SonarCloud server."
            exit 1
          fi

          echo ""
          echo "SonarCloud project lookup response:"
          cat /tmp/sonar-project.json

          PROJECT_COUNT=$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/sonar-project.json", "utf8"));
            process.stdout.write(String(Array.isArray(data.components) ? data.components.length : 0));
          ')

          if [ "$PROJECT_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: SonarCloud project was not found."
            echo "Project key: ${SONAR_PROJECT_KEY}"
            echo "Organization: ${SONAR_ORG}"
            exit 1
          fi

          echo ""
          echo "SonarCloud project access verified successfully."

      # ============================================================
      # SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud analysis
        continue-on-error: true   # <-- prevents pipeline failure before report generation
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "Running SonarCloud analysis"
          echo "============================================================"

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$SONAR_HOST" ]; then
            echo "ERROR: SONAR_HOST is not configured."
            exit 1
          fi

          if [ -z "$SONAR_ORG" ]; then
            echo "ERROR: SONAR_ORG is not configured."
            exit 1
          fi

          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "ERROR: SONAR_PROJECT_KEY is not configured."
            exit 1
          fi

          SONAR_HOST="${SONAR_HOST%/}"

          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.tests=src,test,tests

      # ============================================================
      # GENERATE REPORT SCRIPT
      # ============================================================
      - name: Create SonarCloud report generator
        if: always()
        shell: bash
        run: |
          cat > generate-sonar-report.mjs <<'EOF'
          import fs from "node:fs";

          const sonarHost =
            process.env.SONAR_HOST?.trim() ||
            "https://sonarcloud.io";

          const projectKey =
            process.env.SONAR_PROJECT_KEY?.trim();

          const organization =
            process.env.SONAR_ORG?.trim();

          const token =
            process.env.SONAR_TOKEN?.trim();

          const repository =
            process.env.GITHUB_REPOSITORY ||
            "unknown/repository";

          const branch =
            process.env.GITHUB_REF_NAME ||
            "main";

          const commit =
            (process.env.GITHUB_SHA || "unknown").substring(0, 7);

          if (!projectKey) {
            throw new Error("SONAR_PROJECT_KEY is missing.");
          }

          if (!token) {
            throw new Error("SONAR_TOKEN is missing.");
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function numberValue(value) {
            if (
              value === undefined ||
              value === null ||
              value === ""
            ) {
              return 0;
            }

            const n = Number(value);

            return Number.isFinite(n) ? n : 0;
          }

          function metricValue(measures, metricKey) {
            const measure = measures.find(
              item => item.metric === metricKey
            );

            if (!measure) {
              return null;
            }

            if (
              measure.value === undefined ||
              measure.value === null ||
              measure.value === ""
            ) {
              return null;
            }

            const n = Number(measure.value);

            return Number.isFinite(n) ? n : null;
          }

          function percent(value) {
            if (
              value === null ||
              value === undefined ||
              !Number.isFinite(Number(value))
            ) {
              return "N/A";
            }

            return `${Number(value).toFixed(1)}%`;
          }

          async function sonarApi(path, params = {}) {
            const url = new URL(
              `${sonarHost.replace(/\/$/, "")}${path}`
            );

            for (const [key, value] of Object.entries(params)) {
              if (
                value !== undefined &&
                value !== null &&
                value !== ""
              ) {
                url.searchParams.set(key, String(value));
              }
            }

            const auth = Buffer
              .from(`${token}:`)
              .toString("base64");

            const response = await fetch(url, {
              method: "GET",
              headers: {
                Authorization: `Basic ${auth}`,
                Accept: "application/json",
              },
            });

            const text = await response.text();

            if (!response.ok) {
              throw new Error(
                `SonarCloud API ${response.status} ${response.statusText}: ${text.slice(0, 1000)}`
              );
            }

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(
                `SonarCloud API returned invalid JSON: ${text.slice(0, 1000)}`
              );
            }
          }

          async function fetchAllIssues() {
            const all = [];
            let page = 1;
            const pageSize = 500;

            while (true) {
              const data = await sonarApi(
                "/api/issues/search",
                {
                  componentKeys: projectKey,
                  organization,
                  branch,
                  statuses: "OPEN,REOPENED",
                  ps: pageSize,
                  p: page,
                }
              );

              const issues = Array.isArray(data.issues)
                ? data.issues
                : [];

              all.push(...issues);

              const total = numberValue(data.total);

              if (
                issues.length === 0 ||
                all.length >= total ||
                issues.length < pageSize
              ) {
                break;
              }

              page += 1;

              if (page > 100) {
                break;
              }
            }

            return all;
          }

          async function fetchProjectMeasures() {
            const metricKeys = [
              "coverage",
              "new_coverage",
              "uncovered_lines",
              "uncovered_conditions",
              "new_uncovered_lines",
              "new_uncovered_conditions",
              "lines_to_cover",
              "conditions_to_cover",
              "new_lines_to_cover",
              "new_conditions_to_cover",
            ].join(",");

            const data = await sonarApi(
              "/api/measures/component",
              {
                component: projectKey,
                organization,
                branch,
                metricKeys,
              }
            );

            return Array.isArray(data.component?.measures)
              ? data.component.measures
              : [];
          }

          async function fetchAllFileMeasures() {
            const metricKeys = [
              "coverage",
              "new_coverage",
              "uncovered_lines",
              "uncovered_conditions",
              "new_uncovered_lines",
              "new_uncovered_conditions",
              "lines_to_cover",
              "conditions_to_cover",
              "new_lines_to_cover",
              "new_conditions_to_cover",
            ].join(",");

            const all = [];
            let page = 1;
            const pageSize = 500;

            while (true) {
              const data = await sonarApi(
                "/api/measures/component_tree",
                {
                  component: projectKey,
                  organization,
                  branch,
                  metricKeys,
                  qualifiers: "FIL",
                  ps: pageSize,
                  p: page,
                }
              );

              const components =
                Array.isArray(data.components)
                  ? data.components
                  : [];

              all.push(...components);

              const total = numberValue(
                data.paging?.total
              );

              if (
                components.length === 0 ||
                all.length >= total ||
                components.length < pageSize
              ) {
                break;
              }

              page += 1;

              if (page > 100) {
                break;
              }
            }

            return all;
          }

          console.log("============================================================");
          console.log("SonarCloud API");
          console.log("============================================================");
          console.log(`Project: ${projectKey}`);
          console.log(`Organization: ${organization || "not specified"}`);
          console.log(`Branch: ${branch}`);
          console.log(`Sonar URL: ${sonarHost}`);
          console.log("============================================================");

          const [
            issues,
            projectMeasures,
            fileMeasures,
          ] = await Promise.all([
            fetchAllIssues(),
            fetchProjectMeasures(),
            fetchAllFileMeasures(),
          ]);

          console.log(`Issues retrieved: ${issues.length}`);
          console.log(
            `Project measures retrieved: ${projectMeasures.length}`
          );
          console.log(
            `File components retrieved: ${fileMeasures.length}`
          );

          function normalizedSeverity(issue) {
            const severity =
              String(issue.severity || "")
                .trim()
                .toUpperCase();

            if (severity === "BLOCKER") {
              return "BLOCKER";
            }

            if (severity === "CRITICAL") {
              return "HIGH";
            }

            if (severity === "MAJOR") {
              return "MEDIUM";
            }

            if (severity === "MINOR") {
              return "LOW";
            }

            if (severity === "INFO") {
              return "INFO";
            }

            return severity || "UNKNOWN";
          }

          const highIssues = issues.filter(
            issue =>
              normalizedSeverity(issue) === "HIGH"
          );

          const mediumIssues = issues.filter(
            issue =>
              normalizedSeverity(issue) === "MEDIUM"
          );

          const blockerIssues = issues.filter(
            issue =>
              normalizedSeverity(issue) === "BLOCKER"
          );

          const lowIssues = issues.filter(
            issue =>
              normalizedSeverity(issue) === "LOW"
          );

          const infoIssues = issues.filter(
            issue =>
              normalizedSeverity(issue) === "INFO"
          );

          const overallCoverage =
            metricValue(
              projectMeasures,
              "coverage"
            );

          const newCoverage =
            metricValue(
              projectMeasures,
              "new_coverage"
            );

          const uncoveredLines =
            numberValue(
              metricValue(
                projectMeasures,
                "uncovered_lines"
              )
            );

          const uncoveredConditions =
            numberValue(
              metricValue(
                projectMeasures,
                "uncovered_conditions"
              )
            );

          const newUncoveredLines =
            numberValue(
              metricValue(
                projectMeasures,
                "new_uncovered_lines"
              )
            );

          const newUncoveredConditions =
            numberValue(
              metricValue(
                projectMeasures,
                "new_uncovered_conditions"
              )
            );

          const fileRows = fileMeasures
            .map(component => {
              const measures =
                Array.isArray(component.measures)
                  ? component.measures
                  : [];

              const path =
                component.path ||
                component.name ||
                component.key ||
                "";

              const lowerPath =
                path.toLowerCase();

              const isCoverageFile =
                lowerPath.endsWith(".js") ||
                lowerPath.endsWith(".jsx") ||
                lowerPath.endsWith(".ts") ||
                lowerPath.endsWith(".tsx") ||
                lowerPath.endsWith(".mjs") ||
                lowerPath.endsWith(".cjs");

              if (!isCoverageFile) {
                return null;
              }

              return {
                path,

                coverage:
                  metricValue(
                    measures,
                    "coverage"
                  ),

                newCoverage:
                  metricValue(
                    measures,
                    "new_coverage"
                  ),

                uncoveredLines:
                  numberValue(
                    metricValue(
                      measures,
                      "uncovered_lines"
                    )
                  ),

                uncoveredConditions:
                  numberValue(
                    metricValue(
                      measures,
                      "uncovered_conditions"
                    )
                  ),

                newUncoveredLines:
                  numberValue(
                    metricValue(
                      measures,
                      "new_uncovered_lines"
                    )
                  ),

                newUncoveredConditions:
                  numberValue(
                    metricValue(
                      measures,
                      "new_uncovered_conditions"
                    )
                  ),
              };
            })
            .filter(Boolean);

          fileRows.sort((a, b) => {
            if (
              b.newUncoveredLines !==
              a.newUncoveredLines
            ) {
              return (
                b.newUncoveredLines -
                a.newUncoveredLines
              );
            }

            return (
              b.uncoveredLines -
              a.uncoveredLines
            );
          });

          function issueRows(list) {
            if (!list.length) {
              return [
                "<tr>",
                '<td colspan="6" class="empty">',
                "✓ No active issues found.",
                "</td>",
                "</tr>",
              ].join("");
            }

            return list
              .map(issue => {
                const component =
                  String(
                    issue.component || ""
                  ).replace(
                    `${projectKey}:`,
                    ""
                  );

                const line =
                  issue.line !== undefined &&
                  issue.line !== null
                    ? issue.line
                    : "-";

                const severity =
                  normalizedSeverity(issue);

                let severityClass = "low";

                if (severity === "HIGH") {
                  severityClass = "high";
                } else if (
                  severity === "MEDIUM"
                ) {
                  severityClass = "medium";
                } else if (
                  severity === "BLOCKER"
                ) {
                  severityClass = "blocker";
                }

                const issueUrl =
                  `${sonarHost}/project/issues?id=` +
                  encodeURIComponent(projectKey) +
                  `&open=` +
                  encodeURIComponent(
                    issue.key || ""
                  );

                return [
                  "<tr>",
                  '<td><span class="badge ' +
                    severityClass +
                    '">' +
                    escapeHtml(severity) +
                    "</span></td>",
                  "<td>" +
                    escapeHtml(
                      issue.rule || "-"
                    ) +
                    "</td>",
                  "<td>" +
                    escapeHtml(
                      issue.message || "-"
                    ) +
                    "</td>",
                  "<td>" +
                    escapeHtml(component) +
                    "</td>",
                  "<td>" +
                    escapeHtml(line) +
                    "</td>",
                  '<td><a target="_blank" href="' +
                    escapeHtml(issueUrl) +
                    '">View</a></td>',
                  "</tr>",
                ].join("");
              })
              .join("");
          }

          function fileCoverageRows() {
            if (!fileRows.length) {
              return [
                "<tr>",
                '<td colspan="7" class="empty">',
                "No file-level coverage information returned by SonarCloud.",
                "</td>",
                "</tr>",
              ].join("");
            }

            return fileRows
              .map(file => {
                const newCoverage =
                  file.newCoverage === null
                    ? "N/A"
                    : percent(
                        file.newCoverage
                      );

                const overall =
                  file.coverage === null
                    ? "N/A"
                    : percent(
                        file.coverage
                      );

                const newLineClass =
                  file.newUncoveredLines > 0
                    ? "danger-text"
                    : "success-text";

                const overallLineClass =
                  file.uncoveredLines > 0
                    ? "danger-text"
                    : "success-text";

                return [
                  "<tr>",

                  "<td><strong>" +
                    escapeHtml(file.path) +
                    "</strong></td>",

                  "<td>" +
                    newCoverage +
                    "</td>",

                  '<td class="' +
                    newLineClass +
                    '">' +
                    file.newUncoveredLines +
                    "</td>",

                  "<td>" +
                    file.newUncoveredConditions +
                    "</td>",

                  "<td>" +
                    overall +
                    "</td>",

                  '<td class="' +
                    overallLineClass +
                    '">' +
                    file.uncoveredLines +
                    "</td>",

                  "<td>" +
                    file.uncoveredConditions +
                    "</td>",

                  "</tr>",
                ].join("");
              })
              .join("");
          }

          const html = [
            "<!DOCTYPE html>",
            '<html lang="en">',
            "<head>",
            '<meta charset="UTF-8">',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
            "<title>SonarCloud Security & Coverage Report</title>",
            "<style>",
            "*{box-sizing:border-box}",
            "body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}",
            ".container{max-width:1600px;margin:auto;padding:30px}",
            ".header{background:linear-gradient(135deg,#111827,#26344d);color:white;border-radius:18px;padding:30px;margin-bottom:24px}",
            ".header h1{margin:0 0 10px;font-size:30px}",
            ".header p{margin:6px 0;color:#d5dbea}",
            ".header a{color:#93c5fd;font-weight:700}",
            ".grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}",
            ".card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}",
            ".card-title{font-size:13px;color:#6b7280;text-transform:uppercase;font-weight:700}",
            ".value{font-size:32px;font-weight:800;margin-top:8px}",
            ".high-value{color:#dc2626}",
            ".medium-value{color:#ea580c}",
            ".blocker-value{color:#7c3aed}",
            ".coverage-value{color:#2563eb}",
            ".section{background:white;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,.06)}",
            ".section h2{margin-top:0}",
            ".stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}",
            ".stat{background:#f8fafc;border-radius:12px;padding:18px}",
            ".stat strong{font-size:24px;display:block;margin-top:5px}",
            "table{width:100%;border-collapse:collapse;font-size:13px}",
            "th{background:#eef2f7;text-align:left;padding:12px;position:sticky;top:0;z-index:1}",
            "td{padding:11px;border-bottom:1px solid #e5e7eb;vertical-align:top}",
            "tr:hover{background:#f8fafc}",
            ".badge{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:700;font-size:11px}",
            ".badge.high{background:#fee2e2;color:#b91c1c}",
