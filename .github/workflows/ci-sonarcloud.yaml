name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD REAL JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        shell: bash
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip \
            -o sonar-scanner.zip

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip.sha256 \
            -o sonar-scanner.zip.sha256

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> "$GITHUB_PATH"

      # ============================================================
      # RUN SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Running SonarCloud Analysis"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Sonar URL: $SONAR_HOST"
          echo "============================================================"

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=false

      # ============================================================
      # WAIT FOR SONARCLOUD BACKGROUND TASK
      #
      # This is important.
      #
      # SonarScanner submits analysis asynchronously.
      # We wait until SonarCloud has actually processed it before
      # calling the REST APIs.
      # ============================================================
      - name: Wait for SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "ERROR: .scannerwork/report-task.txt was not found."
            echo "SonarScanner did not produce the expected task information."
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: SonarCloud CE task URL was not found."
            cat .scannerwork/report-task.txt
            exit 1
          fi

          echo "SonarCloud background task:"
          echo "$CE_TASK_URL"

          for attempt in {1..30}; do
            echo ""
            echo "Waiting for SonarCloud analysis... attempt $attempt/30"

            RESPONSE=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              -sS \
              -u "$SONAR_TOKEN:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // empty')

            echo "SonarCloud task status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                echo "SonarCloud analysis completed successfully."
                break
                ;;

              FAILED|CANCELED)
                echo "SonarCloud analysis failed."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              PENDING|IN_PROGRESS)
                sleep 5
                ;;

              *)
                echo "Unexpected SonarCloud task response:"
                echo "$RESPONSE" | jq .
                sleep 5
                ;;
            esac

            if [ "$attempt" -eq 30 ]; then
              echo "Timed out waiting for SonarCloud analysis."
              exit 1
            fi
          done

      # ============================================================
      # VERIFY SONARCLOUD PROJECT / BRANCH
      # ============================================================
      - name: Verify SonarCloud project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud API"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Sonar URL: $SONAR_HOST"
          echo "============================================================"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -f \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            "$SONAR_HOST/api/projects/search" \
            -o sonar-project.json

          echo ""
          echo "SonarCloud project response:"
          cat sonar-project.json | jq .

      # ============================================================
      # EXPORT REAL SONARCLOUD ISSUES
      # ============================================================
      - name: Export SonarCloud issues
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "Fetching SonarCloud issues..."

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -f \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "statuses=OPEN,REOPENED" \
            --data-urlencode "ps=500" \
            "$SONAR_HOST/api/issues/search" \
            -o sonar-issues.json

          echo ""
          echo "Issues retrieved:"
          jq '.total' sonar-issues.json

      # ============================================================
      # EXPORT OVERALL + NEW CODE COVERAGE
      # ============================================================
      - name: Export SonarCloud coverage metrics
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "Fetching SonarCloud coverage metrics..."

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -f \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "metricKeys=coverage,new_coverage,uncovered_lines,new_uncovered_lines,uncovered_conditions,new_uncovered_conditions,lines_to_cover,new_lines_to_cover,conditions_to_cover,new_conditions_to_cover" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            "$SONAR_HOST/api/measures/component" \
            -o sonar-measures.json

          echo ""
          echo "Coverage metrics:"
          cat sonar-measures.json | jq .

      # ============================================================
      # EXPORT FILE-LEVEL COVERAGE
      # ============================================================
      - name: Export file-level SonarCloud coverage
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "Fetching file-level coverage..."

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -f \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "metricKeys=coverage,new_coverage,uncovered_lines,new_uncovered_lines,uncovered_conditions,new_uncovered_conditions,lines_to_cover,new_lines_to_cover,conditions_to_cover,new_conditions_to_cover" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "ps=500" \
            "$SONAR_HOST/api/measures/component_tree" \
            -o sonar-files.json

          echo ""
          echo "File coverage retrieved:"
          jq '.components | length' sonar-files.json

      # ============================================================
      # CREATE REAL-TIME HTML REPORT GENERATOR
      #
      # .cjs is intentional because package.json contains:
      #
      #   "type": "module"
      #
      # Therefore CommonJS require() must use .cjs.
      # ============================================================
      - name: Create SonarCloud report generator
        if: always()
        shell: bash
        run: |
          cat > generate-sonar-report.cjs <<'NODE'
          const fs = require("fs");

          function readJson(file, fallback) {
            try {
              if (!fs.existsSync(file)) {
                return fallback;
              }

              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              console.error(`Unable to read ${file}:`, error.message);
              return fallback;
            }
          }

          const issuesData = readJson("sonar-issues.json", {
            issues: [],
            total: 0
          });

          const measuresData = readJson("sonar-measures.json", {
            component: {
              measures: []
            }
          });

          const filesData = readJson("sonar-files.json", {
            components: []
          });

          const issues = issuesData.issues || [];
          const measures = measuresData.component?.measures || [];
          const files = filesData.components || [];

          function metricValue(metricKey) {
            const metric = measures.find(m => m.metric === metricKey);
            return metric?.value ?? null;
          }

          const highIssues = issues.filter(
            issue => String(issue.severity).toUpperCase() === "HIGH"
          );

          const mediumIssues = issues.filter(
            issue => String(issue.severity).toUpperCase() === "MEDIUM"
          );

          const blockerIssues = issues.filter(
            issue => String(issue.severity).toUpperCase() === "BLOCKER"
          );

          const coverage = metricValue("coverage");
          const newCoverage = metricValue("new_coverage");
          const uncoveredLines = metricValue("uncovered_lines");
          const uncoveredConditions = metricValue("uncovered_conditions");
          const newUncoveredLines = metricValue("new_uncovered_lines");
          const newUncoveredConditions = metricValue("new_uncovered_conditions");

          const repo =
            process.env.GITHUB_REPOSITORY || "Unknown repository";

          const branch =
            process.env.GITHUB_REF_NAME || "Unknown branch";

          const commit =
            (process.env.GITHUB_SHA || "unknown").substring(0, 7);

          const sonarHost =
            process.env.SONAR_HOST || "https://sonarcloud.io";

          const projectKey =
            process.env.SONAR_PROJECT_KEY || "";

          const sonarUrl =
            `${sonarHost}/dashboard?id=${encodeURIComponent(projectKey)}`;

          function escapeHtml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function display(value, suffix = "") {
            if (
              value === null ||
              value === undefined ||
              value === ""
            ) {
              return "N/A";
            }

            return `${escapeHtml(value)}${suffix}`;
          }

          function issueRows(issueList) {
            if (!issueList.length) {
              return `
                <tr>
                  <td colspan="6" class="empty">
                    ✓ No active issues found
                  </td>
                </tr>
              `;
            }

            return issueList.map(issue => {
              const component =
                issue.component || issue.project || "Unknown";

              const file =
                component.includes(":")
                  ? component.split(":").slice(1).join(":")
                  : component;

              const line =
                issue.line ??
                issue.textRange?.startLine ??
                "—";

              return `
                <tr>
                  <td>
                    <span class="severity ${String(issue.severity).toLowerCase()}">
                      ${escapeHtml(issue.severity)}
                    </span>
                  </td>
                  <td>${escapeHtml(issue.rule || "—")}</td>
                  <td>${escapeHtml(issue.message || "—")}</td>
                  <td class="file">${escapeHtml(file)}</td>
                  <td>${escapeHtml(line)}</td>
                  <td>
                    <a
                      href="${sonarUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Review
                    </a>
                  </td>
                </tr>
              `;
            }).join("");
          }

          /*
           * Only show files where SonarCloud has actual new-code data.
           *
           * Files with zero new lines to cover are not useful for the
           * "uncovered new code" section, so they are placed after files
           * containing actual new-code coverage information.
           */
          const fileRows = files
            .map(component => {
              const metricMap = {};

              for (const metric of component.measures || []) {
                metricMap[metric.metric] = metric.value;
              }

              return {
                path:
                  component.path ||
                  component.key ||
                  component.name ||
                  "Unknown file",

                newCoverage:
                  metricMap.new_coverage ?? null,

                newUncoveredLines:
                  Number(metricMap.new_uncovered_lines ?? 0),

                newUncoveredConditions:
                  Number(metricMap.new_uncovered_conditions ?? 0),

                coverage:
                  metricMap.coverage ?? null,

                uncoveredLines:
                  Number(metricMap.uncovered_lines ?? 0)
              };
            })
            .sort((a, b) => {
              if (b.newUncoveredLines !== a.newUncoveredLines) {
                return b.newUncoveredLines - a.newUncoveredLines;
              }

              return (
                b.newUncoveredConditions -
                a.newUncoveredConditions
              );
            });

          function fileCoverageRows() {
            if (!fileRows.length) {
              return `
                <tr>
                  <td colspan="6" class="empty">
                    No file-level coverage data returned by SonarCloud.
                  </td>
                </tr>
              `;
            }

            return fileRows.map(file => {
              return `
                <tr>
                  <td class="file">
                    ${escapeHtml(file.path)}
                  </td>

                  <td class="coverage-value">
                    ${display(
                      file.newCoverage,
                      file.newCoverage !== null ? "%" : ""
                    )}
                  </td>

                  <td>
                    ${escapeHtml(file.newUncoveredLines)}
                  </td>

                  <td>
                    ${escapeHtml(file.newUncoveredConditions)}
                  </td>

                  <td>
                    ${display(
                      file.coverage,
                      file.coverage !== null ? "%" : ""
                    )}
                  </td>

                  <td>
                    ${escapeHtml(file.uncoveredLines)}
                  </td>
                </tr>
              `;
            }).join("");
          }

          const html = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              SonarCloud Security & Coverage Report
            </title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 32px;
                background: #0f172a;
                color: #e5e7eb;
                font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              .container {
                max-width: 1500px;
                margin: auto;
              }

              .header {
                background: #111827;
                border: 1px solid #334155;
                border-radius: 18px;
                padding: 28px;
                margin-bottom: 20px;
              }

              h1 {
                margin: 0 0 8px;
                font-size: 28px;
                color: #f8fafc;
              }

              h2 {
                margin-top: 0;
                color: #f8fafc;
              }

              .subtitle {
                color: #94a3b8;
                margin-bottom: 18px;
              }

              .metadata {
                display: flex;
                flex-wrap: wrap;
                gap: 22px;
                font-size: 13px;
                color: #cbd5e1;
              }

              .metadata strong {
                color: #f8fafc;
              }

              a {
                color: #60a5fa;
                text-decoration: none;
              }

              a:hover {
                text-decoration: underline;
              }

              .cards {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(190px, 1fr));
                gap: 14px;
                margin-bottom: 20px;
              }

              .card {
                background: #172033;
                border: 1px solid #334155;
                border-radius: 16px;
                padding: 20px;
                min-height: 112px;
              }

              .card.high {
                border-color: #ef4444;
              }

              .card.medium {
                border-color: #f59e0b;
              }

              .card.blocker {
                border-color: #8b5cf6;
              }

              .card.coverage {
                border-color: #06b6d4;
              }

              .card.newcoverage {
                border-color: #22c55e;
              }

              .label {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: .08em;
                color: #94a3b8;
              }

              .value {
                margin-top: 12px;
                font-size: 30px;
                font-weight: 800;
                color: #f8fafc;
              }

              .high .value {
                color: #fb7185;
              }

              .medium .value {
                color: #fbbf24;
              }

              .blocker .value {
                color: #a78bfa;
              }

              .coverage .value {
                color: #67e8f9;
              }

              .newcoverage .value {
                color: #86efac;
              }

              .section {
                background: #111827;
                border: 1px solid #334155;
                border-radius: 18px;
                padding: 20px;
                margin-bottom: 20px;
                overflow: hidden;
              }

              .section-description {
                color: #94a3b8;
                margin-top: -8px;
                margin-bottom: 18px;
              }

              .severity-bar {
                width: 100%;
                height: 14px;
                background: #1e293b;
                border-radius: 999px;
                overflow: hidden;
                display: flex;
              }

              .bar-high {
                background: #fb7185;
              }

              .bar-medium {
                background: #fbbf24;
              }

              .bar-blocker {
                background: #a78bfa;
              }

              .legend {
                display: flex;
                gap: 20px;
                margin-top: 16px;
                flex-wrap: wrap;
                color: #94a3b8;
                font-size: 13px;
              }

              .dot {
                display: inline-block;
                width: 9px;
                height: 9px;
                border-radius: 50%;
                margin-right: 6px;
              }

              .dot.high {
                background: #fb7185;
              }

              .dot.medium {
                background: #fbbf24;
              }

              .dot.blocker {
                background: #a78bfa;
              }

              .metrics {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(180px, 1fr));
                gap: 12px;
              }

              .metric {
                background: #172033;
                border-radius: 14px;
                border: 1px solid #334155;
                padding: 18px;
              }

              .metric-title {
                color: #94a3b8;
                font-size: 12px;
                margin-bottom: 8px;
              }

              .metric-value {
                font-size: 24px;
                font-weight: 800;
                color: #f8fafc;
              }

              .table-wrapper {
                width: 100%;
                overflow-x: auto;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                min-width: 850px;
              }

              th {
                background: #1e293b;
                color: #cbd5e1;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .04em;
                text-align: left;
              }

              th,
              td {
                padding: 12px;
                border-bottom: 1px solid #334155;
                vertical-align: top;
              }

              td {
                color: #cbd5e1;
                font-size: 13px;
              }

              tr:hover td {
                background: #172033;
              }

              .file {
                font-family:
                  ui-monospace,
                  SFMono-Regular,
                  Menlo,
                  Monaco,
                  Consolas,
                  monospace;
                color: #93c5fd;
              }

              .coverage-value {
                font-weight: 800;
                color: #86efac;
              }

              .severity {
                display: inline-block;
                border-radius: 999px;
                padding: 4px 9px;
                font-size: 11px;
                font-weight: 700;
              }

              .severity.high {
                background: #451a1a;
                color: #fca5a5;
              }

              .severity.medium {
                background: #422006;
                color: #fcd34d;
              }

              .severity.blocker {
                background: #2e1065;
                color: #c4b5fd;
              }

              .empty {
                text-align: center;
                color: #86efac;
                padding: 24px;
              }

              .footer {
                text-align: center;
                color: #64748b;
                font-size: 12px;
                padding: 12px;
              }

              @media (max-width: 700px) {
                body {
                  padding: 14px;
                }

                .header {
                  padding: 20px;
                }

                h1 {
                  font-size: 22px;
                }
              }
            </style>
          </head>

          <body>
            <div class="container">

              <div class="header">
                <h1>
                  SonarCloud Security & Coverage Report
                </h1>

                <div class="subtitle">
                  Security issues, severity distribution and uncovered new code.
                </div>

                <div class="metadata">
                  <span>
                    Repository:
                    <strong>${escapeHtml(repo)}</strong>
                  </span>

                  <span>
                    Branch:
                    <strong>${escapeHtml(branch)}</strong>
                  </span>

                  <span>
                    Commit:
                    <strong>${escapeHtml(commit)}</strong>
                  </span>

                  <span>
                    <a
                      href="${sonarUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Open SonarCloud
                    </a>
                  </span>
                </div>
              </div>

              <div class="cards">

                <div class="card high">
                  <div class="label">
                    High Severity
                  </div>

                  <div class="value">
                    ${highIssues.length}
                  </div>
                </div>

                <div class="card medium">
                  <div class="label">
                    Medium Severity
                  </div>

                  <div class="value">
                    ${mediumIssues.length}
                  </div>
                </div>

                <div class="card blocker">
                  <div class="label">
                    Blocker
                  </div>

                  <div class="value">
                    ${blockerIssues.length}
                  </div>
                </div>

                <div class="card">
                  <div class="label">
                    Total Active Issues
                  </div>

                  <div class="value">
                    ${issues.length}
                  </div>
                </div>

                <div class="card coverage">
                  <div class="label">
                    Overall Coverage
                  </div>

                  <div class="value">
                    ${display(coverage, coverage !== null ? "%" : "")}
                  </div>
                </div>

                <div class="card newcoverage">
                  <div class="label">
                    New Code Coverage
                  </div>

                  <div class="value">
                    ${display(
                      newCoverage,
                      newCoverage !== null ? "%" : ""
                    )}
                  </div>
                </div>

              </div>

              <div class="section">
                <h2>
                  Security Severity Distribution
                </h2>

                <div class="section-description">
                  Active OPEN and REOPENED SonarCloud issues.
                </div>

                <div class="severity-bar">
                  ${
                    issues.length
                      ? `
                        <div
