name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD JEST COVERAGE
      # ============================================================
      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ============================================================
      # SETUP JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # INSTALL SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI
        shell: bash
        run: |
          set -e

          SONAR_SCANNER_VERSION="5.0.1.3006"
          SONAR_SCANNER_ZIP="sonar-scanner-cli-${SONAR_SCANNER_VERSION}.zip"
          SONAR_SCANNER_URL="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SONAR_SCANNER_ZIP}"

          curl --fail --show-error --silent \
            --proto '=https' \
            --tlsv1.2 \
            "$SONAR_SCANNER_URL" \
            -o sonar-scanner.zip

          curl --fail --show-error --silent \
            --proto '=https' \
            --tlsv1.2 \
            "${SONAR_SCANNER_URL}.sha256" \
            -o sonar-scanner.zip.sha256

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-${SONAR_SCANNER_VERSION}/bin" >> "$GITHUB_PATH"

      # ============================================================
      # RUN SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "Running SonarCloud Analysis"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Host: $SONAR_HOST"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "============================================================"

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=false

      # ============================================================
      # CREATE REPORT GENERATOR
      # ============================================================
      - name: Create SonarCloud Report Generator
        shell: bash
        run: |
          cat > generate-sonar-report.mjs <<'EOF'
          import fs from "node:fs";

          const token = process.env.SONAR_TOKEN;
          const projectKey = process.env.SONAR_PROJECT_KEY;
          const organization = process.env.SONAR_ORG;
          const sonarHost = process.env.SONAR_HOST || "https://sonarcloud.io";

          const repository = process.env.GITHUB_REPOSITORY || "Unknown";
          const branch = process.env.GITHUB_REF_NAME || "Unknown";
          const commit = (process.env.GITHUB_SHA || "Unknown").substring(0, 7);

          if (!token) {
            throw new Error("SONAR_TOKEN is missing.");
          }

          if (!projectKey) {
            throw new Error("SONAR_PROJECT_KEY is missing.");
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function numberValue(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
          }

          function percent(value) {
            const parsed = Number(value);

            if (!Number.isFinite(parsed)) {
              return "N/A";
            }

            return parsed.toFixed(1) + "%";
          }

          async function sonarGet(path, params = {}) {
            const url = new URL(path, sonarHost);

            for (const [key, value] of Object.entries(params)) {
              if (
                value !== undefined &&
                value !== null &&
                value !== ""
              ) {
                url.searchParams.set(key, String(value));
              }
            }

            const auth = Buffer.from(token + ":").toString("base64");

            const response = await fetch(url, {
              headers: {
                Authorization: "Basic " + auth,
                Accept: "application/json",
              },
            });

            const body = await response.text();

            if (!response.ok) {
              throw new Error(
                "SonarCloud API " +
                response.status +
                ": " +
                body.substring(0, 1000)
              );
            }

            return JSON.parse(body);
          }

          async function safeSonarGet(path, params = {}, fallback = null) {
            try {
              return await sonarGet(path, params);
            } catch (error) {
              console.warn(
                "SonarCloud API request failed:",
                path,
                error.message
              );

              return fallback;
            }
          }

          console.log("============================================================");
          console.log("Generating SonarCloud HTML report");
          console.log("============================================================");
          console.log("Project:", projectKey);
          console.log("Organization:", organization);
          console.log("Repository:", repository);
          console.log("Branch:", branch);
          console.log("Commit:", commit);
          console.log("Sonar URL:", sonarHost);
          console.log("============================================================");

          // ==========================================================
          // PROJECT MEASURES
          // ==========================================================
          const metricKeys = [
            "coverage",
            "new_coverage",
            "lines_to_cover",
            "uncovered_lines",
            "conditions_to_cover",
            "uncovered_conditions",
            "new_lines_to_cover",
            "new_uncovered_lines",
            "new_conditions_to_cover",
            "new_uncovered_conditions",
          ].join(",");

          const componentResponse = await safeSonarGet(
            "/api/measures/component",
            {
              component: projectKey,
              metricKeys,
              branch,
            },
            {
              component: {
                measures: [],
              },
            }
          );

          const measures = {};

          for (
            const measure of componentResponse?.component?.measures || []
          ) {
            measures[measure.metric] = measure.value;
          }

          const overallCoverage =
            measures.coverage !== undefined
              ? Number(measures.coverage)
              : null;

          const newCoverage =
            measures.new_coverage !== undefined
              ? Number(measures.new_coverage)
              : null;

          const uncoveredLines =
            numberValue(measures.uncovered_lines);

          const uncoveredConditions =
            numberValue(measures.uncovered_conditions);

          const newUncoveredLines =
            numberValue(measures.new_uncovered_lines);

          const newUncoveredConditions =
            numberValue(measures.new_uncovered_conditions);

          // ==========================================================
          // ISSUES
          // ==========================================================
          const issueResponse = await safeSonarGet(
            "/api/issues/search",
            {
              componentKeys: projectKey,
              projectKeys: projectKey,
              branch,
              statuses: "OPEN,REOPENED",
              ps: 500,
            },
            {
              issues: [],
              total: 0,
            }
          );

          const issues = Array.isArray(issueResponse?.issues)
            ? issueResponse.issues
            : [];

          const highIssues = issues.filter(
            issue =>
              String(issue.severity).toUpperCase() === "HIGH"
          );

          const mediumIssues = issues.filter(
            issue =>
              String(issue.severity).toUpperCase() === "MEDIUM"
          );

          const blockerIssues = issues.filter(
            issue =>
              String(issue.severity).toUpperCase() === "BLOCKER"
          );

          // ==========================================================
          // FILE-LEVEL MEASURES
          // ==========================================================
          const fileMetrics = [
            "coverage",
            "lines_to_cover",
            "uncovered_lines",
            "conditions_to_cover",
            "uncovered_conditions",
            "new_coverage",
            "new_lines_to_cover",
            "new_uncovered_lines",
            "new_conditions_to_cover",
            "new_uncovered_conditions",
          ].join(",");

          const treeResponse = await safeSonarGet(
            "/api/measures/component_tree",
            {
              component: projectKey,
              metricKeys: fileMetrics,
              branch,
              qualifiers: "FIL",
              ps: 500,
            },
            {
              components: [],
            }
          );

          const files = Array.isArray(treeResponse?.components)
            ? treeResponse.components
            : [];

          const fileRows = files
            .map(file => {
              const fileMeasures = {};

              for (const measure of file.measures || []) {
                fileMeasures[measure.metric] = measure.value;
              }

              return {
                path: file.path || file.key || "Unknown",

                coverage:
                  fileMeasures.coverage !== undefined
                    ? Number(fileMeasures.coverage)
                    : null,

                uncoveredLines:
                  numberValue(fileMeasures.uncovered_lines),

                uncoveredConditions:
                  numberValue(fileMeasures.uncovered_conditions),

                newCoverage:
                  fileMeasures.new_coverage !== undefined
                    ? Number(fileMeasures.new_coverage)
                    : null,

                newUncoveredLines:
                  numberValue(fileMeasures.new_uncovered_lines),

                newUncoveredConditions:
                  numberValue(
                    fileMeasures.new_uncovered_conditions
                  ),
              };
            })
            .filter(file => {
              const path = file.path.toLowerCase();

              const isCoverageFile =
                path.endsWith(".js") ||
                path.endsWith(".jsx") ||
                path.endsWith(".ts") ||
                path.endsWith(".tsx") ||
                path.endsWith(".mjs") ||
                path.endsWith(".cjs");

              return isCoverageFile;
            });

          // ==========================================================
          // SORT FILES
          // ==========================================================
          fileRows.sort((a, b) => {
            if (b.newUncoveredLines !== a.newUncoveredLines) {
              return b.newUncoveredLines - a.newUncoveredLines;
            }

            return b.uncoveredLines - a.uncoveredLines;
          });

          // ==========================================================
          // ISSUE TABLE GENERATOR
          // ==========================================================
          function issueRows(list) {
            if (!list.length) {
              return [
                "<tr>",
                '<td colspan="6" class="empty">✓ No active issues found.</td>',
                "</tr>",
              ].join("");
            }

            return list
              .map(issue => {
                const component = String(
                  issue.component || ""
                ).replace(projectKey + ":", "");

                const line =
                  issue.line !== undefined
                    ? issue.line
                    : "-";

                const severity =
                  String(issue.severity || "").toUpperCase();

                let severityClass = "medium";

                if (severity === "HIGH") {
                  severityClass = "high";
                }

                if (severity === "BLOCKER") {
                  severityClass = "blocker";
                }

                return [
                  "<tr>",
                  '<td><span class="badge ' +
                    severityClass +
                    '">' +
                    escapeHtml(severity) +
                    "</span></td>",
                  "<td>" +
                    escapeHtml(issue.rule || "-") +
                    "</td>",
                  "<td>" +
                    escapeHtml(issue.message || "-") +
                    "</td>",
                  "<td>" +
                    escapeHtml(component) +
                    "</td>",
                  "<td>" +
                    escapeHtml(line) +
                    "</td>",
                  '<td><a target="_blank" href="' +
                    escapeHtml(
                      sonarHost +
                        "/project/issues?id=" +
                        encodeURIComponent(projectKey) +
                        "&open=" +
                        encodeURIComponent(issue.key)
                    ) +
                    '">View</a></td>',
                  "</tr>",
                ].join("");
              })
              .join("");
          }

          // ==========================================================
          // FILE COVERAGE TABLE
          // ==========================================================
          function fileCoverageRows() {
            if (!fileRows.length) {
              return [
                "<tr>",
                '<td colspan="7" class="empty">',
                "No file-level coverage information returned by SonarCloud.",
                "</td>",
                "</tr>",
              ].join("");
            }

            return fileRows
              .map(file => {
                const newCoverage =
                  file.newCoverage === null
                    ? "N/A"
                    : percent(file.newCoverage);

                const overall =
                  file.coverage === null
                    ? "N/A"
                    : percent(file.coverage);

                const newLineClass =
                  file.newUncoveredLines > 0
                    ? "danger-text"
                    : "success-text";

                return [
                  "<tr>",
                  "<td><strong>" +
                    escapeHtml(file.path) +
                    "</strong></td>",
                  "<td>" +
                    newCoverage +
                    "</td>",
                  '<td class="' +
                    newLineClass +
                    '">' +
                    file.newUncoveredLines +
                    "</td>",
                  "<td>" +
                    file.newUncoveredConditions +
                    "</td>",
                  "<td>" +
                    overall +
                    "</td>",
                  '<td class="' +
                    (file.uncoveredLines > 0
                      ? "danger-text"
                      : "success-text") +
                    '">' +
                    file.uncoveredLines +
                    "</td>",
                  "<td>" +
                    file.uncoveredConditions +
                    "</td>",
                  "</tr>",
                ].join("");
              })
              .join("");
          }

          // ==========================================================
          // HTML
          // ==========================================================
          const html = [
            "<!DOCTYPE html>",
            '<html lang="en">',
            "<head>",
            '<meta charset="UTF-8">',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
            "<title>SonarCloud Security & Coverage Report</title>",
            "<style>",
            "*{box-sizing:border-box}",
            "body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}",
            ".container{max-width:1500px;margin:auto;padding:30px}",
            ".header{background:linear-gradient(135deg,#111827,#26344d);color:white;border-radius:18px;padding:30px;margin-bottom:24px}",
            ".header h1{margin:0 0 10px;font-size:30px}",
            ".header p{margin:5px 0;color:#d5dbea}",
            ".header a{color:#93c5fd}",
            ".grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}",
            ".card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.06)}",
            ".card-title{font-size:13px;color:#6b7280;text-transform:uppercase;font-weight:700}",
            ".value{font-size:32px;font-weight:800;margin-top:8px}",
            ".high-value{color:#dc2626}",
            ".medium-value{color:#ea580c}",
            ".blocker-value{color:#7c3aed}",
            ".coverage-value{color:#2563eb}",
            ".section{background:white;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,.06)}",
            ".section h2{margin-top:0}",
            ".stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}",
            ".stat{background:#f8fafc;border-radius:12px;padding:18px}",
            ".stat strong{font-size:24px;display:block;margin-top:5px}",
            "table{width:100%;border-collapse:collapse;font-size:13px}",
            "th{background:#eef2f7;text-align:left;padding:12px;position:sticky;top:0}",
            "td{padding:11px;border-bottom:1px solid #e5e7eb;vertical-align:top}",
            "tr:hover{background:#f8fafc}",
            ".badge{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:700;font-size:11px}",
            ".badge.high{background:#fee2e2;color:#b91c1c}",
            ".badge.medium{background:#ffedd5;color:#c2410c}",
            ".badge.blocker{background:#ede9fe;color:#6d28d9}",
            ".empty{text-align:center;padding:25px;color:#15803d;font-weight:700}",
            ".danger-text{color:#dc2626;font-weight:800}",
            ".success-text{color:#15803d;font-weight:700}",
            ".table-wrap{overflow:auto;max-height:700px;border:1px solid #e5e7eb;border-radius:10px}",
            ".footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}",
            ".legend{display:flex;gap:20px;flex-wrap:wrap;margin:15px 0}",
            ".legend span{font-size:13px}",
            "@media(max-width:900px){.grid,.stats{grid-template-columns:repeat(2,1fr)}}",
            "@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.container{padding:15px}}",
            "</style>",
            "</head>",
            "<body>",
            '<div class="container">',

            '<div class="header">',
            "<h1>SonarCloud Security & Coverage Report</h1>",
            "<p>Real-time security issues, severity distribution and uncovered code.</p>",
            "<p>Repository: <strong>" +
              escapeHtml(repository) +
              "</strong></p>",
            "<p>Branch: <strong>" +
              escapeHtml(branch) +
              "</strong></p>",
            "<p>Commit: <strong>" +
              escapeHtml(commit) +
              "</strong></p>",
            '<p><a target="_blank" href="' +
              escapeHtml(
                sonarHost +
                  "/dashboard?id=" +
                  encodeURIComponent(projectKey)
              ) +
              '">Open SonarCloud Dashboard</a></p>',
            "</div>",

            '<div class="grid">',

            '<div class="card">',
            '<div class="card-title">High Severity</div>',
            '<div class="value high-value">' +
              highIssues.length +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">Medium Severity</div>',
            '<div class="value medium-value">' +
              mediumIssues.length +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">Blocker</div>',
            '<div class="value blocker-value">' +
              blockerIssues.length +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">Total Active Issues</div>',
            '<div class="value">' +
              issues.length +
              "</div>",
            "</div>",

            "</div>",

            '<div class="grid">',

            '<div class="card">',
            '<div class="card-title">Overall Coverage</div>',
            '<div class="value coverage-value">' +
              (overallCoverage === null
                ? "N/A"
                : percent(overallCoverage)) +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">New Code Coverage</div>',
            '<div class="value coverage-value">' +
              (newCoverage === null
                ? "N/A"
                : percent(newCoverage)) +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">Uncovered Lines</div>',
            '<div class="value">' +
              uncoveredLines +
              "</div>",
            "</div>",

            '<div class="card">',
            '<div class="card-title">Uncovered Conditions</div>',
            '<div class="value">' +
              uncoveredConditions +
              "</div>",
            "</div>",

            "</div>",

            '<div class="section">',
            "<h2>Security Severity Distribution</h2>",
            "<p>Active OPEN and REOPENED SonarCloud issues.</p>",
            '<div class="stats">',

            '<div class="stat">',
            "<span>🔴 High</span>",
            "<strong>" +
              highIssues.length +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>🟠 Medium</span>",
            "<strong>" +
              mediumIssues.length +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>🟣 Blocker</span>",
            "<strong>" +
              blockerIssues.length +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>📋 Total</span>",
            "<strong>" +
              issues.length +
              "</strong>",
            "</div>",

            "</div>",
            "</div>",

            '<div class="section">',
            "<h2>Coverage Overview</h2>",
            '<div class="stats">',

            '<div class="stat">',
            "<span>Overall Coverage</span>",
            "<strong>" +
              (overallCoverage === null
                ? "N/A"
                : percent(overallCoverage)) +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>Coverage on New Code</span>",
            "<strong>" +
              (newCoverage === null
                ? "N/A"
                : percent(newCoverage)) +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>Uncovered Lines</span>",
            "<strong>" +
              uncoveredLines +
              "</strong>",
            "</div>",

            '<div class="stat">',
            "<span>Uncovered Conditions</span>",
            "<strong>" +
              uncoveredConditions +
              "</strong>",
            "</div>",

            "</div>",

            "<br>",

            "<p>",
            "<strong>Uncovered New Lines:</strong> " +
              newUncoveredLines +
              " &nbsp;&nbsp; ",
            "<strong>Uncovered New Conditions:</strong> " +
              newUncoveredConditions,
            "</p>",

            "</div>",

            '<div class="section">',
            "<h2>🔴 High Severity Issues</h2>",
            "<p>" +
              highIssues.length +
              " active high-severity issue(s).</p>",
            '<div class="table-wrap">',
            "<table>",
            "<thead>",
            "<tr>",
            "<th>Severity</th>",
            "<th>Rule</th>",
            "<th>Message</th>",
            "<th>File</th>",
            "<th>Line</th>",
            "<th>Action</th>",
            "</tr>",
            "</thead>",
            "<tbody>",
            issueRows(highIssues),
            "</tbody>",
            "</table>",
            "</div>",
            "</div>",

            '<div class="section">',
            "<h2>🟠 Medium Severity Issues</h2>",
            "<p>" +
              mediumIssues.length +
              " active medium-severity issue(s).</p>",
            '<div class="table-wrap">',
            "<table>",
            "<thead>",
            "<tr>",
            "<th>Severity</th>",
            "<th>Rule</th>",
            "<th>Message</th>",
            "<th>File</th>",
            "<th>Line</th>",
            "<th>Action</th>",
            "</tr>",
            "</thead>",
            "<tbody>",
            issueRows(mediumIssues),
            "</tbody>",
            "</table>",
            "</div>",
            "</div>",

            '<div class="section">',
            "<h2>🟣 Blocker Issues</h2>",
            "<p>" +
              blockerIssues.length +
              " active blocker issue(s).</p>",
            '<div class="table-wrap">',
            "<table>",
            "<thead>",
            "<tr>",
            "<th>Severity</th>",
            "<th>Rule</th>",
            "<th>Message</th>",
            "<th>File</th>",
            "<th>Line</th>",
            "<th>Action</th>",
            "</tr>",
            "</thead>",
            "<tbody>",
            issueRows(blockerIssues),
            "</tbody>",
            "</table>",
            "</div>",
            "</div>",

            '<div class="section">',
            "<h2>📊 Coverage by File</h2>",
            "<p>",
            "Files are sorted by uncovered new lines first, followed by overall uncovered lines.",
            "</p>",

            '<div class="legend">',
            "<span>🔴 Red = uncovered code exists</span>",
            "<span>🟢 Green = fully covered</span>",
            "</div>",

            '<div class="table-wrap">',
            "<table>",
            "<thead>",
            "<tr>",
            "<th>File</th>",
            "<th>New Code Coverage</th>",
            "<th>Uncovered New Lines</th>",
            "<th>Uncovered New Conditions</th>",
            "<th>Overall Coverage</th>",
            "<th>Overall Uncovered Lines</th>",
            "<th>Overall Uncovered Conditions</th>",
            "</tr>",
            "</thead>",
            "<tbody>",
            fileCoverageRows(),
            "</tbody>",
            "</table>",
            "</div>",
            "</div>",

            '<div class="footer">',
            "Generated automatically by GitHub Actions → SonarCloud Security Analysis",
            "<br>",
            "Repository: " +
              escapeHtml(repository) +
              " | Branch: " +
              escapeHtml(branch) +
              " | Commit: " +
              escapeHtml(commit),
            "</div>",

            "</div>",
            "</body>",
            "</html>",
          ].join("\n");

          fs.writeFileSync(
            "sonar-summary.html",
            html,
            "utf8"
          );

          console.log("============================================================");
          console.log("Report generated successfully");
          console.log("============================================================");
          console.log("Active issues:", issues.length);
          console.log("High:", highIssues.length);
          console.log("Medium:", mediumIssues.length);
          console.log("Blocker:", blockerIssues.length);
          console.log(
            "Overall coverage:",
            overallCoverage === null
              ? "N/A"
              : percent(overallCoverage)
          );
          console.log(
            "New-code coverage:",
            newCoverage === null
              ? "N/A"
              : percent(newCoverage)
          );
          console.log("Uncovered lines:", uncoveredLines);
          console.log("Uncovered conditions:", uncoveredConditions);
          console.log("Files returned:", fileRows.length);
          console.log("============================================================");
          EOF

      # ============================================================
      # GENERATE REPORT
      # ============================================================
      - name: Generate SonarCloud HTML Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "============================================================"
          echo "Generating SonarCloud HTML report"
          echo "============================================================"

          node generate-sonar-report.mjs

          test -f sonar-summary.html

          echo "Report created:"
          ls -lh sonar-summary.html

      # ============================================================
      # UPLOAD REPORT
      # ============================================================
      - name: Upload SonarCloud HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html
          if-no-files-found: warn