      # ============================================================
      # GENERATE REPORT
      # ============================================================
      - name: Generate real-time SonarCloud HTML report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "============================================================"
          echo "Generating SonarCloud HTML report"
          echo "============================================================"

          node generate-sonar-report.mjs

      # ============================================================
      # UPLOAD HTML
      # ============================================================
      - name: Upload SonarCloud HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html
          if-no-files-found: warn

      # ============================================================
      # UPLOAD RAW DATA FOR DEBUGGING
      # ============================================================
      - name: Upload SonarCloud diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-diagnostics
          path: |
            .scannerwork/report-task.txt
            coverage/lcov.info
          if-no-files-found: warn