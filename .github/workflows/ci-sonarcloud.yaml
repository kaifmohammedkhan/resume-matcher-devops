      # ============================================================
      # GENERATE REPORT
      #
      # IMPORTANT:
      # Use .cjs because package.json contains "type": "module".
      # ============================================================
      - name: Generate SonarCloud infographic report
        if: always()
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e

          node generate-sonar-report.cjs

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================
      - name: Upload SonarCloud infographic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html
          if-no-files-found: warn

      # ============================================================
      # UPLOAD RAW SONARCLOUD DATA
      #
      # Useful for debugging and verifying that the HTML report
      # is based on actual SonarCloud API responses.
      # ============================================================
      - name: Upload SonarCloud raw API data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-raw-data
          path: |
            sonar-project.json
            sonar-issues.json
            sonar-measures.json
            sonar-files.json
            .scannerwork/report-task.txt
          if-no-files-found: warn