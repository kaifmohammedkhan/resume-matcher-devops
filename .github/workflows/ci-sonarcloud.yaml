name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD REAL JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # ============================================================
      # VERIFY COVERAGE
      # ============================================================
      - name: Verify LCOV coverage
        run: |
          set -e
          echo "============================================================"
          echo "Checking Jest coverage"
          echo "============================================================"

          if [ ! -f "coverage/lcov.info" ]; then
            echo "ERROR: coverage/lcov.info was not found." >&2
            exit 1
          fi

          echo "LCOV file found:"
          ls -lh coverage/lcov.info

          echo ""
          echo "LCOV record count:"
          grep -c "^SF:" coverage/lcov.info || true

          echo ""
          echo "First LCOV records:"
          head -30 coverage/lcov.info

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        shell: bash
        run: |
          set -e
          SONAR_SCANNER_VERSION="5.0.1.3006"
          SONAR_SCANNER_ZIP="sonar-scanner-cli-${SONAR_SCANNER_VERSION}.zip"
          SONAR_SCANNER_URL="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SONAR_SCANNER_ZIP}"
          SONAR_SCANNER_SHA_URL="${SONAR_SCANNER_URL}.sha256"

          curl --fail --silent --location "$SONAR_SCANNER_URL" --output "$SONAR_SCANNER_ZIP"
          curl --fail --silent --location "$SONAR_SCANNER_SHA_URL" --output "${SONAR_SCANNER_ZIP}.sha256"

          EXPECTED_SHA=$(awk '{print $1}' "${SONAR_SCANNER_ZIP}.sha256")
          ACTUAL_SHA=$(sha256sum "$SONAR_SCANNER_ZIP" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: SonarScanner checksum verification failed." >&2
            exit 1
          fi

          unzip -q "$SONAR_SCANNER_ZIP" -d "$HOME"
          rm -f "$SONAR_SCANNER_ZIP" "${SONAR_SCANNER_ZIP}.sha256"
          echo "$HOME/sonar-scanner-${SONAR_SCANNER_VERSION}/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # ============================================================
      # GENERATE REPORT SCRIPT
      # ============================================================
      - name: Create SonarCloud report generator
        if: always()
        run: |
          node generate-sonar-report.mjs

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload SonarCloud report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-report
          path: sonar-report.html
