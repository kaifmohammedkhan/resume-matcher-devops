name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Verify LCOV coverage report
        run: |
          echo "Checking coverage directory..."
          find coverage -maxdepth 3 -type f -print || true

          if [ ! -f "coverage/lcov.info" ]; then
            echo "::error::coverage/lcov.info was not found."
            echo "The SonarCloud coverage metrics cannot be calculated without the LCOV report."
            exit 1
          fi

          if [ ! -s "coverage/lcov.info" ]; then
            echo "::error::coverage/lcov.info exists but is empty."
            exit 1
          fi

          echo "LCOV report found:"
          wc -l coverage/lcov.info

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # SONAR SCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip \
            -o sonar-scanner.zip

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip.sha256 \
            -o sonar-scanner.zip.sha256

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SONARCLOUD ANALYSIS
      #
      # IMPORTANT:
      # qualitygate.wait=true makes the scanner wait until the
      # SonarCloud background analysis has finished.
      # ============================================================
      - name: Run SonarCloud analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          set -e

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

      # ============================================================
      # INSTALL JQ
      # ============================================================
      - name: Install jq
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # ============================================================
      # COLLECT REAL SONARCLOUD DATA
      # ============================================================
      - name: Fetch real-time SonarCloud data
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          SONAR_URL="${SONAR_HOST:-https://sonarcloud.io}"

          echo "============================================================"
          echo "SonarCloud API"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Sonar URL: $SONAR_URL"
          echo "============================================================"

          # --------------------------------------------------------
          # 1. ACTIVE ISSUES
          #
          # Use componentKeys + branch.
          # Use impactSeverities for current High/Medium/Blocker
          # terminology.
          # --------------------------------------------------------
          curl --fail-with-body \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "organization=$SONAR_ORG" \
            --data-urlencode "issueStatuses=OPEN,CONFIRMED,REOPENED" \
            --data-urlencode "impactSeverities=HIGH,MEDIUM,BLOCKER" \
            --data-urlencode "ps=500" \
            --data-urlencode "facets=impactSeverities" \
            "$SONAR_URL/api/issues/search" \
            -o sonar-issues.json

          # --------------------------------------------------------
          # 2. OVERALL + NEW CODE COVERAGE
          # --------------------------------------------------------
          curl --fail-with-body \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "metricKeys=coverage,new_coverage,lines_to_cover,new_lines_to_cover,uncovered_lines,new_uncovered_lines,conditions_to_cover,new_conditions_to_cover,uncovered_conditions,new_uncovered_conditions" \
            "$SONAR_URL/api/measures/component" \
            -o sonar-measures.json

          # --------------------------------------------------------
          # 3. FILE-LEVEL COVERAGE
          #
          # strategy=leaves returns file-level components.
          # --------------------------------------------------------
          curl --fail-with-body \
            --proto '=https' \
            --tlsv1.2 \
            -sS \
            -u "$SONAR_TOKEN:" \
            --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            --data-urlencode "metricKeys=coverage,new_coverage,lines_to_cover,new_lines_to_cover,uncovered_lines,new_uncovered_lines,conditions_to_cover,new_conditions_to_cover,uncovered_conditions,new_uncovered_conditions" \
            --data-urlencode "strategy=leaves" \
            --data-urlencode "ps=500" \
            "$SONAR_URL/api/measures/component_tree" \
            -o sonar-files.json

          # --------------------------------------------------------
          # VERIFY API RESPONSES
          # --------------------------------------------------------
          echo ""
          echo "Checking SonarCloud API responses..."

          if jq -e '.errors and (.errors | length > 0)' sonar-issues.json >/dev/null 2>&1; then
            echo "::error::SonarCloud Issues API returned an error:"
            jq '.' sonar-issues.json
            exit 1
          fi

          if jq -e '.errors and (.errors | length > 0)' sonar-measures.json >/dev/null 2>&1; then
            echo "::error::SonarCloud Measures API returned an error:"
            jq '.' sonar-measures.json
            exit 1
          fi

          if jq -e '.errors and (.errors | length > 0)' sonar-files.json >/dev/null 2>&1; then
            echo "::error::SonarCloud Component Tree API returned an error:"
            jq '.' sonar-files.json
            exit 1
          fi

          echo ""
          echo "SonarCloud data successfully retrieved."

          echo ""
          echo "Issue count:"
          jq '.total // 0' sonar-issues.json

          echo ""
          echo "Overall/New coverage measures:"
          jq '.component.measures' sonar-measures.json

      # ============================================================
      # CREATE REAL-TIME HTML REPORT
      # ============================================================
      - name: Generate SonarCloud infographic report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import json
          import html
          import os
          from pathlib import Path

          SONAR_URL = os.environ.get("SONAR_HOST") or "https://sonarcloud.io"
          PROJECT_KEY = os.environ.get("SONAR_PROJECT_KEY", "")
          REPOSITORY = os.environ.get("REPOSITORY", "")
          BRANCH = os.environ.get("BRANCH", "")
          COMMIT = os.environ.get("COMMIT", "")
          SHORT_COMMIT = COMMIT[:7]

          def load_json(path, fallback):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return fallback

          issues_data = load_json("sonar-issues.json", {"issues": [], "total": 0})
          measures_data = load_json(
              "sonar-measures.json",
              {"component": {"measures": []}}
          )
          files_data = load_json(
              "sonar-files.json",
              {"components": []}
          )

          issues = issues_data.get("issues", [])
          total_issues = issues_data.get("total", len(issues))

          # ==========================================================
          # ISSUE COUNTS
          # ==========================================================
          def impact_severity(issue):
              return (
                  issue.get("impactSeverity")
                  or issue.get("impact", {}).get("severity")
                  or issue.get("severity")
                  or ""
              ).upper()

          high_issues = [
              i for i in issues
              if impact_severity(i) == "HIGH"
          ]

          medium_issues = [
              i for i in issues
              if impact_severity(i) == "MEDIUM"
          ]

          blocker_issues = [
              i for i in issues
              if impact_severity(i) == "BLOCKER"
          ]

          # ==========================================================
          # MEASURES
          # ==========================================================
          measures = {}

          for measure in measures_data.get("component", {}).get("measures", []):
              metric = measure.get("metric")

              value = measure.get("value")

              if value is None and isinstance(measure.get("period"), dict):
                  value = measure["period"].get("value")

              if value is None and measure.get("periods"):
                  value = measure["periods"][0].get("value")

              measures[metric] = value

          def metric_value(metric, default="0"):
              value = measures.get(metric)

              if value is None or value == "":
                  return default

              return value

          overall_coverage = metric_value("coverage", "N/A")
          new_coverage = metric_value("new_coverage", "N/A")

          uncovered_lines = metric_value("uncovered_lines", "0")
          uncovered_conditions = metric_value("uncovered_conditions", "0")

          new_uncovered_lines = metric_value("new_uncovered_lines", "0")
          new_uncovered_conditions = metric_value(
              "new_uncovered_conditions",
              "0"
          )

          lines_to_cover = metric_value("lines_to_cover", "0")
          new_lines_to_cover = metric_value("new_lines_to_cover", "0")

          # ==========================================================
          # FILE-LEVEL COVERAGE
          # ==========================================================
          file_rows = []

          for component in files_data.get("components", []):
              if component.get("qualifier") != "FIL":
                  continue

              measures_for_file = {}

              for measure in component.get("measures", []):
                  metric = measure.get("metric")

                  value = measure.get("value")

                  if value is None and isinstance(measure.get("period"), dict):
                      value = measure["period"].get("value")

                  if value is None and measure.get("periods"):
                      value = measure["periods"][0].get("value")

                  measures_for_file[metric] = value

              file_rows.append({
                  "path": component.get("path") or component.get("name") or "Unknown",
                  "new_coverage": measures_for_file.get("new_coverage"),
                  "new_uncovered_lines": measures_for_file.get(
                      "new_uncovered_lines"
                  ),
                  "new_uncovered_conditions": measures_for_file.get(
                      "new_uncovered_conditions"
                  ),
                  "coverage": measures_for_file.get("coverage"),
                  "uncovered_lines": measures_for_file.get(
                      "uncovered_lines"
                  ),
              })

          def number(value):
              try:
                  return float(value)
              except Exception:
                  return 0

          file_rows.sort(
              key=lambda row: (
                  number(row["new_uncovered_lines"]),
                  number(row["new_uncovered_conditions"])
              ),
              reverse=True
          )

          # ==========================================================
          # HELPERS
          # ==========================================================
          def esc(value):
              if value is None:
                  return ""
              return html.escape(str(value))

          def pct(value):
              if value in (None, ""):
                  return "N/A"
              try:
                  return f"{float(value):.1f}%"
              except Exception:
                  return esc(value)

          def issue_rows(issue_list, empty_message):
              if not issue_list:
                  return (
                      "<tr>"
                      "<td colspan='7' class='empty'>"
                      f"✓ {esc(empty_message)}"
                      "</td>"
                      "</tr>"
                  )

              rows = []

              for issue in issue_list:
                  component = issue.get("component", "")
                  file_name = component

                  prefix = PROJECT_KEY + ":"

                  if file_name.startswith(prefix):
                      file_name = file_name[len(prefix):]

                  line = issue.get("line")
                  if line is None:
                      line = "-"

                  severity = (
                      issue.get("impactSeverity")
                      or issue.get("severity")
                      or "UNKNOWN"
                  )

                  rule = issue.get("rule", "-")
                  message = issue.get("message", "-")
                  issue_key = issue.get("key", "")

                  sonar_issue_url = (
                      f"{SONAR_URL}/project/issues"
                      f"?id={PROJECT_KEY}"
                      f"&open={issue_key}"
                  )

                  rows.append(
                      "<tr>"
                      f"<td><span class='badge {severity.lower()}'>"
                      f"{esc(severity)}</span></td>"
                      f"<td>{esc(rule)}</td>"
                      f"<td>{esc(message)}</td>"
                      f"<td class='file'>{esc(file_name)}</td>"
                      f"<td>{esc(line)}</td>"
                      f"<td><a href='{esc(sonar_issue_url)}' "
                      f"target='_blank'>Open</a></td>"
                      "</tr>"
                  )

              return "".join(rows)

          # ==========================================================
          # HTML
          # ==========================================================
          html_report = f"""
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>SonarCloud Security & Coverage Report</title>

          <style>

          * {{
              box-sizing: border-box;
          }}

          body {{
              margin: 0;
              padding: 34px;
              background: #0b1324;
              color: #e8eefc;
              font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
          }}

          .container {{
              max-width: 1180px;
              margin: auto;
          }}

          .header {{
              background: linear-gradient(
                  135deg,
                  #111b31,
                  #16223a
              );
              border: 1px solid #33425e;
              border-radius: 18px;
              padding: 28px;
              margin-bottom: 20px;
          }}

          .header h1 {{
              margin: 0 0 8px 0;
              font-size: 27px;
          }}

          .subtitle {{
              color: #8fa7cf;
              margin-bottom: 20px;
          }}

          .metadata {{
              display: flex;
              flex-wrap: wrap;
              gap: 22px;
              font-size: 13px;
              color: #b9c9e5;
          }}

          .metadata strong {{
              color: #ffffff;
          }}

          .metadata a {{
              color: #6fc8ff;
              text-decoration: none;
          }}

          .cards {{
              display: grid;
              grid-template-columns:
                  repeat(6, minmax(0, 1fr));
              gap: 14px;
              margin-bottom: 20px;
          }}

          .card {{
              background: #121d32;
              border: 1px solid #34425c;
              border-radius: 16px;
              padding: 18px;
              min-height: 105px;
          }}

          .card-title {{
              color: #8fa7cf;
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
          }}

          .card-value {{
              margin-top: 10px;
              font-size: 28px;
              font-weight: 800;
          }}

          .high {{
              color: #ff6578;
          }}

          .medium {{
              color: #ffb629;
          }}

          .blocker {{
              color: #b27cff;
          }}

          .cyan {{
              color: #54dfff;
          }}

          .green {{
              color: #72e6a3;
          }}

          .section {{
              background: #111b2e;
              border: 1px solid #33425e;
              border-radius: 18px;
              padding: 20px;
              margin-bottom: 20px;
          }}

          .section h2 {{
              margin: 0 0 6px 0;
              font-size: 18px;
          }}

          .section-description {{
              color: #8fa7cf;
              font-size: 13px;
              margin-bottom: 18px;
          }}

          .severity-bar {{
              height: 14px;
              width: 100%;
              background: #202d45;
              border-radius: 999px;
              overflow: hidden;
              display: flex;
          }}

          .severity-high {{
              background: #ff6578;
          }}

          .severity-medium {{
              background: #ffb629;
          }}

          .severity-blocker {{
              background: #b27cff;
          }}

          .legend {{
              display: flex;
              flex-wrap: wrap;
              gap: 18px;
              margin-top: 14px;
              color: #9fb1d0;
              font-size: 12px;
          }}

          .legend span::before {{
              content: "●";
              margin-right: 6px;
          }}

          .legend .lh::before {{
              color: #ff6578;
          }}

          .legend .lm::before {{
              color: #ffb629;
          }}

          .legend .lb::before {{
              color: #b27cff;
          }}

          .coverage-grid {{
              display: grid;
              grid-template-columns:
                  repeat(5, minmax(0, 1fr));
              gap: 12px;
          }}

          .coverage-box {{
              background: #162238;
              border: 1px solid #2f3e59;
              border-radius: 14px;
              padding: 16px;
          }}

          .coverage-label {{
              color: #8fa7cf;
              font-size: 11px;
          }}

          .coverage-value {{
              margin-top: 7px;
              font-size: 24px;
              font-weight: 800;
          }}

          table {{
              width: 100%;
              border-collapse: collapse;
              font-size: 12px;
          }}

          th {{
              background: #1b2942;
              color: #c8d6ee;
              text-align: left;
              padding: 12px 10px;
              border-bottom: 1px solid #35445e;
          }}

          td {{
              padding: 11px 10px;
              border-bottom: 1px solid #26354d;
              vertical-align: top;
          }}

          tr:hover {{
              background: #152239;
          }}

          .file {{
              color: #8fd5ff;
              font-family: monospace;
          }}

          .badge {{
              padding: 4px 8px;
              border-radius: 999px;
              font-size: 10px;
              font-weight: 800;
              display: inline-block;
          }}

          .badge.high {{
              background: rgba(255,101,120,.15);
              color: #ff7181;
          }}

          .badge.medium {{
              background: rgba(255,182,41,.15);
              color: #ffbf42;
          }}

          .badge.blocker {{
              background: rgba(178,124,255,.15);
              color: #bd8cff;
          }}

          .empty {{
              text-align: center;
              color: #74e2a0;
              padding: 22px;
          }}

          a {{
              color: #67c7ff;
              text-decoration: none;
          }}

          .footer {{
              text-align: center;
              color: #7083a4;
              font-size: 11px;
              padding: 15px;
          }}

          @media (max-width: 1000px) {{
              .cards {{
                  grid-template-columns: repeat(3, 1fr);
              }}

              .coverage-grid {{
                  grid-template-columns: repeat(2, 1fr);
              }}
          }}

          @media (max-width: 650px) {{
              body {{
                  padding: 15px;
              }}

              .cards {{
                  grid-template-columns: 1fr 1fr;
              }}

              .coverage-grid {{
                  grid-template-columns: 1fr;
              }}

              table {{
                  display: block;
                  overflow-x: auto;
              }}
          }}

          </style>
          </head>

          <body>

          <div class="container">

          <div class="header">

              <h1>SonarCloud Security & Coverage Report</h1>

              <div class="subtitle">
                  Real-time SonarCloud issues, severity distribution,
                  overall coverage and uncovered new code.
              </div>

              <div class="metadata">

                  <span>
                      Repository:
                      <strong>{esc(REPOSITORY)}</strong>
                  </span>

                  <span>
                      Branch:
                      <strong>{esc(BRANCH)}</strong>
                  </span>

                  <span>
                      Commit:
                      <strong>{esc(SHORT_COMMIT)}</strong>
                  </span>

                  <span>
                      <a
                        href="{esc(SONAR_URL)}/dashboard?id={esc(PROJECT_KEY)}"
                        target="_blank"
                      >
                        Open SonarCloud
                      </a>
                  </span>

              </div>

          </div>


          <div class="cards">

              <div class="card">
                  <div class="card-title">High Severity</div>
                  <div class="card-value high">
                      {len(high_issues)}
                  </div>
              </div>

              <div class="card">
                  <div class="card-title">Medium Severity</div>
                  <div class="card-value medium">
                      {len(medium_issues)}
                  </div>
              </div>

              <div class="card">
                  <div class="card-title">Blocker</div>
                  <div class="card-value blocker">
                      {len(blocker_issues)}
                  </div>
              </div>

              <div class="card">
                  <div class="card-title">Total Active Issues</div>
                  <div class="card-value">
                      {total_issues}
                  </div>
              </div>

              <div class="card">
                  <div class="card-title">Overall Coverage</div>
                  <div class="card-value cyan">
                      {pct(overall_coverage)}
                  </div>
              </div>

              <div class="card">
                  <div class="card-title">New Code Coverage</div>
                  <div class="card-value green">
                      {pct(new_coverage)}
                  </div>
              </div>

          </div>


          <div class="section">

              <h2>Security Severity Distribution</h2>

              <div class="section-description">
                  Active OPEN, CONFIRMED and REOPENED SonarCloud issues.
              </div>

              <div class="severity-bar">

                  <div
                    class="severity-high"
                    style="width: {
                      (
                        len(high_issues)
                        / max(
                            len(high_issues)
                            + len(medium_issues)
                            + len(blocker_issues),
                            1
                        )
                        * 100
                      )
                    }%"
                  ></div>

                  <div
                    class="severity-medium"
                    style="width: {
                      (
                        len(medium_issues)
                        / max(
                            len(high_issues)
                            + len(medium_issues)
                            + len(blocker_issues),
                            1
                        )
                        * 100
                      )
                    }%"
                  ></div>

                  <div
                    class="severity-blocker"
                    style="width: {
                      (
                        len(blocker_issues)
                        / max(
                            len(high_issues)
                            + len(medium_issues)
                            + len(blocker_issues),
                            1
                        )
                        * 100
                      )
                    }%"
                  ></div>

              </div>

              <div class="legend">

                  <span class="lh">
                      High: {len(high_issues)}
                  </span>

                  <span class="lm">
                      Medium: {len(medium_issues)}
                  </span>

                  <span class="lb">
                      Blocker: {len(blocker_issues)}
                  </span>

              </div>

          </div>


          <div class="section">

              <h2>Coverage Overview</h2>

              <div class="section-description">
                  Values are read directly from the SonarCloud Measures API
                  after the analysis has completed.
              </div>

              <div class="coverage-grid">

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Overall Coverage
                      </div>
                      <div class="coverage-value cyan">
                          {pct(overall_coverage)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Coverage on New Code
                      </div>
                      <div class="coverage-value green">
                          {pct(new_coverage)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Uncovered Lines
                      </div>
                      <div class="coverage-value">
                          {esc(uncovered_lines)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Uncovered Conditions
                      </div>
                      <div class="coverage-value">
                          {esc(uncovered_conditions)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Uncovered New Lines
                      </div>
                      <div class="coverage-value high">
                          {esc(new_uncovered_lines)}
                      </div>
                  </div>

              </div>

              <div style="height:12px"></div>

              <div class="coverage-grid">

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Lines to Cover
                      </div>
                      <div class="coverage-value">
                          {esc(lines_to_cover)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          New Lines to Cover
                      </div>
                      <div class="coverage-value">
                          {esc(new_lines_to_cover)}
                      </div>
                  </div>

                  <div class="coverage-box">
                      <div class="coverage-label">
                          Uncovered New Conditions
                      </div>
                      <div class="coverage-value high">
                          {esc(new_uncovered_conditions)}
                      </div>
                  </div>

              </div>

          </div>


          <div class="section">

              <h2>🔴 High Severity Issues</h2>

              <div class="section-description">
                  {len(high_issues)} active high-severity issue(s).
              </div>

              <table>

                  <thead>
                      <tr>
                          <th>Severity</th>
                          <th>Rule</th>
                          <th>Message</th>
                          <th>File</th>
                          <th>Line</th>
                          <th>Action</th>
                      </tr>
                  </thead>

                  <tbody>

                      {issue_rows(
                          high_issues,
                          "No active high-severity issues found."
                      )}

                  </tbody>

              </table>

          </div>


          <div class="section">

              <h2>🟠 Medium Severity Issues</h2>

              <div class="section-description">
                  {len(medium_issues)} active medium-severity issue(s).
              </div>

              <table>

                  <thead>
                      <tr>
                          <th>Severity</th>
                          <th>Rule</th>
                          <th>Message</th>
                          <th>File</th>
                          <th>Line</th>
                          <th>Action</th>
                      </tr>
                  </thead>

                  <tbody>

                      {issue_rows(
                          medium_issues,
                          "No active medium-severity issues found."
                      )}

                  </tbody>

              </table>

          </div>


          <div class="section">

              <h2>🟣 Blocker Issues</h2>

              <div class="section-description">
                  {len(blocker_issues)} active blocker issue(s).
              </div>

              <table>

                  <thead>
                      <tr>
                          <th>Severity</th>
                          <th>Rule</th>
                          <th>Message</th>
                          <th>File</th>
                          <th>Line</th>
                          <th>Action</th>
                      </tr>
                  </thead>

                  <tbody>

                      {issue_rows(
                          blocker_issues,
                          "No active blocker issues found."
                      )}

                  </tbody>

              </table>

          </div>


          <div class="section">

              <h2>📊 New Code Coverage by File</h2>

              <div class="section-description">
                  Real SonarCloud file-level metrics, sorted by the number
                  of uncovered new lines.
              </div>

              <table>

                  <thead>
                      <tr>
                          <th>File</th>
                          <th>New Code Coverage</th>
                          <th>Uncovered New Lines</th>
                          <th>Uncovered New Conditions</th>
                          <th>Overall Coverage</th>
                          <th>Overall Uncovered Lines</th>
                      </tr>
                  </thead>

                  <tbody>
          """

          if not file_rows:
              html_report += """
                      <tr>
                          <td colspan="6" class="empty">
                              No file-level coverage data returned by SonarCloud.
                          </td>
                      </tr>
              """
          else:
              for row in file_rows:
                  html_report += f"""
                      <tr>
                          <td class="file">
                              {esc(row["path"])}
                          </td>

                          <td>
                              {pct(row["new_coverage"])}
                          </td>

                          <td class="high">
                              {esc(row["new_uncovered_lines"] or "0")}
                          </td>

                          <td class="high">
                              {esc(row["new_uncovered_conditions"] or "0")}
                          </td>

                          <td>
                              {pct(row["coverage"])}
                          </td>

                          <td>
                              {esc(row["uncovered_lines"] or "0")}
                          </td>
                      </tr>
                  """

          html_report += """
                  </tbody>

              </table>

          </div>


          <div class="footer">
              Generated automatically by GitHub Actions →
              SonarCloud Security Analysis.
              Data retrieved after SonarCloud background analysis completed.
          </div>

          </div>

          </body>
          </html>
          """

          Path("sonar-summary.html").write_text(
              html_report,
              encoding="utf-8"
          )

          print("Generated sonar-summary.html")

          print("")
          print("============================================================")
          print("REAL SONARCLOUD SUMMARY")
          print("============================================================")
          print(f"High:       {len(high_issues)}")
          print(f"Medium:     {len(medium_issues)}")
          print(f"Blocker:    {len(blocker_issues)}")
          print(f"Total:      {total_issues}")
          print(f"Coverage:   {overall_coverage}")
          print(f"New code:   {new_coverage}")
          print(f"Uncovered:  {uncovered_lines}")
          print(f"New lines:  {new_uncovered_lines}")
          print("============================================================")
          PY

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================
      - name: Upload SonarCloud infographic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: |
            sonar-summary.html
            sonar-issues.json
            sonar-measures.json
            sonar-files.json
          if-no-files-found: warn