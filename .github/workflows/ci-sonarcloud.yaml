name: CI & Security Pipeline - SonarCloud Security Analysis

on:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DOWNLOAD JEST COVERAGE
      # ============================================================
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Verify coverage report
        run: |
          set -e

          echo "============================================================"
          echo "Coverage files"
          echo "============================================================"

          find coverage -maxdepth 3 -type f -print || true

          echo "============================================================"

          if [ ! -f "coverage/lcov.info" ]; then
            echo "ERROR: coverage/lcov.info was not found."
            exit 1
          fi

          echo "Coverage report found."

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # INSTALL SONARSCANNER
      # ============================================================
      - name: Install SonarScanner CLI securely
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip \
            -o sonar-scanner.zip

          curl --proto '=https' --tlsv1.2 -sSLf \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip.sha256 \
            -o sonar-scanner.zip.sha256

          sed -i "s/$/  sonar-scanner.zip/" sonar-scanner.zip.sha256

          sha256sum -c sonar-scanner.zip.sha256

          unzip -q sonar-scanner.zip -d "$HOME"

          rm -f sonar-scanner.zip sonar-scanner.zip.sha256

          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> "$GITHUB_PATH"

      # ============================================================
      # SONARCLOUD ANALYSIS
      # ============================================================
      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          set -e

          echo "============================================================"
          echo "SonarCloud Analysis"
          echo "============================================================"
          echo "Project: $SONAR_PROJECT_KEY"
          echo "Organization: $SONAR_ORG"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Sonar URL: $SONAR_HOST"
          echo "============================================================"

          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.branch.name="${GITHUB_REF_NAME}" \
            -Dsonar.qualitygate.wait=false

      # ============================================================
      # SHOW SONAR TASK
      # ============================================================
      - name: Show SonarCloud task
        if: always()
        run: |
          echo "============================================================"
          echo "SonarCloud task"
          echo "============================================================"

          if [ -f ".scannerwork/report-task.txt" ]; then
            cat .scannerwork/report-task.txt
          else
            echo "WARNING: .scannerwork/report-task.txt not found."
          fi

      # ============================================================
      # WAIT FOR SONARCLOUD COMPUTE ENGINE
      # ============================================================
      - name: Wait for SonarCloud analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "ERROR: Sonar task file does not exist."
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: ceTaskUrl was not found."
            exit 1
          fi

          echo "Compute Engine URL:"
          echo "$CE_TASK_URL"

          echo ""
          echo "Waiting for SonarCloud analysis..."

          for i in $(seq 1 36); do

            RESPONSE=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              -sS \
              -u "$SONAR_TOKEN:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // empty')

            echo "Attempt $i/36 - Status: $STATUS"

            case "$STATUS" in

              SUCCESS)
                echo "SonarCloud analysis completed successfully."
                exit 0
                ;;

              FAILED)
                echo "SonarCloud analysis FAILED."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              CANCELED)
                echo "SonarCloud analysis was CANCELED."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              PENDING|IN_PROGRESS)
                sleep 10
                ;;

              *)
                echo "Unexpected response:"
                echo "$RESPONSE"
                sleep 10
                ;;

            esac

          done

          echo "ERROR: Timed out waiting for SonarCloud."
          exit 1

      # ============================================================
      # CREATE REPORT GENERATOR
      # ============================================================
      - name: Create SonarCloud report generator
        if: always()
        run: |
          cat > generate-sonar-report.mjs <<'EOF'

          import fs from "node:fs";

          const SONAR_TOKEN = process.env.SONAR_TOKEN;
          const SONAR_HOST =
            process.env.SONAR_HOST || "https://sonarcloud.io";

          const SONAR_PROJECT_KEY =
            process.env.SONAR_PROJECT_KEY;

          const SONAR_ORG =
            process.env.SONAR_ORG;

          const BRANCH =
            process.env.GITHUB_REF_NAME || "main";

          const REPOSITORY =
            process.env.GITHUB_REPOSITORY || "unknown";

          const COMMIT =
            process.env.GITHUB_SHA || "";

          if (!SONAR_TOKEN) {
            throw new Error("SONAR_TOKEN is missing.");
          }

          if (!SONAR_PROJECT_KEY) {
            throw new Error("SONAR_PROJECT_KEY is missing.");
          }

          if (!SONAR_ORG) {
            throw new Error("SONAR_ORG is missing.");
          }

          const BASE_URL =
            SONAR_HOST.replace(/\/+$/, "");

          // ==========================================================
          // API HELPER
          // ==========================================================

          async function sonarApi(path, params = {}) {

            const url = new URL(
              `${BASE_URL}${path}`
            );

            for (const [key, value] of Object.entries(params)) {

              if (
                value !== undefined &&
                value !== null &&
                value !== ""
              ) {
                url.searchParams.set(
                  key,
                  String(value)
                );
              }

            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("SonarCloud API");
            console.log(
              "============================================================"
            );
            console.log(`Endpoint: ${path}`);
            console.log(`Project: ${SONAR_PROJECT_KEY}`);
            console.log(`Branch: ${BRANCH}`);
            console.log(`URL: ${url.toString()}`);
            console.log(
              "============================================================"
            );

            const response = await fetch(
              url.toString(),
              {
                headers: {
                  Authorization:
                    `Basic ${Buffer.from(
                      `${SONAR_TOKEN}:`
                    ).toString("base64")`,

                  Accept:
                    "application/json",
                },
              }
            );

            const text =
              await response.text();

            if (!response.ok) {

              console.error("");
              console.error(
                "============================================================"
              );
              console.error(
                "SONARCLOUD API ERROR"
              );
              console.error(
                "============================================================"
              );
              console.error(
                `HTTP ${response.status}`
              );
              console.error(text);
              console.error(
                "============================================================"
              );

              throw new Error(
                `SonarCloud API returned HTTP ${response.status}`
              );
            }

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(
                `Invalid JSON returned by SonarCloud: ${text}`
              );
            }
          }

          // ==========================================================
          // HTML ESCAPE
          // ==========================================================

          function escapeHtml(value) {

            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");

          }

          function num(value) {

            const parsed =
              Number(value);

            return Number.isFinite(parsed)
              ? parsed
              : 0;

          }

          function percent(value) {

            if (
              value === undefined ||
              value === null ||
              value === ""
            ) {
              return "N/A";
            }

            const parsed =
              Number(value);

            if (!Number.isFinite(parsed)) {
              return "N/A";
            }

            return `${parsed.toFixed(1)}%`;

          }

          // ==========================================================
          // PROJECT METRICS
          // ==========================================================

          const metricKeys = [
            "coverage",
            "lines_to_cover",
            "uncovered_lines",
            "conditions_to_cover",
            "uncovered_conditions",

            "new_coverage",
            "new_lines_to_cover",
            "new_uncovered_lines",
            "new_conditions_to_cover",
            "new_uncovered_conditions",

            "new_lines",
            "new_technical_debt",
            "new_bugs",
            "new_vulnerabilities",
            "new_code_smells",
          ].join(",");

          const projectData =
            await sonarApi(
              "/api/measures/component",
              {
                component:
                  SONAR_PROJECT_KEY,

                metricKeys,

                branch:
                  BRANCH,
              }
            );

          const projectMeasures = {};

          for (
            const metric
            of projectData.component?.measures || []
          ) {

            projectMeasures[
              metric.metric
            ] = metric.value;

          }

          // ==========================================================
          // FILE LEVEL METRICS
          // ==========================================================

          const treeData =
            await sonarApi(
              "/api/measures/component_tree",
              {
                component:
                  SONAR_PROJECT_KEY,

                metricKeys,

                branch:
                  BRANCH,

                qualifiers:
                  "FIL",

                ps:
                  500,
              }
            );

          let files = [];

          for (
            const component
            of treeData.components || []
          ) {

            const values = {};

            for (
              const metric
              of component.measures || []
            ) {

              values[
                metric.metric
              ] = metric.value;

            }

            const path =
              component.path ||
              component.key ||
              "";

            // --------------------------------------------------------
            // Only source files that can meaningfully have JS coverage
            // --------------------------------------------------------

            const isCoverageFile =
              /\.(js|jsx|mjs|cjs|ts|tsx)$/i.test(path);

            if (!isCoverageFile) {
              continue;
            }

            files.push({

              path,

              coverage:
                values.coverage,

              uncoveredLines:
                num(values.uncovered_lines),

              newCoverage:
                values.new_coverage,

              newUncoveredLines:
                num(values.new_uncovered_lines),

              newUncoveredConditions:
                num(
                  values.new_uncovered_conditions
                ),

              uncoveredConditions:
                num(
                  values.uncovered_conditions
                ),

              linesToCover:
                num(values.lines_to_cover),

              newLinesToCover:
                num(
                  values.new_lines_to_cover
                ),

              conditionsToCover:
                num(
                  values.conditions_to_cover
                ),

              newConditionsToCover:
                num(
                  values.new_conditions_to_cover
                ),

            });

          }

          // ==========================================================
          // ISSUES
          // ==========================================================

          const issuesData =
            await sonarApi(
              "/api/issues/search",
              {
                componentKeys:
                  SONAR_PROJECT_KEY,

                branch:
                  BRANCH,

                statuses:
                  "OPEN,REOPENED",

                ps:
                  500,

                organization:
                  SONAR_ORG,
              }
            );

          const issues =
            issuesData.issues || [];

          // ==========================================================
          // SEVERITY COUNTS
          // ==========================================================

          const severityCounts = {

            BLOCKER: 0,

            CRITICAL: 0,

            HIGH: 0,

            MEDIUM: 0,

            LOW: 0,

            INFO: 0,

          };

          for (const issue of issues) {

            const severity =
              String(
                issue.severity || ""
              ).toUpperCase();

            if (
              severityCounts[
                severity
              ] !== undefined
            ) {

              severityCounts[
                severity
              ]++;

            }

          }

          // ==========================================================
          // SECURITY ISSUES
          // ==========================================================

          const securityIssues =
            issues.filter(
              issue =>
                issue.type === "VULNERABILITY" ||
                issue.type === "SECURITY_HOTSPOT" ||
                issue.type === "BUG"
            );

          const highIssues =
            issues.filter(
              issue =>
                String(
                  issue.severity
                ).toUpperCase() === "HIGH"
            );

          const mediumIssues =
            issues.filter(
              issue =>
                String(
                  issue.severity
                ).toUpperCase() === "MEDIUM"
            );

          const blockerIssues =
            issues.filter(
              issue =>
                String(
                  issue.severity
                ).toUpperCase() === "BLOCKER"
            );

          const criticalIssues =
            issues.filter(
              issue =>
                String(
                  issue.severity
                ).toUpperCase() === "CRITICAL"
            );

          // ==========================================================
          // NEW CODE FILES
          //
          // Only show files where Sonar actually reports new-code
          // coverage information.
          // ==========================================================

          const newCodeFiles =
            files.filter(file => {

              return (
                file.newCoverage !== undefined ||
                file.newUncoveredLines > 0 ||
                file.newUncoveredConditions > 0 ||
                file.newLinesToCover > 0
              );

            });

          newCodeFiles.sort(
            (a, b) => {

              if (
                b.newUncoveredLines !==
                a.newUncoveredLines
              ) {

                return (
                  b.newUncoveredLines -
                  a.newUncoveredLines
                );

              }

              return (
                b.newUncoveredConditions -
                a.newUncoveredConditions
              );

            }
          );

          // ==========================================================
          // ALL SOURCE FILES SORTED BY OVERALL UNCOVERED LINES
          // ==========================================================

          files.sort(
            (a, b) =>
              b.uncoveredLines -
              a.uncoveredLines
          );

          // ==========================================================
          // ISSUE TABLE
          // ==========================================================

          function issueTable(issueList) {

            if (!issueList.length) {

              return `
                <div class="empty success">
                  ✓ No active issues found.
                </div>
              `;

            }

            return `
              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>
                      <th>Severity</th>
                      <th>Type</th>
                      <th>Rule</th>
                      <th>Message</th>
                      <th>File</th>
                      <th>Line</th>
                    </tr>

                  </thead>

                  <tbody>

                    ${issueList.map(issue => {

                      const severity =
                        String(
                          issue.severity || ""
                        ).toLowerCase();

                      const file =
                        issue.component
                          ?.replace(
                            `${SONAR_PROJECT_KEY}:`,
                            ""
                          ) || "N/A";

                      return `

                        <tr>

                          <td>
                            <span
                              class="badge ${escapeHtml(
                                severity
                              )}"
                            >
                              ${escapeHtml(
                                issue.severity ||
                                "UNKNOWN"
                              )}
                            </span>
                          </td>

                          <td>
                            ${escapeHtml(
                              issue.type ||
                              "N/A"
                            )}
                          </td>

                          <td>
                            ${escapeHtml(
                              issue.rule ||
                              "N/A"
                            )}
                          </td>

                          <td>
                            ${escapeHtml(
                              issue.message ||
                              "N/A"
                            )}
                          </td>

                          <td class="file">
                            ${escapeHtml(file)}
                          </td>

                          <td>
                            ${escapeHtml(
                              issue.line ||
                              "N/A"
                            )}
                          </td>

                        </tr>

                      `;

                    }).join("")}

                  </tbody>

                </table>

              </div>
            `;

          }

          // ==========================================================
          // NEW CODE COVERAGE TABLE
          // ==========================================================

          function newCodeTable() {

            if (!newCodeFiles.length) {

              return `

                <div class="empty warning">

                  ⚠ SonarCloud did not return file-level
                  New Code coverage metrics for this analysis.

                  <br><br>

                  Overall coverage is available, but the
                  New Code baseline/period must be available
                  in SonarCloud for file-level new-code
                  coverage to be calculated.

                </div>

              `;

            }

            return `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>File</th>

                      <th>New Code Coverage</th>

                      <th>New Lines</th>

                      <th>Uncovered New Lines</th>

                      <th>New Conditions</th>

                      <th>Uncovered New Conditions</th>

                      <th>Overall Coverage</th>

                      <th>Overall Uncovered Lines</th>

                    </tr>

                  </thead>

                  <tbody>

                    ${newCodeFiles.map(file => `

                      <tr>

                        <td class="file">
                          ${escapeHtml(file.path)}
                        </td>

                        <td class="${
                          file.newUncoveredLines > 0
                            ? "danger-text"
                            : "success-text"
                        }">

                          ${percent(
                            file.newCoverage
                          )}

                        </td>

                        <td>
                          ${file.newLinesToCover}
                        </td>

                        <td class="${
                          file.newUncoveredLines > 0
                            ? "danger-text"
                            : ""
                        }">

                          ${file.newUncoveredLines}

                        </td>

                        <td>
                          ${file.newConditionsToCover}
                        </td>

                        <td class="${
                          file.newUncoveredConditions > 0
                            ? "danger-text"
                            : ""
                        }">

                          ${file.newUncoveredConditions}

                        </td>

                        <td>
                          ${percent(
                            file.coverage
                          )}
                        </td>

                        <td>
                          ${file.uncoveredLines}
                        </td>

                      </tr>

                    `).join("")}

                  </tbody>

                </table>

              </div>

            `;

          }

          // ==========================================================
          // OVERALL COVERAGE TABLE
          // ==========================================================

          function overallCoverageTable() {

            return `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>File</th>

                      <th>Coverage</th>

                      <th>Lines to Cover</th>

                      <th>Uncovered Lines</th>

                      <th>Conditions</th>

                      <th>Uncovered Conditions</th>

                    </tr>

                  </thead>

                  <tbody>

                    ${files.map(file => `

                      <tr>

                        <td class="file">
                          ${escapeHtml(
                            file.path
                          )}
                        </td>

                        <td>
                          ${percent(
                            file.coverage
                          )}
                        </td>

                        <td>
                          ${file.linesToCover}
                        </td>

                        <td class="${
                          file.uncoveredLines > 0
                            ? "danger-text"
                            : ""
                        }">

                          ${file.uncoveredLines}

                        </td>

                        <td>
                          ${file.conditionsToCover}
                        </td>

                        <td class="${
                          file.uncoveredConditions > 0
                            ? "danger-text"
                            : ""
                        }">

                          ${file.uncoveredConditions}

                        </td>

                      </tr>

                    `).join("")}

                  </tbody>

                </table>

              </div>

            `;

          }

          // ==========================================================
          // PROJECT VALUES
          // ==========================================================

          const overallCoverage =
            projectMeasures.coverage;

          const newCoverage =
            projectMeasures.new_coverage;

          const uncoveredLines =
            num(
              projectMeasures.uncovered_lines
            );

          const uncoveredConditions =
            num(
              projectMeasures.uncovered_conditions
            );

          const newLines =
            num(
              projectMeasures.new_lines
            );

          const newLinesToCover =
            num(
              projectMeasures.new_lines_to_cover
            );

          const newUncoveredLines =
            num(
              projectMeasures.new_uncovered_lines
            );

          const newConditionsToCover =
            num(
              projectMeasures.new_conditions_to_cover
            );

          const newUncoveredConditions =
            num(
              projectMeasures.new_uncovered_conditions
            );

          // ==========================================================
          // GENERATE HTML
          // ==========================================================

          const html = `

          <!DOCTYPE html>

          <html>

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              SonarCloud Security & Coverage Report
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {

                margin: 0;

                padding: 30px;

                background:
                  #07111f;

                color:
                  #f8fafc;

                font-family:
                  Inter,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

              }

              .container {

                max-width:
                  1500px;

                margin:
                  auto;

              }

              .hero {

                background:
                  linear-gradient(
                    135deg,
                    #111c31,
                    #0c1628
                  );

                border:
                  1px solid #263852;

                border-radius:
                  20px;

                padding:
                  30px;

                margin-bottom:
                  20px;

              }

              h1 {

                margin:
                  0 0 8px;

                font-size:
                  30px;

              }

              h2 {

                margin-top:
                  0;

              }

              .subtitle {

                color:
                  #93c5fd;

              }

              .metadata {

                margin-top:
                  18px;

                color:
                  #cbd5e1;

                font-size:
                  13px;

                display:
                  flex;

                flex-wrap:
                  wrap;

                gap:
                  18px;

              }

              .metadata a {

                color:
                  #60a5fa;

              }

              .cards {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                  );

                gap:
                  14px;

                margin-bottom:
                  20px;

              }

              .card {

                background:
                  #111c31;

                border:
                  1px solid #263852;

                border-radius:
                  16px;

                padding:
                  20px;

              }

              .card-label {

                color:
                  #93c5fd;

                font-size:
                  11px;

                text-transform:
                  uppercase;

                letter-spacing:
                  .08em;

              }

              .card-value {

                font-size:
                  30px;

                font-weight:
                  800;

                margin-top:
                  10px;

              }

              .high {
                color:
                  #ff647c;
              }

              .medium {
                color:
                  #ffb11b;
              }

              .blocker {
                color:
                  #b184ff;
              }

              .critical {
                color:
                  #ff8a65;
              }

              .low {
                color:
                  #94a3b8;
              }

              .success-text {

                color:
                  #7ee787;

                font-weight:
                  700;

              }

              .danger-text {

                color:
                  #ff647c;

                font-weight:
                  700;

              }

              .section {

                background:
                  #111c31;

                border:
                  1px solid #263852;

                border-radius:
                  18px;

                padding:
                  24px;

                margin-bottom:
                  20px;

              }

              .severity-grid {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(140px, 1fr)
                  );

                gap:
                  12px;

              }

              .severity {

                padding:
                  16px;

                border-radius:
                  12px;

                background:
                  #0c1628;

                border:
                  1px solid #263852;

              }

              .severity-number {

                font-size:
                  26px;

                font-weight:
                  800;

              }

              .coverage-grid {

                display:
                  grid;

                grid-template-columns:
                  repeat(
