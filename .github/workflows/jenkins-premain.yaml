name: Trigger Jenkins on PR

on:
  pull_request:
    # Triggers when a PR is opened, updated, or reopened
    types: [opened, synchronize, reopened] 
    # Only trigger if the PR is trying to merge into the pre-main branch
    branches:
      - pre-main

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Pipeline Job
        uses: appleboy/jenkins-action@master
        with:
          url: ${{ secrets.JENKINS_URL }}
          user: ${{ secrets.JENKINS_USER }}
          token: ${{ secrets.JENKINS_TOKEN }}
          job: "your-jenkins-job-name" # Change this to your exact Jenkins job name
          # Passes the PR number and source branch info to Jenkins as parameters
          parameter: "PR_NUMBER=${{ github.event.pull_request.number }},BRANCH_NAME=${{ github.event.pull_request.head.ref }}"
