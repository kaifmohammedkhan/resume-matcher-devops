name: Manual Reseal GHCR Secret

on:
  workflow_dispatch:   # only runs when you trigger it manually

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up kubeseal
        run: |
          wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.0/kubeseal-linux-amd64
          sudo install -m 755 kubeseal-linux-amd64 /usr/local/bin/kubeseal

      - name: Create secret manifest
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=${{ secrets.GHCR_EMAIL }} \
            --dry-run=client -o yaml > ghcr-secret.yaml

      - name: Reseal secret
        run: |
          kubeseal --controller-namespace kube-system \
                   --controller-name sealed-secrets-controller \
                   --format=yaml < ghcr-secret.yaml > kustomize/base/sealed-ghcr-secret.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add kustomize/base/sealed-ghcr-secret.yaml
          git commit -m "Manually resealed GHCR secret"
          git push
