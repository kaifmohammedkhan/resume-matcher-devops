name: QA Pipeline - k6 Load Test

on:
  workflow_call:

permissions:
  contents: read

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
  QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
  SONAR_HOST: ${{ secrets.SONAR_HOST }}
  SONAR_ORG: ${{ secrets.SONAR_ORG }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:

  k6-load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wiremock:
        image: wiremock/wiremock:2.35.0
        ports:
          - 8080:8080
        volumes:
          - ./wiremock/mappings:/home/wiremock/mappings
        options: >-
          --health-cmd="curl --fail http://localhost:8080/__admin/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Application
        env:
          PORT: 3000
          WIREMOCK_URL: http://127.0.0.1:8080
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RATE_LIMIT_MAX: "10000"
        run: |
          mkdir -p results
          npm start > results/app.log 2>&1 &
          APP_PID=$!
          echo "$APP_PID" > results/app.pid
          echo "Application PID: $APP_PID"

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Application is READY."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited unexpectedly."
              cat results/app.log || true
              exit 1
            fi
            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

          echo "Application failed to start."
          cat results/app.log || true
          exit 1

      - name: Verify Application Before Load Test
        run: |
          mkdir -p results
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/ || true)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "ERROR: Application is unreachable."
            cat results/app.log || true
            exit 1
          fi
          echo "Application is reachable."
          echo "Target: http://127.0.0.1:3000"

      - name: Run k6 Load Test
        id: k6_load
        continue-on-error: true
        run: |
          mkdir -p results
          echo "=========================================="
          echo "k6 LOAD TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo "Virtual Users: 10"
          echo "Duration: 30 seconds"
          echo "Rate Limit: 10000 requests / 60 seconds"
          echo ""

          set +e
          k6 run \
            --vus 10 \
            --duration 30s \
            --out json=results/output.json \
            --summary-export=results/summary.json \
            tests/load.js \
            2>&1 | tee results/k6-console.log
          K6_EXIT=${PIPESTATUS[0]}
          set -e

          echo "$K6_EXIT" > results/k6-exit-code.txt
          echo "k6 exit code: $K6_EXIT"
          exit "$K6_EXIT"

      - name: Capture Load Diagnostics
        if: always()
        run: |
          mkdir -p results
          {
            echo "=========================================="
            echo "k6 Load Diagnostics"
            echo "=========================================="
            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo ""
            echo "k6 step outcome:"
            echo "${{ steps.k6_load.outcome }}"
            echo ""
            echo "k6 exit code:"
            cat results/k6-exit-code.txt 2>/dev/null || true
            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="
            cat results/app.log 2>/dev/null || true
            echo ""
            echo "=========================================="
            echo "k6 Console Log"
            echo "=========================================="
            cat results/k6-console.log 2>/dev/null || true
            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="
            cat results/summary.json 2>/dev/null || true
          } > results/diagnostics.log

      - name: Upload k6 Load Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail k6 Load Stage
        if: always() && steps.k6_load.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Review:"
          echo "  results/summary.json"
          echo "  results/output.json"
          echo "  results/k6-console.log"
          echo "  results/diagnostics.log"
          exit 1
