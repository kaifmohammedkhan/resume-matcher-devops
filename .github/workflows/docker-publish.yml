name: Build and Push to GHCR and Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # STAGE 1 — BUILD AND PUSH
  # ============================================================
  #
  # TEMPORARILY DISABLED
  #
  # DO NOT ENABLE THIS UNTIL THE SECURITY ENHANCEMENTS STAGE
  # HAS BEEN SUCCESSFULLY DEBUGGED AND VERIFIED.
  #
  # This prevents unnecessary Docker image builds and pushes
  # while Cosign / Syft / SBOM attestation are being tested.
  #
  # When re-enabled, this stage produces:
  #
  #   docker-build-push-report.html
  #
  # That report is automatically picked up by the Security
  # Enhancements email if the artifact exists.
  #
  # ============================================================

  # build-and-push:
  #   name: Build & Push
  #   runs-on: ubuntu-latest
  #
  #   permissions:
  #     contents: read
  #     packages: write
  #
  #   steps:
  #
  #     # ========================================================
  #     # CHECKOUT
  #     # ========================================================
  #
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #
  #     # ========================================================
  #     # QEMU
  #     # ========================================================
  #
  #     - name: Set up QEMU
  #       uses: docker/setup-qemu-action@v3
  #
  #
  #     # ========================================================
  #     # DOCKER BUILDX
  #     # ========================================================
  #
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #
  #
  #     # ========================================================
  #     # GHCR LOGIN
  #     # ========================================================
  #
  #     - name: Log in to GitHub Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #
  #
  #     # ========================================================
  #     # DOCKER HUB LOGIN
  #     # ========================================================
  #
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_TOKEN }}
  #
  #
  #     # ========================================================
  #     # DOCKER IMAGE METADATA
  #     # ========================================================
  #
  #     - name: Extract metadata (tags, labels) for Docker
  #       id: meta
  #       uses: docker/metadata-action@v5
  #       with:
  #         images: |
  #           ghcr.io/${{ github.repository }}
  #           ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
  #         tags: |
  #           type=raw,value=latest
  #           type=sha,format=short
  #
  #
  #     # ========================================================
  #     # BUILD AND PUSH
  #     # ========================================================
  #
  #     - name: Build and push Docker image
  #       id: build
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         tags: ${{ steps.meta.outputs.tags }}
  #         labels: ${{ steps.meta.outputs.labels }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max
  #
  #
  #     # ========================================================
  #     # DOCKER BUILD REPORT
  #     # ========================================================
  #
  #     - name: Generate Docker Build & Push HTML Report
  #       if: success()
  #       run: |
  #         mkdir -p reports/docker
  #
  #         # Existing Docker build report script goes here.
  #
  #
  #     - name: Upload Docker Build & Push Report
  #       if: success()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: docker-build-push-report
  #         path: reports/docker/docker-build-push-report.html
  #         retention-days: 14
  #
  #
  #     # ========================================================
  #     # INSTALL NODEMAILER
  #     # ========================================================
  #
  #     - name: Install Nodemailer
  #       if: success()
  #       run: npm install nodemailer@9.0.3
  #
  #
  #     # ========================================================
  #     # EMAIL
  #     # ========================================================
  #
  #     - name: Email Docker Build & Push Report
  #       if: success()
  #       env:
  #         EMAIL_USER: ${{ secrets.EMAIL_USER }}
  #         EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  #         QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
  #         QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
  #       run: |
  #         node --input-type=commonjs <<'NODE'
  #
  #         // Existing email script goes here.
  #
  #         NODE


  # ============================================================
  # STAGE 2 — SECURITY ENHANCEMENTS
  # ============================================================
  #
  # This stage works against the EXISTING images already present
  # in GHCR and Docker Hub.
  #
  # No Docker build occurs here.
  # No Docker push occurs here.
  #
  # ============================================================

  security-enhancements:
    name: Security Enhancements
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

      # REQUIRED FOR COSIGN KEYLESS SIGNING
      id-token: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false


      # ==========================================================
      # DOWNLOAD DOCKER BUILD & PUSH REPORT IF AVAILABLE
      # ==========================================================
      #
      # Stage 1 is currently disabled.
      #
      # Therefore this artifact normally does not exist.
      #
      # When Stage 1 is enabled again and produces:
      #
      #   docker-build-push-report
      #
      # this step automatically downloads:
      #
      #   docker-build-push-report.html
      #
      # If the artifact does not exist, the step is ignored.
      #
      # This allows Security Enhancements to remain fully isolated
      # while still supporting the final combined email.
      #
      # ==========================================================

      - name: Download Docker Build & Push Report if available
        uses: actions/download-artifact@v4
        with:
          name: docker-build-push-report
          path: reports/docker-build
          if-no-artifact-found: ignore


      # ==========================================================
      # INSTALL COSIGN
      # ==========================================================
      #
      # IMPORTANT:
      #
      # Do NOT configure certificate identity variables globally.
      #
      # The Cosign installer verifies the Cosign release itself.
      # Its release certificate identity is different from the
      # certificate identity generated by this GitHub Actions run.
      #
      # Therefore certificate identity parameters are supplied
      # ONLY to our image/attestation verification commands below.
      #
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify Cosign installation
        run: |
          cosign version


      # ==========================================================
      # INSTALL SYFT
      # ==========================================================

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Verify Syft installation
        run: |
          syft version


      # ==========================================================
      # GHCR LOGIN
      # ==========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # PREPARE EVIDENCE DIRECTORY
      # ==========================================================

      - name: Prepare Docker security evidence directory
        run: |
          mkdir -p reports/docker

          echo "=============================================="
          echo "Docker Security Evidence"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Run        : #$GITHUB_RUN_NUMBER"
          echo "=============================================="


      # ==========================================================
      # VERIFY EXISTING GHCR IMAGE
      # ==========================================================

      - name: Verify GHCR image exists
        run: |
          docker manifest inspect \
            ghcr.io/${{ github.repository }}:latest

          echo "GHCR image exists."


      # ==========================================================
      # VERIFY EXISTING DOCKER HUB IMAGE
      # ==========================================================

      - name: Verify Docker Hub image exists
        run: |
          docker manifest inspect \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest

          echo "Docker Hub image exists."


      # ==========================================================
      # COSIGN SIGN — GHCR
      # ==========================================================

      - name: Cosign Sign GHCR Image
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ghcr.io/${{ github.repository }}:latest


      # ==========================================================
      # COSIGN SIGN — DOCKER HUB
      # ==========================================================

      - name: Cosign Sign Docker Hub Image
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — GHCR
      # ==========================================================

      - name: Verify Cosign Signature — GHCR
        if: success()
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/kaifmohammedkhan/resume-matcher-devops/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            ghcr.io/${{ github.repository }}:latest \
            > reports/docker/cosign-ghcr-verify.json

          test -s reports/docker/cosign-ghcr-verify.json

          echo "=============================================="
          echo "GHCR Cosign verification PASSED"
          echo "=============================================="
          echo "Evidence:"
          echo "reports/docker/cosign-ghcr-verify.json"


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — DOCKER HUB
      # ==========================================================

      - name: Verify Cosign Signature — Docker Hub
        if: success()
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/kaifmohammedkhan/resume-matcher-devops/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            > reports/docker/cosign-dockerhub-verify.json

          test -s reports/docker/cosign-dockerhub-verify.json

          echo "=============================================="
          echo "Docker Hub Cosign verification PASSED"
          echo "=============================================="
          echo "Evidence:"
          echo "reports/docker/cosign-dockerhub-verify.json"


      # ==========================================================
      # GENERATE SPDX SBOM — GHCR
      # ==========================================================

      - name: Generate GHCR SPDX SBOM
        if: success()
        run: |
          syft \
            ghcr.io/${{ github.repository }}:latest \
            -o spdx-json \
            > reports/docker/sbom-ghcr.json

          test -s reports/docker/sbom-ghcr.json

          echo "GHCR SPDX SBOM generated successfully."


      # ==========================================================
      # GENERATE SPDX SBOM — DOCKER HUB
      # ==========================================================

      - name: Generate Docker Hub SPDX SBOM
        if: success()
        run: |
          syft \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            -o spdx-json \
            > reports/docker/sbom-dockerhub.json

          test -s reports/docker/sbom-dockerhub.json

          echo "Docker Hub SPDX SBOM generated successfully."


      # ==========================================================
      # VERIFY SBOM FILES
      # ==========================================================

      - name: Verify SBOM files
        if: success()
        run: |
          set -e

          test -s reports/docker/sbom-ghcr.json
          test -s reports/docker/sbom-dockerhub.json

          echo "GHCR SPDX SBOM generated successfully."
          echo "Docker Hub SPDX SBOM generated successfully."

          echo ""
          echo "Current evidence:"
          ls -lh reports/docker/


      # ==========================================================
      # COSIGN SBOM ATTESTATION — GHCR
      # ==========================================================
      #
      # SPDX JSON is the actual predicate.
      #
      # Therefore the predicate type is:
      #
      #   spdxjson
      #
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — GHCR
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate reports/docker/sbom-ghcr.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}:latest

          echo "GHCR SPDX SBOM attestation created."


      # ==========================================================
      # COSIGN SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — Docker Hub
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate reports/docker/sbom-dockerhub.json \
            --type spdxjson \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest

          echo "Docker Hub SPDX SBOM attestation created."


      # ==========================================================
      # VERIFY SBOM ATTESTATION — GHCR
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — GHCR
        if: success()
        run: |
          cosign verify-attestation \
            --certificate-identity-regexp="https://github.com/kaifmohammedkhan/resume-matcher-devops/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --type spdxjson \
            --output json \
            ghcr.io/${{ github.repository }}:latest \
            > reports/docker/attestation-ghcr.json

          test -s reports/docker/attestation-ghcr.json

          echo "=============================================="
          echo "GHCR SPDX attestation verification PASSED"
          echo "=============================================="
          echo "Evidence:"
          echo "reports/docker/attestation-ghcr.json"


      # ==========================================================
      # VERIFY SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — Docker Hub
        if: success()
        run: |
          cosign verify-attestation \
            --certificate-identity-regexp="https://github.com/kaifmohammedkhan/resume-matcher-devops/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --type spdxjson \
            --output json \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            > reports/docker/attestation-dockerhub.json

          test -s reports/docker/attestation-dockerhub.json

          echo "=============================================="
          echo "Docker Hub SPDX attestation verification PASSED"
          echo "=============================================="
          echo "Evidence:"
          echo "reports/docker/attestation-dockerhub.json"


      # ==========================================================
      # VERIFY ALL SECURITY EVIDENCE
      # ==========================================================

      - name: Verify all security evidence
        if: success()
        run: |
          set -e

          required_files=(
            reports/docker/cosign-ghcr-verify.json
            reports/docker/cosign-dockerhub-verify.json
            reports/docker/sbom-ghcr.json
            reports/docker/sbom-dockerhub.json
            reports/docker/attestation-ghcr.json
            reports/docker/attestation-dockerhub.json
          )

          for file in "${required_files[@]}"; do

            if [ ! -s "$file" ]; then
              echo "ERROR: Required evidence file is missing or empty:"
              echo "$file"
              exit 1
            fi

            echo "Verified evidence file:"
            echo "$file"

          done

          echo ""
          echo "=============================================="
          echo "ALL SECURITY EVIDENCE VERIFIED"
          echo "=============================================="

          ls -lh reports/docker/


      # ==========================================================
      # CREATE RAW SECURITY EVIDENCE ZIP
      # ==========================================================
      #
      # The six JSON files remain individually available through
      # the GitHub Actions artifact.
      #
      # This ZIP is created specifically for the email so that
      # the complete raw evidence can be delivered as ONE
      # attachment instead of six separate attachments.
      #
      # ==========================================================

      - name: Create raw security evidence ZIP
        if: success()
        run: |
          set -e

          cd reports/docker

          zip -j docker-security-raw-evidence.zip \
            cosign-ghcr-verify.json \
            cosign-dockerhub-verify.json \
            sbom-ghcr.json \
            sbom-dockerhub.json \
            attestation-ghcr.json \
            attestation-dockerhub.json

          cd ../..

          test -s reports/docker/docker-security-raw-evidence.zip

          echo ""
          echo "=============================================="
          echo "RAW SECURITY EVIDENCE ZIP CREATED"
          echo "=============================================="

          unzip -l reports/docker/docker-security-raw-evidence.zip


      # ==========================================================
      # GENERATE SECURITY ENHANCEMENTS HTML REPORT
      # ==========================================================
      #
      # IMPORTANT:
      #
      # The HTML report contains SUMMARY information only.
      #
      # It does NOT embed the complete SBOM JSON.
      #
      # This keeps the report lightweight.
      #
      # The complete raw evidence remains separately available
      # in the GitHub Actions artifact and in the ZIP attachment.
      #
      # ==========================================================

      - name: Generate Security Enhancements HTML Report
        if: success()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p reports/docker

          node --input-type=commonjs <<'NODE'

          const fs = require("fs");


          const repo =
            process.env.GITHUB_REPOSITORY || "N/A";

          const commit =
            process.env.GITHUB_SHA || "N/A";

          const shortCommit =
            commit.substring(0, 7);

          const branch =
            process.env.GITHUB_REF_NAME || "N/A";

          const runNumber =
            process.env.GITHUB_RUN_NUMBER || "N/A";

          const workflow =
            process.env.GITHUB_WORKFLOW || "N/A";

          const generatedAt =
            new Date().toISOString();

          const dockerHubUsername =
            process.env.DOCKERHUB_USERNAME || "N/A";


          const evidenceFiles = {

            ghcrSignature:
              "reports/docker/cosign-ghcr-verify.json",

            dockerHubSignature:
              "reports/docker/cosign-dockerhub-verify.json",

            ghcrSbom:
              "reports/docker/sbom-ghcr.json",

            dockerHubSbom:
              "reports/docker/sbom-dockerhub.json",

            ghcrAttestation:
              "reports/docker/attestation-ghcr.json",

            dockerHubAttestation:
              "reports/docker/attestation-dockerhub.json"

          };


          const evidence =
            Object.values(evidenceFiles);


          function escapeHtml(value) {

            return String(value)

              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");

          }


          function readJson(file) {

            return JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          }


          function fileSize(file) {

            const bytes =
              fs.statSync(file).size;

            if (bytes < 1024) {
              return `${bytes} B`;
            }

            if (bytes < 1024 * 1024) {
              return `${(
                bytes / 1024
              ).toFixed(1)} KB`;
            }

            return `${(
              bytes /
              (1024 * 1024)
            ).toFixed(2)} MB`;

          }


          function sbomStats(file) {

            const sbom =
              readJson(file);

            return {

              packages:
                Array.isArray(sbom.packages)
                  ? sbom.packages.length
                  : 0,

              files:
                Array.isArray(sbom.files)
                  ? sbom.files.length
                  : 0,

              spdxVersion:
                sbom.spdxVersion ||
                "SPDX JSON"

            };

          }


          function countEntries(file) {

            try {

              const data =
                readJson(file);

              if (Array.isArray(data)) {
                return data.length;
              }

              return 1;

            } catch {

              return 0;

            }

          }


          for (const file of evidence) {

            if (
              !fs.existsSync(file) ||
              fs.statSync(file).size === 0
            ) {

              throw new Error(
                `Required evidence file is missing or empty: ${file}`
              );

            }

          }


          const ghcrSbom =
            sbomStats(
              evidenceFiles.ghcrSbom
            );


          const dockerHubSbom =
            sbomStats(
              evidenceFiles.dockerHubSbom
            );


          const ghcrSignatureCount =
            countEntries(
              evidenceFiles.ghcrSignature
            );


          const dockerHubSignatureCount =
            countEntries(
              evidenceFiles.dockerHubSignature
            );


          const ghcrAttestationCount =
            countEntries(
              evidenceFiles.ghcrAttestation
            );


          const dockerHubAttestationCount =
            countEntries(
              evidenceFiles.dockerHubAttestation
            );


          const html = `<!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Docker Security Enhancements Report
            </title>


            <style>

              body {

                background:#07111f;

                color:#f8fafc;

                font-family:Arial,sans-serif;

                padding:28px;

                margin:0;

              }


              .container {

                max-width:1100px;

                margin:auto;

              }


              .panel {

                background:#0d1a2b;

                border:1px solid #263a56;

                border-radius:18px;

                padding:24px;

                margin-bottom:20px;

              }


              h1 {

                font-size:26px;

                margin:0 0 10px;

              }


              h2 {

                font-size:20px;

                margin:0 0 12px;

              }


              .status {

                font-weight:bold;

                color:#34d399;

                font-size:16px;

                margin-bottom:14px;

              }


              .meta {

                color:#a9b8cc;

                line-height:1.8;

              }


              .grid {

                display:grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(260px,1fr)
                  );

                gap:14px;

              }


              .card {

                background:#102138;

                border:1px solid #263a56;

                border-radius:12px;

                padding:18px;

              }


              .label {

                color:#8fa4bd;

                font-size:12px;

                text-transform:uppercase;

                letter-spacing:.05em;

              }


              .value {

                margin-top:7px;

                font-size:18px;

                font-weight:bold;

                word-break:break-word;

              }


              .small {

                color:#8fa4bd;

                font-size:12px;

                margin-top:7px;

                line-height:1.6;

              }


              .success {

                color:#34d399;

              }


              .file {

                font-family:monospace;

                font-size:12px;

                word-break:break-all;

              }


              .notice {

                background:#0b2035;

                border-left:4px solid #60a5fa;

                padding:15px;

                border-radius:8px;

                line-height:1.6;

                color:#cbd5e1;

              }

            </style>

          </head>


          <body>

            <div class="container">


              <div class="panel">

                <h1>
                  Docker Security Enhancements
                </h1>


                <div class="status">
                  ✓ SECURITY VERIFICATION PASSED
                </div>


                <div class="meta">

                  Repository:
                  ${escapeHtml(repo)}
                  <br>

                  Branch:
                  ${escapeHtml(branch)}
                  <br>

                  Commit:
                  ${escapeHtml(shortCommit)}
                  <br>

                  Workflow Run:
                  #${escapeHtml(runNumber)}
                  <br>

                  Workflow:
                  ${escapeHtml(workflow)}
                  <br>

                  Generated:
                  ${escapeHtml(generatedAt)}

                </div>

              </div>


              <div class="panel">

                <h2>
                  Cosign Image Signing
                </h2>


                <div class="grid">


                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="value success">
                      ✓ VERIFIED
                    </div>

                    <div class="small">

                      ghcr.io/${escapeHtml(repo)}:latest

                      <br>

                      Verification records:
                      ${ghcrSignatureCount}

                      <br>

                      Evidence:
                      <span class="file">
                        cosign-ghcr-verify.json
                      </span>

                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="value success">
                      ✓ VERIFIED
                    </div>

                    <div class="small">

                      ${escapeHtml(
                        dockerHubUsername
                      )}/resume-matcher-devops:latest

                      <br>

                      Verification records:
                      ${dockerHubSignatureCount}

                      <br>

                      Evidence:
                      <span class="file">
                        cosign-dockerhub-verify.json
                      </span>

                    </div>

                  </div>


                </div>

              </div>


              <div class="panel">

                <h2>
                  SPDX SBOM
                </h2>


                <div class="grid">


                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="value success">
                      ✓ GENERATED
                    </div>

                    <div class="small">

                      SPDX Version:
                      ${escapeHtml(
                        ghcrSbom.spdxVersion
                      )}

                      <br>

                      Packages:
                      ${ghcrSbom.packages}

                      <br>

                      Files:
                      ${ghcrSbom.files}

                      <br>

                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.ghcrSbom
                        )
                      )}

                      <br>

                      Evidence:
                      <span class="file">
                        sbom-ghcr.json
                      </span>

                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="value success">
                      ✓ GENERATED
                    </div>

                    <div class="small">

                      SPDX Version:
                      ${escapeHtml(
                        dockerHubSbom.spdxVersion
                      )}

                      <br>

                      Packages:
                      ${dockerHubSbom.packages}

                      <br>

                      Files:
                      ${dockerHubSbom.files}

                      <br>

                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.dockerHubSbom
                        )
                      )}

                      <br>

                      Evidence:
                      <span class="file">
                        sbom-dockerhub.json
                      </span>

                    </div>

                  </div>


                </div>

              </div>


              <div class="panel">

                <h2>
                  SBOM Attestation
                </h2>


                <div class="grid">


                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="value success">
                      ✓ VERIFIED
                    </div>

                    <div class="small">

                      Predicate Type:
                      spdxjson

                      <br>

                      Verification records:
                      ${ghcrAttestationCount}

                      <br>

                      Evidence:
                      <span class="file">
                        attestation-ghcr.json
                      </span>

                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="value success">
                      ✓ VERIFIED
                    </div>

                    <div class="small">

                      Predicate Type:
                      spdxjson

                      <br>

                      Verification records:
                      ${dockerHubAttestationCount}

                      <br>

                      Evidence:
                      <span class="file">
                        attestation-dockerhub.json
                      </span>

                    </div>

                  </div>


                </div>

              </div>


              <div class="panel">

                <h2>
                  Downloadable Raw Evidence
                </h2>


                <div class="notice">

                  The HTML report intentionally contains
                  summary information only.

                  <br><br>

                  The complete machine-readable evidence
                  remains available in the GitHub Actions
                  artifact:

                  <strong>
                    docker-security-evidence
                  </strong>

                  <br><br>

                  The email also includes the complete raw
                  security evidence as:

                  <strong>
                    docker-security-raw-evidence.zip
                  </strong>

                  <br><br>

                  The ZIP contains the complete raw Cosign
                  verification records, SPDX SBOMs, and
                  SBOM attestation verification records.

                </div>


                <br>


                <div class="grid">


                  ${evidence.map(file => `

                    <div class="card">

                      <div class="file">

                        ${escapeHtml(
                          file.replace(
                            "reports/docker/",
                            ""
                          )
                        )}

                      </div>


                      <div class="small">

                        Size:
                        ${escapeHtml(
                          fileSize(file)
                        )}

                      </div>

                    </div>

                  `).join("")}


                </div>

              </div>


            </div>

          </body>

          </html>`;


          fs.writeFileSync(

            "reports/docker/docker-security-report.html",

            html

          );


          console.log(
            "Docker security HTML report generated successfully."
          );


          console.log(
            "HTML report size:",
            fileSize(
              "reports/docker/docker-security-report.html"
            )
          );

          NODE


      # ==========================================================
      # VERIFY EMAIL ATTACHMENTS
      # ==========================================================
      #
      # Security report:
      #
      #   REQUIRED
      #
      # Raw evidence ZIP:
      #
      #   REQUIRED
      #
      # Docker Build & Push report:
      #
      #   OPTIONAL
      #
      # This is intentional because Stage 1 is currently disabled.
      #
      # ==========================================================

      - name: Verify email attachment files
        if: success()
        run: |
          set -e

          test -s reports/docker/docker-security-report.html
          test -s reports/docker/docker-security-raw-evidence.zip

          echo "Required email attachment:"
          ls -lh reports/docker/docker-security-report.html

          echo ""
          echo "Required raw evidence attachment:"
          ls -lh reports/docker/docker-security-raw-evidence.zip

          echo ""

          if [ -s reports/docker-build/docker-build-push-report.html ]; then
            echo "Optional Docker Build & Push report FOUND:"
            ls -lh reports/docker-build/docker-build-push-report.html
          else
            echo "Docker Build & Push report NOT FOUND."
            echo "This is expected while Stage 1 is disabled."
          fi


      # ==========================================================
      # UPLOAD COMPLETE DOCKER SECURITY EVIDENCE
      # ==========================================================
      #
      # This artifact contains:
      #
      # 1. docker-security-report.html
      # 2. docker-security-raw-evidence.zip
      # 3. sbom-ghcr.json
      # 4. sbom-dockerhub.json
      # 5. cosign-ghcr-verify.json
      # 6. cosign-dockerhub-verify.json
      # 7. attestation-ghcr.json
      # 8. attestation-dockerhub.json
      #
      # ==========================================================

      - name: Upload Docker Security Evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-evidence
          path: reports/docker/
          retention-days: 14


      # ==========================================================
      # INSTALL NODEMAILER
      # ==========================================================

      - name: Install Nodemailer
        if: success()
        run: |
          npm install nodemailer@9.0.3


      # ==========================================================
      # EMAIL DOCKER SECURITY REPORT
      # ==========================================================
      #
      # FINAL EMAIL ATTACHMENT DESIGN:
      #
      # Attachment 1:
      #   docker-build-push-report.html
      #
      #   OPTIONAL while Stage 1 is disabled.
      #
      #
      # Attachment 2:
      #   docker-security-report.html
      #
      #   ALWAYS ATTACHED.
      #
      #
      # Attachment 3:
      #   docker-security-raw-evidence.zip
      #
      #   ALWAYS ATTACHED.
      #
      #   Contains:
      #
      #     cosign-ghcr-verify.json
      #     cosign-dockerhub-verify.json
      #     sbom-ghcr.json
      #     sbom-dockerhub.json
      #     attestation-ghcr.json
      #     attestation-dockerhub.json
      #
      #
      # The individual JSON files are ALSO preserved inside the
      # docker-security-evidence GitHub Actions artifact.
      #
      # ==========================================================

      - name: Email Docker Security Report
        if: success()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: |
          node --input-type=commonjs <<'NODE'

          const nodemailer =
            require("nodemailer");

          const fs =
            require("fs");


          const emailUser =
            process.env.EMAIL_USER;

          const emailPass =
            process.env.EMAIL_PASS;

          const emailTo =
            process.env.QA_EMAIL_TO;

          const emailCc =
            process.env.QA_EMAIL_CC || "";


          const securityReportPath =
            "reports/docker/docker-security-report.html";


          const rawEvidenceZipPath =
            "reports/docker/docker-security-raw-evidence.zip";


          const dockerBuildReportPath =
            "reports/docker-build/docker-build-push-report.html";


          // ======================================================
          // REQUIRED FILES
          // ======================================================

          if (!fs.existsSync(securityReportPath)) {

            throw new Error(
              "Docker security HTML report does not exist."
            );

          }


          if (
            !fs.existsSync(rawEvidenceZipPath) ||
            fs.statSync(rawEvidenceZipPath).size === 0
          ) {

            throw new Error(
              "Docker security raw evidence ZIP does not exist or is empty."
            );

          }


          // ======================================================
          // BUILD ATTACHMENT LIST
          // ======================================================

          const attachments = [];


          // ======================================================
          // ATTACHMENT 1 — DOCKER BUILD & PUSH REPORT
          // ======================================================
          //
          // This is optional while Stage 1 is disabled.
          //
          // Once Stage 1 is enabled and its artifact exists,
          // this automatically becomes the first attachment.
          //
          // ======================================================

          if (
            fs.existsSync(dockerBuildReportPath) &&
            fs.statSync(dockerBuildReportPath).size > 0
          ) {

            attachments.push({

              filename:
                "docker-build-push-report.html",

              path:
                dockerBuildReportPath

            });

            console.log(
              "Attachment added: docker-build-push-report.html"
            );

          } else {

            console.log(
              "Docker Build & Push report not available."
            );

            console.log(
              "This is expected while Stage 1 is disabled."
            );

          }


          // ======================================================
          // ATTACHMENT 2 — SECURITY HTML REPORT
          // ======================================================

          attachments.push({

            filename:
              "docker-security-report.html",

            path:
              securityReportPath

          });


          // ======================================================
          // ATTACHMENT 3 — RAW SECURITY EVIDENCE
          // ======================================================

          attachments.push({

            filename:
              "docker-security-raw-evidence.zip",

            path:
              rawEvidenceZipPath

          });


          // ======================================================
          // LOG ATTACHMENTS
          // ======================================================

          console.log("");
          console.log(
            "=============================================="
          );
          console.log(
            "EMAIL ATTACHMENTS"
          );
          console.log(
            "=============================================="
          );

          for (
            const attachment of attachments
          ) {

            const size =
              fs.statSync(
                attachment.path
              ).size;

            console.log(
              `${attachment.filename} - ${size} bytes`
            );

          }

          console.log(
            "=============================================="
          );


          // ======================================================
          // CREATE TRANSPORTER
          // ======================================================

          const transporter =
            nodemailer.createTransport({

              service: "gmail",

              auth: {

                user:
                  emailUser,

                pass:
                  emailPass

              }

            });


          // ======================================================
          // EMAIL BODY
          // ======================================================

          const summaryHtml = `

            <div
              style="
                font-family:Arial,sans-serif;
                max-width:700px;
                margin:auto;
                color:#1f2937;
              "
            >

              <h2>
                Docker Security Enhancements
              </h2>


              <p
                style="
                  color:#059669;
                  font-weight:bold;
                "
              >
                ✓ Security verification completed successfully
              </p>


              <hr>


              <p>

                <strong>
                  Cosign:
                </strong>

                ✓ Images signed and independently verified

              </p>


              <p>

                <strong>
                  SPDX SBOM:
                </strong>

                ✓ Generated for GHCR and Docker Hub

              </p>


              <p>

                <strong>
                  SBOM Attestation:
                </strong>

                ✓ Created and independently verified

              </p>


              <p>

                <strong>
                  Predicate Type:
                </strong>

                spdxjson

              </p>


              <p>

                <strong>
                  Keyless Verification:
                </strong>

                ✓ GitHub Actions OIDC certificate verification

              </p>


              <hr>


              <h3>
                Attachments
              </h3>


              <p>

                <strong>
                  Docker Build & Push Report:
                </strong>

                ${fs.existsSync(dockerBuildReportPath)
                  ? "✓ Attached"
                  : "Not attached — Stage 1 is currently disabled"}

              </p>


              <p>

                <strong>
                  Docker Security Report:
                </strong>

                ✓ Attached

              </p>


              <p>

                <strong>
                  Raw Security Evidence:
                </strong>

                ✓ Attached as
                <code>
                  docker-security-raw-evidence.zip
                </code>

              </p>


              <hr>


              <p>

                The Docker Security HTML report contains
                the lightweight security summary.

                The raw evidence ZIP contains the complete
                machine-readable Cosign verification records,
                SPDX SBOMs, and SBOM attestation verification
                records.

              </p>


              <p>

                The same raw evidence is also preserved
                individually in the GitHub Actions artifact:

                <strong>
                  docker-security-evidence
                </strong>

              </p>


              <p>

                This allows the evidence to be independently
                downloaded and inspected without relying only
                on the HTML summary.

              </p>

            </div>

          `;


          // ======================================================
          // SEND EMAIL
          // ======================================================

          (async () => {

            await transporter.sendMail({

              from:
                emailUser,

              to:
                emailTo,

              cc:
                emailCc,

              subject:
                "Docker Security Enhancements Report",

              html:
                summaryHtml,

              attachments:
                attachments

            });


            console.log("");
            console.log(
              "=============================================="
            );

            console.log(
              "Docker security email sent successfully."
            );

            console.log(
              `Total attachments: ${attachments.length}`
            );

            console.log(
              "=============================================="
            );


          })().catch(error => {

            console.error(
              "Failed to email Docker security report:"
            );

            console.error(error);

            process.exit(1);

          });

          NODE