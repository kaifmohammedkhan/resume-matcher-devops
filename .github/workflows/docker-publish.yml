  #           ghcr.io/${{ github.repository }}
  #           ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
  #         tags: |
  #           type=raw,value=latest
  #           type=sha,format=short
  #
  #     - name: Build and push Docker image
  #       id: build
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         tags: ${{ steps.meta.outputs.tags }}
  #         labels: ${{ steps.meta.outputs.labels }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max


  # ============================================================
  # STAGE 2 — SECURITY ENHANCEMENTS
  # ============================================================

  security-enhancements:
    name: Security Enhancements
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false


      # ==========================================================
      # INSTALL COSIGN
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        env:
          COSIGN_CERTIFICATE_IDENTITY: ""
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ""

      - name: Verify Cosign installation
        run: |
          cosign version


      # ==========================================================
      # INSTALL SYFT
      # ==========================================================

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Verify Syft installation
        run: |
          syft version


      # ==========================================================
      # PREPARE REPORT DIRECTORY
      # ==========================================================

      - name: Prepare security evidence directory
        run: |
          mkdir -p reports/docker
          echo "Security evidence directory prepared."


      # ==========================================================
      # GHCR LOGIN
      # ==========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # DEFINE IMAGE REFERENCES
      # ==========================================================

      - name: Define Docker image references
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:latest" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest" >> "$GITHUB_ENV"

          echo "GHCR image: ghcr.io/${GITHUB_REPOSITORY}:latest"
          echo "Docker Hub image: ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest"


      # ==========================================================
      # VERIFY EXISTING IMAGES
      # ==========================================================

      - name: Verify GHCR image exists
        run: |
          set -euo pipefail
          docker manifest inspect "$GHCR_IMAGE" > /dev/null
          echo "GHCR image exists: $GHCR_IMAGE"

      - name: Verify Docker Hub image exists
        run: |
          set -euo pipefail
          docker manifest inspect "$DOCKERHUB_IMAGE" > /dev/null
          echo "Docker Hub image exists: $DOCKERHUB_IMAGE"


      # ==========================================================
      # DETERMINE KEYLESS SIGNING IDENTITY
      # ==========================================================

      - name: Determine Cosign keyless identity
        run: |
          set -euo pipefail
          COSIGN_WORKFLOW_IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"
          echo "COSIGN_WORKFLOW_IDENTITY=$COSIGN_WORKFLOW_IDENTITY" >> "$GITHUB_ENV"
          echo "Cosign workflow identity: $COSIGN_WORKFLOW_IDENTITY"


      # ==========================================================
      # COSIGN SIGN IMAGES
      # ==========================================================

      - name: Cosign Sign GHCR Image
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "$GHCR_IMAGE"
          echo "GHCR image signed successfully."

      - name: Cosign Sign Docker Hub Image
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "$DOCKERHUB_IMAGE"
          echo "Docker Hub image signed successfully."


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION
      # ==========================================================

      - name: Verify Cosign Signature — GHCR
        env:
          COSIGN_CERTIFICATE_IDENTITY: ""
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ""
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$COSIGN_WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --output json \
            "$GHCR_IMAGE" \
            > reports/docker/cosign-ghcr-verify.json
          test -s reports/docker/cosign-ghcr-verify.json

      - name: Verify Cosign Signature — Docker Hub
        env:
          COSIGN_CERTIFICATE_IDENTITY: ""
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ""
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$COSIGN_WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --output json \
            "$DOCKERHUB_IMAGE" \
            > reports/docker/cosign-dockerhub-verify.json
          test -s reports/docker/cosign-dockerhub-verify.json


      # ==========================================================
      # GENERATE SPDX SBOMs
      # ==========================================================

      - name: Generate GHCR SPDX SBOM
        run: |
          set -euo pipefail
          syft "$GHCR_IMAGE" -o spdx-json > reports/docker/sbom-ghcr.json
          test -s reports/docker/sbom-ghcr.json

      - name: Generate Docker Hub SPDX SBOM
        run: |
          set -euo pipefail
          syft "$DOCKERHUB_IMAGE" -o spdx-json > reports/docker/sbom-dockerhub.json
          test -s reports/docker/sbom-dockerhub.json


      # ==========================================================
      # COSIGN SBOM ATTESTATION
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — GHCR
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign attest \
            --predicate reports/docker/sbom-ghcr.json \
            --type spdxjson \
            "$GHCR_IMAGE"

      - name: Cosign Attest SPDX SBOM — Docker Hub
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign attest \
            --predicate reports/docker/sbom-dockerhub.json \
            --type spdxjson \
            "$DOCKERHUB_IMAGE"


      # ==========================================================
      # VERIFY SBOM ATTESTATION
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — GHCR
        env:
          COSIGN_CERTIFICATE_IDENTITY: ""
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ""
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --certificate-identity "$COSIGN_WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type spdxjson \
            --output json \
            "$GHCR_IMAGE" \
            > reports/docker/attestation-ghcr.json
          test -s reports/docker/attestation-ghcr.json

      - name: Verify SPDX SBOM Attestation — Docker Hub
        env:
          COSIGN_CERTIFICATE_IDENTITY: ""
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER: ""
          COSIGN_CERTIFICATE_OIDC_ISSUER_REGEXP: ""
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --certificate-identity "$COSIGN_WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type spdxjson \
            --output json \
            "$DOCKERHUB_IMAGE" \
            > reports/docker/attestation-dockerhub.json
          test -s reports/docker/attestation-dockerhub.json


      # ==========================================================
      # UPLOAD SECURITY EVIDENCE ARTIFACTS
      # ==========================================================

      - name: Upload Security Evidence Directory
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-reports
          path: reports/docker/
          retention-days: 14
          if-no-files-found: error


      # ==========================================================
      # GENERATE SECURITY ENHANCEMENTS HTML REPORT
      # ==========================================================

      - name: Generate Security Enhancements HTML Report
        run: |
          set -euo pipefail

          node --input-type=commonjs <<'NODE'
          const fs = require("fs");

          const repo = process.env.GITHUB_REPOSITORY || "N/A";
          const commit = (process.env.GITHUB_SHA || "N/A").substring(0, 7);
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const generatedAt = new Date().toISOString();

          const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Docker Security Enhancements Report</title>
            <style>
              body { margin: 0; padding: 30px; background: #07111f; color: #f8fafc; font-family: sans-serif; }
              .container { max-width: 800px; margin: auto; }
              .panel { background: #0d1a2b; border: 1px solid #263a56; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
              h1 { margin-top: 0; color: #34d399; font-size: 24px; }
              p { line-height: 1.5; color: #cbd5e1; }
              a { color: #60a5fa; text-decoration: none; font-weight: bold; }
              a:hover { text-decoration: underline; }
              .badge { display: inline-block; padding: 4px 8px; background: #059669; color: white; border-radius: 4px; font-size: 12px; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="panel">
                <h1>Docker Security Report</h1>
                <p><span class="badge">PASSED</span> Image verification and keyless signing completed successfully.</p>
                <p><strong>Repository:</strong> ${repo}</p>
                <p><strong>Commit:</strong> ${commit}</p>
                <p><strong>Generated At:</strong> ${generatedAt}</p>
                <hr style="border-color: #263a56; margin: 20px 0;">
                <p>All container images stored in GHCR and Docker Hub have been signed with Cosign, generated SPDX SBOMs via Syft, and verified with keyless attestation.</p>
                <p><a href="${runUrl}">View GitHub Actions Run & Download Raw Evidence Artifacts &rarr;</a></p>
              </div>
            </div>
          </body>
          </html>`;

          fs.writeFileSync("reports/docker/security-report.html", html);
          console.log("HTML report generated successfully.");
          NODE


      # ==========================================================
      # EMAIL DELIVERY STEP
      # ==========================================================

      - name: Send Email Security Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Security Report: ${{ github.repository }} (Run #${{ github.run_number }})"
          to: ${{ secrets.QA_EMAIL_TO }}
          cc: ${{ secrets.QA_EMAIL_CC }}
          from: "GitHub Actions <${{ secrets.EMAIL_USER }}>"
          html_body: file://reports/docker/security-report.html