name: Build and Push to GHCR and Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # STAGE 1 — BUILD AND PUSH
  # ============================================================
  #
  # TEMPORARILY DISABLED
  #
  # DO NOT ENABLE THIS UNTIL THE SECURITY ENHANCEMENTS STAGE
  # HAS BEEN SUCCESSFULLY DEBUGGED AND VERIFIED.
  #
  # This prevents unnecessary Docker image builds and pushes
  # while Cosign / Syft / SBOM attestation are being tested.
  #
  # ============================================================

  # build-and-push:
  #   name: Build & Push
  #   runs-on: ubuntu-latest
  #
  #   permissions:
  #     contents: read
  #     packages: write
  #
  #   steps:
  #
  #     # ========================================================
  #     # CHECKOUT
  #     # ========================================================
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     # ========================================================
  #     # QEMU
  #     # ========================================================
  #     - name: Set up QEMU
  #       uses: docker/setup-qemu-action@v3
  #
  #     # ========================================================
  #     # DOCKER BUILDX
  #     # ========================================================
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #
  #     # ========================================================
  #     # GHCR LOGIN
  #     # ========================================================
  #     - name: Log in to GitHub Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #
  #     # ========================================================
  #     # DOCKER HUB LOGIN
  #     # ========================================================
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_TOKEN }}
  #
  #     # ========================================================
  #     # DOCKER IMAGE METADATA
  #     # ========================================================
  #     - name: Extract metadata (tags, labels) for Docker
  #       id: meta
  #       uses: docker/metadata-action@v5
  #       with:
  #         images: |
  #           ghcr.io/${{ github.repository }}
  #           ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
  #         tags: |
  #           type=raw,value=latest
  #           type=sha,format=short
  #
  #     # ========================================================
  #     # BUILD AND PUSH
  #     # ========================================================
  #     - name: Build and push Docker image
  #       id: build
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         tags: ${{ steps.meta.outputs.tags }}
  #         labels: ${{ steps.meta.outputs.labels }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max
  #
  #     # ========================================================
  #     # DOCKER BUILD REPORT
  #     # ========================================================
  #     - name: Generate Docker Build & Push HTML Report
  #       if: success()
  #       run: |
  #         mkdir -p reports/docker
  #         # (your existing Node script remains unchanged here)
  #
  #     - name: Upload Docker Build & Push Report
  #       if: success()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: docker-build-push-report
  #         path: reports/docker/docker-build-push-report.html
  #         retention-days: 14
  #
  #     - name: Install Nodemailer
  #       if: success()
  #       run: npm install nodemailer@9.0.3
  #
  #     - name: Email Docker Build & Push Report
  #       if: success()
  #       env:
  #         EMAIL_USER: ${{ secrets.EMAIL_USER }}
  #         EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  #         QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
  #         QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
  #       run: |
  #         node <<'NODE'
  #         // (your existing email script remains unchanged here)
  #         NODE


  # ============================================================
  # STAGE 2 — SECURITY ENHANCEMENTS
  # ============================================================
  #
  # This stage works against the EXISTING images already present
  # in GHCR and Docker Hub.
  #
  # No Docker build occurs here.
  # No Docker push occurs here.
  #
  # ============================================================

  security-enhancements:
    name: Security Enhancements
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

      # REQUIRED FOR COSIGN KEYLESS SIGNING
      id-token: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false


      # ==========================================================
      # INSTALL COSIGN
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Verify Cosign installation
        run: |
          cosign version


      # ==========================================================
      # INSTALL SYFT
      # ==========================================================

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Verify Syft installation
        run: |
          syft version


      # ==========================================================
      # GHCR LOGIN
      # ==========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # VERIFY EXISTING GHCR IMAGE
      # ==========================================================

      - name: Verify GHCR image exists
        run: |
          docker manifest inspect \
            ghcr.io/${{ github.repository }}:latest


      # ==========================================================
      # VERIFY EXISTING DOCKER HUB IMAGE
      # ==========================================================

      - name: Verify Docker Hub image exists
        run: |
          docker manifest inspect \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest


      # ==========================================================
      # COSIGN SIGN — GHCR
      # ==========================================================

      - name: Cosign Sign GHCR Image
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ghcr.io/${{ github.repository }}:latest


      # ==========================================================
      # COSIGN SIGN — DOCKER HUB
      # ==========================================================

      - name: Cosign Sign Docker Hub Image
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — GHCR
      # ==========================================================

      - name: Verify Cosign Signature — GHCR
        if: success()
        run: |
          mkdir -p reports/docker

          cosign verify \
            --output json \
            ghcr.io/${{ github.repository }}:latest \
            > reports/docker/cosign-ghcr-verify.json

          test -s reports/docker/cosign-ghcr-verify.json

          echo "GHCR Cosign signature verification completed."
          echo "Evidence: reports/docker/cosign-ghcr-verify.json"


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — DOCKER HUB
      # ==========================================================

      - name: Verify Cosign Signature — Docker Hub
        if: success()
        run: |
          mkdir -p reports/docker

          cosign verify \
            --output json \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            > reports/docker/cosign-dockerhub-verify.json

          test -s reports/docker/cosign-dockerhub-verify.json

          echo "Docker Hub Cosign signature verification completed."
          echo "Evidence: reports/docker/cosign-dockerhub-verify.json"


      # ==========================================================
      # GENERATE SPDX SBOM — GHCR
      # ==========================================================
      #
      # IMPORTANT:
      # We explicitly request SPDX JSON so that the output format
      # matches the Cosign "spdxjson" predicate type.
      #
      # ==========================================================

      - name: Generate GHCR SPDX SBOM
        if: success()
        run: |
          mkdir -p reports/docker

          syft \
            ghcr.io/${{ github.repository }}:latest \
            -o spdx-json \
            > reports/docker/sbom-ghcr.json


      # ==========================================================
      # GENERATE SPDX SBOM — DOCKER HUB
      # ==========================================================

      - name: Generate Docker Hub SPDX SBOM
        if: success()
        run: |
          mkdir -p reports/docker

          syft \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            -o spdx-json \
            > reports/docker/sbom-dockerhub.json


      # ==========================================================
      # VERIFY SBOM FILES
      # ==========================================================

      - name: Verify SBOM files
        if: success()
        run: |
          test -s reports/docker/sbom-ghcr.json
          test -s reports/docker/sbom-dockerhub.json

          echo "GHCR SPDX SBOM generated successfully."
          echo "Docker Hub SPDX SBOM generated successfully."

          ls -lh reports/docker/


      # ==========================================================
      # COSIGN SBOM ATTESTATION — GHCR
      # ==========================================================
      #
      # FIX:
      #
      # The previous version incorrectly used:
      #
      #   --type slsa
      #
      # "slsa" is not a valid predicate type.
      #
      # More importantly, the predicate being supplied is an
      # SPDX SBOM, not an SLSA provenance document.
      #
      # Therefore we use:
      #
      #   --type spdxjson
      #
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — GHCR
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate reports/docker/sbom-ghcr.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}:latest


      # ==========================================================
      # COSIGN SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — Docker Hub
        if: success()
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate reports/docker/sbom-dockerhub.json \
            --type spdxjson \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest


      # ==========================================================
      # VERIFY SBOM ATTESTATION — GHCR
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — GHCR
        if: success()
        run: |
          mkdir -p reports/docker

          cosign verify-attestation \
            --type spdxjson \
            --output json \
            ghcr.io/${{ github.repository }}:latest \
            > reports/docker/attestation-ghcr.json

          test -s reports/docker/attestation-ghcr.json

          echo "GHCR SPDX SBOM attestation verification completed."
          echo "Evidence: reports/docker/attestation-ghcr.json"


      # ==========================================================
      # VERIFY SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — Docker Hub
        if: success()
        run: |
          mkdir -p reports/docker

          cosign verify-attestation \
            --type spdxjson \
            --output json \
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest \
            > reports/docker/attestation-dockerhub.json

          test -s reports/docker/attestation-dockerhub.json

          echo "Docker Hub SPDX SBOM attestation verification completed."
          echo "Evidence: reports/docker/attestation-dockerhub.json"


      # ==========================================================
      # SECURITY ENHANCEMENTS REPORT
      # ==========================================================

      - name: Generate Security Enhancements HTML Report
        if: success()
        run: |
          mkdir -p reports/docker

          node <<'NODE'
          const fs = require("fs");

          const repo = process.env.GITHUB_REPOSITORY || "N/A";
          const commit = process.env.GITHUB_SHA || "N/A";
          const shortCommit = commit.substring(0, 7);
          const runNumber = process.env.GITHUB_RUN_NUMBER || "N/A";
          const workflow = process.env.GITHUB_WORKFLOW || "N/A";
          const generatedAt = new Date().toISOString();

          const evidenceFiles = {
            ghcrSignature: "reports/docker/cosign-ghcr-verify.json",
            dockerHubSignature: "reports/docker/cosign-dockerhub-verify.json",
            ghcrSbom: "reports/docker/sbom-ghcr.json",
            dockerHubSbom: "reports/docker/sbom-dockerhub.json",
            ghcrAttestation: "reports/docker/attestation-ghcr.json",
            dockerHubAttestation: "reports/docker/attestation-dockerhub.json"
          };

          function readJson(file) {
            return JSON.parse(fs.readFileSync(file, "utf8"));
          }

          function readJsonSafely(file) {
            try {
              return readJson(file);
            } catch (error) {
              return {
                _error: `Unable to parse ${file}: ${error.message}`
              };
            }
          }

          function prettyJson(file) {
            return JSON.stringify(readJsonSafely(file), null, 2);
          }

          function escapeHtml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function fileSize(file) {
            const bytes = fs.statSync(file).size;
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
          }

          function sbomStats(file) {
            const sbom = readJson(file);

            return {
              packages: Array.isArray(sbom.packages) ? sbom.packages.length : 0,
              files: Array.isArray(sbom.files) ? sbom.files.length : 0,
              format: sbom.spdxVersion || "SPDX JSON",
              documentNamespace: sbom.documentNamespace || "N/A"
            };
          }

          const ghcrSbom = sbomStats(evidenceFiles.ghcrSbom);
          const dockerHubSbom = sbomStats(evidenceFiles.dockerHubSbom);

          const evidence = [
            evidenceFiles.ghcrSignature,
            evidenceFiles.dockerHubSignature,
            evidenceFiles.ghcrSbom,
            evidenceFiles.dockerHubSbom,
            evidenceFiles.ghcrAttestation,
            evidenceFiles.dockerHubAttestation
          ];

          for (const file of evidence) {
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
              throw new Error(`Required evidence file is missing or empty: ${file}`);
            }
          }

          const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Docker Security Enhancements Report</title>

            <style>
              body {
                background:#07111f;
                color:#f8fafc;
                font-family:Arial,sans-serif;
                padding:28px;
                margin:0;
              }

              .container {
                max-width:1100px;
                margin:auto;
              }

              .panel {
                background:#0d1a2b;
                border:1px solid #263a56;
                border-radius:18px;
                padding:24px;
                margin-bottom:20px;
              }

              h1 {
                font-size:26px;
                margin:0 0 10px;
              }

              h2 {
                font-size:20px;
                margin:0 0 12px;
              }

              h3 {
                font-size:15px;
                margin:18px 0 8px;
              }

              .status {
                font-weight:bold;
                color:#34d399;
                font-size:16px;
                margin-bottom:14px;
              }

              .meta {
                color:#a9b8cc;
                line-height:1.7;
              }

              .grid {
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
                gap:14px;
              }

              .card {
                background:#102138;
                border:1px solid #263a56;
                border-radius:12px;
                padding:16px;
              }

              .label {
                color:#8fa4bd;
                font-size:12px;
                text-transform:uppercase;
                letter-spacing:.05em;
              }

              .value {
                margin-top:5px;
                word-break:break-word;
              }

              pre {
                background:#081522;
                padding:14px;
                border-radius:10px;
                font-size:11px;
                line-height:1.5;
                overflow:auto;
                max-height:520px;
                white-space:pre-wrap;
                word-break:break-word;
              }

              details {
                margin-top:14px;
              }

              summary {
                cursor:pointer;
                color:#93c5fd;
                font-weight:bold;
              }

              a {
                color:#93c5fd;
              }

              .file {
                font-family:monospace;
                font-size:12px;
                word-break:break-all;
              }

              .small {
                color:#8fa4bd;
                font-size:12px;
              }
            </style>
          </head>

          <body>
            <div class="container">

              <div class="panel">
                <h1>Docker Security Enhancements</h1>

                <div class="status">
                  ✓ Security evidence generated and verified successfully
                </div>

                <div class="meta">
                  Repository: ${escapeHtml(repo)}<br>
                  Commit: ${escapeHtml(shortCommit)}<br>
                  Workflow Run: #${escapeHtml(runNumber)}<br>
                  Workflow: ${escapeHtml(workflow)}<br>
                  Generated: ${escapeHtml(generatedAt)}
                </div>
              </div>


              <div class="panel">
                <h2>Cosign Signing</h2>

                <div class="status">
                  ✓ Images signed and independently verified
                </div>

                <div class="grid">
                  <div class="card">
                    <div class="label">GHCR</div>
                    <div class="value">
                      ghcr.io/${escapeHtml(repo)}:latest
                    </div>
                    <div class="small">
                      Verification evidence:
                      <span class="file">cosign-ghcr-verify.json</span>
                    </div>
                  </div>

                  <div class="card">
                    <div class="label">Docker Hub</div>
                    <div class="value">
                      ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest
                    </div>
                    <div class="small">
                      Verification evidence:
                      <span class="file">cosign-dockerhub-verify.json</span>
                    </div>
                  </div>
                </div>

                <details>
                  <summary>View actual GHCR Cosign verification JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.ghcrSignature))}</pre>
                </details>

                <details>
                  <summary>View actual Docker Hub Cosign verification JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.dockerHubSignature))}</pre>
                </details>
              </div>


              <div class="panel">
                <h2>Syft SPDX SBOM</h2>

                <div class="status">
                  ✓ SPDX SBOM generated from the actual images
                </div>

                <div class="grid">
                  <div class="card">
                    <div class="label">GHCR SBOM</div>
                    <div class="value">
                      Packages: ${ghcrSbom.packages}<br>
                      Files: ${ghcrSbom.files}<br>
                      Format: ${escapeHtml(ghcrSbom.format)}<br>
                      Size: ${escapeHtml(fileSize(evidenceFiles.ghcrSbom))}
                    </div>
                    <div class="small">
                      <span class="file">sbom-ghcr.json</span>
                    </div>
                  </div>

                  <div class="card">
                    <div class="label">Docker Hub SBOM</div>
                    <div class="value">
                      Packages: ${dockerHubSbom.packages}<br>
                      Files: ${dockerHubSbom.files}<br>
                      Format: ${escapeHtml(dockerHubSbom.format)}<br>
                      Size: ${escapeHtml(fileSize(evidenceFiles.dockerHubSbom))}
                    </div>
                    <div class="small">
                      <span class="file">sbom-dockerhub.json</span>
                    </div>
                  </div>
                </div>

                <details>
                  <summary>View actual GHCR SPDX JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.ghcrSbom))}</pre>
                </details>

                <details>
                  <summary>View actual Docker Hub SPDX JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.dockerHubSbom))}</pre>
                </details>
              </div>


              <div class="panel">
                <h2>SBOM Attestation</h2>

                <div class="status">
                  ✓ SPDX SBOM attestations created and independently verified
                </div>

                <div class="grid">
                  <div class="card">
                    <div class="label">GHCR</div>
                    <div class="value">
                      Predicate Type: spdxjson
                    </div>
                    <div class="small">
                      <span class="file">attestation-ghcr.json</span>
                    </div>
                  </div>

                  <div class="card">
                    <div class="label">Docker Hub</div>
                    <div class="value">
                      Predicate Type: spdxjson
                    </div>
                    <div class="small">
                      <span class="file">attestation-dockerhub.json</span>
                    </div>
                  </div>
                </div>

                <details>
                  <summary>View actual GHCR attestation verification JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.ghcrAttestation))}</pre>
                </details>

                <details>
                  <summary>View actual Docker Hub attestation verification JSON</summary>
                  <pre>${escapeHtml(prettyJson(evidenceFiles.dockerHubAttestation))}</pre>
                </details>
              </div>


              <div class="panel">
                <h2>Downloadable Raw Evidence</h2>

                <div class="status">
                  ✓ Raw machine-readable evidence included in this workflow artifact
                </div>

                <div class="grid">
                  ${evidence.map(file => `
                    <div class="card">
                      <div class="file">${escapeHtml(file.replace("reports/docker/", ""))}</div>
                      <div class="small">Size: ${escapeHtml(fileSize(file))}</div>
                    </div>
                  `).join("")}
                </div>

                <p class="small">
                  The raw JSON files are preserved separately from this HTML report
                  in the GitHub Actions artifact named
                  <strong>docker-security-evidence</strong>.
                </p>
              </div>

            </div>
          </body>
          </html>`;

          fs.writeFileSync(
            "reports/docker/docker-security-report.html",
            html
          );

          console.log("Docker security HTML report generated successfully.");
          console.log("Evidence files:");
          for (const file of evidence) {
            console.log(` - ${file} (${fileSize(file)})`);
          }
          NODE


      # ==========================================================
      # UPLOAD COMPLETE DOCKER SECURITY EVIDENCE
      # ==========================================================

      - name: Upload Docker Security Evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-evidence
          path: reports/docker/
          retention-days: 14


      # ==========================================================
      # INSTALL NODEMAILER
      # ==========================================================

      - name: Install Nodemailer
        if: success()
        run: |
          npm install nodemailer@9.0.3


      # ==========================================================
      # EMAIL DOCKER SECURITY REPORT
      # ==========================================================

      - name: Email Docker Security Report
        if: success()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: |
          node <<'NODE'
          const nodemailer = require("nodemailer");

          const emailUser = process.env.EMAIL_USER;
          const emailPass = process.env.EMAIL_PASS;
          const emailTo = process.env.QA_EMAIL_TO;
          const emailCc = process.env.QA_EMAIL_CC || "";

          const summaryHtml = `
            <p>
              <strong>Cosign:</strong>
              ✓ Images signed
            </p>

            <p>
              <strong>Syft SPDX SBOM:</strong>
              ✓ Generated
            </p>

            <p>
              <strong>SBOM Attestation:</strong>
              ✓ Attested with Cosign
            </p>

            <p>
              <strong>Predicate Type:</strong>
              spdxjson
            </p>

            <p>
              <strong>Raw Evidence:</strong>
              ✓ HTML report and all JSON evidence files are attached
            </p>

            <p>
              The same files are also available in the GitHub Actions artifact
              <strong>docker-security-evidence</strong>.
            </p>
          `;

          const transporter = nodemailer.createTransport({
            service: "gmail",

            auth: {
              user: emailUser,
              pass: emailPass
            }
          });

          (async () => {

            await transporter.sendMail({

              from: emailUser,

              to: emailTo,

              cc: emailCc,

              subject:
                "Docker Security Enhancements Report",

              html: summaryHtml,

              attachments: [
                {
                  filename:
                    "docker-security-report.html",

                  path:
                    "reports/docker/docker-security-report.html"
                },
                {
                  filename:
                    "sbom-ghcr.json",

                  path:
