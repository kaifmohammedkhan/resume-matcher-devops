name: Build and Push to GHCR and Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # STAGE 1 — BUILD AND PUSH
  # ============================================================
  #
  # TEMPORARILY DISABLED
  #
  # This stage remains disabled while the existing images are
  # being used for the security-enhancement workflow.
  #
  # ============================================================

  # build-and-push:
  #   name: Build & Push
  #   runs-on: ubuntu-latest
  #
  #   permissions:
  #     contents: read
  #     packages: write
  #
  #   steps:
  #
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Set up QEMU
  #       uses: docker/setup-qemu-action@v3
  #
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #
  #     - name: Log in to GitHub Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_TOKEN }}
  #
  #     - name: Extract metadata
  #       id: meta
  #       uses: docker/metadata-action@v5
  #       with:
  #         images: |
  #           ghcr.io/${{ github.repository }}
  #           ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
  #         tags: |
  #           type=raw,value=latest
  #           type=sha,format=short
  #
  #     - name: Build and push Docker image
  #       id: build
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         tags: ${{ steps.meta.outputs.tags }}
  #         labels: ${{ steps.meta.outputs.labels }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max


  # ============================================================
  # STAGE 2 — SECURITY ENHANCEMENTS
  # ============================================================
  #
  # Works against the EXISTING images.
  #
  # No Docker build.
  # No Docker push.
  #
  # Generates:
  #
  #   cosign-ghcr-verify.json
  #   cosign-dockerhub-verify.json
  #   sbom-ghcr.json
  #   sbom-dockerhub.json
  #   attestation-ghcr.json
  #   attestation-dockerhub.json
  #
  # Plus:
  #
  #   docker-security-report.html
  #   docker-security-raw-evidence.zip
  #   README.txt
  #
  # ============================================================

  security-enhancements:

    name: Security Enhancements

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

      # Required for Cosign keyless signing.
      id-token: write


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false


      # ==========================================================
      # INSTALL COSIGN
      # ==========================================================
      #
      # v4.1.2 is used instead of v4.1.0.
      #
      # v4.1.2 updates the default Cosign release to v3.0.6.
      #
      # This avoids the previous installer failure involving:
      #
      # keyless@projectsigstore.iam.gserviceaccount.com
      #
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2


      - name: Verify Cosign installation
        run: |
          set -e

          cosign version


      # ==========================================================
      # INSTALL SYFT
      # ==========================================================

      - name: Install Syft
        run: |
          set -e

          curl -sSfL \
            https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin


      - name: Verify Syft installation
        run: |
          set -e

          syft version


      # ==========================================================
      # GHCR LOGIN
      # ==========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # DEFINE IMAGE VARIABLES
      # ==========================================================

      - name: Define image variables
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:latest" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest" >> "$GITHUB_ENV"

          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:latest"
          echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest"


      # ==========================================================
      # VERIFY EXISTING GHCR IMAGE
      # ==========================================================

      - name: Verify GHCR image exists
        run: |
          set -e

          docker manifest inspect "$GHCR_IMAGE"


      # ==========================================================
      # VERIFY EXISTING DOCKER HUB IMAGE
      # ==========================================================

      - name: Verify Docker Hub image exists
        run: |
          set -e

          docker manifest inspect "$DOCKERHUB_IMAGE"


      # ==========================================================
      # COSIGN SIGN — GHCR
      # ==========================================================

      - name: Cosign Sign GHCR Image
        env:
          COSIGN_YES: "true"
        run: |
          set -e

          cosign sign \
            "$GHCR_IMAGE"


      # ==========================================================
      # COSIGN SIGN — DOCKER HUB
      # ==========================================================

      - name: Cosign Sign Docker Hub Image
        env:
          COSIGN_YES: "true"
        run: |
          set -e

          cosign sign \
            "$DOCKERHUB_IMAGE"


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — GHCR
      # ==========================================================
      #
      # Keyless verification MUST specify:
      #
      # --certificate-identity
      # --certificate-oidc-issuer
      #
      # The identity is the workflow identity used to sign.
      #
      # ==========================================================

      - name: Verify Cosign Signature — GHCR
        run: |
          set -e

          mkdir -p reports/docker

          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "$GHCR_IMAGE" \
            > reports/docker/cosign-ghcr-verify.json

          test -s reports/docker/cosign-ghcr-verify.json

          echo "GHCR Cosign signature verification completed."
          echo "Evidence: reports/docker/cosign-ghcr-verify.json"


      # ==========================================================
      # COSIGN SIGNATURE VERIFICATION — DOCKER HUB
      # ==========================================================

      - name: Verify Cosign Signature — Docker Hub
        run: |
          set -e

          mkdir -p reports/docker

          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "$DOCKERHUB_IMAGE" \
            > reports/docker/cosign-dockerhub-verify.json

          test -s reports/docker/cosign-dockerhub-verify.json

          echo "Docker Hub Cosign signature verification completed."
          echo "Evidence: reports/docker/cosign-dockerhub-verify.json"


      # ==========================================================
      # GENERATE SPDX SBOM — GHCR
      # ==========================================================

      - name: Generate GHCR SPDX SBOM
        run: |
          set -e

          mkdir -p reports/docker

          syft \
            "$GHCR_IMAGE" \
            -o spdx-json \
            > reports/docker/sbom-ghcr.json

          test -s reports/docker/sbom-ghcr.json


      # ==========================================================
      # GENERATE SPDX SBOM — DOCKER HUB
      # ==========================================================

      - name: Generate Docker Hub SPDX SBOM
        run: |
          set -e

          mkdir -p reports/docker

          syft \
            "$DOCKERHUB_IMAGE" \
            -o spdx-json \
            > reports/docker/sbom-dockerhub.json

          test -s reports/docker/sbom-dockerhub.json


      # ==========================================================
      # VERIFY SBOM FILES
      # ==========================================================

      - name: Verify SBOM files
        run: |
          set -e

          test -s reports/docker/sbom-ghcr.json
          test -s reports/docker/sbom-dockerhub.json

          echo "GHCR SPDX SBOM generated successfully."
          echo "Docker Hub SPDX SBOM generated successfully."

          ls -lh reports/docker/


      # ==========================================================
      # COSIGN SBOM ATTESTATION — GHCR
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — GHCR
        env:
          COSIGN_YES: "true"
        run: |
          set -e

          cosign attest \
            --predicate reports/docker/sbom-ghcr.json \
            --type spdxjson \
            "$GHCR_IMAGE"


      # ==========================================================
      # COSIGN SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Cosign Attest SPDX SBOM — Docker Hub
        env:
          COSIGN_YES: "true"
        run: |
          set -e

          cosign attest \
            --predicate reports/docker/sbom-dockerhub.json \
            --type spdxjson \
            "$DOCKERHUB_IMAGE"


      # ==========================================================
      # VERIFY SBOM ATTESTATION — GHCR
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — GHCR
        run: |
          set -e

          mkdir -p reports/docker

          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "$GHCR_IMAGE" \
            > reports/docker/attestation-ghcr.json

          test -s reports/docker/attestation-ghcr.json

          echo "GHCR SPDX SBOM attestation verification completed."
          echo "Evidence: reports/docker/attestation-ghcr.json"


      # ==========================================================
      # VERIFY SBOM ATTESTATION — DOCKER HUB
      # ==========================================================

      - name: Verify SPDX SBOM Attestation — Docker Hub
        run: |
          set -e

          mkdir -p reports/docker

          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "$DOCKERHUB_IMAGE" \
            > reports/docker/attestation-dockerhub.json

          test -s reports/docker/attestation-dockerhub.json

          echo "Docker Hub SPDX SBOM attestation verification completed."
          echo "Evidence: reports/docker/attestation-dockerhub.json"


      # ==========================================================
      # GENERATE SECURITY ENHANCEMENTS HTML REPORT
      # ==========================================================

      - name: Generate Security Enhancements HTML Report
        run: |
          set -e

          mkdir -p reports/docker

          node --input-type=commonjs <<'NODE'
          const fs = require("fs");

          const repo = process.env.GITHUB_REPOSITORY || "N/A";
          const commit = process.env.GITHUB_SHA || "N/A";
          const shortCommit = commit.substring(0, 7);
          const runNumber = process.env.GITHUB_RUN_NUMBER || "N/A";
          const workflow = process.env.GITHUB_WORKFLOW || "N/A";
          const branch = process.env.GITHUB_REF_NAME || "N/A";
          const generatedAt = new Date().toISOString();

          const dockerHubUsername =
            process.env.DOCKERHUB_USERNAME || "N/A";

          const evidenceFiles = {
            ghcrSignature:
              "reports/docker/cosign-ghcr-verify.json",

            dockerHubSignature:
              "reports/docker/cosign-dockerhub-verify.json",

            ghcrSbom:
              "reports/docker/sbom-ghcr.json",

            dockerHubSbom:
              "reports/docker/sbom-dockerhub.json",

            ghcrAttestation:
              "reports/docker/attestation-ghcr.json",

            dockerHubAttestation:
              "reports/docker/attestation-dockerhub.json"
          };

          const evidence = [
            evidenceFiles.ghcrSignature,
            evidenceFiles.dockerHubSignature,
            evidenceFiles.ghcrSbom,
            evidenceFiles.dockerHubSbom,
            evidenceFiles.ghcrAttestation,
            evidenceFiles.dockerHubAttestation
          ];

          function readJson(file) {
            return JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          }

          function readJsonSafely(file) {
            try {
              return readJson(file);
            } catch (error) {
              return {
                _error:
                  `Unable to parse ${file}: ${error.message}`
              };
            }
          }

          function prettyJson(file) {
            return JSON.stringify(
              readJsonSafely(file),
              null,
              2
            );
          }

          function escapeHtml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function fileSize(file) {
            const bytes =
              fs.statSync(file).size;

            if (bytes < 1024) {
              return `${bytes} B`;
            }

            if (bytes < 1024 * 1024) {
              return `${(bytes / 1024).toFixed(1)} KB`;
            }

            return `${(
              bytes /
              (1024 * 1024)
            ).toFixed(2)} MB`;
          }

          function sbomStats(file) {
            const sbom = readJson(file);

            return {
              packages:
                Array.isArray(sbom.packages)
                  ? sbom.packages.length
                  : 0,

              files:
                Array.isArray(sbom.files)
                  ? sbom.files.length
                  : 0,

              format:
                sbom.spdxVersion ||
                "SPDX JSON",

              namespace:
                sbom.documentNamespace ||
                "N/A"
            };
          }

          function verificationCount(file) {
            try {
              const data = readJson(file);

              if (Array.isArray(data)) {
                return data.length;
              }

              if (
                data &&
                Array.isArray(data.verificationResult)
              ) {
                return data.verificationResult.length;
              }

              return 0;

            } catch {
              return 0;
            }
          }

          for (const file of evidence) {
            if (
              !fs.existsSync(file) ||
              fs.statSync(file).size === 0
            ) {
              throw new Error(
                `Required evidence file is missing or empty: ${file}`
              );
            }
          }

          const ghcrSbom =
            sbomStats(evidenceFiles.ghcrSbom);

          const dockerHubSbom =
            sbomStats(evidenceFiles.dockerHubSbom);

          const ghcrSignatureCount =
            verificationCount(
              evidenceFiles.ghcrSignature
            );

          const dockerHubSignatureCount =
            verificationCount(
              evidenceFiles.dockerHubSignature
            );

          const ghcrAttestationCount =
            verificationCount(
              evidenceFiles.ghcrAttestation
            );

          const dockerHubAttestationCount =
            verificationCount(
              evidenceFiles.dockerHubAttestation
            );

          const totalEvidenceBytes =
            evidence.reduce(
              (total, file) =>
                total + fs.statSync(file).size,
              0
            );

          const totalEvidenceSize =
            totalEvidenceBytes < 1024 * 1024
              ? `${(
                  totalEvidenceBytes / 1024
                ).toFixed(1)} KB`
              : `${(
                  totalEvidenceBytes /
                  (1024 * 1024)
                ).toFixed(2)} MB`;

          const html = `<!doctype html>

          <html lang="en">

          <head>

            <meta charset="utf-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>
              Docker Security Enhancements Report
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {
                background: #07111f;
                color: #f8fafc;
                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;
                padding: 28px;
                margin: 0;
              }

              .container {
                max-width: 1100px;
                margin: auto;
              }

              .panel {
                background: #0d1a2b;
                border: 1px solid #263a56;
                border-radius: 18px;
                padding: 24px;
                margin-bottom: 20px;
              }

              h1 {
                font-size: 28px;
                margin: 0 0 10px;
              }

              h2 {
                font-size: 20px;
                margin: 0 0 14px;
              }

              .status {
                font-weight: bold;
                color: #34d399;
                font-size: 16px;
                margin-bottom: 14px;
              }

              .meta {
                color: #a9b8cc;
                line-height: 1.8;
              }

              .grid {
                display: grid;
                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                  );
                gap: 14px;
              }

              .card {
                background: #102138;
                border: 1px solid #263a56;
                border-radius: 12px;
                padding: 16px;
              }

              .label {
                color: #8fa4bd;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .05em;
              }

              .value {
                margin-top: 5px;
                word-break: break-word;
              }

              .file {
                font-family: monospace;
                font-size: 12px;
                word-break: break-all;
              }

              .small {
                color: #8fa4bd;
                font-size: 12px;
                line-height: 1.6;
              }

              .download {
                display: inline-block;
                background: #2563eb;
                color: white;
                text-decoration: none;
                padding: 12px 18px;
                border-radius: 9px;
                font-weight: bold;
                margin-top: 10px;
              }

              .download:hover {
                opacity: .9;
              }

              .notice {
                background: #0b2035;
                border: 1px solid #28537a;
                border-radius: 12px;
                padding: 18px;
                line-height: 1.7;
                color: #dbeafe;
              }

              pre {
                background: #081522;
                padding: 14px;
                border-radius: 10px;
                font-size: 11px;
                line-height: 1.5;
                overflow: auto;
                max-height: 520px;
                white-space: pre-wrap;
                word-break: break-word;
              }

              details {
                margin-top: 14px;
              }

              summary {
                cursor: pointer;
                color: #93c5fd;
                font-weight: bold;
              }

              .metric {
                font-size: 24px;
                font-weight: bold;
                margin-top: 6px;
              }

            </style>

          </head>

          <body>

            <div class="container">

              <div class="panel">

                <h1>
                  Docker Security Enhancements
                </h1>

                <div class="status">
                  ✓ SECURITY VERIFICATION PASSED
                </div>

                <div class="meta">

                  Repository:
                  ${escapeHtml(repo)}
                  <br>

                  Branch:
                  ${escapeHtml(branch)}
                  <br>

                  Commit:
                  ${escapeHtml(shortCommit)}
                  <br>

                  Workflow Run:
                  #${escapeHtml(runNumber)}
                  <br>

                  Workflow:
                  ${escapeHtml(workflow)}
                  <br>

                  Generated:
                  ${escapeHtml(generatedAt)}

                </div>

              </div>


              <!-- ================================================= -->

              <div class="panel">

                <h2>
                  Cosign Image Signing
                </h2>

                <div class="status">
                  ✓ VERIFIED
                </div>

                <div class="grid">

                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="value">

                      ghcr.io/${escapeHtml(repo)}:latest

                    </div>

                    <div class="metric">
                      ${ghcrSignatureCount}
                    </div>

                    <div class="small">
                      Verification records
                    </div>

                    <br>

                    <div class="file">
                      cosign-ghcr-verify.json
                    </div>

                    <div class="small">
                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.ghcrSignature
                        )
                      )}
                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="value">

                      ${escapeHtml(
                        dockerHubUsername
                      )}/resume-matcher-devops:latest

                    </div>

                    <div class="metric">
                      ${dockerHubSignatureCount}
                    </div>

                    <div class="small">
                      Verification records
                    </div>

                    <br>

                    <div class="file">
                      cosign-dockerhub-verify.json
                    </div>

                    <div class="small">
                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.dockerHubSignature
                        )
                      )}
                    </div>

                  </div>

                </div>


                <details>

                  <summary>
                    View actual GHCR Cosign verification JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.ghcrSignature
                    )
                  )}</pre>

                </details>


                <details>

                  <summary>
                    View actual Docker Hub Cosign verification JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.dockerHubSignature
                    )
                  )}</pre>

                </details>

              </div>


              <!-- ================================================= -->

              <div class="panel">

                <h2>
                  SPDX SBOM
                </h2>

                <div class="status">
                  ✓ GENERATED
                </div>

                <div class="grid">

                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="metric">
                      ${ghcrSbom.packages}
                    </div>

                    <div class="small">
                      Packages
                    </div>

                    <br>

                    Files:
                    ${ghcrSbom.files}

                    <br>

                    SPDX Version:
                    ${escapeHtml(
                      ghcrSbom.format
                    )}

                    <br>

                    Size:
                    ${escapeHtml(
                      fileSize(
                        evidenceFiles.ghcrSbom
                      )
                    )}

                    <br><br>

                    <div class="file">
                      sbom-ghcr.json
                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="metric">
                      ${dockerHubSbom.packages}
                    </div>

                    <div class="small">
                      Packages
                    </div>

                    <br>

                    Files:
                    ${dockerHubSbom.files}

                    <br>

                    SPDX Version:
                    ${escapeHtml(
                      dockerHubSbom.format
                    )}

                    <br>

                    Size:
                    ${escapeHtml(
                      fileSize(
                        evidenceFiles.dockerHubSbom
                      )
                    )}

                    <br><br>

                    <div class="file">
                      sbom-dockerhub.json
                    </div>

                  </div>

                </div>


                <details>

                  <summary>
                    View actual GHCR SPDX JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.ghcrSbom
                    )
                  )}</pre>

                </details>


                <details>

                  <summary>
                    View actual Docker Hub SPDX JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.dockerHubSbom
                    )
                  )}</pre>

                </details>

              </div>


              <!-- ================================================= -->

              <div class="panel">

                <h2>
                  SBOM Attestation
                </h2>

                <div class="status">
                  ✓ VERIFIED
                </div>

                <div class="grid">

                  <div class="card">

                    <div class="label">
                      GHCR
                    </div>

                    <div class="value">
                      Predicate Type:
                      <strong>
                        spdxjson
                      </strong>
                    </div>

                    <div class="metric">
                      ${ghcrAttestationCount}
                    </div>

                    <div class="small">
                      Verification records
                    </div>

                    <br>

                    <div class="file">
                      attestation-ghcr.json
                    </div>

                    <div class="small">
                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.ghcrAttestation
                        )
                      )}
                    </div>

                  </div>


                  <div class="card">

                    <div class="label">
                      Docker Hub
                    </div>

                    <div class="value">
                      Predicate Type:
                      <strong>
                        spdxjson
                      </strong>
                    </div>

                    <div class="metric">
                      ${dockerHubAttestationCount}
                    </div>

                    <div class="small">
                      Verification records
                    </div>

                    <br>

                    <div class="file">
                      attestation-dockerhub.json
                    </div>

                    <div class="small">
                      Size:
                      ${escapeHtml(
                        fileSize(
                          evidenceFiles.dockerHubAttestation
                        )
                      )}
                    </div>

                  </div>

                </div>


                <details>

                  <summary>
                    View actual GHCR attestation verification JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.ghcrAttestation
                    )
                  )}</pre>

                </details>


                <details>

                  <summary>
                    View actual Docker Hub attestation verification JSON
                  </summary>

                  <pre>${escapeHtml(
                    prettyJson(
                      evidenceFiles.dockerHubAttestation
                    )
                  )}</pre>

                </details>

              </div>


              <!-- ================================================= -->

              <div class="panel">

                <h2>
                  Downloadable Raw Evidence
                </h2>

                <div class="status">
                  ✓ COMPLETE MACHINE-READABLE EVIDENCE PRESERVED
                </div>

                <div class="notice">

                  <strong>
                    The HTML report is a summary.
                  </strong>

                  <br><br>

                  The actual Cosign verification records,
                  SPDX SBOMs, and SBOM attestation records
                  are preserved as their original JSON files.

                  <br><br>

                  All six files are also packaged into one
                  downloadable ZIP archive:

                  <br><br>

                  <strong>
                    docker-security-raw-evidence.zip
                  </strong>

                  <br>

                  Total raw evidence:
                  <strong>
                    ${escapeHtml(
                      totalEvidenceSize
                    )}
                  </strong>

                  <br><br>

                  Download the ZIP from the GitHub Actions
                  artifact:

                  <strong>
                    docker-security-evidence
                  </strong>

                </div>


                <br>


                <div class="grid">

                  ${evidence.map(file => `

                    <div class="card">

                      <div class="file">
                        ${escapeHtml(
                          file.replace(
                            "reports/docker/",
                            ""
                          )
                        )}
                      </div>

                      <div class="small">

                        Size:
                        ${escapeHtml(
                          fileSize(file)
                        )}

                        <br>

                        Original machine-readable
                        evidence file.

                      </div>

                    </div>

                  `).join("")}

                </div>


                <br>


                <div class="card">

                  <div class="label">
                    Complete Download
                  </div>

                  <div class="value">
                    docker-security-raw-evidence.zip
                  </div>

                  <div class="small">

                    Contains all six original JSON
                    evidence files.

                    <br>

                    Available inside the
                    <strong>
                      docker-security-evidence
                    </strong>
                    GitHub Actions artifact.

                  </div>

                </div>

              </div>


              <!-- ================================================= -->

              <div class="panel">

                <h2>
                  Evidence Files
                </h2>

                <div class="small">

                  The following files are uploaded individually
                  to the GitHub Actions artifact in addition
                  to the ZIP archive:

                </div>

                <br>

                ${evidence.map(file => `

                  <div class="card">

                    <div class="file">
                      ${escapeHtml(
                        file.replace(
                          "reports/docker/",
                          ""
                        )
                      )}
                    </div>

                    <div class="small">

                      ${escapeHtml(
                        fileSize(file)
                      )}

                    </div>

                  </div>

                  <br>

                `).join("")}

              </div>

            </div>

          </body>

          </html>`;

          fs.writeFileSync(
            "reports/docker/docker-security-report.html",
            html
          );

          console.log(
            "Docker security HTML report generated successfully."
          );

          console.log(
            `Total raw evidence: ${totalEvidenceSize}`
          );

          NODE


      # ==========================================================
      # CREATE DOWNLOADABLE RAW EVIDENCE ZIP
      # ==========================================================
      #
      # This creates ONE actual downloadable archive containing
      # the six original JSON evidence files.
      #
      # ==========================================================

      - name: Create Downloadable Raw Evidence ZIP
        run: |
          set -e

          cd reports/docker

          zip -9 \
            docker-security-raw-evidence.zip \
            cosign-ghcr-verify.json \
            cosign-dockerhub-verify.json \
            sbom-ghcr.json \
            sbom-dockerhub.json \
            attestation-ghcr.json \
            attestation-dockerhub.json

          cd ../..

          test -s \
            reports/docker/docker-security-raw-evidence.zip

          echo ""
          echo "=============================================="
          echo "DOWNLOADABLE RAW EVIDENCE CREATED"
          echo "=============================================="

          ls -lh \
            reports/docker/docker-security-raw-evidence.zip


      # ==========================================================
      # CREATE RAW EVIDENCE README
      # ==========================================================

      - name: Create Raw Evidence README
        run: |
          set -e

          cat > reports/docker/README.txt <<EOF
Docker Security Evidence
========================

Repository:
${GITHUB_REPOSITORY}

Branch:
${GITHUB_REF_NAME}

Commit:
${GITHUB_SHA}

Workflow:
${GITHUB_WORKFLOW}

Workflow Run:
#${GITHUB_RUN_NUMBER}


RAW MACHINE-READABLE EVIDENCE
=============================

1. cosign-ghcr-verify.json

   Cosign keyless signature verification result
   for the GHCR image.


2. cosign-dockerhub-verify.json

   Cosign keyless signature verification result
   for the Docker Hub image.


3. sbom-ghcr.json

   SPDX JSON SBOM generated by Syft
   for the GHCR image.


4. sbom-dockerhub.json

   SPDX JSON SBOM generated by Syft
   for the Docker Hub image.


5. attestation-ghcr.json

   Cosign SPDX SBOM attestation verification result
   for the GHCR image.


6. attestation-dockerhub.json

   Cosign SPDX SBOM attestation verification result
   for the Docker Hub image.


DOWNLOAD EVERYTHING
===================

Use:

docker-security-raw-evidence.zip

This archive contains all six original JSON
machine-readable evidence files.


HTML REPORT
===========

docker-security-report.html

The HTML report provides a human-readable summary
of the security verification results.


IMPORTANT
=========

The JSON files are the actual machine-readable
security evidence.

The HTML report is only the human-readable presentation.

The ZIP archive provides the easiest way to download
all raw evidence as one file.
EOF

          test -s reports/docker/README.txt


      # ==========================================================
      # SHOW FINAL EVIDENCE DIRECTORY
      # ==========================================================

      - name: Validate Complete Evidence Package
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "FINAL DOCKER SECURITY EVIDENCE"
          echo "=============================================="

          find reports/docker \
            -maxdepth 1 \
            -type f \
            -printf "%f\t%s bytes\n" \
            | sort

          echo ""
          echo "Required evidence files:"

          test -s reports/docker/cosign-ghcr-verify.json
          test -s reports/docker/cosign-dockerhub-verify.json
          test -s reports/docker/sbom-ghcr.json
          test -s reports/docker/sbom-dockerhub.json
          test -s reports/docker/attestation-ghcr.json
          test -s reports/docker/attestation-dockerhub.json

          test -s reports/docker/docker-security-report.html
          test -s reports/docker/docker-security-raw-evidence.zip
          test -s reports/docker/README.txt

          echo ""
          echo "✓ All security evidence files exist."
          echo "✓ HTML report exists."
          echo "✓ Downloadable ZIP exists."
          echo "✓ Evidence README exists."


      # ==========================================================
      # UPLOAD COMPLETE DOCKER SECURITY EVIDENCE
      # ==========================================================
      #
      # GitHub Actions artifact contains:
      #
      # docker-security-report.html
      #
      # docker-security-raw-evidence.zip
      #
      # README.txt
      #
      # six original JSON files
      #
      # ==========================================================

      - name: Upload Docker Security Evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-evidence
          path: reports/docker/
          retention-days: 14


      # ==========================================================
      # INSTALL NODEMAILER
      # ==========================================================

      - name: Install Nodemailer
        if: success()
        run: |
          npm install --no-save nodemailer@9.0.3


      # ==========================================================
      # EMAIL DOCKER SECURITY REPORT
      # ==========================================================
      #
      # IMPORTANT:
      #
      # DO NOT ATTACH the huge SBOM and attestation JSON files.
      #
      # Gmail previously rejected the message with:
      #
      # 552-5.3.4 Your message exceeded Google's message size limits
      #
      # Therefore the email contains:
      #
      # - HTML report
      # - small Cosign verification files
      #
      # The complete evidence remains downloadable from
      # the GitHub Actions artifact.
      #
      # ==========================================================

      - name: Email Docker Security Report
        if: success()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=commonjs <<'NODE'

          const fs = require("fs");
          const nodemailer = require("nodemailer");

          const emailUser =
            process.env.EMAIL_USER;

          const emailPass =
            process.env.EMAIL_PASS;

          const emailTo =
            process.env.QA_EMAIL_TO;

          const emailCc =
            process.env.QA_EMAIL_CC || "";

          const repository =
            process.env.GITHUB_REPOSITORY;

          const runNumber =
            process.env.GITHUB_RUN_NUMBER;

          const serverUrl =
            process.env.GITHUB_SERVER_URL;

          const runId =
            process.env.GITHUB_RUN_ID;

          const artifactUrl =
            `${serverUrl}/${repository}/actions/runs/${runId}`;


          if (!emailUser) {
            throw new Error(
              "EMAIL_USER secret is missing."
            );
          }

          if (!emailPass) {
            throw new Error(
              "EMAIL_PASS secret is missing."
            );
          }

          if (!emailTo) {
            throw new Error(
              "QA_EMAIL_TO secret is missing."
            );
          }


          const summaryHtml = `

          <div style="
            font-family:Arial,Helvetica,sans-serif;
            line-height:1.6;
            color:#172033;
          ">

            <h2>
              Docker Security Enhancements
            </h2>

            <p>
              <strong>
                ✓ SECURITY VERIFICATION PASSED
              </strong>
            </p>

            <p>

              <strong>Repository:</strong>
              ${repository}

              <br>

              <strong>Workflow Run:</strong>
              #${runNumber}

            </p>


            <hr>


            <h3>
              Security Results
            </h3>

            <p>
              <strong>Cosign Image Signing:</strong>
              ✓ Signed and verified
            </p>

            <p>
              <strong>SPDX SBOM:</strong>
              ✓ Generated for GHCR and Docker Hub
            </p>

            <p>
              <strong>SBOM Attestation:</strong>
              ✓ Created and verified
            </p>

            <p>
              <strong>Predicate Type:</strong>
              spdxjson
            </p>


            <h3>
              Evidence
            </h3>

            <p>
              The complete machine-readable evidence is
              preserved in the GitHub Actions artifact:
            </p>

            <p>
              <strong>
                docker-security-evidence
              </strong>
            </p>


            <p>
              The artifact contains:
            </p>

            <ul>

              <li>
                docker-security-report.html
              </li>

              <li>
                docker-security-raw-evidence.zip
              </li>

              <li>
                cosign-ghcr-verify.json
              </li>

              <li>
                cosign-dockerhub-verify.json
              </li>

              <li>
                sbom-ghcr.json
              </li>

              <li>
                sbom-dockerhub.json
              </li>

              <li>
                attestation-ghcr.json
              </li>

              <li>
                attestation-dockerhub.json
              </li>

            </ul>


            <p>

              <strong>
                Download the complete raw evidence
                from the GitHub Actions artifact.
              </strong>

            </p>


            <p>

              <a
                href="${artifactUrl}"
                style="
                  display:inline-block;
                  background:#2563eb;
                  color:white;
                  padding:10px 16px;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                Open GitHub Actions Run
              </a>

            </p>


            <hr>


            <p style="
              color:#667085;
              font-size:12px;
            ">

              The large SBOM and attestation files are
              intentionally not attached to this email
              because Gmail imposes message-size limits.

              They remain available as downloadable files
              in the GitHub Actions artifact.

            </p>

          </div>

          `;


          const transporter =
            nodemailer.createTransport({

              service: "gmail",

              auth: {
                user: emailUser,
                pass: emailPass
              }

            });


          (async () => {

            try {

              await transporter.sendMail({

                from: emailUser,

                to: emailTo,

                cc: emailCc,

                subject:
                  `Docker Security Enhancements Report - Run #${runNumber}`,

                html: summaryHtml,

                attachments: [

                  {
                    filename:
                      "docker-security-report.html",

                    path:
                      "reports/docker/docker-security-report.html"
                  },

                  {
                    filename:
                      "cosign-ghcr-verify.json",

                    path:
                      "reports/docker/cosign-ghcr-verify.json"
                  },

                  {
                    filename:
                      "cosign-dockerhub-verify.json",

                    path:
                      "reports/docker/cosign-dockerhub-verify.json"
                  }

                ]

              });


              console.log(
                "Docker security report emailed successfully."
              );

              console.log(
                "Large evidence files remain available in the GitHub Actions artifact."
              );


            } catch (error) {

              console.error(
                "Failed to email Docker security report:"
              );

              console.error(error);

              process.exit(1);

            }

          })();

          NODE