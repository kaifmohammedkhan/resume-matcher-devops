  #         images: |
  #           ghcr.io/${{ github.repository }}
  #           ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
  #         tags: |
  #           type=raw,value=latest
  #           type=sha,format=short
  #
  #     # ========================================================
