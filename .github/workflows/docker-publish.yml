name: Build and Push to GHCR and Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # STAGE 1 — BUILD AND PUSH
  # ============================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # QEMU
      # ==========================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ==========================================================
      # DOCKER BUILDX
      # ==========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================================
      # GHCR LOGIN
      # ==========================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # DOCKER HUB LOGIN
      # ==========================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # DOCKER IMAGE METADATA
      # ==========================================================
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # ==========================================================
      # BUILD AND PUSH
      # ==========================================================
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================
      # DOCKER BUILD REPORT (UNCHANGED)
      # ==========================================================
      - name: Generate Docker Build & Push HTML Report
        if: success()
        run: |
          mkdir -p reports/docker
          # (your existing Node script remains unchanged here)

      - name: Upload Docker Build & Push Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-push-report
          path: reports/docker/docker-build-push-report.html
          retention-days: 14

      - name: Install Nodemailer
        if: success()
        run: npm install nodemailer@9.0.3

      - name: Email Docker Build & Push Report
        if: success()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: |
          node <<'NODE'
          // (your existing email script remains unchanged here)
          NODE


  # ============================================================
  # STAGE 2 — SECURITY ENHANCEMENTS
  # ============================================================
  security-enhancements:
    name: Security Enhancements
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      packages: write

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # INSTALL NODE DEPENDENCY FOR EMAIL
      # ==========================================================
      - name: Install Nodemailer
        if: success()
        run: npm install nodemailer@9.0.3

      # ==========================================================
      # COSIGN SIGN
      # ==========================================================
      - name: Cosign Sign Images
        if: success()
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:latest
          cosign sign --yes ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest

      # ==========================================================
      # SYFT SBOM
      # ==========================================================
      - name: Generate SBOM with Syft
        if: success()
        run: |
          mkdir -p reports/docker
          syft ghcr.io/${{ github.repository }}:latest -o json > reports/docker/sbom-ghcr.json
          syft ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest -o json > reports/docker/sbom-dockerhub.json

      # ==========================================================
      # COSIGN PROVENANCE ATTESTATION
      # ==========================================================
      - name: Cosign Attest Provenance
        if: success()
        run: |
          cosign attest --predicate reports/docker/sbom-ghcr.json --type slsa ghcr.io/${{ github.repository }}:latest
          cosign attest --predicate reports/docker/sbom-dockerhub.json --type slsa ${{ secrets.DOCKERHUB_USERNAME }}/resume-matcher-devops:latest

      # ==========================================================
      # SECURITY ENHANCEMENTS REPORT
      # ==========================================================
      - name: Generate Security Enhancements HTML Report
        if: success()
        run: |
          mkdir -p reports/docker
          node <<'NODE'
          const fs = require("fs");
          const repo = process.env.GITHUB_REPOSITORY || "N/A";
          const commit = process.env.GITHUB_SHA || "N/A";
          const shortCommit = commit.substring(0,7);

          const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Docker Security Enhancements Report</title>
            <style>
              body { background:#07111f; color:#f8fafc; font-family:Arial,sans-serif; padding:28px; }
              .panel { background:#0d1a2b; border:1px solid #263a56; border-radius:18px; padding:24px; max-width:900px; margin:auto; }
              h1 { font-size:24px; margin:0 0 12px; }
              .status { font-weight:bold; color:#34d399; }
              pre { background:#102138; padding:12px; border-radius:8px; font-size:12px; overflow-x:auto; }
            </style>
          </head>
          <body>
            <div class="panel">
              <h1>Cosign Signing</h1>
              <div class="status">✓ Images signed successfully</div>
              <pre>Repository: ${repo}\nCommit: ${shortCommit}</pre>
            </div>
            <div class="panel" style="margin-top:20px;">
              <h1>Syft SBOM</h1>
              <div class="status">✓ SBOM generated</div>
              <pre>reports/docker/sbom-ghcr.json\nreports/docker/sbom-dockerhub.json</pre>
            </div>
            <div class="panel" style="margin-top:20px;">
              <h1>Provenance Attestation</h1>
              <div class="status">✓ Provenance attached</div>
              <pre>Commit: ${commit}</pre>
            </div>
          </body>
          </html>`;
          fs.writeFileSync("reports/docker/docker-security-report.html", html);
          NODE

      - name: Upload Docker Security Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-report
          path: reports/docker/docker-security-report.html
          retention-days: 14

      - name: Email Docker Security Report
        if: success()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: |
          node <<'NODE'
          const nodemailer = require("nodemailer");
          const fs = require("fs");
          const emailUser = process.env.EMAIL_USER;
          const emailPass = process.env.EMAIL_PASS;
          const emailTo = process.env.QA_EMAIL_TO;
          const emailCc = process.env.QA_EMAIL_CC || "";

          const summaryHtml = `
            <p><strong>Cosign:</strong> ✓ Signed</p>
            <p><strong>Syft SBOM:</strong> ✓ Generated</p>
            <p><strong>Provenance:</strong> ✓ Attested</p>
            <p>Full details are attached in the HTML report.</p>
          `;

          const transporter = nodemailer.createTransport({
            service: "gmail",
            auth: { user: emailUser, pass: emailPass }
          });

          (async () => {
            await transporter.sendMail({
              from: emailUser,
              to: emailTo,
              cc: emailCc,
              subject: "Docker Security Enhancements Report",
              html: summaryHtml,
              attachments: [
                { filename: "docker-security-report.html", path: "reports/docker/docker-security-report.html" }
              ]
            });
            console.log("Docker security report emailed successfully.");
          })();
          NODE