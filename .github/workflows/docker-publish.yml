name: Build and Push to GHCR

on:
  push:
    branches:
      - main  # Triggers the build whenever you push to the main branch
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Permissions required to log in and push to GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8c2311636a942006768205f42220d18822 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c1001a189f36f69ef4269e84725d2c0e86b240ff # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@369eb701f426a3124536735c023d3862cb5631c5 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enables powerful GitHub Actions native caching to speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max