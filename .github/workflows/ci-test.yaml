name: CI & Security Pipeline - Unit Tests & Coverage

on:
  workflow_call:

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resumes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            build-essential

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # ============================================================
      # TESTS + COVERAGE
      # ============================================================

      - name: Run Tests & Capture Console Logs
        id: tests
        shell: bash
        run: |
          set +e

          npm test --silent=false 2>&1 | tee console.log

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "TEST_EXIT_CODE=${TEST_EXIT_CODE}" >> "$GITHUB_ENV"

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # UPLOAD COVERAGE
      # ============================================================

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # ============================================================
      # GENERATE REAL-TIME HTML REPORT
      # ============================================================

      - name: Build Test Summary HTML Report
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "Generating Jest Test & Coverage HTML report"
          echo "============================================================"

          # --------------------------------------------------------
          # Basic metadata
          # --------------------------------------------------------

          REPOSITORY="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA:0:7}"

          if [ "${TEST_EXIT_CODE:-1}" -eq 0 ]; then
            TEST_STATUS="PASSED"
          else
            TEST_STATUS="FAILED"
          fi

          # --------------------------------------------------------
          # Clean ANSI escape sequences
          # --------------------------------------------------------

          if [ -f console.log ]; then
            sed -E $'s/\033\\[[0-9;]*[[:alpha:]]//g' console.log > console-clean.log
          else
            touch console-clean.log
          fi

          # --------------------------------------------------------
          # Extract Jest test statistics
          # --------------------------------------------------------

          SUITES_LINE=$(grep -E "^Test Suites:" console-clean.log | tail -1 || true)
          TESTS_LINE=$(grep -E "^Tests:" console-clean.log | tail -1 || true)
          SNAPSHOTS_LINE=$(grep -E "^Snapshots:" console-clean.log | tail -1 || true)
          TIME_LINE=$(grep -E "^Time:" console-clean.log | tail -1 || true)

          SUITES_RESULT=$(echo "$SUITES_LINE" | sed 's/^Test Suites:[[:space:]]*//' | xargs)
          TESTS_RESULT=$(echo "$TESTS_LINE" | sed 's/^Tests:[[:space:]]*//' | xargs)
          SNAPSHOTS_RESULT=$(echo "$SNAPSHOTS_LINE" | sed 's/^Snapshots:[[:space:]]*//' | xargs)
          TIME_RESULT=$(echo "$TIME_LINE" | sed 's/^Time:[[:space:]]*//' | xargs)

          SUITES_RESULT="${SUITES_RESULT:-N/A}"
          TESTS_RESULT="${TESTS_RESULT:-N/A}"
          SNAPSHOTS_RESULT="${SNAPSHOTS_RESULT:-N/A}"
          TIME_RESULT="${TIME_RESULT:-N/A}"

          # --------------------------------------------------------
          # Extract coverage summary
          #
          # Jest coverage output normally looks like:
          #
          # Statements   : 86.1% ( ...)
          # Branches     : 76.4% ( ...)
          # Functions    : 88.2% ( ...)
          # Lines        : 86.1% ( ...)
          # --------------------------------------------------------

          STMTS_SUMMARY=$(grep -E "Statements[[:space:]]*:" console-clean.log | tail -1 || true)
          BRANCH_SUMMARY=$(grep -E "Branches[[:space:]]*:" console-clean.log | tail -1 || true)
          FUNCS_SUMMARY=$(grep -E "Functions[[:space:]]*:" console-clean.log | tail -1 || true)
          LINES_SUMMARY=$(grep -E "Lines[[:space:]]*:" console-clean.log | tail -1 || true)

          STMTS_SUMMARY="${STMTS_SUMMARY:-N/A}"
          BRANCH_SUMMARY="${BRANCH_SUMMARY:-N/A}"
          FUNCS_SUMMARY="${FUNCS_SUMMARY:-N/A}"
          LINES_SUMMARY="${LINES_SUMMARY:-N/A}"

          # --------------------------------------------------------
          # Escape HTML helper
          # --------------------------------------------------------

          escape_html() {
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              -e "s/'/&#39;/g"
          }

          HTML_REPOSITORY=$(printf '%s' "$REPOSITORY" | escape_html)
          HTML_BRANCH=$(printf '%s' "$BRANCH" | escape_html)
          HTML_COMMIT=$(printf '%s' "$COMMIT" | escape_html)

          HTML_STATUS=$(printf '%s' "$TEST_STATUS" | escape_html)
          HTML_SUITES=$(printf '%s' "$SUITES_RESULT" | escape_html)
          HTML_TESTS=$(printf '%s' "$TESTS_RESULT" | escape_html)
          HTML_SNAPSHOTS=$(printf '%s' "$SNAPSHOTS_RESULT" | escape_html)
          HTML_TIME=$(printf '%s' "$TIME_RESULT" | escape_html)

          HTML_STMTS=$(printf '%s' "$STMTS_SUMMARY" | escape_html)
          HTML_BRANCH_COVERAGE=$(printf '%s' "$BRANCH_SUMMARY" | escape_html)
          HTML_FUNCS=$(printf '%s' "$FUNCS_SUMMARY" | escape_html)
          HTML_LINES=$(printf '%s' "$LINES_SUMMARY" | escape_html)

          # --------------------------------------------------------
          # Build file-by-file coverage rows directly from
          # coverage/lcov.info.
          #
          # This is more reliable than scraping Jest's console table.
          # --------------------------------------------------------

          COVERAGE_ROWS=""

          if [ -f coverage/lcov.info ]; then

            CURRENT_FILE=""
            CURRENT_LINES_FOUND=0
            CURRENT_LINES_HIT=0
            CURRENT_UNCOVERED=""

            while IFS= read -r line || [ -n "$line" ]; do

              case "$line" in

                SF:*)
                  CURRENT_FILE="${line#SF:}"
                  CURRENT_LINES_FOUND=0
                  CURRENT_LINES_HIT=0
                  CURRENT_UNCOVERED=""
                  ;;

                LF:*)
                  CURRENT_LINES_FOUND="${line#LF:}"
                  ;;

                LH:*)
                  CURRENT_LINES_HIT="${line#LH:}"
                  ;;

                DA:*)
                  DATA="${line#DA:}"

                  LINE_NUMBER="${DATA%%,*}"
                  REST="${DATA#*,}"

                  HIT_COUNT="${REST%%,*}"

                  if [ "$HIT_COUNT" = "0" ]; then
                    if [ -n "$CURRENT_UNCOVERED" ]; then
                      CURRENT_UNCOVERED="${CURRENT_UNCOVERED}, ${LINE_NUMBER}"
                    else
                      CURRENT_UNCOVERED="${LINE_NUMBER}"
                    fi
                  fi
                  ;;

                end_of_record)

                  if [ -n "$CURRENT_FILE" ]; then

                    if [ "$CURRENT_LINES_FOUND" -gt 0 ] 2>/dev/null; then
                      COVERAGE_PERCENT=$(awk \
                        -v hit="$CURRENT_LINES_HIT" \
                        -v found="$CURRENT_LINES_FOUND" \
                        'BEGIN {
                          if (found == 0) print "N/A";
                          else printf "%.1f%%", (hit / found) * 100;
                        }')
                    else
                      COVERAGE_PERCENT="N/A"
                    fi

                    FILE_ESCAPED=$(printf '%s' "$CURRENT_FILE" | escape_html)
                    PERCENT_ESCAPED=$(printf '%s' "$COVERAGE_PERCENT" | escape_html)
                    UNCOVERED_ESCAPED=$(printf '%s' "${CURRENT_UNCOVERED:-None}" | escape_html)

                    if [ "$CURRENT_LINES_FOUND" -gt 0 ] 2>/dev/null &&
                       [ "$CURRENT_LINES_HIT" -eq "$CURRENT_LINES_FOUND" ] 2>/dev/null; then

                      ROW_CLASS="covered"

                    else

                      ROW_CLASS="uncovered"

                    fi

                    COVERAGE_ROWS="${COVERAGE_ROWS}
          <tr class=\"${ROW_CLASS}\">
            <td><strong>${FILE_ESCAPED}</strong></td>
            <td>${PERCENT_ESCAPED}</td>
            <td>${CURRENT_LINES_FOUND}</td>
            <td>${CURRENT_LINES_HIT}</td>
            <td>${UNCOVERED_ESCAPED}</td>
          </tr>"

                  fi

                  CURRENT_FILE=""
                  CURRENT_LINES_FOUND=0
                  CURRENT_LINES_HIT=0
                  CURRENT_UNCOVERED=""

                  ;;

              esac

            done < coverage/lcov.info

          fi

          if [ -z "$COVERAGE_ROWS" ]; then
            COVERAGE_ROWS='
          <tr>
            <td colspan="5">No LCOV coverage data was generated.</td>
          </tr>'
          fi

          # --------------------------------------------------------
          # Console highlights
          # --------------------------------------------------------

          if [ -f console-clean.log ]; then
            HTML_HIGHLIGHTS=$(grep -E \
              "PASS|FAIL|Test Suites:|Tests:|Snapshots:|Time:|Coverage|PASS|FAIL|❌|✅|⚠️" \
              console-clean.log \
              | tail -100 \
              | escape_html || true)
          fi

          HTML_HIGHLIGHTS="${HTML_HIGHLIGHTS:-No major test output highlights found.}"

          # --------------------------------------------------------
          # Determine status CSS
          # --------------------------------------------------------

          if [ "$TEST_STATUS" = "PASSED" ]; then
            STATUS_BACKGROUND="#dcfce7"
            STATUS_COLOR="#166534"
          else
            STATUS_BACKGROUND="#fee2e2"
            STATUS_COLOR="#991b1b"
          fi

          # --------------------------------------------------------
          # Generate HTML.
          #
          # IMPORTANT:
          # The heredoc is single-quoted so Bash DOES NOT evaluate
          # JavaScript/CSS ${...} expressions.
          # --------------------------------------------------------

          cat > test-summary.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Jest Test & Coverage Report</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 0;
                background: #f5f7fb;
                color: #1f2937;
                font-family: Arial, Helvetica, sans-serif;
              }

              .container {
                max-width: 1500px;
                margin: 0 auto;
                padding: 30px;
              }

              .header,
              .section,
              .card {
                background: white;
                border-radius: 16px;
                box-shadow: 0 4px 18px rgba(0,0,0,0.07);
              }

              .header {
                padding: 28px;
                margin-bottom: 24px;
              }

              .header h1 {
                margin: 0 0 10px 0;
                font-size: 28px;
              }

              .header p {
                margin: 5px 0;
                color: #6b7280;
              }

              .status {
                display: inline-block;
                margin-top: 15px;
                padding: 8px 16px;
                border-radius: 999px;
                font-weight: bold;
              }

              .metadata {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 12px;
                margin-top: 18px;
              }

              .metadata div {
                background: #f9fafb;
                padding: 12px;
                border-radius: 8px;
              }

              .metadata strong {
                display: block;
                margin-bottom: 4px;
              }

              .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 18px;
                margin-bottom: 24px;
              }

              .card {
                padding: 22px;
              }

              .card .label {
                color: #6b7280;
                font-size: 14px;
                margin-bottom: 8px;
              }

              .card .value {
                font-size: 25px;
                font-weight: bold;
              }

              .section {
                padding: 24px;
                margin-bottom: 24px;
              }

              .section h2 {
                margin-top: 0;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th {
                background: #f3f4f6;
                text-align: left;
                padding: 10px;
              }

              td {
                padding: 9px 10px;
                border-bottom: 1px solid #e5e7eb;
                vertical-align: top;
              }

              tr.uncovered td:last-child {
                color: #dc2626;
                font-weight: bold;
              }

              tr.covered td:last-child {
                color: #16a34a;
              }

              .code {
                background: #111827;
                color: #e5e7eb;
                padding: 16px;
                border-radius: 10px;
                white-space: pre-wrap;
                overflow-x: auto;
                max-height: 400px;
                overflow-y: auto;
              }

              code {
                background: #f3f4f6;
                padding: 2px 5px;
                border-radius: 4px;
              }

              .link {
                display: inline-block;
                margin-top: 12px;
                padding: 10px 16px;
                border-radius: 8px;
                background: #111827;
                color: white;
                text-decoration: none;
              }

              @media (max-width: 800px) {
                .container {
                  padding: 15px;
                }

                table {
                  font-size: 12px;
                }
              }
            </style>
          </head>

          <body>

            <div class="container">

              <div class="header">

                <h1>🧪 Jest Test & Coverage Report</h1>

                <p>
                  Real-time test execution and Jest coverage generated from the current GitHub Actions run.
                </p>

                <div class="metadata">

                  <div>
                    <strong>Repository</strong>
                    __HTML_REPOSITORY__
                  </div>

                  <div>
                    <strong>Branch</strong>
                    __HTML_BRANCH__
                  </div>

                  <div>
                    <strong>Commit</strong>
                    __HTML_COMMIT__
                  </div>

                </div>

                <div
                  class="status"
                  style="background: __STATUS_BACKGROUND__; color: __STATUS_COLOR__;"
                >
                  __HTML_STATUS__
                </div>

                <br>

                <a
                  class="link"
                  href="https://github.com/__HTML_REPOSITORY__/actions"
                  target="_blank"
                >
                  Open GitHub Actions
                </a>

              </div>


              <div class="cards">

                <div class="card">
                  <div class="label">Test Suites</div>
                  <div class="value">__HTML_SUITES__</div>
                </div>

                <div class="card">
                  <div class="label">Tests</div>
                  <div class="value">__HTML_TESTS__</div>
                </div>

                <div class="card">
                  <div class="label">Snapshots</div>
                  <div class="value">__HTML_SNAPSHOTS__</div>
                </div>

                <div class="card">
                  <div class="label">Execution Time</div>
                  <div class="value">__HTML_TIME__</div>
                </div>

              </div>


              <div class="section">

                <h2>📊 Overall Coverage Summary</h2>

                <table>

                  <tr>
                    <th>Metric</th>
                    <th>Actual Jest Result</th>
                  </tr>

                  <tr>
                    <td><strong>Statements</strong></td>
                    <td>__HTML_STMTS__</td>
                  </tr>

                  <tr>
                    <td><strong>Branches</strong></td>
                    <td>__HTML_BRANCH_COVERAGE__</td>
                  </tr>

                  <tr>
                    <td><strong>Functions</strong></td>
                    <td>__HTML_FUNCS__</td>
                  </tr>

                  <tr>
                    <td><strong>Lines</strong></td>
                    <td>__HTML_LINES__</td>
                  </tr>

                </table>

              </div>


              <div class="section">

                <h2>📁 Full Coverage Breakdown</h2>

                <p>
                  File-level coverage generated directly from the current
                  <code>coverage/lcov.info</code> file.
                </p>

                <table>

                  <tr>
                    <th>File</th>
                    <th>Line Coverage</th>
                    <th>Lines Found</th>
                    <th>Lines Hit</th>
                    <th>Uncovered Lines</th>
                  </tr>

                  __COVERAGE_ROWS__

                </table>

              </div>


              <div class="section">

                <h2>📦 Coverage Artifacts</h2>

                <table>

                  <tr>
                    <th>Artifact</th>
                    <th>Location</th>
                  </tr>

                  <tr>
                    <td>LCOV Coverage</td>
                    <td><code>coverage/lcov.info</code></td>
                  </tr>

                  <tr>
                    <td>LCOV HTML Report</td>
                    <td><code>coverage/lcov-report/index.html</code></td>
                  </tr>

                </table>

              </div>


              <div class="section">

                <h2>🖥️ Console Output Highlights</h2>

                <pre class="code">__HTML_HIGHLIGHTS__</pre>

              </div>

            </div>

          </body>
          </html>
          HTML

          # --------------------------------------------------------
          # Replace placeholders.
          #
          # This is intentionally done AFTER the quoted heredoc so
          # HTML/CSS/JavaScript cannot be interpreted by Bash.
          # --------------------------------------------------------

          sed -i \
            -e "s|__HTML_REPOSITORY__|${HTML_REPOSITORY}|g" \
            -e "s|__HTML_BRANCH__|${HTML_BRANCH}|g" \
            -e "s|__HTML_COMMIT__|${HTML_COMMIT}|g" \
            -e "s|__HTML_STATUS__|${HTML_STATUS}|g" \
            -e "s|__HTML_SUITES__|${HTML_SUITES}|g" \
            -e "s|__HTML_TESTS__|${HTML_TESTS}|g" \
            -e "s|__HTML_SNAPSHOTS__|${HTML_SNAPSHOTS}|g" \
            -e "s|__HTML_TIME__|${HTML_TIME}|g" \
            -e "s|__HTML_STMTS__|${HTML_STMTS}|g" \
            -e "s|__HTML_BRANCH_COVERAGE__|${HTML_BRANCH_COVERAGE}|g" \
            -e "s|__HTML_FUNCS__|${HTML_FUNCS}|g" \
            -e "s|__HTML_LINES__|${HTML_LINES}|g" \
            -e "s|__STATUS_BACKGROUND__|${STATUS_BACKGROUND}|g" \
            -e "s|__STATUS_COLOR__|${STATUS_COLOR}|g" \
            test-summary.html

          # COVERAGE_ROWS and HTML_HIGHLIGHTS may contain newlines,
          # so replace them using temporary files rather than sed.

          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("test-summary.html")
          html = html_path.read_text(encoding="utf-8")

          coverage_rows = Path("/tmp/coverage_rows.txt").read_text(encoding="utf-8") if Path("/tmp/coverage_rows.txt").exists() else ""
          highlights = Path("/tmp/highlights.txt").read_text(encoding="utf-8") if Path("/tmp/highlights.txt").exists() else ""

          html = html.replace("__COVERAGE_ROWS__", coverage_rows)
          html = html.replace("__HTML_HIGHLIGHTS__", highlights)

          html_path.write_text(html, encoding="utf-8")
          PY

          # Write multiline values for the replacement step.
          printf '%s\n' "$COVERAGE_ROWS" > /tmp/coverage_rows.txt
          printf '%s\n' "$HTML_HIGHLIGHTS" > /tmp/highlights.txt

          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("test-summary.html")
          html = html_path.read_text(encoding="utf-8")

          coverage_rows = Path("/tmp/coverage_rows.txt").read_text(encoding="utf-8")
          highlights = Path("/tmp/highlights.txt").read_text(encoding="utf-8")

          html = html.replace("__COVERAGE_ROWS__", coverage_rows)
          html = html.replace("__HTML_HIGHLIGHTS__", highlights)

          html_path.write_text(html, encoding="utf-8")
          PY

          echo "============================================================"
          echo "HTML report generated:"
          echo "test-summary.html"
          echo "============================================================"

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================

      - name: Upload Test Summary HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-report
          path: test-summary.html
          if-no-files-found: warn

      # ============================================================
      # UPLOAD RAW CONSOLE LOG
      # ============================================================

      - name: Upload Test Console Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-console-log
          path: console.log
          if-no-files-found: warn