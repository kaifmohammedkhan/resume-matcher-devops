name: CI & Security Pipeline - Unit Tests & Coverage

on:
  workflow_call:

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resumes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev build-essential

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # ============================================================
      # TESTS + COVERAGE
      # ============================================================
      - name: Run Tests & Capture Console Logs
        id: jest
        shell: bash
        run: |
          set +e

          npm test --silent=false 2>&1 | tee console.log

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # COVERAGE ARTIFACT
      # ============================================================
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # ============================================================
      # GENERATE REAL-TIME HTML REPORT
      # ============================================================
      - name: Generate Test & Coverage HTML Report
        if: always()
        shell: bash
        run: |
          cat > generate-test-report.mjs <<'NODE'
          import fs from "fs";

          const logFile = "console.log";
          const outputFile = "test-summary.html";

          let log = "";

          if (fs.existsSync(logFile)) {
            log = fs.readFileSync(logFile, "utf8");
          }

          // ------------------------------------------------------------
          // Helpers
          // ------------------------------------------------------------

          function escapeHtml(value = "") {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function stripAnsi(value = "") {
            return String(value).replace(
              // eslint-disable-next-line no-control-regex
              /\u001B(?:[@-_]|\[[0-?]*[ -/]*[@-~])/g,
              ""
            );
          }

          const cleanLog = stripAnsi(log);

          // ------------------------------------------------------------
          // GitHub metadata
          // ------------------------------------------------------------

          const repository =
            process.env.GITHUB_REPOSITORY || "Unknown repository";

          const branch =
            process.env.GITHUB_REF_NAME || "Unknown branch";

          const commit =
            process.env.GITHUB_SHA
              ? process.env.GITHUB_SHA.substring(0, 7)
              : "Unknown";

          // ------------------------------------------------------------
          // Test status
          // ------------------------------------------------------------

          const exitCode =
            process.env.TEST_EXIT_CODE ?? "1";

          const testPassed =
            exitCode === "0";

          const testStatus =
            testPassed ? "PASSED" : "FAILED";

          // ------------------------------------------------------------
          // Jest summary
          // ------------------------------------------------------------

          function findLine(prefix) {
            const lines = cleanLog.split(/\r?\n/);

            return (
              lines.find((line) =>
                line.trim().startsWith(prefix)
              ) || ""
            );
          }

          const suiteLine = findLine("Test Suites:");

          const testsLine = findLine("Tests:");

          const snapshotsLine = findLine("Snapshots:");

          const timeLine = findLine("Time:");

          // ------------------------------------------------------------
          // Extract numeric test information
          // ------------------------------------------------------------

          function extractMetric(line, label) {
            const match = line.match(
              new RegExp(
                `(\\d+)\\s+${label}`,
                "i"
              )
            );

            return match ? match[1] : "0";
          }

          const suitesPassed =
            extractMetric(suiteLine, "passed");

          const suitesFailed =
            extractMetric(suiteLine, "failed");

          const suitesTotalMatch =
            suiteLine.match(
              /of\s+(\d+)\s+total/i
            );

          const suitesTotal =
            suitesTotalMatch
              ? suitesTotalMatch[1]
              : "0";

          const testsPassed =
            extractMetric(testsLine, "passed");

          const testsFailed =
            extractMetric(testsLine, "failed");

          const testsTotalMatch =
            testsLine.match(
              /(\d+)\s+total/i
            );

          const testsTotal =
            testsTotalMatch
              ? testsTotalMatch[1]
              : "0";

          const snapshots =
            snapshotsLine.trim() || "N/A";

          const executionTime =
            timeLine.trim() || "N/A";

          // ------------------------------------------------------------
          // Coverage summary
          // ------------------------------------------------------------

          function extractCoverage(metric) {
            const lines = cleanLog.split(/\r?\n/);

            for (const line of lines) {
              if (
                line
                  .toLowerCase()
                  .includes(metric.toLowerCase())
              ) {
                const match =
                  line.match(
                    /(\d+(?:\.\d+)?)\s*%/
                  );

                if (match) {
                  return `${match[1]}%`;
                }
              }
            }

            return "N/A";
          }

          const statements =
            extractCoverage("Statements");

          const branches =
            extractCoverage("Branches");

          const functions =
            extractCoverage("Functions");

          const linesCoverage =
            extractCoverage("Lines");

          // ------------------------------------------------------------
          // Coverage table
          // ------------------------------------------------------------

          let coverageRows = "";

          const coverageStart =
            cleanLog.indexOf(
              "-------------------|---------|----------|---------|---------|-------------------"
            );

          if (coverageStart !== -1) {
            const coverageText =
              cleanLog.substring(coverageStart);

            const coverageLines =
              coverageText.split(/\r?\n/);

            for (const rawLine of coverageLines) {
              const line = rawLine.trim();

              if (!line.startsWith("|")) {
                continue;
              }

              const parts =
                line
                  .split("|")
                  .map((part) => part.trim())
                  .filter(Boolean);

              if (parts.length < 6) {
                continue;
              }

              const file = parts[0];

              if (
                file === "File" ||
                file.startsWith("---")
              ) {
                continue;
              }

              const stmts = parts[1];
              const branch = parts[2];
              const funcs = parts[3];
              const lines = parts[4];
              const uncovered = parts[5];

              if (
                file === "All files" ||
                file === "All files "
              ) {
                coverageRows += `
                  <tr class="total-row">
                    <td><strong>${escapeHtml(file)}</strong></td>
                    <td><strong>${escapeHtml(stmts)}</strong></td>
                    <td><strong>${escapeHtml(branch)}</strong></td>
                    <td><strong>${escapeHtml(funcs)}</strong></td>
                    <td><strong>${escapeHtml(lines)}</strong></td>
                    <td><strong>${escapeHtml(uncovered)}</strong></td>
                  </tr>
                `;

                continue;
              }

              const uncoveredExists =
                uncovered &&
                uncovered !== "-" &&
                uncovered !== "0";

              coverageRows += `
                <tr class="${
                  uncoveredExists
                    ? "uncovered"
                    : "covered"
                }">
                  <td>${escapeHtml(file)}</td>
                  <td>${escapeHtml(stmts)}</td>
                  <td>${escapeHtml(branch)}</td>
                  <td>${escapeHtml(funcs)}</td>
                  <td>${escapeHtml(lines)}</td>
                  <td>${escapeHtml(uncovered || "-")}</td>
                </tr>
              `;
            }
          }

          if (!coverageRows) {
            coverageRows = `
              <tr>
                <td colspan="6">
                  No file-level coverage table was detected in Jest output.
                  See the LCOV artifact for the complete coverage report.
                </td>
              </tr>
            `;
          }

          // ------------------------------------------------------------
          // Console highlights
          // ------------------------------------------------------------

          const highlightLines =
            cleanLog
              .split(/\r?\n/)
              .filter((line) =>
                /PASS |FAIL |Test Suites:|Tests:|Snapshots:|Time:|Coverage summary|Statements|Branches|Functions|Lines|console\.error|console\.warn/i.test(
                  line
                )
              )
              .slice(-150);

          const highlights =
            highlightLines.length
              ? highlightLines.join("\n")
              : "No console highlights found.";

          // ------------------------------------------------------------
          // Status styling
          // ------------------------------------------------------------

          const statusBackground =
            testPassed
              ? "#dcfce7"
              : "#fee2e2";

          const statusColor =
            testPassed
              ? "#166534"
              : "#991b1b";

          // ------------------------------------------------------------
          // HTML
          // ------------------------------------------------------------

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Jest Test & Coverage Report</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 0;
                background: #f5f7fb;
                color: #1f2937;
                font-family: Arial, Helvetica, sans-serif;
              }

              .container {
                max-width: 1500px;
                margin: 0 auto;
                padding: 30px;
              }

              .header,
              .section,
              .card {
                background: white;
                border-radius: 16px;
                box-shadow: 0 4px 18px rgba(0,0,0,0.06);
              }

              .header {
                padding: 28px;
                margin-bottom: 24px;
              }

              .header h1 {
                margin: 0 0 10px;
                font-size: 28px;
              }

              .header p {
                color: #6b7280;
              }

              .metadata {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(240px, 1fr));
                gap: 12px;
                margin-top: 20px;
              }

              .metadata div {
                background: #f9fafb;
                padding: 14px;
                border-radius: 10px;
              }

              .metadata strong {
                display: block;
                margin-bottom: 5px;
              }

              .status {
                display: inline-block;
                margin-top: 18px;
                padding: 9px 18px;
                border-radius: 999px;
                font-weight: bold;
                background: ${statusBackground};
                color: ${statusColor};
              }

              .cards {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(200px, 1fr));
                gap: 18px;
                margin-bottom: 24px;
              }

              .card {
                padding: 22px;
              }

              .label {
                color: #6b7280;
                font-size: 14px;
                margin-bottom: 8px;
              }

              .value {
                font-size: 25px;
                font-weight: bold;
              }

              .section {
                padding: 24px;
                margin-bottom: 24px;
              }

              .section h2 {
                margin-top: 0;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th {
                background: #f3f4f6;
                text-align: left;
                padding: 10px;
              }

              td {
                padding: 9px 10px;
                border-bottom: 1px solid #e5e7eb;
                vertical-align: top;
              }

              tr.uncovered td:last-child {
                color: #dc2626;
                font-weight: bold;
              }

              tr.covered td:last-child {
                color: #16a34a;
              }

              tr.total-row {
                background: #f9fafb;
              }

              .code {
                background: #111827;
                color: #e5e7eb;
                padding: 16px;
                border-radius: 10px;
                white-space: pre-wrap;
                overflow-x: auto;
                max-height: 450px;
                overflow-y: auto;
              }

              code {
                background: #f3f4f6;
                padding: 2px 5px;
                border-radius: 4px;
              }
            </style>
          </head>

          <body>

            <div class="container">

              <div class="header">

                <h1>🧪 Jest Test & Coverage Report</h1>

                <p>
                  Real-time test execution and coverage generated
                  from the current GitHub Actions run.
                </p>

                <div class="metadata">

                  <div>
                    <strong>Repository</strong>
                    ${escapeHtml(repository)}
                  </div>

                  <div>
                    <strong>Branch</strong>
                    ${escapeHtml(branch)}
                  </div>

                  <div>
                    <strong>Commit</strong>
                    ${escapeHtml(commit)}
                  </div>

                </div>

                <div class="status">
                  ${escapeHtml(testStatus)}
                </div>

              </div>

              <div class="cards">

                <div class="card">
                  <div class="label">Test Suites Passed</div>
                  <div class="value">
                    ${escapeHtml(suitesPassed)} /
                    ${escapeHtml(suitesTotal)}
                  </div>
                </div>

                <div class="card">
                  <div class="label">Tests Passed</div>
                  <div class="value">
                    ${escapeHtml(testsPassed)} /
                    ${escapeHtml(testsTotal)}
                  </div>
                </div>

                <div class="card">
                  <div class="label">Test Suites Failed</div>
                  <div class="value">
                    ${escapeHtml(suitesFailed)}
                  </div>
                </div>

                <div class="card">
                  <div class="label">Tests Failed</div>
                  <div class="value">
                    ${escapeHtml(testsFailed)}
                  </div>
                </div>

                <div class="card">
                  <div class="label">Execution Time</div>
                  <div class="value">
                    ${escapeHtml(executionTime)}
                  </div>
                </div>

              </div>

              <div class="section">

                <h2>📊 Overall Coverage Summary</h2>

                <table>

                  <tr>
                    <th>Metric</th>
                    <th>Actual Jest Result</th>
                  </tr>

                  <tr>
                    <td><strong>Statements</strong></td>
                    <td>${escapeHtml(statements)}</td>
                  </tr>

                  <tr>
                    <td><strong>Branches</strong></td>
                    <td>${escapeHtml(branches)}</td>
                  </tr>

                  <tr>
                    <td><strong>Functions</strong></td>
                    <td>${escapeHtml(functions)}</td>
                  </tr>

                  <tr>
                    <td><strong>Lines</strong></td>
                    <td>${escapeHtml(linesCoverage)}</td>
                  </tr>

                </table>

              </div>

              <div class="section">

                <h2>📁 Full Coverage Breakdown</h2>

                <p>
                  File-level coverage and uncovered lines reported
                  by the current Jest execution.
                </p>

                <table>

                  <tr>
                    <th>File</th>
                    <th>% Stmts</th>
                    <th>% Branch</th>
                    <th>% Funcs</th>
                    <th>% Lines</th>
                    <th>Uncovered Line #s</th>
                  </tr>

                  ${coverageRows}

                </table>

              </div>

              <div class="section">

                <h2>📦 Coverage Artifacts</h2>

                <table>

                  <tr>
                    <th>Artifact</th>
                    <th>Location</th>
                  </tr>

                  <tr>
                    <td>LCOV Coverage</td>
                    <td>
                      <code>coverage/lcov.info</code>
                    </td>
                  </tr>

                  <tr>
                    <td>LCOV HTML Report</td>
                    <td>
                      <code>coverage/lcov-report/index.html</code>
                    </td>
                  </tr>

                </table>

              </div>

              <div class="section">

                <h2>🖥️ Console Output Highlights</h2>

                <pre class="code">${escapeHtml(highlights)}</pre>

              </div>

            </div>

          </body>
          </html>`;

          fs.writeFileSync(
            outputFile,
            html,
            "utf8"
          );

          console.log(
            `Generated ${outputFile}`
          );
          NODE

          node generate-test-report.mjs

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================
      - name: Upload Test Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-report
          path: test-summary.html
          if-no-files-found: error

      # ============================================================
      # UPLOAD RAW TEST LOG
      # ============================================================
      - name: Upload Jest Console Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-console-log
          path: console.log
          if-no-files-found: warn