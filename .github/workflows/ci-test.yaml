name: CI & Security Pipeline - Unit Tests & Coverage

on:
  workflow_call:

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resumes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev build-essential

      # ============================================================
      # NPM DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # ============================================================
      # JEST TESTS + LCOV COVERAGE
      # ============================================================
      - name: Run Tests & Capture Console Logs
        shell: bash
        run: |
          set -o pipefail

          npm test --silent=false 2>&1 | tee console.log

      # ============================================================
      # UPLOAD RAW COVERAGE
      # ============================================================
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # ============================================================
      # BUILD REAL-TIME TEST SUMMARY
      # ============================================================
      - name: Build Test Summary HTML Report
        if: always()
        shell: bash
        run: |
          set -u

          # --------------------------------------------------------
          # Remove ANSI escape sequences from Jest output
          # --------------------------------------------------------
          CLEAN_LOG="console-clean.log"

          if [ -f console.log ]; then
            sed 's/\x1b\[[0-9;]*m//g' console.log > "$CLEAN_LOG"
          else
            touch "$CLEAN_LOG"
          fi

          # --------------------------------------------------------
          # Repository metadata
          # --------------------------------------------------------
          REPOSITORY="${GITHUB_REPOSITORY:-N/A}"
          BRANCH="${GITHUB_REF_NAME:-N/A}"
          COMMIT="${GITHUB_SHA:-N/A}"

          if [ "$COMMIT" != "N/A" ]; then
            SHORT_COMMIT="${COMMIT:0:7}"
          else
            SHORT_COMMIT="N/A"
          fi

          # --------------------------------------------------------
          # Test Suite result
          # Example:
          # Test Suites: 40 passed, 40 total
          # --------------------------------------------------------
          SUITES_LINE=$(grep -E "^Test Suites:" "$CLEAN_LOG" | tail -1 || true)

          if [ -n "$SUITES_LINE" ]; then
            SUITES_RESULT=$(echo "$SUITES_LINE" | sed 's/^Test Suites:[[:space:]]*//')
          else
            SUITES_RESULT="N/A"
          fi

          # --------------------------------------------------------
          # Test result
          # Example:
          # Tests: 76 passed, 76 total
          # --------------------------------------------------------
          TESTS_LINE=$(grep -E "^Tests:" "$CLEAN_LOG" | tail -1 || true)

          if [ -n "$TESTS_LINE" ]; then
            TESTS_RESULT=$(echo "$TESTS_LINE" | sed 's/^Tests:[[:space:]]*//')
          else
            TESTS_RESULT="N/A"
          fi

          # --------------------------------------------------------
          # Snapshot result
          # --------------------------------------------------------
          SNAPSHOTS_LINE=$(grep -E "^Snapshots:" "$CLEAN_LOG" | tail -1 || true)

          if [ -n "$SNAPSHOTS_LINE" ]; then
            SNAPSHOTS_RESULT=$(echo "$SNAPSHOTS_LINE" | sed 's/^Snapshots:[[:space:]]*//')
          else
            SNAPSHOTS_RESULT="N/A"
          fi

          # --------------------------------------------------------
          # Execution time
          # --------------------------------------------------------
          TIME_LINE=$(grep -E "^Time:" "$CLEAN_LOG" | tail -1 || true)

          if [ -n "$TIME_LINE" ]; then
            TIME_RESULT=$(echo "$TIME_LINE" | sed 's/^Time:[[:space:]]*//')
          else
            TIME_RESULT="N/A"
          fi

          # --------------------------------------------------------
          # Jest overall coverage summary
          # --------------------------------------------------------
          STMTS_SUMMARY=$(grep -E "^Statements[[:space:]]*:" "$CLEAN_LOG" | tail -1 || true)
          BRANCH_SUMMARY=$(grep -E "^Branches[[:space:]]*:" "$CLEAN_LOG" | tail -1 || true)
          FUNCS_SUMMARY=$(grep -E "^Functions[[:space:]]*:" "$CLEAN_LOG" | tail -1 || true)
          LINES_SUMMARY=$(grep -E "^Lines[[:space:]]*:" "$CLEAN_LOG" | tail -1 || true)

          STMTS_SUMMARY="${STMTS_SUMMARY:-N/A}"
          BRANCH_SUMMARY="${BRANCH_SUMMARY:-N/A}"
          FUNCS_SUMMARY="${FUNCS_SUMMARY:-N/A}"
          LINES_SUMMARY="${LINES_SUMMARY:-N/A}"

          # --------------------------------------------------------
          # HTML escaping helper
          # --------------------------------------------------------
          html_escape() {
            printf '%s' "$1" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g' \
                -e 's/"/\&quot;/g' \
                -e "s/'/\&#39;/g"
          }

          # --------------------------------------------------------
          # Escape metadata
          # --------------------------------------------------------
          HTML_REPOSITORY=$(html_escape "$REPOSITORY")
          HTML_BRANCH=$(html_escape "$BRANCH")
          HTML_COMMIT=$(html_escape "$SHORT_COMMIT")

          HTML_SUITES=$(html_escape "$SUITES_RESULT")
          HTML_TESTS=$(html_escape "$TESTS_RESULT")
          HTML_SNAPSHOTS=$(html_escape "$SNAPSHOTS_RESULT")
          HTML_TIME=$(html_escape "$TIME_RESULT")

          HTML_STMTS=$(html_escape "$STMTS_SUMMARY")
          HTML_BRANCH=$(html_escape "$BRANCH_SUMMARY")
          HTML_FUNCS=$(html_escape "$FUNCS_SUMMARY")
          HTML_LINES=$(html_escape "$LINES_SUMMARY")

          # --------------------------------------------------------
          # Determine test status from actual Jest output
          # --------------------------------------------------------
          if grep -qE "^Test Suites:.*failed" "$CLEAN_LOG"; then
            TEST_STATUS="FAILED"
          elif grep -qE "^Test Suites:.*passed" "$CLEAN_LOG"; then
            TEST_STATUS="PASSED"
          else
            TEST_STATUS="UNKNOWN"
          fi

          # --------------------------------------------------------
          # Coverage table
          # --------------------------------------------------------
          COVERAGE_ROWS=""

          if grep -q "All files" "$CLEAN_LOG"; then

            while IFS='|' read -r file stmts branch funcs lines uncovered; do

              file=$(echo "$file" | xargs)
              stmts=$(echo "$stmts" | xargs)
              branch=$(echo "$branch" | xargs)
              funcs=$(echo "$funcs" | xargs)
              lines=$(echo "$lines" | xargs)
              uncovered=$(echo "$uncovered" | xargs)

              # Skip invalid/header rows
              if [ -z "$file" ]; then
                continue
              fi

              if [ "$file" = "File" ]; then
                continue
              fi

              if [[ "$file" == -* ]]; then
                continue
              fi

              if [[ "$file" == "All files" ]]; then
                continue
              fi

              # Skip decorative rows
              if [[ "$file" == "==="* ]]; then
                continue
              fi

              if [ -z "$uncovered" ]; then
                uncovered="None"
              fi

              HTML_FILE=$(html_escape "$file")
              HTML_STMTS_FILE=$(html_escape "$stmts")
              HTML_BRANCH_FILE=$(html_escape "$branch")
              HTML_FUNCS_FILE=$(html_escape "$funcs")
              HTML_LINES_FILE=$(html_escape "$lines")
              HTML_UNCOVERED=$(html_escape "$uncovered")

              if [ "$uncovered" = "None" ]; then
                ROW_CLASS="covered"
              else
                ROW_CLASS="uncovered"
              fi

              COVERAGE_ROWS="${COVERAGE_ROWS}
          <tr class=\"${ROW_CLASS}\">
            <td><strong>${HTML_FILE}</strong></td>
            <td>${HTML_STMTS_FILE}</td>
            <td>${HTML_BRANCH_FILE}</td>
            <td>${HTML_FUNCS_FILE}</td>
            <td>${HTML_LINES_FILE}</td>
            <td>${HTML_UNCOVERED}</td>
          </tr>"

            done < <(
              awk '
                /File[[:space:]]+\|[[:space:]]+% Stmts/ {
                  found=1
                  next
                }

                /Coverage summary/ {
                  found=0
                }

                found {
                  print
                }
              ' "$CLEAN_LOG"
            )

          fi

          if [ -z "$COVERAGE_ROWS" ]; then
            COVERAGE_ROWS="
          <tr>
            <td colspan=\"6\">No Jest coverage table was found in the current test output.</td>
          </tr>"
          fi

          # --------------------------------------------------------
          # Console highlights
          # --------------------------------------------------------
          HIGHLIGHTS=$(grep -E "🧠|📏|❌|📁|🔑|🧩|🛠️|✅|🚫|⚠️" "$CLEAN_LOG" \
            | grep -v "at " \
            | tail -100 || true)

          if [ -z "$HIGHLIGHTS" ]; then
            HIGHLIGHTS="No major console highlights found."
          fi

          HTML_HIGHLIGHTS=$(html_escape "$HIGHLIGHTS")

          # --------------------------------------------------------
          # Generate HTML
          # --------------------------------------------------------
          cat > test-summary.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Jest Test & Coverage Report</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 0;
                background: #f5f7fb;
                color: #1f2937;
                font-family: Arial, Helvetica, sans-serif;
              }

              .container {
                max-width: 1500px;
                margin: 0 auto;
                padding: 30px;
              }

              .header {
                background: white;
                border-radius: 16px;
                padding: 28px;
                margin-bottom: 24px;
                box-shadow: 0 4px 18px rgba(0,0,0,0.07);
              }

              .header h1 {
                margin: 0 0 10px 0;
                font-size: 28px;
              }

              .header p {
                margin: 5px 0;
                color: #6b7280;
              }

              .status {
                display: inline-block;
                margin-top: 15px;
                padding: 8px 16px;
                border-radius: 999px;
                font-weight: bold;
                background: ${TEST_STATUS == "PASSED" && echo "#dcfce7" || echo "#fee2e2"};
                color: ${TEST_STATUS == "PASSED" && echo "#166534" || echo "#991b1b"};
              }

              .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 18px;
                margin-bottom: 24px;
              }

              .card {
                background: white;
                border-radius: 14px;
                padding: 22px;
                box-shadow: 0 4px 18px rgba(0,0,0,0.06);
              }

              .card .label {
                color: #6b7280;
                font-size: 14px;
                margin-bottom: 8px;
              }

              .card .value {
                font-size: 25px;
                font-weight: bold;
              }

              .section {
                background: white;
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 24px;
                box-shadow: 0 4px 18px rgba(0,0,0,0.06);
              }

              .section h2 {
                margin-top: 0;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th {
                background: #f3f4f6;
                text-align: left;
                padding: 10px;
              }

              td {
                padding: 9px 10px;
                border-bottom: 1px solid #e5e7eb;
                vertical-align: top;
              }

              tr.uncovered td:last-child {
                color: #dc2626;
                font-weight: bold;
              }

              tr.covered td:last-child {
                color: #16a34a;
              }

              .code {
                background: #111827;
                color: #e5e7eb;
                padding: 16px;
                border-radius: 10px;
                white-space: pre-wrap;
                overflow-x: auto;
                max-height: 400px;
                overflow-y: auto;
              }

              .metadata {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 12px;
              }

              .metadata div {
                background: #f9fafb;
                padding: 12px;
                border-radius: 8px;
              }

              .metadata strong {
                display: block;
                margin-bottom: 4px;
              }

              code {
                background: #f3f4f6;
                padding: 2px 5px;
                border-radius: 4px;
              }

              @media (max-width: 800px) {
                .container {
                  padding: 15px;
                }

                table {
                  font-size: 12px;
                }
              }
            </style>
          </head>

          <body>

            <div class="container">

              <div class="header">
                <h1>🧪 Jest Test & Coverage Report</h1>

                <p>
                  Real-time test execution and Jest coverage generated from the current GitHub Actions run.
                </p>

                <div class="metadata">
                  <div>
                    <strong>Repository</strong>
                    ${HTML_REPOSITORY}
                  </div>

                  <div>
                    <strong>Branch</strong>
                    ${HTML_BRANCH}
                  </div>

                  <div>
                    <strong>Commit</strong>
                    ${HTML_COMMIT}
                  </div>
                </div>

                <div class="status">
                  ${TEST_STATUS}
                </div>
              </div>

              <div class="cards">

                <div class="card">
                  <div class="label">Test Suites</div>
                  <div class="value">${HTML_SUITES}</div>
                </div>

                <div class="card">
                  <div class="label">Tests</div>
                  <div class="value">${HTML_TESTS}</div>
                </div>

                <div class="card">
                  <div class="label">Snapshots</div>
                  <div class="value">${HTML_SNAPSHOTS}</div>
                </div>

                <div class="card">
                  <div class="label">Execution Time</div>
                  <div class="value">${HTML_TIME}</div>
                </div>

              </div>

              <div class="section">

                <h2>📊 Overall Coverage Summary</h2>

                <table>
                  <tr>
                    <th>Metric</th>
                    <th>Actual Jest Result</th>
                  </tr>

                  <tr>
                    <td><strong>Statements</strong></td>
                    <td>${HTML_STMTS}</td>
                  </tr>

                  <tr>
                    <td><strong>Branches</strong></td>
                    <td>${HTML_BRANCH}</td>
                  </tr>

                  <tr>
                    <td><strong>Functions</strong></td>
                    <td>${HTML_FUNCS}</td>
                  </tr>

                  <tr>
                    <td><strong>Lines</strong></td>
                    <td>${HTML_LINES}</td>
                  </tr>
                </table>

              </div>

              <div class="section">

                <h2>📁 Full Coverage Breakdown</h2>

                <p>
                  File-level coverage and uncovered lines reported by the current Jest execution.
                </p>

                <table>

                  <tr>
                    <th>File</th>
                    <th>% Stmts</th>
                    <th>% Branch</th>
                    <th>% Funcs</th>
                    <th>% Lines</th>
                    <th>Uncovered Line #s</th>
                  </tr>

                  ${COVERAGE_ROWS}

                </table>

              </div>

              <div class="section">

                <h2>📦 Coverage Artifacts</h2>

                <table>

                  <tr>
                    <th>Artifact</th>
                    <th>Location</th>
                  </tr>

                  <tr>
                    <td>LCOV Coverage</td>
                    <td><code>coverage/lcov.info</code></td>
                  </tr>

                  <tr>
                    <td>LCOV HTML Report</td>
                    <td><code>coverage/lcov-report/index.html</code></td>
                  </tr>

                </table>

              </div>

              <div class="section">

                <h2>🖥️ Console Output Highlights</h2>

                <pre class="code">${HTML_HIGHLIGHTS}</pre>

              </div>

            </div>

          </body>
          </html>
          EOF

          echo "============================================================"
          echo "Jest Test & Coverage Report"
          echo "============================================================"
          echo "Repository : $REPOSITORY"
          echo "Branch     : $BRANCH"
          echo "Commit     : $SHORT_COMMIT"
          echo "Status     : $TEST_STATUS"
          echo "Suites     : $SUITES_RESULT"
          echo "Tests      : $TESTS_RESULT"
          echo "Snapshots  : $SNAPSHOTS_RESULT"
          echo "Time       : $TIME_RESULT"
          echo "============================================================"

      # ============================================================
      # UPLOAD HTML REPORT
      # ============================================================
      - name: Upload Test Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-report
          path: test-summary.html
          if-no-files-found: warn