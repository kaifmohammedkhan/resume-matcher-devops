name: QA + Security Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env: # Global env so all jobs inherit
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.DB_USER }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run Cypress Integration Tests
        env:
          DB_HOST: localhost
        run: npm run cypress:ci
      - name: Upload Cypress Report
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load.js
      - name: Upload k6 Results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results/

  dast-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.DB_USER }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Start App
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: localhost
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: npm start &
      - name: Wait for App
        run: npx wait-on --timeout=60000 http://localhost:3000
      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: "http://localhost:3000"
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report/

  email-report:
    needs: [integration-tests, performance-tests, dast-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Send Email Report
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "QA + Security Pipeline Results"
          to: "kaif@example.com"
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>QA + Security Pipeline Results</h2>
            <p><strong>Integration Tests:</strong> See attached Cypress report.</p>
            <p><strong>Performance Tests:</strong> See attached k6 results.</p>
            <p><strong>DAST Scan:</strong> See attached ZAP report.</p>
          attachments: |
            reports/cypress-report/*
            reports/k6-results/*
            reports/zap-report/*
