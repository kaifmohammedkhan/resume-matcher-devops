name: QA + Security Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  DB_HOST: postgres
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build App (if required)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Verify Cypress specs exist
        run: |
          if ! find cypress/e2e -type f \( -name '*.cy.js' -o -name '*.cy.jsx' -o -name '*.cy.ts' -o -name '*.cy.tsx' \) -print -quit 2>/dev/null | grep -q .; then
            echo "ERROR: No Cypress E2E spec files were found under cypress/e2e."
            echo "Expected files such as *.cy.js, *.cy.jsx, *.cy.ts, or *.cy.tsx."
            exit 1
          fi

      - name: Start App & Diagnose Port
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          npm start > app.log 2>&1 &

          for i in {1..15}; do
            if nc -z 127.0.0.1 3000 2>/dev/null || nc -z localhost 3000 2>/dev/null; then
              echo "Server is up and listening on port 3000!"
              exit 0
            fi
            sleep 2
          done

          echo "=== TIMEOUT: Server failed to bind to port 3000 ==="
          echo "=== Application logs ==="
          cat app.log
          exit 1

      - name: Run Cypress Integration Tests
        id: cypress_tests
        continue-on-error: true
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          mkdir -p cypress/reports

          npx cypress run \
            --browser chrome \
            --headless \
            --posix-exit-codes \
            --reporter junit \
            --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true" \
            2>&1 | tee cypress/reports/cypress-run.log

          exit ${PIPESTATUS[0]}

      - name: Generate Detailed Cypress HTML Report
        if: always()
        env:
          CYPRESS_STEP_OUTCOME: ${{ steps.cypress_tests.outcome }}
        run: |
          mkdir -p cypress/reports

          python3 <<'PYTHON'
          import html
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          REPORT_DIR = Path("cypress/reports")
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          def esc(value):
              return html.escape(str(value if value is not None else ""))

          def seconds_text(value):
              try:
                  n = float(value or 0)
              except (TypeError, ValueError):
                  n = 0

              if n < 1:
                  return f"{round(n * 1000)}ms"

              return f"{n:.2f}s"

          def xml_testsuites(root):
              if root.tag == "testsuite":
                  return [root]

              return root.findall(".//testsuite")

          try:
              xml_files = sorted(REPORT_DIR.glob("junit-*.xml"))

              suites = []
              tests = []

              total = 0
              passed = 0
              failed = 0
              skipped = 0
              pending = 0

              duration_seconds = 0.0

              for xml_file in xml_files:
                  try:
                      root = ET.parse(xml_file).getroot()
                  except Exception as error:
                      print(f"Could not parse {xml_file}: {error}")
                      continue

                  for suite in xml_testsuites(root):
                      suite_name = suite.attrib.get(
                          "name",
                          xml_file.name
                      )

                      suite_time = float(
                          suite.attrib.get("time", "0") or 0
                      )

                      cases = suite.findall("testcase")

                      suite_failed = 0
                      suite_skipped = 0

                      for case in cases:
                          name = case.attrib.get(
                              "name",
                              "Unnamed test"
                          )

                          classname = case.attrib.get(
                              "classname",
                              suite_name
                          )

                          case_time = float(
                              case.attrib.get("time", "0") or 0
                          )

                          failure = case.find("failure")
                          skipped_node = case.find("skipped")
                          pending_node = case.find("pending")

                          if failure is not None:
                              state = "failed"
                              suite_failed += 1

                              error_message = failure.attrib.get(
                                  "message",
                                  "Test failed"
                              )

                              error_stack = failure.text or ""

                          elif skipped_node is not None:
                              state = "skipped"
                              suite_skipped += 1

                              error_message = ""
                              error_stack = ""

                          elif pending_node is not None:
                              state = "pending"

                              error_message = ""
                              error_stack = ""

                          else:
                              state = "passed"

                              error_message = ""
                              error_stack = ""

                          total += 1

                          if state == "passed":
                              passed += 1

                          elif state == "failed":
                              failed += 1

                          elif state == "skipped":
                              skipped += 1

                          elif state == "pending":
                              pending += 1

                          tests.append({
                              "spec": suite_name,
                              "classname": classname,
                              "name": name,
                              "duration": case_time,
                              "state": state,
                              "error_message": error_message,
                              "error_stack": error_stack,
                          })

                      duration_seconds += suite_time

                      suites.append({
                          "name": suite_name,
                          "tests": len(cases),
                          "failures": suite_failed,
                          "skipped": suite_skipped,
                          "duration": suite_time,
                      })

              step_outcome = os.environ.get(
                  "CYPRESS_STEP_OUTCOME",
                  "unknown"
              )

              status = (
                  "FAILED"
                  if failed > 0 or step_outcome == "failure"
                  else "PASSED"
              )

              status_class = (
                  "success"
                  if status == "PASSED"
                  else "danger"
              )

              try:
                  cypress_version = subprocess.check_output(
                      [
                          "npx",
                          "cypress",
                          "version",
                          "--component",
                          "version"
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()

              except Exception:
                  cypress_version = "Unknown"

              try:
                  chrome_version = subprocess.check_output(
                      ["google-chrome", "--version"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()

              except Exception:
                  chrome_version = "Unknown"

              node_version = subprocess.check_output(
                  ["node", "--version"],
                  text=True,
              ).strip()

              timestamp = subprocess.check_output(
                  [
                      "date",
                      "-u",
                      "+%Y-%m-%dT%H:%M:%SZ"
                  ],
                  text=True,
              ).strip()

              run_url = ""

              if (
                  os.environ.get("GITHUB_SERVER_URL")
                  and os.environ.get("GITHUB_REPOSITORY")
                  and os.environ.get("GITHUB_RUN_ID")
              ):
                  run_url = (
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  )

              if suites:
                  suite_rows = "".join(
                      f"""
                      <tr>
                        <td>{esc(s['name'])}</td>
                        <td>{s['tests']}</td>
                        <td class="{'danger-text' if s['failures'] else 'success-text'}">
                          {'✗' if s['failures'] else '✓'}
                        </td>
                        <td>{s['failures']}</td>
                        <td>{s['skipped']}</td>
                        <td>{seconds_text(s['duration'])}</td>
                      </tr>
                      """
                      for s in suites
                  )

              else:
                  suite_rows = (
                      '<tr>'
                      '<td colspan="6">'
                      'No JUnit result files were generated.'
                      '</td>'
                      '</tr>'
                  )

              if tests:
                  test_rows = "".join(
                      f"""
                      <tr>
                        <td>
                          {
                            '✓'
                            if t['state'] == 'passed'
                            else '✗'
                            if t['state'] == 'failed'
                            else '•'
                          }
                        </td>

                        <td>{esc(t['spec'])}</td>
                        <td>{esc(t['name'])}</td>
                        <td>{seconds_text(t['duration'])}</td>

                        <td class="{
                          'danger-text'
                          if t['state'] == 'failed'
                          else 'success-text'
                          if t['state'] == 'passed'
                          else 'warning-text'
                        }">
                          {esc(t['state'].upper())}
                        </td>
                      </tr>
                      """
                      for t in tests
                  )

              else:
                  test_rows = (
                      '<tr>'
                      '<td colspan="5">'
                      'No individual test results were available.'
                      '</td>'
                      '</tr>'
                  )

              failures = [
                  t
                  for t in tests
                  if t["state"] == "failed"
              ]

              if failures:
                  failure_rows = "".join(
                      f"""
                      <div class="failure-box">
                        <h3>✗ {esc(t['name'])}</h3>

                        <p>
                          <strong>Spec:</strong>
                          {esc(t['spec'])}
                        </p>

                        <p>
                          <strong>Duration:</strong>
                          {seconds_text(t['duration'])}
                        </p>

                        <p>
                          <strong>Error:</strong>
                          {esc(
                              t['error_message']
                              or 'Test failed'
                          )}
                        </p>

                        {
                          f"<pre>{esc(t['error_stack'])}</pre>"
                          if t['error_stack']
                          else ''
                        }
                      </div>
                      """
                      for t in failures
                  )

              else:
                  failure_rows = (
                      '<p class="success-text">'
                      'No failed tests.'
                      '</p>'
                  )

              report = f"""
              <!DOCTYPE html>

              <html>

              <head>
                <meta charset="UTF-8">

                <title>
                  Cypress Test Execution Report
                </title>

                <style>

                  body {{
                    font-family: Arial, sans-serif;
                    margin: 0;
                    background: #0d1117;
                    color: #c9d1d9;
                  }}

                  .container {{
                    max-width: 1400px;
                    margin: 0 auto;
                    padding: 32px;
                  }}

                  .card {{
                    background: #161b22;
                    padding: 24px;
                    border-radius: 10px;
                    border: 1px solid #30363d;
                    margin-bottom: 22px;
                    box-shadow: 0 4px 12px rgba(0,0,0,.25);
                  }}

                  h1 {{
                    color: #58a6ff;
                    margin-top: 0;
                  }}

                  h2 {{
                    color: #58a6ff;
                    font-size: 18px;
                    border-bottom: 1px solid #30363d;
                    padding-bottom: 8px;
                  }}

                  h3 {{
                    color: #f0f6fc;
                  }}

                  .meta {{
                    line-height: 1.8;
                  }}

                  .status {{
                    display: inline-block;
                    padding: 8px 14px;
                    border-radius: 6px;
                    font-weight: bold;
                  }}

                  .success {{
                    background: #12351f;
                    color: #3fb950;
                  }}

                  .danger {{
                    background: #3b1717;
                    color: #ff7b72;
                  }}

                  .success-text {{
                    color: #3fb950;
                    font-weight: bold;
                  }}

                  .danger-text {{
                    color: #ff7b72;
                    font-weight: bold;
                  }}

                  .warning-text {{
                    color: #d29922;
                    font-weight: bold;
                  }}

                  .grid {{
                    display: grid;
                    grid-template-columns:
                      repeat(
                        auto-fit,
                        minmax(160px, 1fr)
                      );
                    gap: 12px;
                  }}

                  .stat {{
                    background: #0d1117;
                    border: 1px solid #30363d;
                    padding: 18px;
                    border-radius: 8px;
                  }}

                  .stat .label {{
                    color: #8b949e;
                    font-size: 12px;
                    text-transform: uppercase;
                  }}

                  .stat .value {{
                    font-size: 25px;
                    margin-top: 6px;
                    font-weight: bold;
                  }}

                  table {{
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 12px;
                    font-size: 14px;
                  }}

                  th,
                  td {{
                    border: 1px solid #30363d;
                    padding: 10px 12px;
                    text-align: left;
                    vertical-align: top;
                  }}

                  th {{
                    background: #21262d;
                    color: #f0f6fc;
                  }}

                  tr:nth-child(even) {{
                    background: #1b2028;
                  }}

                  .failure-box {{
                    border: 1px solid #6e2020;
                    background: #210f0f;
                    padding: 16px;
                    margin: 12px 0;
                    border-radius: 8px;
                  }}

                  pre {{
                    white-space: pre-wrap;
                    overflow-wrap: anywhere;
                    background: #0d1117;
                    border: 1px solid #30363d;
                    padding: 12px;
                    border-radius: 6px;
                    color: #ff7b72;
                  }}

                  a {{
                    color: #58a6ff;
                  }}

                </style>

              </head>

              <body>

                <div class="container">

                  <div class="card">

                    <h1>
                      Cypress Test Execution Report
                    </h1>

                    <span class="status {status_class}">
                      {'✓' if status == 'PASSED' else '✗'}
                      {status}
                    </span>

                    <div class="meta">

                      <p>
                        <strong>Cypress:</strong>
                        {esc(cypress_version)}
                      </p>

                      <p>
                        <strong>Browser:</strong>
                        {esc(chrome_version)}
                        (headless)
                      </p>

                      <p>
                        <strong>Node:</strong>
                        {esc(node_version)}
                      </p>

                      <p>
                        <strong>Execution:</strong>
                        GitHub Actions
                      </p>

                      <p>
                        <strong>Timestamp:</strong>
                        {esc(timestamp)}
                      </p>

                      {
                        f'''
                        <p>
                          <strong>Workflow Run:</strong>
                          <a href="{esc(run_url)}">
                            Open GitHub Actions run
                          </a>
                        </p>
                        '''
                        if run_url
                        else ''
                      }

                    </div>

                  </div>


                  <div class="card">

                    <h2>
                      Test Summary
                    </h2>

                    <div class="grid">

                      <div class="stat">
                        <div class="label">
                          Specs
                        </div>

                        <div class="value">
                          {len(suites)}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Tests
                        </div>

                        <div class="value">
                          {total}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Passed
                        </div>

                        <div class="value success-text">
                          {passed}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Failed
                        </div>

                        <div class="value danger-text">
                          {failed}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Skipped
                        </div>

                        <div class="value warning-text">
                          {skipped}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Pending
                        </div>

                        <div class="value warning-text">
                          {pending}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Duration
                        </div>

                        <div class="value">
                          {seconds_text(duration_seconds)}
                        </div>
                      </div>

                    </div>

                  </div>


                  <div class="card">

                    <h2>
                      Spec Results
                    </h2>

                    <table>

                      <thead>

                        <tr>
                          <th>Spec</th>
                          <th>Tests</th>
                          <th>Status</th>
                          <th>Failed</th>
                          <th>Skipped</th>
                          <th>Duration</th>
                        </tr>

                      </thead>

                      <tbody>
                        {suite_rows}
                      </tbody>

                    </table>

                  </div>


                  <div class="card">

                    <h2>
                      Individual Tests
                    </h2>

                    <table>

                      <thead>

                        <tr>
                          <th></th>
                          <th>Spec</th>
                          <th>Test</th>
                          <th>Duration</th>
                          <th>Status</th>
                        </tr>

                      </thead>

                      <tbody>
                        {test_rows}
                      </tbody>

                    </table>

                  </div>


                  <div class="card">

                    <h2>
                      Failures & Diagnostics
                    </h2>

                    {failure_rows}

                  </div>


                  <div class="card">

                    <h2>
                      Artifacts
                    </h2>

                    <p>
                      The workflow uploads the raw JUnit XML,
                      Cypress console log, screenshots, videos,
                      and application log when available.
                    </p>

                  </div>

                </div>

              </body>

              </html>
              """

              (
                  REPORT_DIR / "cypress-report.html"
              ).write_text(
                  report,
                  encoding="utf-8"
              )

              print(
                  "Generated "
                  "cypress/reports/cypress-report.html "
                  "successfully."
              )

              print(
                  f"Cypress report data: "
                  f"{total} tests, "
                  f"{passed} passed, "
                  f"{failed} failed, "
                  f"{skipped} skipped."
              )

          except Exception as error:

              print(
                  f"Error generating Cypress HTML report: "
                  f"{error}"
              )

              fallback = f"""
              <!DOCTYPE html>
              <html>
              <body style="
                font-family:Arial;
                background:#0d1117;
                color:#c9d1d9;
                padding:30px
              ">

                <h1>
                  Cypress Report Generation Error
                </h1>

                <pre>
                  {esc(error)}
                </pre>

              </body>
              </html>
              """

              (
                  REPORT_DIR / "cypress-report.html"
              ).write_text(
                  fallback,
                  encoding="utf-8"
              )

          PYTHON

      - name: Upload Cypress Reports and Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            app.log
          if-no-files-found: warn

      - name: Fail job if Cypress tests failed
        if: always() && steps.cypress_tests.outcome == 'failure'
        run: |
          echo "Cypress integration tests failed."
          exit 1

  performance-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build App (if required)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Create results directory
        run: mkdir -p results

      - name: Start App & Diagnose Port
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          npm start > app.log 2>&1 &

          for i in {1..15}; do
            if nc -z 127.0.0.1 3000 2>/dev/null || nc -z localhost 3000 2>/dev/null; then
              echo "Server is up and listening on port 3000!"
              exit 0
            fi

            sleep 2
          done

          echo "=== TIMEOUT: Server failed to bind to port 3000 ==="
          echo "=== Application logs ==="
          cat app.log
          exit 1

      - name: Run k6 Load Test
        id: k6_load_test
        continue-on-error: true
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load.js
          flags: >-
            --out json=results/output.json
            --summary-export=results/summary.json

      - name: Generate Detailed k6 HTML Report
        if: always()
        env:
          K6_STEP_OUTCOME: ${{ steps.k6_load_test.outcome }}
        run: |
          mkdir -p results

          node <<'NODE'
          const fs = require('fs');

          function esc(value) {
            return String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
          }

          function num(value, fallback = 0) {
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
          }

          function duration(ms) {
            const n = num(ms, NaN);

            if (!Number.isFinite(n)) {
              return 'N/A';
            }

            if (n < 1000) {
              return `${n.toFixed(2)} ms`;
            }

            return `${(n / 1000).toFixed(2)} s`;
          }

          function rate(value) {
            if (value === undefined || value === null) {
              return 'N/A';
            }

            return `${(num(value) * 100).toFixed(2)}%`;
          }

          function bytes(value) {
            const n = num(value, NaN);

            if (!Number.isFinite(n)) {
              return 'N/A';
            }

            if (n < 1024) {
              return `${n.toFixed(0)} B`;
            }

            if (n < 1024 * 1024) {
              return `${(n / 1024).toFixed(2)} KiB`;
            }

            if (n < 1024 * 1024 * 1024) {
              return `${(n / (1024 * 1024)).toFixed(2)} MiB`;
            }

            return `${(
              n / (1024 * 1024 * 1024)
            ).toFixed(2)} GiB`;
          }

          /*
           * IMPORTANT:
           * summary is loaded BEFORE metric() is called.
           * This fixes the previous:
           *
           * ReferenceError: summary is not defined
           */
          function metric(summary, name) {
            return (
              summary?.metrics?.[name] || {
                values: {}
              }
            );
          }

          function value(summary, name, key) {
            return metric(
              summary,
              name
            ).values?.[key];
          }

          try {
            let summary = null;

            if (
              fs.existsSync(
                'results/summary.json'
              )
            ) {
              summary = JSON.parse(
                fs.readFileSync(
                  'results/summary.json',
                  'utf8'
                )
              );
            }

            const httpDuration =
              metric(
                summary,
                'http_req_duration'
              );

            const httpFailed =
              metric(
                summary,
                'http_req_failed'
              );

            const httpReqs =
              metric(
                summary,
                'http_reqs'
              );

            const iterations =
              metric(
                summary,
                'iterations'
              );

            const iterationDuration =
              metric(
                summary,
                'iteration_duration'
              );

            const vus =
              metric(
                summary,
                'vus'
              );

            const vusMax =
              metric(
                summary,
                'vus_max'
              );

            const received =
              metric(
                summary,
                'data_received'
              );

            const sent =
              metric(
                summary,
                'data_sent'
              );

            const checks =
              metric(
                summary,
                'checks'
              );

            const statusCounts = {};
            const endpointCounts = {};
            const errorCounts = {};

            let firstTimestamp = null;
            let lastTimestamp = null;
            let rawHttpPoints = 0;

            if (
              fs.existsSync(
                'results/output.json'
              )
            ) {
              const lines =
                fs.readFileSync(
                  'results/output.json',
                  'utf8'
                ).split(/\r?\n/);

              for (
                const line of lines
              ) {
                if (!line.trim()) {
                  continue;
                }

                let event;

                try {
                  event = JSON.parse(line);
                } catch (_) {
                  continue;
                }

                const time =
                  event.data?.time;

                if (time) {
                  const t =
                    new Date(time).getTime();

                  if (
                    Number.isFinite(t)
                  ) {
                    firstTimestamp =
                      firstTimestamp === null
                        ? t
                        : Math.min(
                            firstTimestamp,
                            t
                          );

                    lastTimestamp =
                      lastTimestamp === null
                        ? t
                        : Math.max(
                            lastTimestamp,
                            t
                          );
                  }
                }

                if (
                  event.metric !==
                    'http_reqs' ||
                  event.type !== 'Point'
                ) {
                  continue;
                }

                rawHttpPoints++;

                const tags =
                  event.data?.tags || {};

                const status =
                  String(
                    tags.status ||
                    'unknown'
                  );

                const method =
                  String(
                    tags.method ||
                    'unknown'
                  );

                const name =
                  String(
                    tags.name ||
                    tags.url ||
                    'unknown'
                  );

                const key =
                  `${method} ${name}`;

                statusCounts[status] =
                  (
                    statusCounts[status] ||
                    0
                  ) + 1;

                if (
                  !endpointCounts[key]
                ) {
                  endpointCounts[key] = {
                    method,
                    name,
                    requests: 0,
                    failures: 0,
                    statuses: {}
                  };
                }

                endpointCounts[key]
                  .requests++;

                endpointCounts[key]
                  .statuses[status] =
                    (
                      endpointCounts[key]
                        .statuses[status] ||
                      0
                    ) + 1;

                if (
                  status.startsWith('4') ||
                  status.startsWith('5')
                ) {
                  endpointCounts[key]
                    .failures++;
                }

                if (tags.error) {
                  const error =
                    String(tags.error);

                  errorCounts[error] =
                    (
                      errorCounts[error] ||
                      0
                    ) + 1;
                }

                if (tags.error_code) {
                  const errorCode =
                    `error_code=${tags.error_code}`;

                  errorCounts[errorCode] =
                    (
                      errorCounts[errorCode] ||
                      0
                    ) + 1;
                }
              }
            }

            const durationMs =
              firstTimestamp !== null &&
              lastTimestamp !== null
                ? Math.max(
                    0,
                    lastTimestamp -
                      firstTimestamp
                  )
                : null;

            const statusRows =
              Object.entries(
                statusCounts
              )
                .sort(
                  (a, b) =>
                    Number(a[0]) -
                    Number(b[0])
                )
                .map(
                  ([status, count]) => `
                    <tr>
                      <td>${esc(status)}</td>
                      <td>${count}</td>
                      <td>
                        ${
                          rawHttpPoints
                            ? (
                                (
                                  count /
                                  rawHttpPoints
                                ) * 100
                              ).toFixed(2)
                            : '0.00'
                        }%
                      </td>
                    </tr>
                  `
                )
                .join('');

            const endpointRows =
              Object.values(
                endpointCounts
              )
                .sort(
                  (a, b) =>
                    b.requests -
                    a.requests
                )
                .map(
                  item => `
                    <tr>
                      <td>
                        ${esc(item.method)}
                      </td>

                      <td>
                        ${esc(item.name)}
                      </td>

                      <td>
                        ${item.requests}
                      </td>

                      <td class="${
                        item.failures
                          ? 'danger-text'
                          : 'success-text'
                      }">
                        ${item.failures}
                      </td>

                      <td>
                        ${
                          Object.entries(
                            item.statuses
                          )
                            .map(
                              ([s, c]) =>
                                `${esc(s)}: ${c}`
                            )
                            .join('<br>')
                        }
                      </td>
                    </tr>
                  `
                )
                .join('');

            const errorRows =
              Object.entries(
                errorCounts
              )
                .sort(
                  (a, b) =>
                    b[1] -
                    a[1]
                )
                .map(
                  ([error, count]) => `
                    <tr>
                      <td>${esc(error)}</td>
                      <td>${count}</td>
                    </tr>
                  `
                )
                .join('');

            const thresholdRows =
              summary?.metrics
                ? Object.entries(
                    summary.metrics
                  )
                    .flatMap(
                      ([name, data]) =>
                        Object.entries(
                          data.thresholds ||
                            {}
                        ).map(
                          ([threshold, ok]) => `
                            <tr>
                              <td>
                                ${esc(name)}
                              </td>

                              <td>
                                ${esc(threshold)}
                              </td>

                              <td class="${
                                ok
                                  ? 'success-text'
                                  : 'danger-text'
                              }">
                                ${
                                  ok
                                    ? '✓ PASSED'
                                    : '✗ FAILED'
                                }
                              </td>
                            </tr>
                          `
                        )
                    )
                    .join('')
                : '';

            const thresholdFailed =
              Object.values(
                summary?.metrics || {}
              ).some(
                metricData =>
                  metricData.thresholds &&
                  Object.values(
                    metricData.thresholds
                  ).some(
                    value => value === false
                  )
              );

            const k6Status =
              process.env.K6_STEP_OUTCOME ===
                'failure' ||
              thresholdFailed
                ? 'FAILED'
                : 'PASSED';

            const report = `
            <!DOCTYPE html>

            <html>

            <head>

              <meta charset="UTF-8">

              <title>
                k6 Load Test Report
              </title>

              <style>

                body {
                  font-family: Arial, sans-serif;
                  margin: 0;
                  background: #0d1117;
                  color: #c9d1d9;
                }

                .container {
                  max-width: 1450px;
                  margin: 0 auto;
                  padding: 32px;
                }

                .card {
                  background: #161b22;
                  padding: 24px;
                  border-radius: 10px;
                  border: 1px solid #30363d;
                  margin-bottom: 22px;
                  box-shadow:
                    0 4px 12px
                    rgba(0,0,0,.25);
                }

                h1 {
                  color: #f0883e;
                  margin-top: 0;
                }

                h2 {
                  color: #58a6ff;
                  font-size: 18px;
                  border-bottom:
                    1px solid #30363d;
                  padding-bottom: 8px;
                }

                .status {
                  display: inline-block;
                  padding: 8px 14px;
                  border-radius: 6px;
                  font-weight: bold;
                }

                .success {
                  background: #12351f;
                  color: #3fb950;
                }

                .danger {
                  background: #3b1717;
                  color: #ff7b72;
                }

                .success-text {
                  color: #3fb950;
                  font-weight: bold;
                }

                .danger-text {
                  color: #ff7b72;
                  font-weight: bold;
                }

                .warning-text {
                  color: #d29922;
                  font-weight: bold;
                }

                .meta {
                  line-height: 1.8;
                }

                .grid {
                  display: grid;
                  grid-template-columns:
                    repeat(
                      auto-fit,
                      minmax(170px, 1fr)
                    );
                  gap: 12px;
                }

                .stat {
                  background: #0d1117;
                  border:
                    1px solid #30363d;
                  padding: 18px;
                  border-radius: 8px;
                }

                .label {
                  color: #8b949e;
                  font-size: 12px;
                  text-transform:
                    uppercase;
                }

                .value {
                  font-size: 24px;
                  margin-top: 6px;
                  font-weight: bold;
                }

                table {
                  width: 100%;
                  border-collapse:
                    collapse;
                  margin-top: 12px;
                  font-size: 14px;
                }

                th,
                td {
                  border:
                    1px solid #30363d;
                  padding:
                    10px 12px;
                  text-align: left;
                  vertical-align:
                    top;
                }

                th {
                  background:
                    #21262d;
                  color:
                    #f0f6fc;
                }

                tr:nth-child(even) {
                  background:
                    #1b2028;
                }

                .muted {
                  color: #8b949e;
                }

                code {
                  background:
                    #0d1117;
                  padding:
                    2px 5px;
                  border-radius:
                    4px;
                }

              </style>

            </head>

            <body>

              <div class="container">

                <div class="card">

                  <h1>
                    k6 Load Test
                    Execution Report
                  </h1>

                  <span class="status ${
                    k6Status === 'PASSED'
                      ? 'success'
                      : 'danger'
                  }">

                    ${
                      k6Status === 'PASSED'
                        ? '✓'
                        : '✗'
                    }

                    ${k6Status}

                  </span>

                  <div class="meta">

                    <p>
                      <strong>
                        Script:
                      </strong>

                      tests/load.js
                    </p>

                    <p>
                      <strong>
                        Execution:
                      </strong>

                      GitHub Actions
                    </p>

                    <p>
                      <strong>
                        Timestamp:
                      </strong>

                      ${esc(
                        new Date()
                          .toISOString()
                      )}
                    </p>

                    <p>
                      <strong>
                        Observed test
                        window:
                      </strong>

                      ${duration(
                        durationMs
                      )}
                    </p>

                    <p>
                      <strong>
                        Raw HTTP points:
                      </strong>

                      ${rawHttpPoints}
                    </p>

                  </div>

                </div>


                ${
                  summary
                    ? `

                <div class="card">

                  <h2>
                    HTTP Performance
                  </h2>

                  <div class="grid">

                    <div class="stat">
                      <div class="label">
                        HTTP Requests
                      </div>

                      <div class="value">
                        ${
                          value(
                            summary,
                            'http_reqs',
                            'count'
                          ) ?? 'N/A'
                        }
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Request Rate
                      </div>

                      <div class="value">
                        ${
                          value(
                            summary,
                            'http_reqs',
                            'rate'
                          ) !== undefined
                            ? num(
                                value(
                                  summary,
                                  'http_reqs',
                                  'rate'
                                )
                              ).toFixed(2)
                              + ' req/s'
                            : 'N/A'
                        }
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Failed Requests
                      </div>

                      <div class="value danger-text">
                        ${
                          value(
                            summary,
                            'http_req_failed',
                            'fails'
                          ) ?? 'N/A'
                        }
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Failure Rate
                      </div>

                      <div class="value danger-text">
                        ${rate(
                          value(
                            summary,
                            'http_req_failed',
                            'rate'
                          )
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Average
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.avg
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Median
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.med
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P90
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(90)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P95
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(95)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P99
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(99)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Maximum
                      </div>

                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.max
                        )}
                      </div>
                    </div>

                  </div>

                </div>


                <div class="card">

                  <h2>
                    Execution Metrics
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Metric
                      </th>

                      <th>
                        Actual Result
                      </th>
                    </tr>

                    <tr>
                      <td>
                        iteration_duration
                      </td>

                      <td>
                        avg=${
                          duration(
                            iterationDuration
                              .values?.avg
                          )
                        },

                        min=${
                          duration(
                            iterationDuration
                              .values?.min
                          )
                        },

                        med=${
                          duration(
                            iterationDuration
                              .values?.med
                          )
                        },

                        max=${
                          duration(
                            iterationDuration
                              .values?.max
                          )
                        },

                        p90=${
                          duration(
                            iterationDuration
                              .values?.['p(90)']
                          )
                        },

                        p95=${
                          duration(
                            iterationDuration
                              .values?.['p(95)']
                          )
                        }
                      </td>
                    </tr>

                    <tr>
                      <td>
                        iterations
                      </td>

                      <td>
                        ${
                          value(
                            summary,
                            'iterations',
                            'count'
                          ) ?? 'N/A'
                        }

                        (

                        ${
                          value(
                            summary,
                            'iterations',
                            'rate'
                          ) !== undefined
                            ? num(
                                value(
                                  summary,
                                  'iterations',
                                  'rate'
                                )
                              ).toFixed(2)
                              + ' iter/s'
                            : 'N/A'
                        }

                        )
                      </td>
                    </tr>

                    <tr>
                      <td>
                        vus
                      </td>

                      <td>
                        min=${
                          vus.values?.min ??
                          'N/A'
                        },

                        max=${
                          vus.values?.max ??
                          'N/A'
                        }
                      </td>
                    </tr>

                    <tr>
                      <td>
                        vus_max
                      </td>

                      <td>
                        min=${
                          vusMax.values?.min ??
                          'N/A'
                        },

                        max=${
                          vusMax.values?.max ??
                          'N/A'
                        }
                      </td>
                    </tr>

                  </table>

                </div>


                <div class="card">

                  <h2>
                    Network Metrics
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Metric
                      </th>

                      <th>
                        Actual Result
                      </th>
                    </tr>

                    <tr>
                      <td>
                        data_received
                      </td>

                      <td>
                        ${
                          bytes(
                            received.values?.count
                          )
                        }

                        (

                        ${
                          bytes(
                            received.values?.rate
                          )
                        }

                        /s)
                      </td>
                    </tr>

                    <tr>
                      <td>
                        data_sent
                      </td>

                      <td>
                        ${
                          bytes(
                            sent.values?.count
                          )
                        }

                        (

                        ${
                          bytes(
                            sent.values?.rate
                          )
                        }

                        /s)
                      </td>
                    </tr>

                  </table>

                </div>


                <div class="card">

                  <h2>
                    HTTP Status Distribution
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Status
                      </th>

                      <th>
                        Requests
                      </th>

                      <th>
                        Percentage
                      </th>
                    </tr>

                    ${
                      statusRows ||
                      `
                      <tr>
                        <td colspan="3"
                            class="muted">
                          No HTTP request
                          samples were
                          available in
                          output.json.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>


                <div class="card">

                  <h2>
                    Endpoint Breakdown
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Method
                      </th>

                      <th>
                        Endpoint / Name
                      </th>

                      <th>
                        Requests
                      </th>

                      <th>
                        4xx/5xx
                      </th>

                      <th>
                        Status Codes
                      </th>
                    </tr>

                    ${
                      endpointRows ||
                      `
                      <tr>
                        <td colspan="5"
                            class="muted">
                          No endpoint-level
                          HTTP samples
                          were available.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>


                <div class="card">

                  <h2>
                    Checks
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Metric
                      </th>

                      <th>
                        Pass Rate
                      </th>

                      <th>
                        Passes
                      </th>

                      <th>
                        Fails
                      </th>
                    </tr>

                    <tr>
                      <td>
                        checks
                      </td>

                      <td>
                        ${rate(
                          checks.values?.rate
                        )}
                      </td>

                      <td>
                        ${
                          checks.values?.passes ??
                          'N/A'
                        }
                      </td>

                      <td>
                        ${
                          checks.values?.fails ??
                          'N/A'
                        }
                      </td>
                    </tr>

                  </table>

                </div>


                <div class="card">

                  <h2>
                    Thresholds
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Metric
                      </th>

                      <th>
                        Threshold
                      </th>

                      <th>
                        Result
                      </th>
                    </tr>

                    ${
                      thresholdRows ||
                      `
                      <tr>
                        <td colspan="3"
                            class="muted">
                          No thresholds
                          were defined
                          in the k6
                          script.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>


                <div class="card">

                  <h2>
                    Errors Observed
                  </h2>

                  <table>

                    <tr>
                      <th>
                        Error
                      </th>

                      <th>
                        Count
                      </th>
                    </tr>

                    ${
                      errorRows ||
                      `
                      <tr>
                        <td colspan="2"
                            class="success-text">
                          No tagged HTTP
                          errors were
                          found in the
                          k6 JSON stream.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>

                `
                    : `

                <div class="card">

                  <h2>
                    k6 Execution Data
                  </h2>

                  <p class="danger-text">
                    summary.json was not
                    generated.
                  </p>

                  <p>
                    The k6 execution may
                    have failed before
                    producing a summary.
                  </p>

                  <p>
                    Check the k6 step logs
                    and uploaded artifacts.
                  </p>

                </div>

                `
                }


                <div class="card">

                  <h2>
                    Raw Artifacts
                  </h2>

                  <p>
                    <code>
                      summary.json
                    </code>

                    contains k6's actual
                    end-of-test metrics.
                  </p>

                  <p>
                    <code>
                      output.json
                    </code>

                    contains the detailed
                    k6 JSON event stream.
                  </p>

                  <p>
                    <code>
                      app.log
                    </code>

                    contains application
                    startup/runtime logs.
                  </p>

                </div>

              </div>

            </body>

            </html>
            `;

            fs.writeFileSync(
              'results/k6-report.html',
              report
            );

            console.log(
              'Generated ' +
              'results/k6-report.html ' +
              'successfully.'
            );

          } catch (error) {

            console.error(
              'Error generating ' +
              'k6 HTML report:',
              error
            );

            const fallback = `
              <!DOCTYPE html>
              <html>

              <body style="
                font-family:Arial;
                background:#0d1117;
                color:#c9d1d9;
                padding:30px
              ">

                <h1>
                  k6 Report Generation Error
                </h1>

                <pre>
                  ${esc(
                    error.stack ||
                    error
                  )}
                </pre>

              </body>

              </html>
            `;

            fs.writeFileSync(
              'results/k6-report.html',
              fallback
            );
          }

          NODE

      - name: Upload k6 Results and Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            results/
            app.log
          if-no-files-found: warn

      - name: Fail job if k6 failed
        if: always() && steps.k6_load_test.outcome == 'failure'
        run: |
          echo "k6 load test failed."
          echo "See the uploaded k6 report, summary.json, output.json, and app.log."
          exit 1

  dast-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build App (if required)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Start App & Diagnose Port
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          npm start > app.log 2>&1 &

          for i in {1..15}; do
            if nc -z 127.0.0.1 3000 2>/dev/null || nc -z localhost 3000 2>/dev/null; then
              echo "Server is up and listening on port 3000!"
              exit 0
            fi

            sleep 2
          done

          echo "=== TIMEOUT: Server failed to bind to port 3000 ==="
          cat app.log
          exit 1

      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: "http://localhost:3000"
        continue-on-error: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: warn

      - name: Upload ZAP Application Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-app-log
          path: app.log
          if-no-files-found: warn

  email-report:
    needs:
      - integration-tests
      - performance-tests
      - dast-scan

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Send Email Report
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}

          subject: "QA + Security Pipeline Results"

          to: "kaifkhanmohammed718@gmail.com"

          from: ${{ secrets.EMAIL_USER }}

          html_body: |
            <h2>QA + Security Pipeline Results</h2>

            <p>
              <strong>Integration Tests:</strong>
              Detailed Cypress report with actual test/spec
              results, failures, durations, and diagnostics
              is attached.
            </p>

            <p>
              <strong>Performance Tests:</strong>
              Detailed k6 report with actual summary metrics,
              HTTP status distribution, endpoint breakdown,
              checks, thresholds, and raw JSON data is attached.
