name: QA Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
  QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
  SONAR_HOST: ${{ secrets.SONAR_HOST }}
  SONAR_ORG: ${{ secrets.SONAR_ORG }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:

  # ============================================================
  # 1. CYPRESS E2E
  # ============================================================

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d resume_db" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
        env:
          PORT: 3000
          DB_HOST: localhost

      - name: Upload Cypress Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: cypress/reports/

  # ============================================================
  # 2. k6 SMOKE TEST
  # ============================================================

  k6-smoke-test:
    name: k6 Smoke Test
    needs:
      - cypress-e2e
    if: needs.cypress-e2e.result == 'success'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d resume_db" --health-interval 10s --health-timeout 5s --health-retries 5

      wiremock:
        image: wiremock/wiremock:2.35.0
        ports:
          - 8080:8080
        volumes:
          - ./wiremock/mappings:/home/wiremock/mappings

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Application
        env:
          PORT: 3000
          DB_HOST: localhost
          WIREMOCK_URL: http://127.0.0.1:8080
        run: |
          mkdir -p results
          npm start > results/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > results/app.pid
          echo "Application PID: $APP_PID"

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Application is READY."
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited unexpectedly."
              cat results/app.log || true
              exit 1
            fi

            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

      - name: Run k6 Smoke Test
        run: |
          k6 run scripts/k6/smoke-test.js || echo "1" > results/smoke-exit-code.txt

      - name: Upload k6 Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-test-report
          path: results/

  # ============================================================
  # 3. k6 LOAD TEST
  # ============================================================

  k6-load-test:
    name: k6 Load Test
    needs:
      - k6-smoke-test
    if: needs.k6-smoke-test.result == 'success'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d resume_db" --health-interval 10s --health-timeout 5s --health-retries 5

      wiremock:
        image: wiremock/wiremock:2.35.0
        ports:
          - 8080:8080
        volumes:
          - ./wiremock/mappings:/home/wiremock/mappings

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Application
        env:
          PORT: 3000
          DB_HOST: localhost
          WIREMOCK_URL: http://127.0.0.1:8080
          RATE_LIMIT_MAX: "10000"
        run: |
          mkdir -p results
          npm start > results/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > results/app.pid
          echo "Application PID: $APP_PID"

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Application is READY."
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited unexpectedly."
              cat results/app.log || true
              exit 1
            fi

            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

      - name: Run k6 Load Test
        run: |
          k6 run scripts/k6/load-test.js || echo "1" > results/k6-exit-code.txt

      - name: Upload k6 Load Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: results/

  # ============================================================
  # 4. QA PASS / FAIL + UI-WORTHY HTML REPORTS + EMAIL
  # ============================================================

  qa-pass:
    name: QA PASS

    needs:
      - cypress-e2e
      - k6-smoke-test
      - k6-load-test

    if: always()

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download Cypress report
      # ----------------------------------------------------------

      - name: Download Cypress Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: cypress-e2e-report
          path: reports/cypress
        continue-on-error: true

      # ----------------------------------------------------------
      # Download k6 smoke report
      # ----------------------------------------------------------

      - name: Download k6 Smoke Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-smoke-test-report
          path: reports/k6-smoke
        continue-on-error: true

      # ----------------------------------------------------------
      # Download k6 load report
      # ----------------------------------------------------------

      - name: Download k6 load report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-report
          path: reports/k6-load
        continue-on-error: true

      # ----------------------------------------------------------
      # Inspect downloaded artifacts
      # ----------------------------------------------------------

      - name: Inspect Downloaded QA Artifacts
        if: always()
        run: |
          echo "=========================================="
          echo "DOWNLOADED QA ARTIFACTS"
          echo "=========================================="

          find reports \
            -type f \
            -print \
            2>/dev/null || true

      # ----------------------------------------------------------
      # Generate HTML reports
      # ----------------------------------------------------------

      - name: Generate UI-Worthy HTML Stage Reports
        if: always()
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          mkdir -p reports/html

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const env = process.env;

          const repo = env.REPOSITORY || "N/A";
          const branch = env.BRANCH || "N/A";
          const commit = env.COMMIT || "N/A";
          const shortCommit = commit.substring(0, 7);
          const runNumber = env.RUN_NUMBER || "N/A";
          const runId = env.RUN_ID || "N/A";
          const actor = env.ACTOR || "N/A";

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#39;");
          }

          function findFiles(root, predicate) {
            const found = [];

            if (!fs.existsSync(root)) {
              return found;
            }

            function walk(current) {
              let entries = [];

              try {
                entries = fs.readdirSync(current, {
                  withFileTypes: true
                });
              } catch {
                return;
              }

              for (const entry of entries) {
                const full = path.join(current, entry.name);

                if (entry.isDirectory()) {
                  walk(full);
                } else if (predicate(full, entry.name)) {
                  found.push(full);
                }
              }
            }

            walk(root);

            return found;
          }

          function firstFile(root, names) {
            const wanted = new Set(names);

            return findFiles(
              root,
              (_, name) => wanted.has(name)
            )[0] || null;
          }

          function readText(file, fallback = "") {
            if (!file || !fs.existsSync(file)) {
              return fallback;
            }

            try {
              return fs.readFileSync(file, "utf8");
            } catch {
              return fallback;
            }
          }

          function number(value) {
            return Number.isFinite(Number(value))
              ? Number(value)
              : null;
          }

          function formatNumber(value) {
            const n = number(value);

            return n === null
              ? "N/A"
              : n.toLocaleString("en-US");
          }

          function formatMs(value) {
            const n = number(value);

            return n === null
              ? "N/A"
              : `${n.toFixed(2)} ms`;
          }

          function formatPercent(value) {
            const n = number(value);

            return n === null
              ? "N/A"
              : `${(n * 100).toFixed(2)}%`;
          }

          function executionLabel(result) {
            const value = String(
              result || "unknown"
            ).toLowerCase();

            if (value === "success") {
              return "EXECUTION PASSED";
            }

            if (value === "failure") {
              return "EXECUTION FAILED";
            }

            if (value === "skipped") {
              return "SKIPPED";
            }

            return value.toUpperCase();
          }

          function assertionClass(failedChecks) {
            const n = number(failedChecks);

            return n !== null && n > 0
              ? "failure"
              : "success";
          }

          const styles = `
            :root {
              --bg: #0b1220;
              --panel: #111827;
              --panel2: #0f172a;
              --border: #263449;
              --text: #f8fafc;
              --muted: #94a3b8;
              --accent: #38bdf8;
              --good: #34d399;
              --bad: #f87171;
              --warn: #fbbf24;
            }

            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              padding: 28px;
              background: var(--bg);
              color: var(--text);
              font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
              line-height: 1.5;
            }

            .container {
              max-width: 1120px;
              margin: 0 auto;
              background: var(--panel);
              border: 1px solid var(--border);
              border-radius: 18px;
              padding: 28px;
              box-shadow: 0 20px 60px rgba(0,0,0,.35);
            }

            .header {
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 18px;
              border-bottom: 1px solid var(--border);
              padding-bottom: 20px;
            }

            h1 {
              margin: 0;
              font-size: 25px;
            }

            h2 {
              margin: 28px 0 12px;
              font-size: 16px;
            }

            .subtitle {
              color: var(--muted);
              margin-top: 5px;
            }

            .badges {
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              justify-content: flex-end;
            }

            .badge {
              display: inline-flex;
              align-items: center;
              padding: 7px 11px;
              border-radius: 999px;
              border: 1px solid var(--border);
              font-size: 11px;
              font-weight: 800;
              letter-spacing: .05em;
              white-space: nowrap;
            }

            .success {
              color: var(--good);
              background: rgba(52,211,153,.10);
              border-color: rgba(52,211,153,.35);
            }

            .failure {
              color: var(--bad);
              background: rgba(248,113,113,.10);
              border-color: rgba(248,113,113,.35);
            }

            .neutral {
              color: var(--muted);
              background: rgba(148,163,184,.08);
            }

            .meta,
            .cards,
            .stage-grid {
              display: grid;
              gap: 12px;
            }

            .meta {
              grid-template-columns:
                repeat(auto-fit, minmax(190px, 1fr));
              margin-top: 20px;
            }

            .meta-card,
            .metric,
            .stage {
              background: var(--panel2);
              border: 1px solid var(--border);
              border-radius: 12px;
            }

            .meta-card {
              padding: 13px;
            }

            .label {
              display: block;
              color: var(--muted);
              font-size: 10px;
              text-transform: uppercase;
              letter-spacing: .08em;
              margin-bottom: 4px;
            }

            .value {
              font-weight: 700;
              word-break: break-word;
            }

            .cards {
              grid-template-columns:
                repeat(auto-fit, minmax(155px, 1fr));
              margin-top: 18px;
            }

            .metric {
              padding: 16px;
            }

            .metric .value {
              color: var(--accent);
              font-size: 22px;
            }

            .metric.good .value {
              color: var(--good);
            }

            .metric.bad .value {
              color: var(--bad);
            }

            .stage-grid {
              grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            }

            .stage {
              padding: 18px;
            }

            .stage-head {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
              margin-bottom: 14px;
            }

            .stage-title {
              font-weight: 800;
            }

            .stage .cards {
              margin-top: 0;
            }

            .stage .metric {
              padding: 12px;
            }

            .stage .metric .value {
              font-size: 18px;
            }

            details {
              margin-top: 18px;
              border: 1px solid var(--border);
              border-radius: 10px;
              overflow: hidden;
            }

            summary {
              cursor: pointer;
              padding: 12px 14px;
              color: var(--muted);
              font-weight: 700;
            }

            pre {
              margin: 0;
              padding: 16px;
              background: #020617;
              color: #cbd5e1;
              overflow: auto;
              max-height: 520px;
              font-size: 12px;
              white-space: pre-wrap;
              word-break: break-word;
            }

            .footer {
              margin-top: 24px;
              padding-top: 16px;
              border-top: 1px solid var(--border);
              color: var(--muted);
              font-size: 12px;
            }
          `;

          function metric(label, value, className = "") {
            return `
              <div class="metric ${className}">
                <span class="label">
                  ${escapeHtml(label)}
                </span>
                <div class="value">
                  ${escapeHtml(value)}
                </div>
              </div>
            `;
          }

          function meta(label, value) {
            return `
              <div class="meta-card">
                <span class="label">
                  ${escapeHtml(label)}
                </span>
                <div class="value">
                  ${escapeHtml(value)}
                </div>
              </div>
            `;
          }

          function page(title, badges, content, footer) {
            return `
              <!doctype html>

              <html>

              <head>
                <meta charset="utf-8">

                <meta
                  name="viewport"
                  content="width=device-width,initial-scale=1"
                >

                <title>
                  ${escapeHtml(title)}
                </title>

                <style>
                  ${styles}
                </style>
              </head>

              <body>

                <main class="container">

                  <div class="header">

                    <div>

                      <h1>
                        ${escapeHtml(title)}
                      </h1>

                      <div class="subtitle">
                        ${escapeHtml(repo)}
                        ·
                        ${escapeHtml(branch)}
                        ·
                        #${escapeHtml(runNumber)}
                      </div>

                    </div>

                    <div class="badges">
                      ${badges}
                    </div>

                  </div>

                  ${content}

                  <div class="footer">
                    ${footer}
                  </div>

                </main>

              </body>

              </html>
            `;
          }

          // --------------------------------------------------------
          // CYPRESS REPORT
          // --------------------------------------------------------

          const cypressRoot = "reports/cypress";

          const cypressXmlFiles = findFiles(
            cypressRoot,
            (_, name) => name.endsWith(".xml")
          );

          let cypTests = null;
          let cypFailures = null;
          let cypErrors = null;
          let cypSkipped = null;
          let cypTime = null;
          let cypSuites = 0;

          function attr(tag, name) {
            const match = tag.match(
              new RegExp(
                `\\b${name}=["']([^"']*)["']`,
                "i"
              )
            );

            return match
              ? match[1]
              : null;
          }

          for (const xmlFile of cypressXmlFiles) {

            const xml = readText(xmlFile);

            const suiteTags =
              xml.match(/<testsuite\b[^>]*>/gi) || [];

            for (const tag of suiteTags) {

              cypSuites += 1;

              cypTests =
                (cypTests ?? 0) +
                Number(attr(tag, "tests") || 0);

              cypFailures =
                (cypFailures ?? 0) +
                Number(attr(tag, "failures") || 0);

              cypErrors =
                (cypErrors ?? 0) +
                Number(attr(tag, "errors") || 0);

              cypSkipped =
                (cypSkipped ?? 0) +
                Number(attr(tag, "skipped") || 0);

              cypTime =
                (cypTime ?? 0) +
                Number(attr(tag, "time") || 0);
            }
          }

          if (cypTests === 0 && cypressXmlFiles.length > 0) {

            for (const xmlFile of cypressXmlFiles) {

              const xml = readText(xmlFile);

              cypTests =
                (cypTests ?? 0) +
                (xml.match(/<testcase\b/gi) || []).length;

              cypFailures =
                (cypFailures ?? 0) +
                (xml.match(/<failure\b/gi) || []).length;

              cypErrors =
                (cypErrors ?? 0) +
                (xml.match(/<error\b/gi) || []).length;

              cypSkipped =
                (cypSkipped ?? 0) +
                (xml.match(/<skipped\b/gi) || []).length;
            }
          }

          const cypExitFile = firstFile(
            cypressRoot,
            ["cypress-exit-code.txt"]
          );

          const cypLogFile = firstFile(
            cypressRoot,
            ["cypress-run.log"]
          );

          const cypExit =
            readText(cypExitFile, "N/A").trim();

          const cypLog =
            readText(
              cypLogFile,
              "No Cypress console log was captured."
            );

          const cypResult =
            env.CYPRESS_RESULT || "unknown";

          const cypressContent = `

            <div class="meta">

              ${meta(
                "Exit Code",
                cypExit
              )}

              ${meta(
                "JUnit Files",
                String(cypressXmlFiles.length)
              )}

              ${meta(
                "Suites",
                String(cypSuites)
              )}

              ${meta(
                "Triggered By",
                actor
              )}

            </div>

            <div class="cards">

              ${metric(
                "Total Tests",
                formatNumber(cypTests)
              )}

              ${metric(
                "Failures",
                formatNumber(cypFailures),
                cypFailures > 0 ? "bad" : "good"
              )}

              ${metric(
                "Errors",
                formatNumber(cypErrors),
                cypErrors > 0 ? "bad" : "good"
              )}

              ${metric(
                "Skipped",
                formatNumber(cypSkipped)
              )}

              ${metric(
                "Duration",
                cypTime == null
                  ? "N/A"
                  : `${cypTime.toFixed(2)} s`
              )}

            </div>

            <details>

              <summary>
                Execution Console Output
              </summary>

              <pre>
                ${escapeHtml(cypLog)}
              </pre>

            </details>

          `;

          fs.writeFileSync(
            "reports/html/cypress-e2e-report.html",

            page(
              "Cypress E2E Test Execution",

              `
                <span class="badge ${
                  cypResult === "success"
                    ? "success"
                    : "failure"
                }">
                  ${escapeHtml(
                    executionLabel(cypResult)
                  )}
                </span>
              `,

              cypressContent,

              "Cypress metrics are read from the JUnit XML files generated by this exact pipeline run. No test counts or durations are hardcoded."
            )
          );

          // --------------------------------------------------------
          // k6 REPORT
          // --------------------------------------------------------

          function readK6Summary(root, filename) {

            const file =
              firstFile(root, [filename]);

            if (!file) {

              return {
                file: null,
                raw: `No ${filename} was captured.`,
                data: null
              };
            }

            const raw = readText(file);

            try {

              return {
                file,
                raw,
                data: JSON.parse(raw)
              };

            } catch (error) {

              return {
                file,
                raw,
                data: null,
                error: error.message
              };
            }
          }

          function k6Metrics(summary) {

            const metrics =
              summary?.data?.metrics || {};

            const reqs =
              metrics.http_reqs || {};

            const duration =
              metrics.http_req_duration || {};

            const failed =
              metrics.http_req_failed || {};

            const iterations =
              metrics.iterations || {};

            const vus =
              metrics.vus || {};

            const vusMax =
              metrics.vus_max || {};

            const checks =
              metrics.checks || {};

            return {

              requests:
                reqs.count,

              requestRate:
                reqs.rate,

              avg:
                duration.avg,

              p95:
                duration["p(95)"],

              max:
                duration.max,

              min:
                duration.min,

              failedRate:
                failed.value,

              failedRequests:
                failed.passes,

              passedRequests:
                failed.fails,

              iterations:
                iterations.count,

              iterationRate:
                iterations.rate,

              vus:
                vus.value,

              vusMax:
                vusMax.value ?? vusMax.max,

              checksPassed:
                checks.passes,

              checksFailed:
                checks.fails,

              checksRate:
                checks.value
            };
          }

          function k6Status(
            metrics,
            executionResult
          ) {

            if (
              metrics.checksFailed !== undefined &&
              Number(metrics.checksFailed) > 0
            ) {

              return {
                text: "CHECKS FAILED",
                className: "failure"
              };
            }

            if (executionResult === "success") {

              return {
                text: "CHECKS PASSED",
                className: "success"
              };
            }

            return {
              text: "EXECUTION FAILED",
              className: "failure"
            };
          }

          function k6Page(
            title,
            root,
            summaryFile,
            executionResult,
            profile
          ) {

            const summary =
              readK6Summary(
                root,
                summaryFile
              );

            const m =
              k6Metrics(summary);

            const status =
              k6Status(
                m,
                executionResult
              );

            const exitFile =
              firstFile(
                root,

                summaryFile === "summary.json"
                  ? ["k6-exit-code.txt"]
                  : ["smoke-exit-code.txt"]
              );

            const consoleFile =
              firstFile(
                root,

                summaryFile === "summary.json"
                  ? ["k6-console.log"]
                  : ["smoke-console.log"]
              );

            const exitCode =
              readText(
                exitFile,
                "N/A"
              ).trim();

            const consoleLog =
              readText(
                consoleFile,
                "No k6 console log was captured."
              );

            const content = `

              <div class="meta">

                ${meta(
                  "Exit Code",
                  exitCode
                )}

                ${meta(
                  "Requests / sec",
                  m.requestRate == null
                    ? "N/A"
                    : m.requestRate.toFixed(2)
                )}

                ${meta(
                  "Max VUs",
                  formatNumber(m.vusMax)
                )}

                ${meta(
                  "Load Profile",
                  profile
                )}

              </div>

              <div class="cards">

                ${metric(
                  "Total Requests",
                  formatNumber(m.requests)
                )}

                ${metric(
                  "Avg Latency",
                  formatMs(m.avg)
                )}

                ${metric(
                  "P95 Latency",
                  formatMs(m.p95)
                )}

                ${metric(
                  "Max Latency",
                  formatMs(m.max)
                )}

                ${metric(
                  "HTTP Failed Rate",
                  formatPercent(m.failedRate),
                  Number(m.failedRate) > 0
                    ? "bad"
                    : "good"
                )}

                ${metric(
                  "Iterations",
                  formatNumber(m.iterations)
                )}

                ${metric(
                  "Checks Passed",
                  formatNumber(m.checksPassed),
                  "good"
                )}

                ${metric(
                  "Checks Failed",
                  formatNumber(m.checksFailed),
                  Number(m.checksFailed) > 0
                    ? "bad"
                    : "good"
                )}

              </div>

              <details>

                <summary>
                  Execution Console Output
                </summary>

                <pre>
                  ${escapeHtml(consoleLog)}
                </pre>

              </details>

            `;

            return {
              html: page(
                title,

                `
                  <span class="badge ${status.className}">
                    ${escapeHtml(status.text)}
                  </span>
                `,

                content,
                "Metrics are read directly from the k6 summary JSON file generated during this pipeline run."
              ),
              summary
            };
          }

          const smoke = k6Page(
            "k6 Smoke Test Execution",
            "reports/k6-smoke",
            "summary.json",
            env.K6_SMOKE_RESULT,
            "Smoke Profile"
          );

          fs.writeFileSync(
            "reports/html/k6-smoke-report.html",
            smoke.html
          );

          const load = k6Page(
            "k6 Load Test Execution",
            "reports/k6-load",
            "summary.json",
            env.K6_LOAD_RESULT,
            "Load Profile"
          );

          fs.writeFileSync(
            "reports/html/k6-load-report.html",
            load.html
          );

          // --------------------------------------------------------
          // OVERVIEW REPORT
          // --------------------------------------------------------

          const overallStatus =
            env.CYPRESS_RESULT === "success" &&
            env.K6_SMOKE_RESULT === "success" &&
            env.K6_LOAD_RESULT === "success"
              ? { text: "QA PIPELINE PASSED", className: "success" }
              : { text: "QA PIPELINE FAILED", className: "failure" };

          const smokeM = k6Metrics(smoke.summary);
          const loadM = k6Metrics(load.summary);

          const overviewContent = `

            <div class="meta">
              ${meta("Repository", repo)}
              ${meta("Branch", branch)}
              ${meta("Commit", shortCommit)}
              ${meta("Run Number", `#${runNumber}`)}
              ${meta("Triggered By", actor)}
              ${meta("Run ID", runId)}
            </div>

            <h2>Stage Execution Summary</h2>

            <div class="stage-grid">

              <div class="stage">
                <div class="stage-head">
                  <span class="stage-title">Cypress E2E</span>
                  <span class="badge ${env.CYPRESS_RESULT === "success" ? "success" : "failure"}">
                    ${escapeHtml(executionLabel(env.CYPRESS_RESULT))}
                  </span>
                </div>
                <div class="cards">
                  ${metric("Tests", formatNumber(cypTests))}
                  ${metric("Failures", formatNumber(cypFailures), cypFailures > 0 ? "bad" : "good")}
                </div>
              </div>

              <div class="stage">
                <div class="stage-head">
                  <span class="stage-title">k6 Smoke Test</span>
                  <span class="badge ${env.K6_SMOKE_RESULT === "success" ? "success" : "failure"}">
                    ${escapeHtml(executionLabel(env.K6_SMOKE_RESULT))}
                  </span>
                </div>
                <div class="cards">
                  ${metric("Reqs", formatNumber(smokeM.requests))}
                  ${metric("P95", formatMs(smokeM.p95))}
                </div>
              </div>

              <div class="stage">
                <div class="stage-head">
                  <span class="stage-title">k6 Load Test</span>
                  <span class="badge ${env.K6_LOAD_RESULT === "success" ? "success" : "failure"}">
                    ${escapeHtml(executionLabel(env.K6_LOAD_RESULT))}
                  </span>
                </div>
                <div class="cards">
                  ${metric("Reqs", formatNumber(loadM.requests))}
                  ${metric("P95", formatMs(loadM.p95))}
                </div>
              </div>

            </div>

          `;

          fs.writeFileSync(
            "reports/html/index.html",
            page(
              "QA Pipeline Overview",
              `
                <span class="badge ${overallStatus.className}">
                  ${escapeHtml(overallStatus.text)}
                </span>
              `,
              overviewContent,
              "Generated automatically by GitHub Actions workflow."
            )
          );

          console.log("All HTML reports generated successfully.");
          NODE

      # ----------------------------------------------------------
      # Upload HTML Reports Artifact
      # ----------------------------------------------------------

      - name: Upload HTML Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-html-reports
          path: reports/html/

      # ----------------------------------------------------------
      # Send Email Notification
      # ----------------------------------------------------------

      - name: Send QA Email Report
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const nodemailer = require("nodemailer");
          const fs = require("fs");
          const path = require("path");

          const env = process.env;
          if (!env.EMAIL_USER || !env.EMAIL_PASS || !env.QA_EMAIL_TO) {
            console.log("Email credentials or recipient not configured. Skipping email.");
            process.exit(0);
          }

          const transporter = nodemailer.createTransport({
            service: "gmail",
            auth: {
              user: env.EMAIL_USER,
              pass: env.EMAIL_PASS
            }
          });

          const passed =
            env.CYPRESS_RESULT === "success" &&
            env.K6_SMOKE_RESULT === "success" &&
            env.K6_LOAD_RESULT === "success";

          const subject = `${passed ? "✅ QA PASSED" : "❌ QA FAILED"}: ${env.REPOSITORY} (#${env.RUN_ID})`;
          const htmlBody = `
            <h2>QA Pipeline Execution Report</h2>
            <p><b>Repository:</b> ${env.REPOSITORY}</p>
            <p><b>Run ID:</b> ${env.RUN_ID}</p>
            <ul>
              <li><b>Cypress E2E:</b> ${env.CYPRESS_RESULT}</li>
              <li><b>k6 Smoke Test:</b> ${env.K6_SMOKE_RESULT}</li>
              <li><b>k6 Load Test:</b> ${env.K6_LOAD_RESULT}</li>
            </ul>
            <p>Please check the GitHub Actions artifacts for detailed UI-worthy HTML reports.</p>
          `;

          async function sendMail() {
            try {
              await transporter.sendMail({
                from: env.EMAIL_USER,
                to: env.QA_EMAIL_TO,
                cc: env.QA_EMAIL_CC || undefined,
                subject: subject,
                html: htmlBody
              });
              console.log("QA Email report sent successfully.");
            } catch (err) {
              console.error("Failed to send email:", err);
            }
          }

          sendMail();
          NODE