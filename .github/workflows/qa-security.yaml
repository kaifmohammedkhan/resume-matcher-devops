name: QA Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  DB_HOST: 127.0.0.1
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}

jobs:

  # ============================================================
  # 1. CYPRESS E2E
  # ============================================================
  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      # --------------------------------------------------------
      # Verify that REAL Cypress tests exist.
      # We intentionally do NOT create placeholder tests.
      # --------------------------------------------------------
      - name: Verify Cypress E2E Specs
        run: |
          echo "Searching for Cypress E2E specs..."

          if ! find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o -name '*.cy.jsx' \
              -o -name '*.cy.ts' \
              -o -name '*.cy.tsx' \
            \) \
            -print -quit 2>/dev/null | grep -q .; then

            echo ""
            echo "ERROR: No Cypress E2E spec files were found."
            echo ""
            echo "Add real Cypress tests under:"
            echo "  cypress/e2e/"
            echo ""
            echo "Examples:"
            echo "  cypress/e2e/home.cy.js"
            echo "  cypress/e2e/upload-resume.cy.js"
            echo "  cypress/e2e/navigation.cy.js"
            echo ""

            exit 1
          fi

          echo ""
          echo "Cypress E2E specs found:"
          find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o -name '*.cy.jsx' \
              -o -name '*.cy.ts' \
              -o -name '*.cy.tsx' \
            \) \
            -print

      # --------------------------------------------------------
      # Start application
      # --------------------------------------------------------
      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p cypress/reports

          echo "Starting application..."

          npm start > cypress/reports/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > cypress/reports/app.pid

          echo "Application PID: $APP_PID"

          echo "Waiting for application on port 3000..."

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is ready on http://127.0.0.1:3000"
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo ""
              echo "ERROR: Application process exited unexpectedly."
              echo ""
              echo "Application logs:"
              cat cypress/reports/app.log || true
              exit 1
            fi

            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

          echo ""
          echo "ERROR: Application failed to become ready."
          echo ""
          echo "Application logs:"
          cat cypress/reports/app.log || true

          exit 1

      # --------------------------------------------------------
      # Cypress
      # --------------------------------------------------------
      - name: Run Cypress E2E Tests
        id: cypress_tests
        continue-on-error: true
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p cypress/reports

          echo "Running Cypress E2E tests..."

          npx cypress run \
            --browser chrome \
            --headless \
            --reporter junit \
            --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true" \
            2>&1 | tee cypress/reports/cypress-run.log

          CYPRESS_EXIT=${PIPESTATUS[0]}

          echo "Cypress exit code: $CYPRESS_EXIT"

          exit "$CYPRESS_EXIT"

      # --------------------------------------------------------
      # Generate REAL Cypress report from JUnit results
      # --------------------------------------------------------
      - name: Generate Cypress HTML Report
        if: always()
        env:
          CYPRESS_STEP_OUTCOME: ${{ steps.cypress_tests.outcome }}
        run: |
          python3 <<'PYTHON'
          import html
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          REPORT_DIR = Path("cypress/reports")
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          def esc(value):
              return html.escape(
                  str(value if value is not None else "")
              )

          def seconds_text(value):
              try:
                  n = float(value or 0)
              except (TypeError, ValueError):
                  n = 0

              if n < 1:
                  return f"{round(n * 1000)}ms"

              return f"{n:.2f}s"

          def get_suites(root):
              if root.tag == "testsuite":
                  return [root]

              return root.findall(".//testsuite")

          try:

              xml_files = sorted(
                  REPORT_DIR.glob("junit-*.xml")
              )

              suites = []
              tests = []

              total = 0
              passed = 0
              failed = 0
              skipped = 0
              pending = 0

              duration_seconds = 0.0

              for xml_file in xml_files:

                  try:
                      root = ET.parse(xml_file).getroot()
                  except Exception as error:
                      print(
                          f"Could not parse {xml_file}: {error}"
                      )
                      continue

                  for suite in get_suites(root):

                      suite_name = suite.attrib.get(
                          "name",
                          xml_file.name
                      )

                      try:
                          suite_time = float(
                              suite.attrib.get(
                                  "time",
                                  "0"
                              ) or 0
                          )
                      except Exception:
                          suite_time = 0

                      cases = suite.findall("testcase")

                      suite_failed = 0
                      suite_skipped = 0

                      for case in cases:

                          name = case.attrib.get(
                              "name",
                              "Unnamed test"
                          )

                          classname = case.attrib.get(
                              "classname",
                              suite_name
                          )

                          try:
                              case_time = float(
                                  case.attrib.get(
                                      "time",
                                      "0"
                                  ) or 0
                              )
                          except Exception:
                              case_time = 0

                          failure = case.find("failure")
                          skipped_node = case.find("skipped")

                          if failure is not None:

                              state = "failed"
                              suite_failed += 1

                              error_message = (
                                  failure.attrib.get(
                                      "message",
                                      "Test failed"
                                  )
                              )

                              error_stack = (
                                  failure.text or ""
                              )

                              failed += 1

                          elif skipped_node is not None:

                              state = "skipped"
                              suite_skipped += 1
                              skipped += 1

                              error_message = ""
                              error_stack = ""

                          else:

                              state = "passed"
                              passed += 1

                              error_message = ""
                              error_stack = ""

                          total += 1

                          tests.append({
                              "spec": suite_name,
                              "classname": classname,
                              "name": name,
                              "duration": case_time,
                              "state": state,
                              "error_message": error_message,
                              "error_stack": error_stack,
                          })

                      duration_seconds += suite_time

                      suites.append({
                          "name": suite_name,
                          "tests": len(cases),
                          "failures": suite_failed,
                          "skipped": suite_skipped,
                          "duration": suite_time,
                      })

              step_outcome = os.environ.get(
                  "CYPRESS_STEP_OUTCOME",
                  "unknown"
              )

              if total == 0:
                  status = "FAILED"
              elif failed > 0 or step_outcome == "failure":
                  status = "FAILED"
              else:
                  status = "PASSED"

              status_class = (
                  "success"
                  if status == "PASSED"
                  else "danger"
              )

              try:
                  cypress_version = subprocess.check_output(
                      [
                          "npx",
                          "cypress",
                          "version",
                          "--component",
                          "version",
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except Exception:
                  cypress_version = "Unknown"

              try:
                  chrome_version = subprocess.check_output(
                      ["google-chrome", "--version"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except Exception:
                  chrome_version = "Unknown"

              node_version = subprocess.check_output(
                  ["node", "--version"],
                  text=True,
              ).strip()

              timestamp = subprocess.check_output(
                  [
                      "date",
                      "-u",
                      "+%Y-%m-%dT%H:%M:%SZ",
                  ],
                  text=True,
              ).strip()

              run_url = ""

              if (
                  os.environ.get("GITHUB_SERVER_URL")
                  and os.environ.get("GITHUB_REPOSITORY")
                  and os.environ.get("GITHUB_RUN_ID")
              ):
                  run_url = (
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  )

              if suites:

                  suite_rows = "".join(
                      f"""
                      <tr>
                        <td>{esc(s['name'])}</td>
                        <td>{s['tests']}</td>
                        <td class="{
                            'danger-text'
                            if s['failures']
                            else 'success-text'
                        }">
                          {
                            '✗'
                            if s['failures']
                            else '✓'
                          }
                        </td>
                        <td>{s['failures']}</td>
                        <td>{s['skipped']}</td>
                        <td>{seconds_text(s['duration'])}</td>
                      </tr>
                      """
                      for s in suites
                  )

              else:

                  suite_rows = """
                  <tr>
                    <td colspan="6">
                      No Cypress JUnit results were generated.
                    </td>
                  </tr>
                  """

              if tests:

                  test_rows = "".join(
                      f"""
                      <tr>
                        <td>
                          {
                            '✓'
                            if t['state'] == 'passed'
                            else '✗'
                            if t['state'] == 'failed'
                            else '•'
                          }
                        </td>

                        <td>{esc(t['spec'])}</td>
                        <td>{esc(t['name'])}</td>

                        <td>
                          {seconds_text(t['duration'])}
                        </td>

                        <td class="{
                            'danger-text'
                            if t['state'] == 'failed'
                            else
                            'success-text'
                            if t['state'] == 'passed'
                            else
                            'warning-text'
                        }">
                          {esc(t['state'].upper())}
                        </td>
                      </tr>
                      """
                      for t in tests
                  )

              else:

                  test_rows = """
                  <tr>
                    <td colspan="5">
                      No individual Cypress test results available.
                    </td>
                  </tr>
                  """

              failures = [
                  t
                  for t in tests
                  if t["state"] == "failed"
              ]

              if failures:

                  failure_rows = "".join(
                      f"""
                      <div class="failure-box">

                        <h3>✗ {esc(t['name'])}</h3>

                        <p>
                          <strong>Spec:</strong>
                          {esc(t['spec'])}
                        </p>

                        <p>
                          <strong>Duration:</strong>
                          {seconds_text(t['duration'])}
                        </p>

                        <p>
                          <strong>Error:</strong>
                          {esc(
                              t['error_message']
                              or 'Test failed'
                          )}
                        </p>

                        {
                          f"<pre>{esc(t['error_stack'])}</pre>"
                          if t['error_stack']
                          else ""
                        }

                      </div>
                      """
                      for t in failures
                  )

              else:

                  failure_rows = """
                  <p class="success-text">
                    No failed Cypress tests.
                  </p>
                  """

              report = f"""
              <!DOCTYPE html>

              <html>

              <head>

                <meta charset="UTF-8">

                <title>
                  Cypress E2E Test Report
                </title>

                <style>

                  body {{
                    font-family: Arial, sans-serif;
                    margin: 0;
                    background: #0d1117;
                    color: #c9d1d9;
                  }}

                  .container {{
                    max-width: 1450px;
                    margin: 0 auto;
                    padding: 32px;
                  }}

                  .card {{
                    background: #161b22;
                    padding: 24px;
                    border-radius: 10px;
                    border: 1px solid #30363d;
                    margin-bottom: 22px;
                    box-shadow:
                      0 4px 12px rgba(0,0,0,.25);
                  }}

                  h1 {{
                    color: #58a6ff;
                    margin-top: 0;
                  }}

                  h2 {{
                    color: #58a6ff;
                    font-size: 18px;
                    border-bottom:
                      1px solid #30363d;
                    padding-bottom: 8px;
                  }}

                  .meta {{
                    line-height: 1.8;
                  }}

                  .status {{
                    display: inline-block;
                    padding: 8px 14px;
                    border-radius: 6px;
                    font-weight: bold;
                  }}

                  .success {{
                    background: #12351f;
                    color: #3fb950;
                  }}

                  .danger {{
                    background: #3b1717;
                    color: #ff7b72;
                  }}

                  .success-text {{
                    color: #3fb950;
                    font-weight: bold;
                  }}

                  .danger-text {{
                    color: #ff7b72;
                    font-weight: bold;
                  }}

                  .warning-text {{
                    color: #d29922;
                    font-weight: bold;
                  }}

                  .grid {{
                    display: grid;
                    grid-template-columns:
                      repeat(
                        auto-fit,
                        minmax(160px, 1fr)
                      );
                    gap: 12px;
                  }}

                  .stat {{
                    background: #0d1117;
                    border: 1px solid #30363d;
                    padding: 18px;
                    border-radius: 8px;
                  }}

                  .label {{
                    color: #8b949e;
                    font-size: 12px;
                    text-transform: uppercase;
                  }}

                  .value {{
                    font-size: 25px;
                    margin-top: 6px;
                    font-weight: bold;
                  }}

                  table {{
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 12px;
                    font-size: 14px;
                  }}

                  th,
                  td {{
                    border:
                      1px solid #30363d;
                    padding: 10px 12px;
                    text-align: left;
                    vertical-align: top;
                  }}

                  th {{
                    background: #21262d;
                    color: #f0f6fc;
                  }}

                  tr:nth-child(even) {{
                    background: #1b2028;
                  }}

                  .failure-box {{
                    border:
                      1px solid #6e2020;
                    background: #210f0f;
                    padding: 16px;
                    margin: 12px 0;
                    border-radius: 8px;
                  }}

                  pre {{
                    white-space: pre-wrap;
                    overflow-wrap: anywhere;
                    background: #0d1117;
                    border:
                      1px solid #30363d;
                    padding: 12px;
                    border-radius: 6px;
                    color: #ff7b72;
                  }}

                  a {{
                    color: #58a6ff;
                  }}

                </style>

              </head>

              <body>

                <div class="container">

                  <div class="card">

                    <h1>
                      Cypress E2E Test Execution Report
                    </h1>

                    <span class="status {status_class}">
                      {
                        '✓'
                        if status == 'PASSED'
                        else '✗'
                      }
                      {status}
                    </span>

                    <div class="meta">

                      <p>
                        <strong>Cypress:</strong>
                        {esc(cypress_version)}
                      </p>

                      <p>
                        <strong>Browser:</strong>
                        {esc(chrome_version)}
                      </p>

                      <p>
                        <strong>Node:</strong>
                        {esc(node_version)}
                      </p>

                      <p>
                        <strong>Execution:</strong>
                        GitHub Actions
                      </p>

                      <p>
                        <strong>Timestamp:</strong>
                        {esc(timestamp)}
                      </p>

                      {
                        f'''
                        <p>
                          <strong>Workflow Run:</strong>
                          <a href="{esc(run_url)}">
                            Open GitHub Actions run
                          </a>
                        </p>
                        '''
                        if run_url
                        else ""
                      }

                    </div>

                  </div>

                  <div class="card">

                    <h2>
                      Test Summary
                    </h2>

                    <div class="grid">

                      <div class="stat">
                        <div class="label">
                          Specs
                        </div>
                        <div class="value">
                          {len(suites)}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Tests
                        </div>
                        <div class="value">
                          {total}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Passed
                        </div>
                        <div class="value success-text">
                          {passed}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Failed
                        </div>
                        <div class="value danger-text">
                          {failed}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Skipped
                        </div>
                        <div class="value warning-text">
                          {skipped}
                        </div>
                      </div>

                      <div class="stat">
                        <div class="label">
                          Duration
                        </div>
                        <div class="value">
                          {seconds_text(duration_seconds)}
                        </div>
                      </div>

                    </div>

                  </div>

                  <div class="card">

                    <h2>
                      Spec Results
                    </h2>

                    <table>

                      <thead>

                        <tr>
                          <th>Spec</th>
                          <th>Tests</th>
                          <th>Status</th>
                          <th>Failed</th>
                          <th>Skipped</th>
                          <th>Duration</th>
                        </tr>

                      </thead>

                      <tbody>
                        {suite_rows}
                      </tbody>

                    </table>

                  </div>

                  <div class="card">

                    <h2>
                      Individual Tests
                    </h2>

                    <table>

                      <thead>

                        <tr>
                          <th></th>
                          <th>Spec</th>
                          <th>Test</th>
                          <th>Duration</th>
                          <th>Status</th>
                        </tr>

                      </thead>

                      <tbody>
                        {test_rows}
                      </tbody>

                    </table>

                  </div>

                  <div class="card">

                    <h2>
                      Failures & Diagnostics
                    </h2>

                    {failure_rows}

                  </div>

                  <div class="card">

                    <h2>
                      Artifacts
                    </h2>

                    <p>
                      Raw JUnit XML, Cypress console output,
                      screenshots, videos and application logs
                      are uploaded by the workflow.
                    </p>

                  </div>

                </div>

              </body>

              </html>
              """

              (
                  REPORT_DIR /
                  "cypress-report.html"
              ).write_text(
                  report,
                  encoding="utf-8"
              )

              print(
                  "Generated "
                  "cypress/reports/cypress-report.html"
              )

              print(
                  f"Cypress results: "
                  f"{total} tests, "
                  f"{passed} passed, "
                  f"{failed} failed, "
                  f"{skipped} skipped."
              )

          except Exception as error:

              print(
                  "Error generating Cypress report:",
                  error
              )

              fallback = f"""
              <!DOCTYPE html>
              <html>
              <body style="
                font-family:Arial;
                background:#0d1117;
                color:#c9d1d9;
                padding:30px
              ">
                <h1>
                  Cypress Report Generation Error
                </h1>

                <pre>
                  {esc(error)}
                </pre>

              </body>
              </html>
              """

              (
                  REPORT_DIR /
                  "cypress-report.html"
              ).write_text(
                  fallback,
                  encoding="utf-8"
              )
          PYTHON

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn

      # --------------------------------------------------------
      # Cypress must pass before k6 starts.
      # --------------------------------------------------------
      - name: Fail Cypress Stage
        if: steps.cypress_tests.outcome == 'failure'
        run: |
          echo "Cypress E2E tests failed."
          exit 1


  # ============================================================
  # 2. k6 LOAD TEST
  #
  # This job starts ONLY after Cypress succeeds.
  # ============================================================
  k6-load-test:
    name: k6 Load Test
    needs: cypress-e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Create Results Directory
        run: |
          mkdir -p results

      # --------------------------------------------------------
      # Install k6 directly on the GitHub runner.
      #
      # This is intentional:
      #
      # npm start
      #      ↓
      # localhost:3000
      #      ↑
      # k6
      #
      # Both are on the same runner/network namespace.
      # --------------------------------------------------------
      - name: Install k6
        run: |
          sudo gpg -k

          sudo apt-get update

          sudo apt-get install -y \
            gnupg \
            ca-certificates \
            curl

          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg \
              --dearmor \
              -o /usr/share/keyrings/k6-archive-keyring.gpg

          echo \
            "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update

          sudo apt-get install -y k6

          k6 version

      # --------------------------------------------------------
      # Start application
      # --------------------------------------------------------
      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          npm start > app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > results/app.pid

          echo "Application PID: $APP_PID"

          echo "Waiting for application on port 3000..."

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is ready."
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then

              echo ""
              echo "ERROR: Application exited unexpectedly."
              echo ""

              cat app.log || true

              exit 1
            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Application failed to start."
          echo ""

          cat app.log || true

          exit 1

      # --------------------------------------------------------
      # Run k6
      # --------------------------------------------------------
      - name: Run k6 Load Test
        id: k6_tests
        continue-on-error: true
        run: |
          echo "Starting k6 load test..."

          k6 run \
            --out json=results/output.json \
            --summary-export=results/summary.json \
            --summary-trend-stats="avg,min,med,max,p(90),p(95),p(99)" \
            tests/load.js

          K6_EXIT=$?

          echo "k6 exit code: $K6_EXIT"

          exit "$K6_EXIT"

      # --------------------------------------------------------
      # Detailed real k6 report
      # --------------------------------------------------------
      - name: Generate Detailed k6 HTML Report
        if: always()
        env:
          K6_STEP_OUTCOME: ${{ steps.k6_tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const RESULTS = 'results';

          function esc(value) {
            return String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
          }

          function number(value) {
            const n = Number(value);

            return Number.isFinite(n)
              ? n
              : null;
          }

          function metric(summary, name) {
            return summary?.metrics?.[name] || {
              values: {}
            };
          }

          function metricValue(summary, name, key) {
            return metric(summary, name)
              .values?.[key];
          }

          function duration(ms) {
            const n = number(ms);

            if (n === null) {
              return 'N/A';
            }

            if (n < 1000) {
              return `${n.toFixed(2)} ms`;
            }

            return `${(n / 1000).toFixed(2)} s`;
          }

          function bytes(value) {
            const n = number(value);

            if (n === null) {
              return 'N/A';
            }

            if (n < 1024) {
              return `${n.toFixed(0)} B`;
            }

            if (n < 1024 * 1024) {
              return `${(n / 1024).toFixed(2)} KiB`;
            }

            if (n < 1024 * 1024 * 1024) {
              return `${(
                n /
                (1024 * 1024)
              ).toFixed(2)} MiB`;
            }

            return `${(
              n /
              (1024 * 1024 * 1024)
            ).toFixed(2)} GiB`;
          }

          function percentage(value) {
            const n = number(value);

            if (n === null) {
              return 'N/A';
            }

            return `${(n * 100).toFixed(2)}%`;
          }

          function reqRate(value) {
            const n = number(value);

            if (n === null) {
              return 'N/A';
            }

            return `${n.toFixed(2)} req/s`;
          }

          function iterRate(value) {
            const n = number(value);

            if (n === null) {
              return 'N/A';
            }

            return `${n.toFixed(2)} iter/s`;
          }

          try {

            let summary = null;

            if (
              fs.existsSync(
                `${RESULTS}/summary.json`
              )
            ) {

              summary = JSON.parse(
                fs.readFileSync(
                  `${RESULTS}/summary.json`,
                  'utf8'
                )
              );

            }

            const httpDuration =
              metric(
                summary,
                'http_req_duration'
              );

            const httpFailed =
              metric(
                summary,
                'http_req_failed'
              );

            const httpReqs =
              metric(
                summary,
                'http_reqs'
              );

            const iterations =
              metric(
                summary,
                'iterations'
              );

            const iterationDuration =
              metric(
                summary,
                'iteration_duration'
              );

            const vus =
              metric(
                summary,
                'vus'
              );

            const vusMax =
              metric(
                summary,
                'vus_max'
              );

            const received =
              metric(
                summary,
                'data_received'
              );

            const sent =
              metric(
                summary,
                'data_sent'
              );

            const checks =
              metric(
                summary,
                'checks'
              );

            const statusCounts = {};
            const endpointCounts = {};
            const errorCounts = {};

            let firstTimestamp = null;
            let lastTimestamp = null;

            let rawHttpPoints = 0;

            if (
              fs.existsSync(
                `${RESULTS}/output.json`
              )
            ) {

              const lines =
                fs.readFileSync(
                  `${RESULTS}/output.json`,
                  'utf8'
                )
                .split(/\r?\n/);

              for (const line of lines) {

                if (!line.trim()) {
                  continue;
                }

                let event;

                try {
                  event = JSON.parse(line);
                } catch {
                  continue;
                }

                const time =
                  event.data?.time;

                if (time) {

                  const timestamp =
                    new Date(time).getTime();

                  if (
                    Number.isFinite(timestamp)
                  ) {

                    firstTimestamp =
                      firstTimestamp === null
                        ? timestamp
                        : Math.min(
                            firstTimestamp,
                            timestamp
                          );

                    lastTimestamp =
                      lastTimestamp === null
                        ? timestamp
                        : Math.max(
                            lastTimestamp,
                            timestamp
                          );
                  }
                }

                if (
                  event.metric !==
                    'http_reqs' ||
                  event.type !== 'Point'
                ) {
                  continue;
                }

                rawHttpPoints++;

                const tags =
                  event.data?.tags || {};

                const status =
                  String(
                    tags.status ||
                    '0'
                  );

                const method =
                  String(
                    tags.method ||
                    'unknown'
                  );

                const endpoint =
                  String(
                    tags.name ||
                    tags.url ||
                    'unknown'
                  );

                const endpointKey =
                  `${method} ${endpoint}`;

                statusCounts[status] =
                  (
                    statusCounts[status] ||
                    0
                  ) + 1;

                if (
                  !endpointCounts[
                    endpointKey
                  ]
                ) {

                  endpointCounts[
                    endpointKey
                  ] = {
                    method,
                    endpoint,
                    requests: 0,
                    failures: 0,
                    statuses: {}
                  };

                }

                const item =
                  endpointCounts[
                    endpointKey
                  ];

                item.requests++;

                item.statuses[status] =
                  (
                    item.statuses[status] ||
                    0
                  ) + 1;

                if (
                  status.startsWith('4') ||
                  status.startsWith('5') ||
                  status === '0'
                ) {

                  item.failures++;

                }

                if (tags.error) {

                  const error =
                    String(tags.error);

                  errorCounts[error] =
                    (
                      errorCounts[error] ||
                      0
                    ) + 1;

                }

                if (tags.error_code) {

                  const errorCode =
                    `error_code=${tags.error_code}`;

                  errorCounts[errorCode] =
                    (
                      errorCounts[errorCode] ||
                      0
                    ) + 1;

                }

              }

            }

            const observedDuration =
              firstTimestamp !== null &&
              lastTimestamp !== null
                ? Math.max(
                    0,
                    lastTimestamp -
                      firstTimestamp
                  )
                : null;

            const statusRows =
              Object.entries(statusCounts)
                .sort(
                  (a, b) =>
                    Number(a[0]) -
                    Number(b[0])
                )
                .map(
                  ([status, count]) => `
                    <tr>
                      <td>${esc(status)}</td>
                      <td>${count}</td>
                      <td>
                        ${
                          rawHttpPoints
                            ? (
                                count /
                                rawHttpPoints *
                                100
                              ).toFixed(2)
                            : '0.00'
                        }%
                      </td>
                    </tr>
                  `
                )
                .join('');

            const endpointRows =
              Object.values(endpointCounts)
                .sort(
                  (a, b) =>
                    b.requests -
                    a.requests
                )
                .map(
                  item => `
                    <tr>

                      <td>
                        ${esc(item.method)}
                      </td>

                      <td>
                        ${esc(item.endpoint)}
                      </td>

                      <td>
                        ${item.requests}
                      </td>

                      <td class="${
                        item.failures
                          ? 'danger-text'
                          : 'success-text'
                      }">
                        ${item.failures}
                      </td>

                      <td>
                        ${
                          Object.entries(
                            item.statuses
                          )
                          .map(
                            ([status, count]) =>
                              `${esc(status)}: ${count}`
                          )
                          .join('<br>')
                        }
                      </td>

                    </tr>
                  `
                )
                .join('');

            const errorRows =
              Object.entries(errorCounts)
                .sort(
                  (a, b) =>
                    b[1] -
                    a[1]
                )
                .map(
                  ([error, count]) => `
                    <tr>
                      <td>
                        ${esc(error)}
                      </td>
                      <td>
                        ${count}
                      </td>
                    </tr>
                  `
                )
                .join('');

            const thresholdRows =
              summary?.metrics
                ? Object.entries(
                    summary.metrics
                  )
                  .flatMap(
                    ([name, data]) =>
                      Object.entries(
                        data.thresholds || {}
                      )
                      .map(
                        ([threshold, ok]) => `
                          <tr>

                            <td>
                              ${esc(name)}
                            </td>

                            <td>
                              ${esc(threshold)}
                            </td>

                            <td class="${
                              ok
                                ? 'success-text'
                                : 'danger-text'
                            }">
                              ${
                                ok
                                  ? '✓ PASSED'
                                  : '✗ FAILED'
                              }
                            </td>

                          </tr>
                        `
                      )
                  )
                  .join('')
                : '';

            const thresholdsFailed =
              Object.values(
                summary?.metrics || {}
              ).some(
                metricData =>
                  metricData.thresholds &&
                  Object.values(
                    metricData.thresholds
                  ).some(
                    result =>
                      result === false
                  )
              );

            const httpFailureRate =
              number(
                httpFailed.values?.rate
              );

            const actualHttpFailures =
              number(
                httpFailed.values?.fails
              );

            const hasConnectionFailures =
              Object.keys(errorCounts)
                .length > 0;

            const k6Failed =
              process.env.K6_STEP_OUTCOME ===
                'failure' ||
              thresholdsFailed ||
              (
                actualHttpFailures !== null &&
                actualHttpFailures > 0
              ) ||
              (
                httpFailureRate !== null &&
                httpFailureRate > 0
              ) ||
              hasConnectionFailures;

            const k6Status =
              k6Failed
                ? 'FAILED'
                : 'PASSED';

            const statusClass =
              k6Failed
                ? 'danger'
                : 'success';

            const report = `
            <!DOCTYPE html>

            <html>

            <head>

              <meta charset="UTF-8">

              <title>
                k6 Load Test Report
              </title>

              <style>

                body {
                  font-family:
                    Arial,
                    sans-serif;
                  margin: 0;
                  background:
                    #0d1117;
                  color:
                    #c9d1d9;
                }

                .container {
                  max-width:
                    1500px;
                  margin:
                    0 auto;
                  padding:
                    32px;
                }

                .card {
                  background:
                    #161b22;
                  padding:
                    24px;
                  border-radius:
                    10px;
                  border:
                    1px solid #30363d;
                  margin-bottom:
                    22px;
                  box-shadow:
                    0 4px 12px
                    rgba(0,0,0,.25);
                }

                h1 {
                  color:
                    #f0883e;
                  margin-top:
                    0;
                }

                h2 {
                  color:
                    #58a6ff;
                  font-size:
                    18px;
                  border-bottom:
                    1px solid
                    #30363d;
                  padding-bottom:
                    8px;
                }

                .status {
                  display:
                    inline-block;
                  padding:
                    8px 14px;
                  border-radius:
                    6px;
                  font-weight:
                    bold;
                }

                .success {
                  background:
                    #12351f;
                  color:
                    #3fb950;
                }

                .danger {
                  background:
                    #3b1717;
                  color:
                    #ff7b72;
                }

                .success-text {
                  color:
                    #3fb950;
                  font-weight:
                    bold;
                }

                .danger-text {
                  color:
                    #ff7b72;
                  font-weight:
                    bold;
                }

                .warning-text {
                  color:
                    #d29922;
                  font-weight:
                    bold;
                }

                .meta {
                  line-height:
                    1.8;
                }

                .grid {
                  display:
                    grid;
                  grid-template-columns:
                    repeat(
                      auto-fit,
                      minmax(
                        175px,
                        1fr
                      )
                    );
                  gap:
                    12px;
                }

                .stat {
                  background:
                    #0d1117;
                  border:
                    1px solid
                    #30363d;
                  padding:
                    18px;
                  border-radius:
                    8px;
                }

                .label {
                  color:
                    #8b949e;
                  font-size:
                    12px;
                  text-transform:
                    uppercase;
                }

                .value {
                  font-size:
                    24px;
                  margin-top:
                    6px;
                  font-weight:
                    bold;
                }

                table {
                  width:
                    100%;
                  border-collapse:
                    collapse;
                  margin-top:
                    12px;
                  font-size:
                    14px;
                }

                th,
                td {
                  border:
                    1px solid
                    #30363d;
                  padding:
                    10px 12px;
                  text-align:
                    left;
                  vertical-align:
                    top;
                }

                th {
                  background:
                    #21262d;
                  color:
                    #f0f6fc;
                }

                tr:nth-child(even) {
                  background:
                    #1b2028;
                }

                code {
                  background:
                    #0d1117;
                  padding:
                    2px 5px;
                  border-radius:
                    4px;
                }

              </style>

            </head>

            <body>

              <div class="container">

                <div class="card">

                  <h1>
                    k6 Load Test Execution Report
                  </h1>

                  <span class="status ${statusClass}">
                    ${
                      k6Failed
                        ? '✗ FAILED'
                        : '✓ PASSED'
                    }
                  </span>

                  <div class="meta">

                    <p>
                      <strong>Script:</strong>
                      tests/load.js
                    </p>

                    <p>
                      <strong>Execution:</strong>
                      GitHub Actions
                    </p>

                    <p>
                      <strong>Target:</strong>
                      http://127.0.0.1:3000
                    </p>

                    <p>
                      <strong>Timestamp:</strong>
                      ${esc(
                        new Date()
                          .toISOString()
                      )}
                    </p>

                    <p>
                      <strong>Observed test window:</strong>
                      ${duration(
                        observedDuration
                      )}
                    </p>

                    <p>
                      <strong>Raw HTTP points:</strong>
                      ${rawHttpPoints}
                    </p>

                  </div>

                </div>

                ${
                  summary
                    ? `
                <div class="card">

                  <h2>
                    HTTP Performance
                  </h2>

                  <div class="grid">

                    <div class="stat">
                      <div class="label">
                        HTTP Requests
                      </div>
                      <div class="value">
                        ${
                          metricValue(
                            summary,
                            'http_reqs',
                            'count'
                          ) ?? 'N/A'
                        }
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Request Rate
                      </div>
                      <div class="value">
                        ${reqRate(
                          metricValue(
                            summary,
                            'http_reqs',
                            'rate'
                          )
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Failed Requests
                      </div>
                      <div class="value danger-text">
                        ${
                          actualHttpFailures ??
                          'N/A'
                        }
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Failure Rate
                      </div>
                      <div class="value danger-text">
                        ${percentage(
                          httpFailureRate
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Average
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.avg
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Median
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.med
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P90
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(90)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P95
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(95)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        P99
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.['p(99)']
                        )}
                      </div>
                    </div>

                    <div class="stat">
                      <div class="label">
                        Maximum
                      </div>
                      <div class="value">
                        ${duration(
                          httpDuration
                            .values?.max
                        )}
                      </div>
                    </div>

                  </div>

                </div>

                <div class="card">

                  <h2>
                    Execution Metrics
                  </h2>

                  <table>

                    <tr>
                      <th>Metric</th>
                      <th>Actual Result</th>
                    </tr>

                    <tr>
                      <td>
                        iteration_duration
                      </td>

                      <td>
                        avg=${
                          duration(
                            iterationDuration
                              .values?.avg
                          )
                        },
                        min=${
                          duration(
                            iterationDuration
                              .values?.min
                          )
                        },
                        med=${
                          duration(
                            iterationDuration
                              .values?.med
                          )
                        },
                        max=${
                          duration(
                            iterationDuration
                              .values?.max
                          )
                        },
                        p90=${
                          duration(
                            iterationDuration
                              .values?.['p(90)']
                          )
                        },
                        p95=${
                          duration(
                            iterationDuration
                              .values?.['p(95)']
                          )
                        }
                      </td>

                    </tr>

                    <tr>

                      <td>
                        iterations
                      </td>

                      <td>
                        ${
                          metricValue(
                            summary,
                            'iterations',
                            'count'
                          ) ?? 'N/A'
                        }

                        (

                        ${
                          iterRate(
                            metricValue(
                              summary,
                              'iterations',
                              'rate'
                            )
                          )
                        }

                        )
                      </td>

                    </tr>

                    <tr>

                      <td>
                        vus
                      </td>

                      <td>
                        min=${
                          vus.values?.min ??
                          'N/A'
                        },

                        max=${
                          vus.values?.max ??
                          'N/A'
                        }
                      </td>

                    </tr>

                    <tr>

                      <td>
                        vus_max
                      </td>

                      <td>
                        min=${
                          vusMax.values?.min ??
                          'N/A'
                        },

                        max=${
                          vusMax.values?.max ??
                          'N/A'
                        }
                      </td>

                    </tr>

                  </table>

                </div>

                <div class="card">

                  <h2>
                    Network Metrics
                  </h2>

                  <table>

                    <tr>
                      <th>Metric</th>
                      <th>Actual Result</th>
                    </tr>

                    <tr>
                      <td>
                        data_received
                      </td>

                      <td>
                        ${bytes(
                          received.values?.count
                        )}

                        (

                        ${bytes(
                          received.values?.rate
                        )}

                        /s)
                      </td>

                    </tr>

                    <tr>
                      <td>
                        data_sent
                      </td>

                      <td>
                        ${bytes(
                          sent.values?.count
                        )}

                        (

                        ${bytes(
                          sent.values?.rate
                        )}

                        /s)
                      </td>

                    </tr>

                  </table>

                </div>

                <div class="card">

                  <h2>
                    HTTP Status Distribution
                  </h2>

                  <table>

                    <tr>
                      <th>Status</th>
                      <th>Requests</th>
                      <th>Percentage</th>
                    </tr>

                    ${
                      statusRows ||
                      `
                      <tr>
                        <td colspan="3">
                          No HTTP samples
                          were available.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>

                <div class="card">

                  <h2>
                    Endpoint Breakdown
                  </h2>

                  <table>

                    <tr>
                      <th>Method</th>
                      <th>Endpoint / Name</th>
                      <th>Requests</th>
                      <th>Failures</th>
                      <th>Status Codes</th>
                    </tr>

                    ${
                      endpointRows ||
                      `
                      <tr>
                        <td colspan="5">
                          No endpoint samples
                          were available.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>

                <div class="card">

                  <h2>
                    Checks
                  </h2>

                  <table>

                    <tr>
                      <th>Metric</th>
                      <th>Pass Rate</th>
                      <th>Passes</th>
                      <th>Fails</th>
                    </tr>

                    <tr>

                      <td>
                        checks
                      </td>

                      <td>
                        ${percentage(
                          checks.values?.rate
                        )}
                      </td>

                      <td>
                        ${
                          checks.values?.passes ??
                          'N/A'
                        }
                      </td>

                      <td class="danger-text">
                        ${
                          checks.values?.fails ??
                          'N/A'
                        }
                      </td>

                    </tr>

                  </table>

                </div>

                <div class="card">

                  <h2>
                    Thresholds
                  </h2>

                  <table>

                    <tr>
                      <th>Metric</th>
                      <th>Threshold</th>
                      <th>Result</th>
                    </tr>

                    ${
                      thresholdRows ||
                      `
                      <tr>
                        <td colspan="3">
                          No thresholds were
                          defined in tests/load.js.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>

                <div class="card">

                  <h2>
                    Errors Observed
                  </h2>

                  <table>

                    <tr>
                      <th>Error</th>
                      <th>Count</th>
                    </tr>

                    ${
                      errorRows ||
                      `
                      <tr>
                        <td colspan="2"
                            class="success-text">
                          No HTTP errors were
                          found in the k6
                          JSON event stream.
                        </td>
                      </tr>
                      `
                    }

                  </table>

                </div>
                `
                    : `
                <div class="card">

                  <h2>
                    k6 Execution Data
                  </h2>

                  <p class="danger-text">
                    summary.json was not generated.
                  </p>

                  <p>
                    k6 may have failed before
                    producing its end-of-test summary.
                  </p>

                  <p>
                    Check output.json,
                    the k6 console log,
                    and app.log.
                  </p>

                </div>
                `
                }

                <div class="card">

                  <h2>
                    Raw Artifacts
                  </h2>

                  <p>
                    <code>summary.json</code>
                    contains the actual k6
                    end-of-test metrics.
                  </p>

                  <p>
                    <code>output.json</code>
                    contains the detailed
                    k6 JSON event stream.
                  </p>

                  <p>
                    <code>app.log</code>
                    contains application
                    startup/runtime logs.
                  </p>

                </div>

              </div>

            </body>

            </html>
            `;

            fs.writeFileSync(
              `${RESULTS}/k6-report.html`,
              report
            );

            console.log(
              'Generated results/k6-report.html'
            );

          } catch (error) {

            console.error(
              'Error generating k6 report:',
              error
            );

            const fallback = `
            <!DOCTYPE html>

            <html>

            <body style="
              font-family:Arial;
              background:#0d1117;
              color:#c9d1d9;
              padding:30px
            ">

              <h1>
                k6 Report Generation Error
              </h1>

              <pre>
                ${esc(
                  error.stack ||
                  error
                )}
              </pre>

            </body>

            </html>
            `;

            fs.writeFileSync(
              `${RESULTS}/k6-report.html`,
              fallback
            );

          }
          NODE

      - name: Upload k6 Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: |
            results/
            app.log
          if-no-files-found: warn

      # --------------------------------------------------------
      # k6 must actually pass.
      # --------------------------------------------------------
      - name: Fail k6 Stage
        if: steps.k6_tests.outcome == 'failure'
        run: |
          echo "k6 load test failed."
          echo ""
          echo "Review:"
          echo "  results/k6-report.html"
          echo "  results/summary.json"
          echo "  results/output.json"
          echo "  app.log"
          exit 1


  # ============================================================
  # 3. QA REPORTS
  #
  # Always executes after Cypress + k6 have completed.
  # ============================================================
  qa-reports:
    name: QA Reports
    needs:
      - cypress-e2e
      - k6-load-test
    if: always()
    runs-on: ubuntu-latest

    steps:

      - name: Download Cypress Report
        uses: actions/download-artifact@v4
        with:
          name: cypress-e2e-report
          path: reports/cypress
        continue-on-error: true

      - name: Download k6 Report
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-report
          path: reports/k6
        continue-on-error: true

      - name: Generate QA Summary
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_RESULT: ${{ needs.k6-load-test.result }}
        run: |
          mkdir -p reports

          cat > reports/qa-summary.html <<EOF
          <!DOCTYPE html>

          <html>

          <head>

            <meta charset="UTF-8">

            <title>
              QA Pipeline Summary
            </title>

            <style>

              body {
                font-family:
                  Arial,
                  sans-serif;
                margin: 0;
                background:
                  #0d1117;
                color:
                  #c9d1d9;
              }

              .container {
                max-width:
                  1000px;
                margin:
                  0 auto;
                padding:
                  40px;
              }

              .card {
                background:
                  #161b22;
                border:
                  1px solid
                  #30363d;
                border-radius:
                  10px;
                padding:
                  24px;
                margin-bottom:
                  20px;
              }

              h1 {
                color:
                  #58a6ff;
              }

              h2 {
                color:
                  #f0883e;
              }

              .status {
                font-size:
                  20px;
                font-weight:
                  bold;
              }

              .passed {
                color:
                  #3fb950;
              }

              .failed {
                color:
                  #ff7b72;
              }

              .neutral {
                color:
                  #d29922;
              }

              table {
                width:
                  100%;
                border-collapse:
                  collapse;
              }

              th,
              td {
                border:
                  1px solid
                  #30363d;
                padding:
                  12px;
                text-align:
                  left;
              }

              th {
                background:
                  #21262d;
              }

              a {
                color:
                  #58a6ff;
              }

            </style>

          </head>

          <body>

            <div class="container">

              <div class="card">

                <h1>
                  QA Pipeline Execution Report
                </h1>

                <p>
                  <strong>Execution:</strong>
                  GitHub Actions
                </p>

                <p>
                  <strong>Timestamp:</strong>
                  $(date -u '+%Y-%m-%dT%H:%M:%SZ')
                </p>

                <p>
                  <strong>Workflow:</strong>
                  $GITHUB_WORKFLOW
                </p>

                <p>
                  <strong>Run:</strong>
                  #$GITHUB_RUN_NUMBER
                </p>

              </div>

              <div class="card">

                <h2>
                  QA Pipeline Stages
                </h2>

                <table>

                  <tr>
                    <th>Stage</th>
                    <th>Result</th>
                  </tr>

                  <tr>

                    <td>
                      Cypress E2E
                    </td>

                    <td class="$(
                      if [ "$CYPRESS_RESULT" = "success" ];
                      then echo passed;
                      elif [ "$CYPRESS_RESULT" = "failure" ];
                      then echo failed;
                      else echo neutral;
                      fi
                    )">

                      $CYPRESS_RESULT

                    </td>

                  </tr>

                  <tr>

                    <td>
                      k6 Load Test
                    </td>

                    <td class="$(
                      if [ "$K6_RESULT" = "success" ];
                      then echo passed;
                      elif [ "$K6_RESULT" = "failure" ];
                      then echo failed;
                      else echo neutral;
                      fi
                    )">

                      $K6_RESULT

                    </td>

                  </tr>

                </table>

              </div>

              <div class="card">

                <h2>
                  Reports
                </h2>

                <ul>

                  <li>
                    Cypress E2E:
                    <code>
                      reports/cypress/
                    </code>
                  </li>

                  <li>
                    k6 Load Test:
                    <code>
                      reports/k6/
                    </code>
                  </li>

                </ul>

              </div>

            </div>

          </body>

          </html>
          EOF

      - name: Upload Combined QA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: reports/
          if-no-files-found: warn

      # --------------------------------------------------------
      # Optional email delivery.
      # Uses the same email secrets already present in the
      # project, but does NOT affect Cypress/k6 execution.
      # --------------------------------------------------------
      - name: Send QA Report Email
        if: always()
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}

          subject: "QA Pipeline Results - Run #${{ github.run_number }}"

          to: "kaifkhanmohammed718@gmail.com"
          from: ${{ secrets.EMAIL_USER }}

          html_body: |
            <h2>QA Pipeline Results</h2>

            <p>
              <strong>Cypress E2E:</strong>
              ${{ needs.cypress-e2e.result }}
            </p>

            <p>
              <strong>k6 Load Test:</strong>
              ${{ needs.k6-load-test.result }}
            </p>

            <p>
              The detailed Cypress and k6 reports are
              available in the GitHub Actions artifacts.
            </p>

          attachments: |
            reports/qa-summary.html
            reports/cypress/cypress-report.html
            reports/k6/k6-report.html