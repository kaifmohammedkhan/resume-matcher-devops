name: QA Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  DB_HOST: 127.0.0.1
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}

jobs:

  # ============================================================
  # 1. CYPRESS E2E
  #
  # Cypress must pass before any k6 testing starts.
  # ============================================================

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            echo "Build script found."
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Verify Cypress Specs
        run: |
          echo "Searching for Cypress E2E specs..."

          if ! find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o -name '*.cy.jsx' \
              -o -name '*.cy.ts' \
              -o -name '*.cy.tsx' \
            \) \
            -print -quit 2>/dev/null | grep -q .; then

            echo "ERROR: No Cypress E2E specs found."
            echo "Expected location: cypress/e2e/"
            exit 1
          fi

          echo "Cypress specs found:"
          find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o -name '*.cy.jsx' \
              -o -name '*.cy.ts' \
              -o -name '*.cy.tsx' \
            \) \
            -print

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p cypress/reports

          echo "Starting application..."

          npm start > cypress/reports/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > cypress/reports/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do
            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "=========================================="
              echo "Application is READY"
              echo "URL: http://127.0.0.1:3000"
              echo "=========================================="

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: Application exited unexpectedly."
              cat cypress/reports/app.log || true
              exit 1
            fi

            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

          echo "ERROR: Application failed to become ready."
          cat cypress/reports/app.log || true
          exit 1

      - name: Run Cypress E2E Tests
        id: cypress_tests
        continue-on-error: true
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p cypress/reports

          npx cypress run \
            --browser chrome \
            --headless \
            --reporter junit \
            --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true" \
            2>&1 | tee cypress/reports/cypress-run.log

          CYPRESS_EXIT=${PIPESTATUS[0]}

          echo "$CYPRESS_EXIT" > cypress/reports/cypress-exit-code.txt

          exit "$CYPRESS_EXIT"

      - name: Capture Cypress Diagnostics
        if: always()
        run: |
          mkdir -p cypress/reports

          {
            echo "=========================================="
            echo "Cypress Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "Cypress step outcome:"
            echo "${{ steps.cypress_tests.outcome }}"

            echo ""
            echo "Cypress exit code:"
            cat cypress/reports/cypress-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat cypress/reports/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Cypress Console Log"
            echo "=========================================="

            cat cypress/reports/cypress-run.log 2>/dev/null || true

          } > cypress/reports/diagnostics.log

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn

      - name: Fail Cypress Stage
        if: always() && steps.cypress_tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "Cypress E2E tests FAILED"
          echo "=========================================="
          echo ""
          echo "k6 testing will NOT run."
          echo ""
          echo "Review the cypress-e2e-report artifact."
          exit 1


  # ============================================================
  # 2. k6 SMOKE TEST
  #
  # Runs ONLY after Cypress passes.
  #
  # Purpose:
  #   - Application is reachable
  #   - HTTP 200
  #   - Response < 500ms
  #
  # Target:
  #   http://127.0.0.1:3000
  # ============================================================

  k6-smoke-test:
    name: k6 Smoke Test

    needs:
      - cypress-e2e

    if: needs.cypress-e2e.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6 Script
        run: |
          if [ ! -f tests/load.js ]; then
            echo "ERROR: tests/load.js not found."
            exit 1
          fi

          echo "k6 script:"
          cat tests/load.js

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > results/app.pid

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited unexpectedly."
              cat results/app.log || true
              exit 1
            fi

            echo "Waiting for application... $i/30"
            sleep 2

          done

          echo "Application failed to start."
          cat results/app.log || true
          exit 1

      - name: Run k6 Smoke Test
        id: k6_smoke
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo ""

          set +e

          k6 run \
            --out json=results/smoke-output.json \
            --summary-export=results/smoke-summary.json \
            tests/load.js \
            2>&1 | tee results/smoke-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" > results/smoke-exit-code.txt

          exit "$K6_EXIT"

      - name: Capture Smoke Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Smoke Diagnostics"
            echo "=========================================="

            echo ""
            echo "Step outcome:"
            echo "${{ steps.k6_smoke.outcome }}"

            echo ""
            echo "Exit code:"
            cat results/smoke-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console"
            echo "=========================================="

            cat results/smoke-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/smoke-summary.json 2>/dev/null || true

          } > results/smoke-diagnostics.log

      - name: Upload k6 Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-test-report
          path: results/
          if-no-files-found: warn

      - name: Fail k6 Smoke Stage
        if: always() && steps.k6_smoke.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Load testing will NOT run."
          echo ""
          echo "Review the k6-smoke-test-report artifact."
          exit 1


  # ============================================================
  # 3. k6 LOAD TEST
  #
  # Runs ONLY after:
  #
  # Cypress PASS
  #      ↓
  # k6 Smoke PASS
  #      ↓
  # k6 Load
  #
  # The same tests/load.js script is used.
  #
  # CLI controls the load:
  #
  #   --vus 10
  #   --duration 30s
  #
  # ============================================================

  k6-load-test:
    name: k6 Load Test

    needs:
      - k6-smoke-test

    if: needs.k6-smoke-test.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > results/app.pid

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited unexpectedly."
              cat results/app.log || true
              exit 1
            fi

            echo "Waiting for application... $i/30"
            sleep 2

          done

          echo "Application failed to start."
          cat results/app.log || true
          exit 1

      - name: Verify Application Before Load Test
        run: |
          HTTP_STATUS=$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:3000/ \
              || true
          )

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "000" ]; then
            echo "ERROR: Application is unreachable."
            cat results/app.log || true
            exit 1
          fi

          echo "Application is reachable."
          echo "Target: http://127.0.0.1:3000"


      - name: Run k6 Load Test
        id: k6_load
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo "Virtual Users: 10"
          echo "Duration: 30 seconds"
          echo ""

          set +e

          k6 run \
            --vus 10 \
            --duration 30s \
            --out json=results/output.json \
            --summary-export=results/summary.json \
            tests/load.js \
            2>&1 | tee results/k6-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" > results/k6-exit-code.txt

          echo ""
          echo "k6 exit code: $K6_EXIT"

          exit "$K6_EXIT"


      - name: Capture Load Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Load Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "k6 step outcome:"
            echo "${{ steps.k6_load.outcome }}"

            echo ""
            echo "k6 exit code:"
            cat results/k6-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console Log"
            echo "=========================================="

            cat results/k6-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/summary.json 2>/dev/null || true

          } > results/diagnostics.log


      - name: Upload k6 Load Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: results/
          if-no-files-found: warn


      - name: Fail k6 Load Stage
        if: always() && steps.k6_load.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Review:"
          echo "  results/summary.json"
          echo "  results/output.json"
          echo "  results/k6-console.log"
          echo "  results/diagnostics.log"
          exit 1


  # ============================================================
  # 4. QA PASS
  #
  # This stage always runs so we get one final QA decision.
  #
  # PASS requires:
  #
  #   Cypress      = success
  #   k6 Smoke     = success
  #   k6 Load      = success
  #
  # ============================================================

  qa-pass:
    name: QA PASS

    needs:
      - cypress-e2e
      - k6-smoke-test
      - k6-load-test

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Download Cypress Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: cypress-e2e-report
          path: reports/cypress
        continue-on-error: true

      - name: Download k6 Smoke Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-smoke-test-report
          path: reports/k6-smoke
        continue-on-error: true

      - name: Download k6 Load Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-report
          path: reports/k6-load
        continue-on-error: true

      - name: Generate QA Summary
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}
        run: |
          echo "=========================================="
          echo "FINAL QA RESULT"
          echo "=========================================="
          echo ""

          echo "Cypress E2E : $CYPRESS_RESULT"
          echo "k6 Smoke    : $K6_SMOKE_RESULT"
          echo "k6 Load     : $K6_LOAD_RESULT"
          echo ""

          if [ "$CYPRESS_RESULT" = "success" ] && \
             [ "$K6_SMOKE_RESULT" = "success" ] && \
             [ "$K6_LOAD_RESULT" = "success" ]; then

            echo "=========================================="
            echo "QA PASS"
            echo "=========================================="

            echo "Cypress E2E: PASS"
            echo "k6 Smoke:    PASS"
            echo "k6 Load:     PASS"

            exit 0

          else

            echo "=========================================="
            echo "QA FAIL"
            echo "=========================================="

            echo "Cypress E2E: $CYPRESS_RESULT"
            echo "k6 Smoke:    $K6_SMOKE_RESULT"
            echo "k6 Load:     $K6_LOAD_RESULT"

            exit 1
          fi

      - name: Publish QA Decision
        if: always()
        run: |
          {
            echo "## QA Pipeline Result"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Cypress E2E | ${{ needs.cypress-e2e.result }} |"
            echo "| k6 Smoke | ${{ needs.k6-smoke-test.result }} |"
            echo "| k6 Load | ${{ needs.k6-load-test.result }} |"
            echo ""
            echo "**Pipeline:** Cypress → k6 Smoke → k6 Load → QA"
          } >> "$GITHUB_STEP_SUMMARY"