name: QA Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# ============================================================
# ONLY APPLICATION SECRET USED GLOBALLY
#
# Available repository secrets:
#   EMAIL_PASS
#   EMAIL_USER
#   GOOGLE_API_KEY
#   NVD_API_KEY
#   SONAR_HOST
#   SONAR_ORG
#   SONAR_PROJECT_KEY
#   SONAR_TOKEN
#
# DB_USER / DB_PASS ARE INTENTIONALLY NOT USED.
# ============================================================

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:

  # ============================================================
  # 1. CYPRESS E2E
  #
  # Cypress must pass before any k6 testing starts.
  # ============================================================

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------

      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            echo "Build script found."
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      # ----------------------------------------------------------
      # Verify Cypress Specs
      # ----------------------------------------------------------

      - name: Verify Cypress Specs
        run: |
          echo "Searching for Cypress E2E specs..."

          if ! find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o \
              -name '*.cy.jsx' \
              -o \
              -name '*.cy.ts' \
              -o \
              -name '*.cy.tsx' \
            \) \
            -print -quit 2>/dev/null | grep -q .; then

            echo ""
            echo "ERROR: No Cypress E2E specs found."
            echo "Expected location: cypress/e2e/"
            echo ""
            exit 1
          fi

          echo ""
          echo "Cypress specs found:"
          find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o \
              -name '*.cy.jsx' \
              -o \
              -name '*.cy.ts' \
              -o \
              -name '*.cy.tsx' \
            \) \
            -print

      # ----------------------------------------------------------
      # Start Application
      #
      # IMPORTANT:
      #
      # DB_USER / DB_PASS are intentionally NOT supplied here.
      #
      # PostgreSQL service itself is configured with:
      #
      #   user     = postgres
      #   password = postgres
      #   database = resume_db
      #
      # The application must provide/default its own DB credentials.
      # ----------------------------------------------------------

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p cypress/reports

          echo "Starting application..."

          npm start > cypress/reports/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > cypress/reports/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "=========================================="
              echo "Application is READY"
              echo "URL: http://127.0.0.1:3000"
              echo "=========================================="

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo ""
              echo "ERROR: Application exited unexpectedly."
              echo ""

              cat cypress/reports/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Application failed to become ready."
          echo ""

          cat cypress/reports/app.log || true

          exit 1

      # ----------------------------------------------------------
      # Cypress
      # ----------------------------------------------------------

      - name: Run Cypress E2E Tests
        id: cypress_tests
        continue-on-error: true
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000
        run: |
          mkdir -p cypress/reports

          npx cypress run \
            --browser chrome \
            --headless \
            --reporter junit \
            --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true" \
            2>&1 | tee cypress/reports/cypress-run.log

          CYPRESS_EXIT=${PIPESTATUS[0]}

          echo "$CYPRESS_EXIT" \
            > cypress/reports/cypress-exit-code.txt

          exit "$CYPRESS_EXIT"

      # ----------------------------------------------------------
      # Diagnostics
      # ----------------------------------------------------------

      - name: Capture Cypress Diagnostics
        if: always()
        run: |
          mkdir -p cypress/reports

          {
            echo "=========================================="
            echo "Cypress Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "Cypress step outcome:"
            echo "${{ steps.cypress_tests.outcome }}"

            echo ""
            echo "Cypress exit code:"
            cat cypress/reports/cypress-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat cypress/reports/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Cypress Console Log"
            echo "=========================================="

            cat cypress/reports/cypress-run.log 2>/dev/null || true

          } > cypress/reports/diagnostics.log

      # ----------------------------------------------------------
      # Upload Cypress Reports
      # ----------------------------------------------------------

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn

      # ----------------------------------------------------------
      # Fail Cypress Stage
      # ----------------------------------------------------------

      - name: Fail Cypress Stage
        if: always() && steps.cypress_tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "Cypress E2E tests FAILED"
          echo "=========================================="
          echo ""
          echo "k6 testing will NOT run."
          echo ""
          echo "Review the cypress-e2e-report artifact."

          exit 1


  # ============================================================
  # 2. k6 SMOKE TEST
  #
  # Runs ONLY after Cypress passes.
  #
  # Purpose:
  #   - Application reachable
  #   - HTTP 200
  #   - Response time < 500ms
  #
  # Target:
  #   http://127.0.0.1:3000
  # ============================================================

  k6-smoke-test:
    name: k6 Smoke Test

    needs:
      - cypress-e2e

    if: needs.cypress-e2e.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------

      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      # ----------------------------------------------------------
      # Setup k6
      # ----------------------------------------------------------

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ----------------------------------------------------------
      # Verify k6 Script
      # ----------------------------------------------------------

      - name: Verify k6 Script
        run: |
          if [ ! -f tests/load.js ]; then
            echo ""
            echo "ERROR: tests/load.js not found."
            echo ""
            exit 1
          fi

          echo ""
          echo "k6 script:"
          echo "tests/load.js"
          echo ""

          cat tests/load.js

      # ----------------------------------------------------------
      # Start Application
      #
      # DB_USER / DB_PASS intentionally omitted.
      # ----------------------------------------------------------

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > results/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo ""
              echo "Application exited unexpectedly."
              echo ""

              cat results/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "Application failed to start."
          echo ""

          cat results/app.log || true

          exit 1

      # ----------------------------------------------------------
      # k6 Smoke
      # ----------------------------------------------------------

      - name: Run k6 Smoke Test
        id: k6_smoke
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo ""

          set +e

          k6 run \
            --out json=results/smoke-output.json \
            --summary-export=results/smoke-summary.json \
            tests/load.js \
            2>&1 | tee results/smoke-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" \
            > results/smoke-exit-code.txt

          exit "$K6_EXIT"

      # ----------------------------------------------------------
      # Diagnostics
      # ----------------------------------------------------------

      - name: Capture Smoke Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Smoke Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "Step outcome:"
            echo "${{ steps.k6_smoke.outcome }}"

            echo ""
            echo "Exit code:"
            cat results/smoke-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console"
            echo "=========================================="

            cat results/smoke-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/smoke-summary.json 2>/dev/null || true

          } > results/smoke-diagnostics.log

      # ----------------------------------------------------------
      # Upload
      # ----------------------------------------------------------

      - name: Upload k6 Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-test-report
          path: results/
          if-no-files-found: warn

      # ----------------------------------------------------------
      # Fail Smoke Stage
      # ----------------------------------------------------------

      - name: Fail k6 Smoke Stage
        if: always() && steps.k6_smoke.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Load testing will NOT run."
          echo ""
          echo "Review the k6-smoke-test-report artifact."

          exit 1


  # ============================================================
  # 3. k6 LOAD TEST
  #
  # Cypress PASS
  #      ↓
  # k6 Smoke PASS
  #      ↓
  # k6 Load
  #
  # CLI controls:
  #   --vus 10
  #   --duration 30s
  # ============================================================

  k6-load-test:
    name: k6 Load Test

    needs:
      - k6-smoke-test

    if: needs.k6-smoke-test.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------

      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      # ----------------------------------------------------------
      # Setup k6
      # ----------------------------------------------------------

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ----------------------------------------------------------
      # Start Application
      #
      # DB_USER / DB_PASS intentionally omitted.
      # ----------------------------------------------------------

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > results/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo ""
              echo "Application exited unexpectedly."
              echo ""

              cat results/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "Application failed to start."
          echo ""

          cat results/app.log || true

          exit 1

      # ----------------------------------------------------------
      # Verify Application
      # ----------------------------------------------------------

      - name: Verify Application Before Load Test
        run: |
          HTTP_STATUS=$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:3000/ \
              || true
          )

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "000" ]; then
            echo ""
            echo "ERROR: Application is unreachable."
            echo ""

            cat results/app.log || true

            exit 1
          fi

          echo ""
          echo "Application is reachable."
          echo "Target: http://127.0.0.1:3000"

      # ----------------------------------------------------------
      # k6 Load
      # ----------------------------------------------------------

      - name: Run k6 Load Test
        id: k6_load
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo "Virtual Users: 10"
          echo "Duration: 30 seconds"
          echo ""

          set +e

          k6 run \
            --vus 10 \
            --duration 30s \
            --out json=results/output.json \
            --summary-export=results/summary.json \
            tests/load.js \
            2>&1 | tee results/k6-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" \
            > results/k6-exit-code.txt

          echo ""
          echo "k6 exit code: $K6_EXIT"

          exit "$K6_EXIT"

      # ----------------------------------------------------------
      # Diagnostics
      # ----------------------------------------------------------

      - name: Capture Load Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Load Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "k6 step outcome:"
            echo "${{ steps.k6_load.outcome }}"

            echo ""
            echo "k6 exit code:"
            cat results/k6-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console Log"
            echo "=========================================="

            cat results/k6-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/summary.json 2>/dev/null || true

          } > results/diagnostics.log

      # ----------------------------------------------------------
      # Upload
      # ----------------------------------------------------------

      - name: Upload k6 Load Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: results/
          if-no-files-found: warn

      # ----------------------------------------------------------
      # Fail Load Stage
      # ----------------------------------------------------------

      - name: Fail k6 Load Stage
        if: always() && steps.k6_load.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Review:"
          echo "  results/summary.json"
          echo "  results/output.json"
          echo "  results/k6-console.log"
          echo "  results/diagnostics.log"

          exit 1


  # ============================================================
  # 4. QA PASS / FAIL + HTML REPORT + EMAIL
  #
  # This job ALWAYS runs.
  #
  # Final decision:
  #
  # Cypress PASS
  #      ↓
  # k6 Smoke PASS
  #      ↓
  # k6 Load PASS
  #      ↓
  # QA PASS
  #
  # Email is sent for BOTH PASS and FAIL.
  # ============================================================

  qa-pass:
    name: QA PASS

    needs:
      - cypress-e2e
      - k6-smoke-test
      - k6-load-test

    if: always()

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download Cypress report
      # ----------------------------------------------------------

      - name: Download Cypress Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: cypress-e2e-report
          path: reports/cypress
        continue-on-error: true

      # ----------------------------------------------------------
      # Download k6 Smoke report
      # ----------------------------------------------------------

      - name: Download k6 Smoke Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-smoke-test-report
          path: reports/k6-smoke
        continue-on-error: true

      # ----------------------------------------------------------
      # Download k6 Load report
      # ----------------------------------------------------------

      - name: Download k6 Load Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-report
          path: reports/k6-load
        continue-on-error: true

      # ----------------------------------------------------------
      # Generate HTML Email Report
      #
      # APP_NAME / ENVIRONMENT are no longer GitHub variables.
      # They are fixed pipeline labels.
      # ----------------------------------------------------------

      - name: Generate HTML QA Report
        if: always()
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}

        run: |
          mkdir -p reports

          if [ "$CYPRESS_RESULT" = "success" ] && \
             [ "$K6_SMOKE_RESULT" = "success" ] && \
             [ "$K6_LOAD_RESULT" = "success" ]; then

            QA_STATUS="PASS"
            QA_STATUS_ICON="✅"

          else

            QA_STATUS="FAIL"
            QA_STATUS_ICON="❌"

          fi

          if [ "$CYPRESS_RESULT" = "success" ]; then
            CYPRESS_CLASS="pass-text"
          else
            CYPRESS_CLASS="fail-text"
          fi

          if [ "$K6_SMOKE_RESULT" = "success" ]; then
            K6_SMOKE_CLASS="pass-text"
          else
            K6_SMOKE_CLASS="fail-text"
          fi

          if [ "$K6_LOAD_RESULT" = "success" ]; then
            K6_LOAD_CLASS="pass-text"
          else
            K6_LOAD_CLASS="fail-text"
          fi

          if [ "$QA_STATUS" = "PASS" ]; then
            QA_CLASS="pass"
          else
            QA_CLASS="fail"
          fi

          cat > reports/qa-email.html <<EOF
          <!DOCTYPE html>
          <html>

          <head>
            <meta charset="UTF-8">

            <style>

              body {
                margin: 0;
                padding: 0;
                background: #f4f6f8;
                font-family: Arial, Helvetica, sans-serif;
                color: #1f2937;
              }

              .container {
                max-width: 760px;
                margin: 30px auto;
                background: #ffffff;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 18px rgba(0,0,0,0.08);
              }

              .header {
                padding: 28px 32px;
                background: #111827;
                color: #ffffff;
              }

              .header h1 {
                margin: 0;
                font-size: 25px;
              }

              .header p {
                margin: 8px 0 0;
                color: #d1d5db;
              }

              .status {
                padding: 25px 32px;
                text-align: center;
                background: #f9fafb;
                border-bottom: 1px solid #e5e7eb;
              }

              .status h2 {
                margin: 0;
                font-size: 30px;
              }

              .status.pass h2 {
                color: #15803d;
              }

              .status.fail h2 {
                color: #b91c1c;
              }

              .content {
                padding: 28px 32px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
              }

              th {
                background: #f3f4f6;
                text-align: left;
                padding: 12px;
                border-bottom: 1px solid #d1d5db;
              }

              td {
                padding: 12px;
                border-bottom: 1px solid #e5e7eb;
              }

              .pass-text {
                color: #15803d;
                font-weight: bold;
              }

              .fail-text {
                color: #b91c1c;
                font-weight: bold;
              }

              .meta {
                background: #f9fafb;
                border-radius: 8px;
                padding: 18px;
                margin-top: 25px;
              }

              .meta p {
                margin: 7px 0;
              }

              .button {
                display: inline-block;
                margin-top: 20px;
                padding: 12px 20px;
                background: #2563eb;
                color: #ffffff !important;
                text-decoration: none;
                border-radius: 7px;
                font-weight: bold;
              }

              .footer {
                padding: 20px 32px;
                background: #f9fafb;
                color: #6b7280;
                font-size: 12px;
              }

            </style>
          </head>

          <body>

            <div class="container">

              <div class="header">
                <h1>Resume Matcher — QA Pipeline</h1>
                <p>QA validation pipeline</p>
              </div>

              <div class="status ${QA_CLASS}">
                <h2>${QA_STATUS_ICON} QA ${QA_STATUS}</h2>
              </div>

              <div class="content">

                <h2>Pipeline Results</h2>

                <table>

                  <tr>
                    <th>Stage</th>
                    <th>Result</th>
                  </tr>

                  <tr>
                    <td>Cypress E2E</td>
                    <td class="${CYPRESS_CLASS}">
                      ${CYPRESS_RESULT}
                    </td>
                  </tr>

                  <tr>
                    <td>k6 Smoke Test</td>
                    <td class="${K6_SMOKE_CLASS}">
                      ${K6_SMOKE_RESULT}
                    </td>
                  </tr>

                  <tr>
                    <td>k6 Load Test</td>
                    <td class="${K6_LOAD_CLASS}">
                      ${K6_LOAD_RESULT}
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <strong>Final QA Decision</strong>
                    </td>

                    <td>
                      <strong>QA ${QA_STATUS}</strong>
                    </td>
                  </tr>

                </table>

                <div class="meta">

                  <p>
                    <strong>Repository:</strong>
                    ${REPOSITORY}
                  </p>

                  <p>
                    <strong>Branch:</strong>
                    ${BRANCH}
                  </p>

                  <p>
                    <strong>Commit:</strong>
                    ${COMMIT}
                  </p>

                  <p>
                    <strong>Run:</strong>
                    #${RUN_NUMBER}
                  </p>

                  <p>
                    <strong>Triggered by:</strong>
                    ${ACTOR}
                  </p>

                </div>

                <a
                  class="button"
                  href="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}">
                  View GitHub Actions Run
                </a>

              </div>

              <div class="footer">
                Automated QA notification generated by GitHub Actions.
              </div>

            </div>

          </body>

          </html>
          EOF

          echo "HTML QA report generated:"
          ls -lh reports/qa-email.html

      # ----------------------------------------------------------
      # Package complete reports
      # ----------------------------------------------------------

      - name: Package QA Reports
        if: always()
        run: |
          mkdir -p reports/archive

          cp \
            reports/qa-email.html \
            reports/archive/qa-email.html

          tar -czf reports/qa-reports.tar.gz \
            reports/cypress \
            reports/k6-smoke \
            reports/k6-load \
            reports/archive/qa-email.html \
            2>/dev/null || true

          echo "QA report archive:"

          ls -lh \
            reports/qa-reports.tar.gz \
            2>/dev/null || true

      # ----------------------------------------------------------
      # GitHub Summary
      # ----------------------------------------------------------

      - name: Publish QA Decision
        if: always()
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

        run: |

          if [ "$CYPRESS_RESULT" = "success" ] && \
             [ "$K6_SMOKE_RESULT" = "success" ] && \
             [ "$K6_LOAD_RESULT" = "success" ]; then

            QA_STATUS="PASS"

          else

            QA_STATUS="FAIL"

          fi

          {
            echo "## QA Pipeline Result"
            echo ""

            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Cypress E2E | $CYPRESS_RESULT |"
            echo "| k6 Smoke | $K6_SMOKE_RESULT |"
            echo "| k6 Load | $K6_LOAD_RESULT |"
            echo "| **Final QA** | **$QA_STATUS** |"

            echo ""
            echo "**Pipeline:** Cypress → k6 Smoke → k6 Load → QA"

            echo ""

            echo "[View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------
      # Upload final reports
      # ----------------------------------------------------------

      - name: Upload Final QA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-final-report
          path: |
            reports/
          if-no-files-found: warn

      # ----------------------------------------------------------
      # SEND HTML EMAIL
      #
      # Uses ONLY the email secrets that actually exist:
      #
      #   EMAIL_USER
      #   EMAIL_PASS
      #
      # No MAIL_* or QA_EMAIL_* variables are required.
      # ----------------------------------------------------------

      - name: Send QA HTML Email
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.EMAIL_USER }}

          password: ${{ secrets.EMAIL_PASS }}

          from: ${{ secrets.EMAIL_USER }}

          to: ${{ secrets.EMAIL_USER }}

          subject: "Resume Matcher - QA Pipeline #${{ github.run_number }} - ${{ needs.cypress-e2e.result == 'success' && needs.k6-smoke-test.result == 'success' && needs.k6-load-test.result == 'success' && 'PASS' || 'FAIL' }}"

          body: |
            QA Pipeline completed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run: #${{ github.run_number }}

            Pipeline:
            Cypress E2E → k6 Smoke → k6 Load → QA

            Cypress: ${{ needs.cypress-e2e.result }}
            k6 Smoke: ${{ needs.k6-smoke-test.result }}
            k6 Load: ${{ needs.k6-load-test.result }}

            View run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          html_body: file://reports/qa-email.html

          attachments: |
            reports/qa-email.html
            reports/qa-reports.tar.gz

# ============================================================
# 4. QA PASS / FAIL + INDIVIDUAL HTML STAGE REPORTS + EMAIL
#
# Generates THREE separate HTML reports:
#
#   1. cypress-e2e-report.html
#   2. k6-smoke-report.html
#   3. k6-load-report.html
#
# Each report contains:
#   - Stage result
#   - Exit code
#   - Application logs
#   - Test console logs
#   - k6 summary where applicable
#
# NO tar.gz archive is created.
#
# Email contains all three HTML reports as separate attachments.
# ============================================================

qa-pass:
  name: QA PASS

  needs:
    - cypress-e2e
    - k6-smoke-test
    - k6-load-test

  if: always()

  runs-on: ubuntu-latest

  steps:

    # ========================================================
    # DOWNLOAD CYPRESS REPORT
    # ========================================================

    - name: Download Cypress Report
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: cypress-e2e-report
        path: reports/cypress
      continue-on-error: true


    # ========================================================
    # DOWNLOAD k6 SMOKE REPORT
    # ========================================================

    - name: Download k6 Smoke Report
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: k6-smoke-test-report
        path: reports/k6-smoke
      continue-on-error: true


    # ========================================================
    # DOWNLOAD k6 LOAD REPORT
    # ========================================================

    - name: Download k6 Load Report
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: k6-load-test-report
        path: reports/k6-load
      continue-on-error: true


    # ========================================================
    # GENERATE INDIVIDUAL HTML REPORTS
    # ========================================================

    - name: Generate Individual HTML Stage Reports
      if: always()
      env:
        CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
        K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
        K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

        REPOSITORY: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ID: ${{ github.run_id }}
        ACTOR: ${{ github.actor }}

      run: |
        set -e

        mkdir -p reports/html

        # ======================================================
        # HTML ESCAPE FUNCTION
        # ======================================================

        escape_html() {
          if [ -f "$1" ]; then
            sed \
              -e 's/\&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              "$1"
          else
            echo "No log file found."
          fi
        }


        # ======================================================
        # COMMON HTML HEADER
        # ======================================================

        generate_header() {
          cat <<EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>$1</title>

          <style>
            body {
              margin: 0;
              padding: 0;
              background: #f4f6f8;
              font-family: Arial, Helvetica, sans-serif;
              color: #1f2937;
            }

            .container {
              max-width: 1100px;
              margin: 30px auto;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            }

            .header {
              padding: 28px 32px;
              background: #111827;
              color: #ffffff;
            }

            .header h1 {
              margin: 0;
              font-size: 26px;
            }

            .header p {
              margin: 8px 0 0;
              color: #d1d5db;
            }

            .status {
              padding: 25px 32px;
              text-align: center;
              border-bottom: 1px solid #e5e7eb;
            }

            .status.pass {
              background: #ecfdf5;
            }

            .status.fail {
              background: #fef2f2;
            }

            .status h2 {
              margin: 0;
              font-size: 30px;
            }

            .pass-text {
              color: #15803d;
              font-weight: bold;
            }

            .fail-text {
              color: #b91c1c;
              font-weight: bold;
            }

            .content {
              padding: 32px;
            }

            .meta {
              background: #f9fafb;
              border-radius: 8px;
              padding: 18px;
              margin-bottom: 28px;
            }

            .meta p {
              margin: 7px 0;
            }

            .section {
              margin-top: 28px;
            }

            .section h2 {
              font-size: 20px;
              border-bottom: 2px solid #e5e7eb;
              padding-bottom: 10px;
            }

            .log {
              background: #111827;
              color: #e5e7eb;
              padding: 18px;
              border-radius: 8px;
              overflow-x: auto;
              white-space: pre-wrap;
              word-break: break-word;
              font-family: Consolas, Monaco, monospace;
              font-size: 13px;
              line-height: 1.5;
              max-height: 650px;
              overflow-y: auto;
            }

            .summary {
              background: #f9fafb;
              border: 1px solid #e5e7eb;
              padding: 18px;
              border-radius: 8px;
              white-space: pre-wrap;
              font-family: Consolas, Monaco, monospace;
              font-size: 13px;
              overflow-x: auto;
            }

            table {
              width: 100%;
              border-collapse: collapse;
            }

            th {
              background: #f3f4f6;
              text-align: left;
              padding: 12px;
              border-bottom: 1px solid #d1d5db;
            }

            td {
              padding: 12px;
              border-bottom: 1px solid #e5e7eb;
            }

            .footer {
              padding: 20px 32px;
              background: #f9fafb;
              color: #6b7280;
              font-size: 12px;
            }
          </style>
        </head>

        <body>
        <div class="container">
        EOF
        }


        # ======================================================
        # CYPRESS E2E HTML REPORT
        # ======================================================

        if [ "$CYPRESS_RESULT" = "success" ]; then
          CYPRESS_STATUS_CLASS="pass"
          CYPRESS_ICON="✅"
        else
          CYPRESS_STATUS_CLASS="fail"
          CYPRESS_ICON="❌"
        fi

        CYPRESS_EXIT_CODE="N/A"

        if [ -f reports/cypress/cypress-exit-code.txt ]; then
          CYPRESS_EXIT_CODE=$(cat reports/cypress/cypress-exit-code.txt)
        fi

        {
          generate_header "Cypress E2E Test Report"

          cat <<EOF
          <div class="header">
            <h1>Cypress E2E Test Report</h1>
            <p>Resume Matcher QA Pipeline</p>
          </div>

          <div class="status $CYPRESS_STATUS_CLASS">
            <h2>$CYPRESS_ICON Cypress E2E — $CYPRESS_RESULT</h2>
          </div>

          <div class="content">

            <div class="meta">
              <p><strong>Stage:</strong> Cypress E2E Tests</p>
              <p><strong>Result:</strong> $CYPRESS_RESULT</p>
              <p><strong>Exit Code:</strong> $CYPRESS_EXIT_CODE</p>
              <p><strong>Repository:</strong> $REPOSITORY</p>
              <p><strong>Branch:</strong> $BRANCH</p>
              <p><strong>Commit:</strong> $COMMIT</p>
              <p><strong>Run:</strong> #$RUN_NUMBER</p>
              <p><strong>Triggered By:</strong> $ACTOR</p>
            </div>

            <div class="section">
              <h2>Application Log</h2>
              <div class="log">
        EOF

          escape_html reports/cypress/app.log

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>Cypress Console Log</h2>
              <div class="log">
        EOF

          escape_html reports/cypress/cypress-run.log

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>Diagnostics</h2>
              <div class="log">
        EOF

          escape_html reports/cypress/diagnostics.log

          cat <<EOF
              </div>
            </div>

          </div>

          <div class="footer">
            Generated by GitHub Actions QA Pipeline.
          </div>

        </div>
        </body>
        </html>
        EOF

        } > reports/html/cypress-e2e-report.html


        # ======================================================
        # k6 SMOKE HTML REPORT
        # ======================================================

        if [ "$K6_SMOKE_RESULT" = "success" ]; then
          SMOKE_STATUS_CLASS="pass"
          SMOKE_ICON="✅"
        else
          SMOKE_STATUS_CLASS="fail"
          SMOKE_ICON="❌"
        fi

        SMOKE_EXIT_CODE="N/A"

        if [ -f reports/k6-smoke/results/smoke-exit-code.txt ]; then
          SMOKE_EXIT_CODE=$(cat reports/k6-smoke/results/smoke-exit-code.txt)
        elif [ -f reports/k6-smoke/smoke-exit-code.txt ]; then
          SMOKE_EXIT_CODE=$(cat reports/k6-smoke/smoke-exit-code.txt)
        fi

        {
          generate_header "k6 Smoke Test Report"

          cat <<EOF
          <div class="header">
            <h1>k6 Smoke Test Report</h1>
            <p>Resume Matcher QA Pipeline</p>
          </div>

          <div class="status $SMOKE_STATUS_CLASS">
            <h2>$SMOKE_ICON k6 Smoke Test — $K6_SMOKE_RESULT</h2>
          </div>

          <div class="content">

            <div class="meta">
              <p><strong>Stage:</strong> k6 Smoke Test</p>
              <p><strong>Result:</strong> $K6_SMOKE_RESULT</p>
              <p><strong>Exit Code:</strong> $SMOKE_EXIT_CODE</p>
              <p><strong>Target:</strong> http://127.0.0.1:3000</p>
              <p><strong>Repository:</strong> $REPOSITORY</p>
              <p><strong>Branch:</strong> $BRANCH</p>
              <p><strong>Commit:</strong> $COMMIT</p>
              <p><strong>Run:</strong> #$RUN_NUMBER</p>
              <p><strong>Triggered By:</strong> $ACTOR</p>
            </div>

            <div class="section">
              <h2>Application Log</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-smoke/results/app.log ]; then
            escape_html reports/k6-smoke/results/app.log
          else
            escape_html reports/k6-smoke/app.log
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>k6 Console Log</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-smoke/results/smoke-console.log ]; then
            escape_html reports/k6-smoke/results/smoke-console.log
          else
            escape_html reports/k6-smoke/smoke-console.log
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>k6 Summary</h2>
              <div class="summary">
          EOF

          if [ -f reports/k6-smoke/results/smoke-summary.json ]; then
            escape_html reports/k6-smoke/results/smoke-summary.json
          else
            escape_html reports/k6-smoke/smoke-summary.json
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>Smoke Diagnostics</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-smoke/results/smoke-diagnostics.log ]; then
            escape_html reports/k6-smoke/results/smoke-diagnostics.log
          else
            escape_html reports/k6-smoke/smoke-diagnostics.log
          fi

          cat <<EOF
              </div>
            </div>

          </div>

          <div class="footer">
            Generated by GitHub Actions QA Pipeline.
          </div>

        </div>
        </body>
        </html>
        EOF

        } > reports/html/k6-smoke-report.html


        # ======================================================
        # k6 LOAD HTML REPORT
        # ======================================================

        if [ "$K6_LOAD_RESULT" = "success" ]; then
          LOAD_STATUS_CLASS="pass"
          LOAD_ICON="✅"
        else
          LOAD_STATUS_CLASS="fail"
          LOAD_ICON="❌"
        fi

        LOAD_EXIT_CODE="N/A"

        if [ -f reports/k6-load/results/k6-exit-code.txt ]; then
          LOAD_EXIT_CODE=$(cat reports/k6-load/results/k6-exit-code.txt)
        elif [ -f reports/k6-load/k6-exit-code.txt ]; then
          LOAD_EXIT_CODE=$(cat reports/k6-load/k6-exit-code.txt)
        fi

        {
          generate_header "k6 Load Test Report"

          cat <<EOF
          <div class="header">
            <h1>k6 Load Test Report</h1>
            <p>Resume Matcher QA Pipeline</p>
          </div>

          <div class="status $LOAD_STATUS_CLASS">
            <h2>$LOAD_ICON k6 Load Test — $K6_LOAD_RESULT</h2>
          </div>

          <div class="content">

            <div class="meta">
              <p><strong>Stage:</strong> k6 Load Test</p>
              <p><strong>Result:</strong> $K6_LOAD_RESULT</p>
              <p><strong>Exit Code:</strong> $LOAD_EXIT_CODE</p>
              <p><strong>Target:</strong> http://127.0.0.1:3000</p>
              <p><strong>Virtual Users:</strong> 10</p>
              <p><strong>Duration:</strong> 30 seconds</p>
              <p><strong>Repository:</strong> $REPOSITORY</p>
              <p><strong>Branch:</strong> $BRANCH</p>
              <p><strong>Commit:</strong> $COMMIT</p>
              <p><strong>Run:</strong> #$RUN_NUMBER</p>
              <p><strong>Triggered By:</strong> $ACTOR</p>
            </div>

            <div class="section">
              <h2>Application Log</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-load/results/app.log ]; then
            escape_html reports/k6-load/results/app.log
          else
            escape_html reports/k6-load/app.log
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>k6 Console Log</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-load/results/k6-console.log ]; then
            escape_html reports/k6-load/results/k6-console.log
          else
            escape_html reports/k6-load/k6-console.log
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>k6 Summary</h2>
              <div class="summary">
          EOF

          if [ -f reports/k6-load/results/summary.json ]; then
            escape_html reports/k6-load/results/summary.json
          else
            escape_html reports/k6-load/summary.json
          fi

          cat <<EOF
              </div>
            </div>

            <div class="section">
              <h2>Load Diagnostics</h2>
              <div class="log">
          EOF

          if [ -f reports/k6-load/results/diagnostics.log ]; then
            escape_html reports/k6-load/results/diagnostics.log
          else
            escape_html reports/k6-load/diagnostics.log
          fi

          cat <<EOF
              </div>
            </div>

          </div>

          <div class="footer">
            Generated by GitHub Actions QA Pipeline.
          </div>

        </div>
        </body>
        </html>
        EOF

        } > reports/html/k6-load-report.html


        # ======================================================
        # SHOW GENERATED REPORTS
        # ======================================================

        echo ""
        echo "=========================================="
        echo "INDIVIDUAL HTML REPORTS"
        echo "=========================================="

        ls -lh reports/html/


    # ========================================================
    # GENERATE FINAL QA SUMMARY HTML
    #
    # This is NOT a replacement for the three stage reports.
    # It is only the overall QA decision.
    # ========================================================

    - name: Generate Final QA HTML Summary
      if: always()
      env:
        CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
        K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
        K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

      run: |
        mkdir -p reports/html

        if [ "$CYPRESS_RESULT" = "success" ] && \
           [ "$K6_SMOKE_RESULT" = "success" ] && \
           [ "$K6_LOAD_RESULT" = "success" ]; then

          QA_STATUS="PASS"
          QA_ICON="✅"
          QA_CLASS="pass"

        else

          QA_STATUS="FAIL"
          QA_ICON="❌"
          QA_CLASS="fail"

        fi

        cat > reports/html/qa-summary.html <<EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>QA Pipeline Summary</title>

          <style>
            body {
              margin: 0;
              padding: 0;
              background: #f4f6f8;
              font-family: Arial, Helvetica, sans-serif;
              color: #1f2937;
            }

            .container {
              max-width: 900px;
              margin: 30px auto;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            }

            .header {
              padding: 30px;
              background: #111827;
              color: #ffffff;
            }

            .header h1 {
              margin: 0;
            }

            .status {
              padding: 30px;
              text-align: center;
            }

            .status.pass {
              background: #ecfdf5;
              color: #15803d;
            }

            .status.fail {
              background: #fef2f2;
              color: #b91c1c;
            }

            .status h2 {
              margin: 0;
              font-size: 34px;
            }

            .content {
              padding: 30px;
            }

            table {
              width: 100%;
              border-collapse: collapse;
            }

            th {
              background: #f3f4f6;
              text-align: left;
              padding: 14px;
            }

            td {
              padding: 14px;
              border-bottom: 1px solid #e5e7eb;
            }

            .pass-text {
              color: #15803d;
              font-weight: bold;
            }

            .fail-text {
              color: #b91c1c;
              font-weight: bold;
            }

            a {
              color: #2563eb;
              text-decoration: none;
              font-weight: bold;
            }

            .footer {
              padding: 20px 30px;
              background: #f9fafb;
              color: #6b7280;
              font-size: 12px;
            }
          </style>
        </head>

        <body>

          <div class="container">

            <div class="header">
              <h1>Resume Matcher — QA Pipeline</h1>
              <p>Cypress → k6 Smoke → k6 Load</p>
            </div>

            <div class="status $QA_CLASS">
              <h2>$QA_ICON QA $QA_STATUS</h2>
            </div>

            <div class="content">

              <h2>Pipeline Results</h2>

              <table>

                <tr>
                  <th>Stage</th>
                  <th>Result</th>
                  <th>HTML Report</th>
                </tr>

                <tr>
                  <td>Cypress E2E</td>
                  <td>$CYPRESS_RESULT</td>
                  <td>
                    <a href="cypress-e2e-report.html">
                      Open Cypress Report
                    </a>
                  </td>
                </tr>

                <tr>
                  <td>k6 Smoke</td>
                  <td>$K6_SMOKE_RESULT</td>
                  <td>
                    <a href="k6-smoke-report.html">
                      Open k6 Smoke Report
                    </a>
                  </td>
                </tr>

                <tr>
                  <td>k6 Load</td>
                  <td>$K6_LOAD_RESULT</td>
                  <td>
                    <a href="k6-load-report.html">
                      Open k6 Load Report
                    </a>
                  </td>
                </tr>

              </table>

            </div>

            <div class="footer">
              Generated by GitHub Actions QA Pipeline.
            </div>

          </div>

        </body>
        </html>
        EOF


    # ========================================================
    # PUBLISH GITHUB SUMMARY
    # ========================================================

    - name: Publish QA Decision
      if: always()
      env:
        CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
        K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
        K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

      run: |

        if [ "$CYPRESS_RESULT" = "success" ] && \
           [ "$K6_SMOKE_RESULT" = "success" ] && \
           [ "$K6_LOAD_RESULT" = "success" ]; then

          QA_STATUS="PASS"

        else

          QA_STATUS="FAIL"

        fi

        {
          echo "## QA Pipeline Result"
          echo ""
          echo "| Stage | Result |"
          echo "|---|---|"
          echo "| Cypress E2E | $CYPRESS_RESULT |"
          echo "| k6 Smoke | $K6_SMOKE_RESULT |"
          echo "| k6 Load | $K6_LOAD_RESULT |"
          echo "| **Final QA** | **$QA_STATUS** |"
          echo ""
          echo "**Pipeline:** Cypress → k6 Smoke → k6 Load → QA"
          echo ""
          echo "### Individual HTML Reports"
          echo ""
          echo "- \`cypress-e2e-report.html\`"
          echo "- \`k6-smoke-report.html\`"
          echo "- \`k6-load-report.html\`"
          echo "- \`qa-summary.html\`"
          echo ""
          echo "[View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        } >> "$GITHUB_STEP_SUMMARY"


    # ========================================================
    # UPLOAD INDIVIDUAL HTML REPORTS
    #
    # NO TAR.GZ
    # ========================================================

    - name: Upload Individual HTML QA Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-html-reports
        path: |
          reports/html/cypress-e2e-report.html
          reports/html/k6-smoke-report.html
          reports/html/k6-load-report.html
          reports/html/qa-summary.html
        if-no-files-found: warn


    # ========================================================
    # SEND HTML EMAIL
    #
    # Email is sent for BOTH PASS and FAIL.
    #
    # Four HTML files are attached separately:
    #
    #   cypress-e2e-report.html
    #   k6-smoke-report.html
    #   k6-load-report.html
    #   qa-summary.html
    #
    # NO TAR.GZ
    # ========================================================

    - name: Send QA HTML Email
      if: always()
      continue-on-error: true
      uses: dawidd6/action-send-mail@v18

      with:

        server_address: ${{ vars.MAIL_SERVER }}

        server_port: ${{ vars.MAIL_PORT }}

        secure: true

        username: ${{ secrets.EMAIL_USER }}

        password: ${{ secrets.EMAIL_PASS }}

        from: ${{ secrets.EMAIL_USER }}

        to: ${{ vars.QA_EMAIL_TO }}

        cc: ${{ vars.QA_EMAIL_CC }}

        subject: "Resume Matcher - QA Pipeline #${{ github.run_number }} - ${{ needs.cypress-e2e.result == 'success' && needs.k6-smoke-test.result == 'success' && needs.k6-load-test.result == 'success' && 'PASS' || 'FAIL' }}"

        body: |
          QA Pipeline completed.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Run: #${{ github.run_number }}

          Pipeline:
          Cypress E2E → k6 Smoke → k6 Load → QA

          Cypress E2E: ${{ needs.cypress-e2e.result }}
          k6 Smoke:    ${{ needs.k6-smoke-test.result }}
          k6 Load:     ${{ needs.k6-load-test.result }}

          Individual HTML reports are attached:

          - Cypress E2E HTML Report
          - k6 Smoke HTML Report
          - k6 Load HTML Report
          - Overall QA Summary HTML Report

          View GitHub Actions run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

        html_body: file://reports/html/qa-summary.html

        attachments: |
          reports/html/cypress-e2e-report.html
          reports/html/k6-smoke-report.html
          reports/html/k6-load-report.html
          reports/html/qa-summary.html


    # ========================================================
    # FINAL QA GATE
    #
    # MUST BE LAST.
    #
    # Reporting/email does not affect QA decision.
    # ========================================================

    - name: Final QA Gate
      if: always()
      env:
        CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
        K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
        K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

      run: |

        echo "=========================================="
        echo "FINAL QA GATE"
        echo "=========================================="

        echo ""
        echo "Cypress E2E : $CYPRESS_RESULT"
        echo "k6 Smoke    : $K6_SMOKE_RESULT"
        echo "k6 Load     : $K6_LOAD_RESULT"
        echo ""

        if [ "$CYPRESS_RESULT" = "success" ] && \
           [ "$K6_SMOKE_RESULT" = "success" ] && \
           [ "$K6_LOAD_RESULT" = "success" ]; then

          echo "=========================================="
          echo "QA PASS"
          echo "=========================================="

          echo "Cypress E2E: PASS"
          echo "k6 Smoke:    PASS"
          echo "k6 Load:     PASS"

          exit 0

        else

          echo "=========================================="
          echo "QA FAIL"
          echo "=========================================="

          echo "Cypress E2E: $CYPRESS_RESULT"
          echo "k6 Smoke:    $K6_SMOKE_RESULT"
          echo "k6 Load:     $K6_LOAD_RESULT"

          exit 1

        fi