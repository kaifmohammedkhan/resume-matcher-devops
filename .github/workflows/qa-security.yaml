name: QA Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
  QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
  SONAR_HOST: ${{ secrets.SONAR_HOST }}
  SONAR_ORG: ${{ secrets.SONAR_ORG }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:

  # ============================================================
  # 1. CYPRESS E2E
  # ============================================================

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            echo "Build script found."
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Verify Cypress Specs
        run: |
          echo "Searching for Cypress E2E specs..."

          if ! find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o \
              -name '*.cy.jsx' \
              -o \
              -name '*.cy.ts' \
              -o \
              -name '*.cy.tsx' \
            \) \
            -print -quit 2>/dev/null | grep -q .; then

            echo ""
            echo "ERROR: No Cypress E2E specs found."
            echo "Expected location: cypress/e2e/"
            echo ""

            exit 1
          fi

          echo ""
          echo "Cypress specs found:"

          find cypress/e2e \
            -type f \
            \( \
              -name '*.cy.js' \
              -o \
              -name '*.cy.jsx' \
              -o \
              -name '*.cy.ts' \
              -o \
              -name '*.cy.tsx' \
            \) \
            -print

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p cypress/reports

          echo "Starting application..."

          npm start > cypress/reports/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > cypress/reports/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "=========================================="
              echo "Application is READY"
              echo "URL: http://127.0.0.1:3000"
              echo "=========================================="

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then

              echo ""
              echo "ERROR: Application exited unexpectedly."
              echo ""

              cat cypress/reports/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "ERROR: Application failed to become ready."
          echo ""

          cat cypress/reports/app.log || true

          exit 1

      - name: Run Cypress E2E Tests
        id: cypress_tests
        continue-on-error: true
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000
        run: |
          mkdir -p cypress/reports

          npx cypress run \
            --browser chrome \
            --headless \
            --reporter junit \
            --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true" \
            2>&1 | tee cypress/reports/cypress-run.log

          CYPRESS_EXIT=${PIPESTATUS[0]}

          echo "$CYPRESS_EXIT" \
            > cypress/reports/cypress-exit-code.txt

          exit "$CYPRESS_EXIT"

      - name: Capture Cypress Diagnostics
        if: always()
        run: |
          mkdir -p cypress/reports

          {
            echo "=========================================="
            echo "Cypress Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "Cypress step outcome:"
            echo "${{ steps.cypress_tests.outcome }}"

            echo ""
            echo "Cypress exit code:"
            cat cypress/reports/cypress-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat cypress/reports/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Cypress Console Log"
            echo "=========================================="

            cat cypress/reports/cypress-run.log 2>/dev/null || true

          } > cypress/reports/diagnostics.log

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail Cypress Stage
        if: always() && steps.cypress_tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "Cypress E2E tests FAILED"
          echo "=========================================="
          echo ""
          echo "k6 testing will NOT run."
          echo ""
          echo "Review the cypress-e2e-report artifact."

          exit 1


  # ============================================================
  # 2. k6 SMOKE TEST
  # ============================================================

  k6-smoke-test:
    name: k6 Smoke Test

    needs:
      - cypress-e2e

    if: needs.cypress-e2e.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6 Script
        run: |
          if [ ! -f tests/load.js ]; then
            echo ""
            echo "ERROR: tests/load.js not found."
            echo ""

            exit 1
          fi

          echo ""
          echo "k6 script:"
          echo "tests/load.js"
          echo ""

          cat tests/load.js

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > results/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then

              echo ""
              echo "Application exited unexpectedly."
              echo ""

              cat results/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "Application failed to start."
          echo ""

          cat results/app.log || true

          exit 1

      - name: Run k6 Smoke Test
        id: k6_smoke
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo ""

          set +e

          k6 run \
            --out json=results/smoke-output.json \
            --summary-export=results/smoke-summary.json \
            tests/load.js \
            2>&1 | tee results/smoke-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" \
            > results/smoke-exit-code.txt

          exit "$K6_EXIT"

      - name: Capture Smoke Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Smoke Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "Step outcome:"
            echo "${{ steps.k6_smoke.outcome }}"

            echo ""
            echo "Exit code:"
            cat results/smoke-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console"
            echo "=========================================="

            cat results/smoke-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/smoke-summary.json 2>/dev/null || true

          } > results/smoke-diagnostics.log

      - name: Upload k6 Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-test-report
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail k6 Smoke Stage
        if: always() && steps.k6_smoke.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 SMOKE TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Load testing will NOT run."
          echo ""
          echo "Review the k6-smoke-test-report artifact."

          exit 1


  # ============================================================
  # 3. k6 LOAD TEST
  # ============================================================

  k6-load-test:
    name: k6 Load Test

    needs:
      - k6-smoke-test

    if: needs.k6-smoke-test.result == 'success'

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d resume_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Application
        env:
          PORT: 3000
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p results

          npm start > results/app.log 2>&1 &

          APP_PID=$!

          echo "$APP_PID" > results/app.pid

          echo "Application PID: $APP_PID"

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Application is READY."

              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then

              echo ""
              echo "Application exited unexpectedly."
              echo ""

              cat results/app.log || true

              exit 1
            fi

            echo "Waiting for application... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "Application failed to start."
          echo ""

          cat results/app.log || true

          exit 1

      - name: Verify Application Before Load Test
        run: |
          HTTP_STATUS=$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:3000/ \
              || true
          )

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "000" ]; then

            echo ""
            echo "ERROR: Application is unreachable."
            echo ""

            cat results/app.log || true

            exit 1
          fi

          echo ""
          echo "Application is reachable."
          echo "Target: http://127.0.0.1:3000"

      - name: Run k6 Load Test
        id: k6_load
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST"
          echo "=========================================="
          echo ""
          echo "Target: http://127.0.0.1:3000"
          echo "Virtual Users: 10"
          echo "Duration: 30 seconds"
          echo ""

          set +e

          k6 run \
            --vus 10 \
            --duration 30s \
            --out json=results/output.json \
            --summary-export=results/summary.json \
            tests/load.js \
            2>&1 | tee results/k6-console.log

          K6_EXIT=${PIPESTATUS[0]}

          set -e

          echo "$K6_EXIT" \
            > results/k6-exit-code.txt

          echo ""
          echo "k6 exit code: $K6_EXIT"

          exit "$K6_EXIT"

      - name: Capture Load Diagnostics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "k6 Load Diagnostics"
            echo "=========================================="

            echo ""
            echo "Timestamp:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'

            echo ""
            echo "k6 step outcome:"
            echo "${{ steps.k6_load.outcome }}"

            echo ""
            echo "k6 exit code:"
            cat results/k6-exit-code.txt 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "Application Log"
            echo "=========================================="

            cat results/app.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Console Log"
            echo "=========================================="

            cat results/k6-console.log 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "k6 Summary"
            echo "=========================================="

            cat results/summary.json 2>/dev/null || true

          } > results/diagnostics.log

      - name: Upload k6 Load Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail k6 Load Stage
        if: always() && steps.k6_load.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "k6 LOAD TEST FAILED"
          echo "=========================================="
          echo ""
          echo "Review:"
          echo "  results/summary.json"
          echo "  results/output.json"
          echo "  results/k6-console.log"
          echo "  results/diagnostics.log"

          exit 1


  # ============================================================
  # 4. QA PASS / FAIL + LOG-DRIVEN HTML REPORTS + EMAIL
  # ============================================================

  qa-pass:
    name: QA PASS

    needs:
      - cypress-e2e
      - k6-smoke-test
      - k6-load-test

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Download Cypress Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: cypress-e2e-report
          path: reports/cypress
        continue-on-error: true

      - name: Download k6 Smoke Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-smoke-test-report
          path: reports/k6-smoke
        continue-on-error: true

      - name: Download k6 Load Report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-report
          path: reports/k6-load
        continue-on-error: true

      - name: Inspect Downloaded QA Artifacts
        if: always()
        run: |
          echo "=========================================="
          echo "DOWNLOADED QA ARTIFACTS"
          echo "=========================================="

          find reports \
            -type f \
            -print \
            2>/dev/null || true

      - name: Generate Individual HTML Stage Reports
        if: always()
        env:
          CYPRESS_RESULT: ${{ needs.cypress-e2e.result }}
          K6_SMOKE_RESULT: ${{ needs.k6-smoke-test.result }}
          K6_LOAD_RESULT: ${{ needs.k6-load-test.result }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          mkdir -p reports/html

          # -----------------------------------------------------------------
          # 1. CYPRESS HTML REPORT GENERATOR (LOG-DRIVEN)
          # -----------------------------------------------------------------
          CYP_LOG="reports/cypress/cypress-run.log"
          CYP_EXIT_CODE=$(cat reports/cypress/cypress-exit-code.txt 2>/dev/null || echo "Unknown")
          
          cat << 'EOF' > reports/html/cypress-e2e-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Cypress E2E Test Report</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
                  .container { max-width: 900px; margin: auto; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
                  h1 { font-size: 1.5rem; border-bottom: 2px solid #334155; padding-bottom: 0.75rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
                  .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; }
                  .success { background: #065f46; color: #6ee7b7; }
                  .failure { background: #991b1b; color: #fca5a5; }
                  .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1.5rem 0; background: #0f172a; padding: 1rem; border-radius: 8px; }
                  .meta-item span { color: #94a3b8; display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.25rem; }
                  pre { background: #0b0f19; color: #38bdf8; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; max-height: 400px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>
                      Cypress E2E Test Execution
                      <span class="badge ${{ env.CYPRESS_RESULT == 'success' && 'success' || 'failure' }}">${{ env.CYPRESS_RESULT }}</span>
                  </h1>
                  <div class="meta-grid">
                      <div class="meta-item"><span>Repository</span><b>${{ env.REPOSITORY }}</b></div>
                      <div class="meta-item"><span>Branch / Commit</span><b>${{ env.BRANCH }} (${{ env.COMMIT }})</b></div>
                      <div class="meta-item"><span>Pipeline Run #</span><b>#${{ env.RUN_NUMBER }}</b></div>
                      <div class="meta-item"><span>Exit Code</span><b>${{ CYP_EXIT_CODE }}</b></div>
                  </div>
                  <h3>Execution Logs / Output:</h3>
                  <pre><code>$(cat "$CYP_LOG" 2>/dev/null || echo "No Cypress log file captured.")</code></pre>
              </div>
          </body>
          </html>
          EOF

          # -----------------------------------------------------------------
          # 2. k6 SMOKE HTML REPORT GENERATOR (LOG-DRIVEN)
          # -----------------------------------------------------------------
          SMOKE_SUMMARY="reports/k6-smoke/smoke-summary.json"
          SMOKE_EXIT=$(cat reports/k6-smoke/smoke-exit-code.txt 2>/dev/null || echo "Unknown")
          
          SMOKE_METRICS="Check reports artifact JSON for deep metrics breakdown."
          if [ -f "$SMOKE_SUMMARY" ]; then
            SMOKE_METRICS=$(cat "$SMOKE_SUMMARY")
          fi

          cat << EOF > reports/html/k6-smoke-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>k6 Smoke Test Report</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
                  .container { max-width: 900px; margin: auto; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
                  h1 { font-size: 1.5rem; border-bottom: 2px solid #334155; padding-bottom: 0.75rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
                  .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; }
                  .success { background: #065f46; color: #6ee7b7; }
                  .failure { background: #991b1b; color: #fca5a5; }
                  .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1.5rem 0; background: #0f172a; padding: 1rem; border-radius: 8px; }
                  .meta-item span { color: #94a3b8; display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.25rem; }
                  pre { background: #0b0f19; color: #38bdf8; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; max-height: 400px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>
                      k6 Smoke Test Execution
                      <span class="badge ${{ env.K6_SMOKE_RESULT == 'success' && 'success' || 'failure' }}">${{ env.K6_SMOKE_RESULT }}</span>
                  </h1>
                  <div class="meta-grid">
                      <div class="meta-item"><span>Pipeline Run #</span><b>#${{ env.RUN_NUMBER }}</b></div>
                      <div class="meta-item"><span>Exit Code</span><b>${{ SMOKE_EXIT }}</b></div>
                  </div>
                  <h3>Raw Summary Metrics JSON:</h3>
                  <pre><code>$SMOKE_METRICS</code></pre>
              </div>
          </body>
          </html>
          EOF

          # -----------------------------------------------------------------
          # 3. k6 LOAD HTML REPORT GENERATOR (LOG-DRIVEN)
          # -----------------------------------------------------------------
          LOAD_SUMMARY="reports/k6-load/summary.json"
          LOAD_EXIT=$(cat reports/k6-load/k6-exit-code.txt 2>/dev/null || echo "Unknown")
          
          LOAD_METRICS="Check reports artifact JSON for deep metrics breakdown."
          if [ -f "$LOAD_SUMMARY" ]; then
            LOAD_METRICS=$(cat "$LOAD_SUMMARY")
          fi

          cat << EOF > reports/html/k6-load-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>k6 Load Test Report</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
                  .container { max-width: 900px; margin: auto; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
                  h1 { font-size: 1.5rem; border-bottom: 2px solid #334155; padding-bottom: 0.75rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
                  .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; }
                  .success { background: #065f46; color: #6ee7b7; }
                  .failure { background: #991b1b; color: #fca5a5; }
                  .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1.5rem 0; background: #0f172a; padding: 1rem; border-radius: 8px; }
                  .meta-item span { color: #94a3b8; display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.25rem; }
                  pre { background: #0b0f19; color: #38bdf8; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; max-height: 400px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>
                      k6 Load Test Execution (10 VUs / 30s)
                      <span class="badge ${{ env.K6_LOAD_RESULT == 'success' && 'success' || 'failure' }}">${{ env.K6_LOAD_RESULT }}</span>
                  </h1>
                  <div class="meta-grid">
                      <div class="meta-item"><span>Pipeline Run #</span><b>#${{ env.RUN_NUMBER }}</b></div>
                      <div class="meta-item"><span>Exit Code</span><b>${{ LOAD_EXIT }}</b></div>
                  </div>
                  <h3>Raw Summary Metrics JSON:</h3>
                  <pre><code>$LOAD_METRICS</code></pre>
              </div>
          </body>
          </html>
          EOF

      # ==========================================================
      # SEND EMAIL NOTIFICATION WITH REPORTS
      # ==========================================================

      - name: Send QA Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          from: ${{ secrets.EMAIL_USER }}
          subject: "QA Pipeline Report [${{ github.ref_name }}] - Run #${{ github.run_number }} (${{ job.status }})"
          to: ${{ secrets.QA_EMAIL_TO }}
          cc: ${{ secrets.QA_EMAIL_CC }}
          body: |
            Hi,

            The QA Pipeline for repository ${{ github.repository }} has finished execution.
            
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Status: ${{ job.status }}

            Please find the attached HTML test reports for Cypress, k6 Smoke, and k6 Load tests.

            Regards,
            QA Automation Pipeline
          attachments: |
            reports/html/*.html