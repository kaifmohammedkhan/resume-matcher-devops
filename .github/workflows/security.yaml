name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  owasp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache OWASP DB
        uses: actions/cache@v4
        with:
          path: $HOME/.dependency-check/data
          key: owasp-db

      - name: Install and Run OWASP Dependency Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          curl -sSLf https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -o /tmp/dc.zip
          unzip -q /tmp/dc.zip -d $HOME/dc
          rm -f /tmp/dc.zip
          npm install --ignore-scripts
          $HOME/dc/dependency-check/bin/dependency-check.sh \
            --project "Resume Matcher" \
            --scan . \
            --exclude "**/node_modules/**" \
            --format HTML \
            --out dependency-check-report.html \
            --nvdApiKey "$NVD_API_KEY" \
            --disableOssIndex

      - name: Upload OWASP Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report.html

      - name: Email OWASP Report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: OWASP Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>OWASP Dependency Check completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: dependency-check-report.html

  trivy-fs:
    needs: [owasp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Trivy HTML Template
        run: curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy FS Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: template
          template: "@html.tpl"
          output: trivy-fs-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy FS Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.html

      - name: Email Trivy FS Report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy FS Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>Trivy filesystem scan completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: trivy-fs-report.html

  sonarcloud:
    needs: [trivy-fs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SonarScanner CLI
        run: |
          curl -sSLf https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip -o sonar-scanner.zip
          unzip -q sonar-scanner.zip -d $HOME
          rm -f sonar-scanner.zip
          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run SonarScanner
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.qualitygate.wait=false

      - name: Export SonarCloud Report
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=$SONAR_PROJECT_KEY&statuses=OPEN,REOPENED&ps=500" \
            -o sonar-report.json

      - name: Convert SonarCloud JSON to HTML Table
        if: always()
        run: |
          echo "<html><body>" > sonar-summary.html
          echo "<h2>SonarCloud Active Issues Report</h2>" >> sonar-summary.html
          echo "<table border='1' cellpadding='5' cellspacing='0' style='border-collapse: collapse; font-family: sans-serif;'>" >> sonar-summary.html
          echo "<tr style='background-color: #f2f2f2;'><th>Rule</th><th>Message</th><th>Severity</th><th>File</th><th>Line</th><th>Action</th></tr>" >> sonar-summary.html
          if jq -e '.issues | length > 0' sonar-report.json >/dev/null 2>&1; then
            jq -r '.issues[] | "<tr><td>\(.rule)</td><td>\(.message)</td><td>\(.severity)</td><td>\(.component)</td><td>\(.line // "N/A")</td><td><a href=\"https://sonarcloud.io/project/issues?id=\(.project)&issues=\(.key)\">View Issue</a></td></tr>"' sonar-report.json >> sonar-summary.html
          else
            echo "<tr><td colspan='6'>No active open or reopened issues found.</td></tr>" >> sonar-summary.html
          fi
          echo "</table>" >> sonar-summary.html
          echo "</body></html>" >> sonar-summary.html

      - name: Upload SonarCloud Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html

      - name: Email SonarCloud Report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: SonarCloud Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>SonarCloud analysis completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: sonar-summary.html

  trivy-img:
    needs: [sonarcloud]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          provenance: false
          sbom: false
          tags: resume-matcher:local

      - name: Display Image Information
        run: |
          docker images resume-matcher:local
          docker history resume-matcher:local
          docker image inspect resume-matcher:local

      - name: Download Trivy HTML Template
        run: curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: resume-matcher:local
          format: template
          template: "@html.tpl"
          output: trivy-img-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy Image Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-img-report
          path: trivy-img-report.html

      - name: Email Trivy Image Report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy Image Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>Trivy image scan completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: trivy-img-report.html