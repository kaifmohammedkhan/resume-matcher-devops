name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  owasp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache OWASP DB
        uses: actions/cache@v4
        with:
          path: $HOME/.dependency-check/data
          key: owasp-db

      - name: Install and Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          curl -sSLf https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -o /tmp/dc.zip
          unzip -q /tmp/dc.zip -d $HOME/dc
          rm -f /tmp/dc.zip
          npm install --ignore-scripts
          $HOME/dc/dependency-check/bin/dependency-check.sh \
            --project "Resume Matcher" \
            --scan . \
            --exclude "**/node_modules/**" \
            --format HTML \
            --out dependency-check-report.html \
            --nvdApiKey "$NVD_API_KEY" \
            --disableOssIndex

      - name: Upload OWASP Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report.html

      - name: Email OWASP Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: OWASP Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>OWASP Dependency Check completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: dependency-check-report.html

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Trivy HTML Template
        run: |
          curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-fs-report.html'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy FS Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.html

      - name: Email Trivy FS Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy FS Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>Trivy filesystem scan completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: trivy-fs-report.html

  trivy-img:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Latest Distroless Runtime
        run: |
          docker pull gcr.io/distroless/nodejs20-debian12:latest

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          provenance: false
          sbom: false
          tags: resume-matcher:local

      - name: Display Image Information
        run: |
          docker images resume-matcher:local
          docker history resume-matcher:local
          docker image inspect resume-matcher:local

      - name: Download Trivy HTML Template
        run: |
          curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: resume-matcher:local
          format: template
          template: "@html.tpl"
          output: trivy-img-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy Image Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-img-report
          path: trivy-img-report.html

      - name: Email Trivy Image Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy Image Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>Trivy image scan completed</h2>
            <p>Build configuration:</p>
            <ul>
              <li>Docker Buildx</li>
              <li>Pull latest base images</li>
              <li>No build cache</li>
              <li>Distroless runtime</li>
            </ul>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: trivy-img-report.html