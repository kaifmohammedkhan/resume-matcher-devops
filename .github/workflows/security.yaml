name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache OWASP DB
        uses: actions/cache@d4323d455462f9ec6911e5e23f22b0f44193c46e # v4.2.3
        with:
          path: $HOME/.dependency-check/data
          key: owasp-db

      - name: Install and Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          curl -sSLf https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -o /tmp/dc.zip
          unzip -q /tmp/dc.zip -d $HOME/dc
          rm -f /tmp/dc.zip
          npm install --ignore-scripts
          $HOME/dc/dependency-check/bin/dependency-check.sh \
            --project "Resume Matcher" \
            --scan . \
            --exclude "**/node_modules/**" \
            --format HTML \
            --out dependency-check-report.html \
            --nvdApiKey "$NVD_API_KEY" \
            --disableOssIndex

      - name: Email OWASP Report
        uses: dawidd6/action-send-mail@1015f3337a288924151740d5b4308ef6186a1005 # v3.15.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: OWASP Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            OWASP Dependency Check completed.
            Summary: see attached report.
          attachments: dependency-check-report.html

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Trivy HTML Template
        run: |
          curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@ed142fd8eebe1c3e34b11f6c449c251407e3bc57 # v0.36.0
        with:
          scan-type: fs
          format: template
          template: '@html.tpl'
          output: trivy-fs-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Email Trivy FS Report
        uses: dawidd6/action-send-mail@1015f3337a288924151740d5b4308ef6186a1005 # v3.15.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy FS Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Trivy filesystem scan completed.
            Summary: see attached report.
          attachments: trivy-fs-report.html

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4e216238b69389e13dccf5f743ee80f08e43e2 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SonarScanner CLI
        run: |
          curl -sSLf https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip -o sonar-scanner.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run SonarScanner
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.qualitygate.wait=false

      - name: Export SonarCloud Report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          curl -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=$SONAR_PROJECT_KEY&statuses=OPEN,REOPENED&ps=500" \
            -o sonar-report.json

      - name: Convert SonarCloud JSON to HTML Table
        run: |
          echo "<html><body>" > sonar-summary.html
          echo "<h2>SonarCloud Active Issues Report</h2>" >> sonar-summary.html
          echo "<table border='1' cellpadding='5' cellspacing='0' style='border-collapse: collapse; font-family: sans-serif;'>" >> sonar-summary.html
          echo "<tr style='background-color: #f2f2f2;'><th>Rule</th><th>Message</th><th>Severity</th><th>File</th><th>Line</th><th>Action</th></tr>" >> sonar-summary.html
          jq -r '.issues[] | "<tr><td>\(.rule)</td><td>\(.message)</td><td>\(.severity)</td><td>\(.component)</td><td>\(.line // "N/A")</td><td><a href=\"https://sonarcloud.io/project/issues?id=\(.project)&issues=\(.key)\">View Issue</a></td></tr>"' sonar-report.json >> sonar-summary.html
          echo "</table>" >> sonar-summary.html
          echo "</body></html>" >> sonar-summary.html

      - name: Email SonarCloud Report
        uses: dawidd6/action-send-mail@1015f3337a288924151740d5b4308ef6186a1005 # v3.15.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: SonarCloud Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            SonarCloud analysis completed.
            Summary: see attached report.
          attachments: sonar-summary.html

  trivy-img:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image
        run: docker build -t resume-matcher:local .

      - name: Download Trivy HTML Template
        run: |
          curl -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@ed142fd8eebe1c3e34b11f6c449c251407e3bc57 # v0.36.0
        with:
          image-ref: resume-matcher:local
          format: template
          template: '@html.tpl'
          output: trivy-img-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Email Trivy Image Report
        uses: dawidd6/action-send-mail@1015f3337a288924151740d5b4308ef6186a1005 # v3.15.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Trivy Image Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Trivy image scan completed.
            Summary: see attached report.
          attachments: trivy-img-report.html