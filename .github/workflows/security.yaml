name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Build
        run: npm run build

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Resume Matcher'
          path: '.'
          format: 'HTML'
          args: >
            --out .

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'trivy-fs-report.html'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.html

  trivy-img:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: resume-matcher:local

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'resume-matcher:local'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'trivy-img-report.html'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Image Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-img-report
          path: trivy-img-report.html

  send-reports:
    needs: [dependency-check, trivy-fs, trivy-img]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Send Security Reports Email
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Security Reports - Resume Matcher"
          body: "Please find attached the latest OWASP Dependency-Check, Trivy Filesystem, and Trivy Image scan reports."
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: "kaifkhanmohammed718@gmail.com"
          attachments: |
            dependency-check-report/dependency-check-report.html,
            trivy-fs-report/trivy-fs-report.html,
            trivy-img-report/trivy-img-report.html