name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SonarScanner CLI
        run: |
          curl -sSLf https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip -o sonar-scanner.zip
          unzip -q sonar-scanner.zip -d $HOME
          rm -f sonar-scanner.zip
          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run SonarScanner
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.qualitygate.wait=false

      - name: Export SonarCloud Report
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=$SONAR_PROJECT_KEY&statuses=OPEN,REOPENED&ps=500" \
            -o sonar-report.json

      - name: Convert SonarCloud JSON to HTML Table
        if: always()
        run: |
          echo "<html><body>" > sonar-summary.html
          echo "<h2>SonarCloud Active Issues Report</h2>" >> sonar-summary.html
          echo "<table border='1' cellpadding='5' cellspacing='0' style='border-collapse: collapse; font-family: sans-serif;'>" >> sonar-summary.html
          echo "<tr style='background-color: #f2f2f2;'><th>Rule</th><th>Message</th><th>Severity</th><th>File</th><th>Line</th><th>Action</th></tr>" >> sonar-summary.html
          if jq -e '.issues | length > 0' sonar-report.json >/dev/null 2>&1; then
            jq -r '.issues[] | "<tr><td>\(.rule)</td><td>\(.message)</td><td>\(.severity)</td><td>\(.component)</td><td>\(.line // "N/A")</td><td><a href=\"https://sonarcloud.io/project/issues?id=\(.project)&issues=\(.key)\">View Issue</a></td></tr>"' sonar-report.json >> sonar-summary.html
          else
            echo "<tr><td colspan='6'>No active open or reopened issues found.</td></tr>" >> sonar-summary.html
          fi
          echo "</table>" >> sonar-summary.html
          echo "</body></html>" >> sonar-summary.html

      - name: Upload SonarCloud Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary-report
          path: sonar-summary.html

      - name: Send Email
        if: always()
        run: sleep $((1 + RANDOM % 5))

      - name: Email SonarCloud Report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: SonarCloud Report - Resume Matcher
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
          content_type: text/html
          body: |
            <h2>SonarCloud analysis completed</h2>
            <p>See attached report or workflow artifacts for full details.</p>
          attachments: sonar-summary.html

