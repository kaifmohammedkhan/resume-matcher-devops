name: Trigger Jenkins Pipeline

on:
  # Scenario 1: Triggers on direct pushes to these branches
  push:
    branches:
      - main
      - pre-main

  # Scenario 2: Triggers when a PR is targeted at the main branch
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Pipeline Job
        uses: appleboy/jenkins-action@master
        with:
          url: ${{ secrets.JENKINS_URL }}
          user: ${{ secrets.JENKINS_USER }}
          token: ${{ secrets.JENKINS_TOKEN }}
          job: "resume-matcher-main" # Change this to your exact Jenkins job name
          # Evaluates dynamically whether it's a PR or a direct Push event
          parameter: >-
            PR_NUMBER=${{ github.event.pull_request.number || 'NONE' }},
            BRANCH_NAME=${{ github.event.pull_request.head.ref || github.ref_name }}
