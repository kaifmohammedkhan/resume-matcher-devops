name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server jq

          echo "root:debugpassword123" | sudo chpasswd

          # Enable root login and password authentication
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Override modern Ubuntu sshd_config.d restrictions
          # and ensure sshd runtime directory exists.
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd

          echo "PasswordAuthentication yes" | \
            sudo tee /etc/ssh/sshd_config.d/99-auth.conf

          echo "PermitRootLogin yes" | \
            sudo tee -a /etc/ssh/sshd_config.d/99-auth.conf

          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok2 CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                    INSTALLING ZROK"
          echo "============================================================"

          curl -sSf https://get.openziti.io/install.bash | \
            sudo bash -s zrok

          sudo apt-get install -y zrok

          hash -r

          # Keep the zrok2 command name used by this workflow.
          sudo ln -sf "$(command -v zrok)" /usr/local/bin/zrok2

          hash -r

          echo
          echo "============================================================"
          echo "                    ZROK2 VERSION"
          echo "============================================================"

          command -v zrok2
          zrok2 version

      - name: Configure zrok API Endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                 CONFIGURING ZROK API"
          echo "============================================================"

          # IMPORTANT:
          # https://zrok.io is not the API endpoint used by this CLI.
          # Use the v1 API endpoint explicitly.
          zrok2 config set apiEndpoint https://api-v1.zrok.io/

          echo
          echo "Configured API endpoint:"
          zrok2 config get apiEndpoint

      - name: Inspect zrok2 CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                    ZROK2 CLI HELP"
          echo "============================================================"

          zrok2 --help

          echo
          echo "============================================================"
          echo "                    ZROK2 LS HELP"
          echo "============================================================"

          zrok2 ls --help || true

          echo
          echo "============================================================"
          echo "                 ZROK2 SHARE HELP"
          echo "============================================================"

          zrok2 share --help || true

          echo
          echo "============================================================"
          echo "                 ZROK2 CONFIGURATION"
          echo "============================================================"

          zrok2 config get apiEndpoint || true

      - name: Pre-Start Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "      PRE-START CLEANUP: LOCAL RUNNER STATE"
          echo "============================================================"

          # Do NOT run `zrok2 enable` here.
          #
          # On GitHub Actions, enable can attempt to access /dev/tty.
          # Account enablement is performed exactly once in the next step.
          #
          # Do NOT run:
          #   zrok2 list environments
          #
          # That command does not exist in the installed CLI.

          echo "No remote environment enumeration performed."
          echo "No zrok account enablement performed."
          echo "Cleanup stage completed."

      - name: Enable zrok2
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "                    ENABLING ZROK2"
          echo "============================================================"

          echo "API endpoint:"
          zrok2 config get apiEndpoint

          zrok2 enable "${ZROK_TOKEN}"

          echo
          echo "zrok2 account successfully enabled."

      - name: Start zrok2 SSH Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "             STARTING ZROK2 SSH TUNNEL"
          echo "============================================================"

          rm -f /tmp/zrok2-share.log

          script -q -c \
            "zrok2 share private --backend-mode tcpTunnel localhost:22" \
            /dev/null \
            > /tmp/zrok2-share.log 2>&1 &

          ZROK_PID=$!

          echo "zrok2 process started with PID: ${ZROK_PID}"

          sleep 10

          echo
          echo "============================================================"
          echo "             ZROK2 TUNNEL INFORMATION"
          echo "============================================================"

          cat /tmp/zrok2-share.log

          echo
          echo "============================================================"

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "ERROR: zrok2 tunnel process terminated."
            echo
            echo "Full zrok2 log:"
            cat /tmp/zrok2-share.log
            exit 1
          fi

          echo "zrok2 tunnel is active."
          echo
          echo "Keeping runner alive for the full 6-hour limit..."
          echo "============================================================"

          sleep 21600