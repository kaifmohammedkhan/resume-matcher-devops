name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server and Install Tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            jq \
            curl \
            ca-certificates

          echo "root:debugpassword123" | sudo chpasswd

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd

          sudo tee /etc/ssh/sshd_config.d/99-zrok-debug.conf > /dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          PubkeyAuthentication yes
          EOF

          echo "Validating sshd configuration..."
          sudo sshd -t

          sudo systemctl restart ssh

          echo
          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok2 from Official GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          ZROK_VERSION="v2.0.8"

          echo "============================================================"
          echo "              INSTALLING ZROK2 ${ZROK_VERSION}"
          echo "============================================================"

          RELEASE_API="https://github.com{ZROK_VERSION}"

          # Note: If rate limits cause failure here, consider using your token or static releases
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "${RELEASE_API}" \
            -o /tmp/zrok-release.json

          ASSET_URL="$(
            jq -r '
              .assets[]
              | select(
                  (.name | test("linux.*amd64|amd64.*linux"; "i"))
                  and
                  (.name | test("\\.(tar\\.gz|tgz|zip)$"; "i"))
                )
              | .browser_download_url
            ' /tmp/zrok-release.json |
            head -n 1
          )"

          if [ -z "${ASSET_URL}" ] || [ "${ASSET_URL}" = "null" ]; then
            exit 1
          fi

          rm -rf /tmp/zrok2-install
          mkdir -p /tmp/zrok2-install
          cd /tmp/zrok2-install

          curl -fL --retry 5 --retry-delay 3 -o zrok2-package "${ASSET_URL}"

          case "${ASSET_URL}" in
            *.tar.gz|*.tgz)
              tar -xzf zrok2-package
              ;;
            *.zip)
              sudo apt-get update && sudo apt-get install -y unzip
              unzip -o zrok2-package
              ;;
            *)
              exit 1
              ;;
          esac

          ZROK_BINARY="$(find . -type f -name 'zrok2' -print -quit)"
          if [ -z "${ZROK_BINARY}" ]; then
            exit 1
          fi

          sudo install -o root -g root -m 0755 "${ZROK_BINARY}" /usr/local/bin/zrok2
          sudo ln -sf /usr/local/bin/zrok2 /usr/local/bin/zrok

          hash -r
          zrok2 version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"

          zrok2 config set apiEndpoint "https://zrok.io"
          zrok2 enable "${ZROK2_ENABLE_TOKEN}"

          echo "Scanning and deleting matched runner profiles..."
          zrok2 list environments --json | \
          jq -r '.[] | select(.description | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")) | .token' | \
          xargs -I {} zrok2 delete environment {} || true

          # Wipe local token state so the next configuration step runs fresh
          zrok2 disable || true
          echo "Pre-cleanup finished successfully."

      - name: Configure zrok2
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          export ZROK2_API_ENDPOINT="https://zrok.io"

          echo "============================================================"
          echo "                  CONFIGURING ZROK2"
          echo "============================================================"

          zrok2 config set apiEndpoint "${ZROK2_API_ENDPOINT}"
          zrok2 enable "${ZROK2_ENABLE_TOKEN}"
          zrok2 status || true

      - name: Validate SSH Locally
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                  LOCAL SSH TEST"
          echo "============================================================"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            root@127.0.0.1 \
            'echo SSH_LOCAL_TEST_OK'

      - name: Keep Runner Alive
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "              INTERACTIVE DEBUG RUNNER"
          echo "============================================================"
          echo "Sleeping for 6 hours..."

          sleep 21600

      - name: Cleanup zrok2 Environment
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "              ZROK2 FINAL CLEANUP"
          echo "============================================================"

          if command -v zrok2 >/dev/null 2>&1; then
            zrok2 disable || true
          fi
