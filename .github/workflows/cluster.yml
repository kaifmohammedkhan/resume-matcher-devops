
name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server

          SSH_DEBUG_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${SSH_DEBUG_PASSWORD}"
          echo "root:${SSH_DEBUG_PASSWORD}" | sudo chpasswd
          unset SSH_DEBUG_PASSWORD

          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd

          sudo tee /etc/ssh/sshd_config.d/99-auth.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          EOF

          sudo sshd -t
          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true
          sudo ss -tlnp | grep ':22 ' || true

          echo "SSH server configured successfully."

      - name: Install zrok CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -sSf https://get.openziti.io/install.bash \
            | sudo bash -s zrok

          sudo apt-get install -y zrok

          hash -r

          echo "============================================================"
          echo "                    ZROK VERSION"
          echo "============================================================"

          zrok version
          zrok enable --help
          zrok share private --help

      - name: Configure zrok API Endpoint
        shell: bash
        run: |
          set -euo pipefail

          # Retain the API endpoint used in the previous attempts.
          zrok config set apiEndpoint https://api-v1.zrok.io/

          echo "Configured endpoint:"
          zrok config get apiEndpoint

      - name: Pre-Start Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                  PRE-START CLEANUP"
          echo "============================================================"

          # Do not run interactive enable/disable operations here.
          # Do not assume the remote environment-listing syntax.
          # Remote cleanup must be done through the zrok console
          # or a supported, authenticated management interface.

          echo "No remote environments deleted."
          echo "Proceeding to account authorization."

      - name: Enable zrok Environment
        id: enable_zrok
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN:-}" ] ||
             [ -z "$(printf '%s' "${ZROK_TOKEN:-}" | tr -d '[:space:]')" ]; then
            echo "::error::ZROK_TOKEN is missing or empty."
            echo "Configure the account enable token in GitHub Actions secrets."
            exit 1
          fi

          echo "============================================================"
          echo "              ENABLING ZROK HEADLESS"
          echo "============================================================"

          echo "API endpoint:"
          zrok config get apiEndpoint

          # Never enable shell tracing or print the token.
          set +e
          zrok enable --headless "${ZROK_TOKEN}"
          ZROK_EXIT_CODE=$?
          set -e

          if [ "${ZROK_EXIT_CODE}" -ne 0 ]; then
            echo
            echo "::error::zrok enable failed with exit code ${ZROK_EXIT_CODE}."
            echo "If the service returned HTTP 401 enableUnauthorized:"
            echo "1. Verify ZROK_TOKEN is the account enable token."
            echo "2. Verify the token belongs to the configured zrok service."
            echo "3. Inspect the zrok console for existing environments."
            echo "4. If the account has reached its environment limit,"
            echo "   remove an obsolete environment through the console."
            echo "5. If necessary, obtain a fresh account enable token."
            exit "${ZROK_EXIT_CODE}"
          fi

          echo "zrok environment enabled successfully."

      - name: Start zrok SSH Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                STARTING PRIVATE SSH SHARE"
          echo "============================================================"

          SHARE_HELP="$(zrok share private --help 2>&1)" || {
            echo "::error::Unable to retrieve private share help."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          }

          if ! printf '%s\n' "${SHARE_HELP}" | grep -q -- '--headless'; then
            echo "::error::Installed CLI does not advertise --headless."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          fi

          if ! printf '%s\n' "${SHARE_HELP}" | grep -q 'tcpTunnel'; then
            echo "::error::Installed CLI does not advertise tcpTunnel."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          fi

          rm -f /tmp/zrok-share.log

          zrok share private \
            --headless \
            --backend-mode tcpTunnel \
            127.0.0.1:22 \
            > /tmp/zrok-share.log 2>&1 &

          ZROK_PID=$!

          cleanup() {
            echo "Stopping zrok share..."
            kill "${ZROK_PID}" 2>/dev/null || true
            wait "${ZROK_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          echo "zrok share PID: ${ZROK_PID}"

          # Give the share time to initialize and detect early failure.
          for attempt in $(seq 1 30); do
            if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
              echo "::error::zrok share exited during startup."
              cat /tmp/zrok-share.log
              exit 1
            fi

            sleep 2
          done

          echo "============================================================"
          echo "                    ZROK SHARE LOG"
          echo "============================================================"

          cat /tmp/zrok-share.log

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "::error::zrok share terminated during startup."
            exit 1
          fi

          echo "Share process remains active."
          echo "Monitoring for up to six hours."

          for ((second = 0; second < 21600; second++)); do
            if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
              echo "::error::zrok tunnel terminated unexpectedly."
              cat /tmp/zrok-share.log
              exit 1
            fi

            sleep 1
          done
