name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server jq

          echo "root:debugpassword123" | sudo chpasswd

          # Enable root login and password authentication
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Override any modern Ubuntu sshd_config.d restrictions & fix privilege separation path
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-auth.conf
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config.d/99-auth.conf

          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok2 CLI
        shell: bash
        run: |
          set -euo pipefail

          # Passing 'zrok' to the core OpenZiti install script maps dependencies accurately
          curl -sSf https://get.openziti.io/install.bash | sudo bash -s zrok
          sudo apt-get install -y zrok
          
          hash -r

          # Create seamless system structural alias link for zrok2 syntax continuity
          sudo ln -sf $(which zrok) /usr/local/bin/zrok2 || true
          hash -r

          echo "============================================================"
          echo "                    ZROK2 VERSION"
          echo "============================================================"

          command -v zrok2
          zrok2 version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
          ZROK_API_ENDPOINT: https://zrok.io
          ZROK2_API_ENDPOINT: https://zrok.io
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"

          # Authorize the target account context to sweep matching ghosts
          zrok2 enable "${ZROK_TOKEN}"

          echo "Scanning and deleting matched runner profiles..."
          zrok2 list environments --json | \
          jq -r '.[] | select(.description | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")) | .token' | \
          xargs -I {} zrok2 delete environment {} || true

          # Wipe local token state so the next configuration step runs completely fresh
          zrok2 disable || true
          echo "Pre-cleanup finished successfully."

      - name: Enable zrok2
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          zrok2 enable "${ZROK_TOKEN}"

          echo "zrok2 account successfully enabled."

      - name: Start zrok2 SSH Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "             STARTING ZROK2 SSH TUNNEL"
          echo "============================================================"

          script -q -c "zrok2 share private --backend-mode tcpTunnel localhost:22" /dev/null > /tmp/zrok2-share.log 2>&1 &

          ZROK_PID=$!

          echo "zrok2 process started with PID: ${ZROK_PID}"

          sleep 10

          echo
          echo "============================================================"
          echo "             ZROK2 TUNNEL INFORMATION"
          echo "============================================================"

          cat /tmp/zrok2-share.log

          echo
          echo "============================================================"

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "ERROR: zrok2 tunnel process terminated."
            exit 1
          fi

          echo "zrok2 tunnel is active."
          echo "Keeping runner alive for the full 6-hour limit..."
          echo "============================================================"

          sleep 21600
