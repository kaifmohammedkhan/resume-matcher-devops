name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server and Install Tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server jq

          echo "root:debugpassword123" | sudo chpasswd

          # Enable root login and password authentication
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Override any modern Ubuntu sshd_config.d restrictions
          sudo mkdir -p /etc/ssh/sshd_config.d
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-auth.conf
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config.d/99-auth.conf

          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Resolving asset paths dynamically from official repository releases..."
          cd $(mktemp -d)
          
          # Fetch the exact browser download url for the 64-bit linux asset from the GitHub API
          DOWNLOAD_URL=$(curl -sSf https://github.com | \
            jq -r '.assets[] | select(.name | test("linux.*amd64")) | .browser_download_url')
          
          echo "Downloading asset via target URL: ${DOWNLOAD_URL}"
          curl -sSfL "${DOWNLOAD_URL}" | tar -xz -f -
          
          # Find whatever binary file was extracted (zrok or zrok2) and place it cleanly into global scope
          BINARY_NAME=$(find . -maxdepth 1 -type f -executable -name "zrok*" | head -n 1)
          
          if [ -z "${BINARY_NAME}" ]; then
            echo "ERROR: No executable binary found in the extracted archive."
            exit 1
          fi

          echo "Registering extracted binary: ${BINARY_NAME}"
          sudo install -o root -g root "${BINARY_NAME}" /usr/local/bin/zrok2
          sudo ln -sf /usr/local/bin/zrok2 /usr/local/bin/zrok
          
          hash -r

          echo "============================================================"
          echo "                    ZROK INSTALLED"
          echo "============================================================"
          zrok2 version || zrok version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail
          
          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"
          
          hash -r

          # Configure endpoint and activate token context to query current account info
          script -q -c "zrok2 config set apiEndpoint https://zrok.io" /dev/null || script -q -c "zrok config set apiEndpoint https://zrok.io" /dev/null
          script -q -c "zrok2 enable ${ZROK_TOKEN}" /dev/null || script -q -c "zrok enable ${ZROK_TOKEN}" /dev/null

          echo "Scanning and deleting matched runner profiles..."
          (zrok2 list environments --json || zrok list environments --json) | \
          jq -r '.[] | select(.description | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")) | .token' | \
          xargs -I {} sh -c 'zrok2 delete environment {} || zrok delete environment {}' || true
          
          # Drop local authentication state so the subsequent setup block builds a completely clean workspace
          script -q -c "zrok2 disable" /dev/null || script -q -c "zrok disable" /dev/null || true
          echo "Pre-cleanup finished successfully."

      - name: Enable and Run zrok SSH Tunnel with Auto-Cleanup
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          # Post-run graceful close
          cleanup() {
            echo
            echo "============================================================"
            echo "          DISABLING CURRENT ZROK ENVIRONMENT ON EXIT"
            echo "============================================================"
            script -q -c "zrok2 disable" /dev/null || script -q -c "zrok disable" /dev/null || true
          }
          trap cleanup EXIT INT TERM

          hash -r

          echo "Setting zrok API endpoint..."
          script -q -c "zrok2 config set apiEndpoint https://zrok.io" /dev/null || script -q -c "zrok config set apiEndpoint https://zrok.io" /dev/null

          echo "Enabling fresh zrok instance..."
          script -q -c "zrok2 enable ${ZROK_TOKEN}" /dev/null || script -q -c "zrok enable ${ZROK_TOKEN}" /dev/null
          echo "zrok account successfully enabled."

          echo "============================================================"
          echo "            STARTING ZROK SSH TUNNEL"
          echo "============================================================"

          script -q -c "zrok2 share private --backend-mode tcpTunnel localhost:22" /dev/null > /tmp/zrok-share.log 2>&1 & || \
          script -q -c "zrok share private --backend-mode tcpTunnel localhost:22" /dev/null > /tmp/zrok-share.log 2>&1 &
          ZROK_PID=$!

          echo "zrok process started with PID: ${ZROK_PID}"
          sleep 10

          echo "============================================================"
          echo "            ZROK TUNNEL INFORMATION"
          echo "============================================================"
          cat /tmp/zrok-share.log
          echo "============================================================"

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "ERROR: zrok tunnel process terminated."
            exit 1
          fi

          echo "zrok tunnel is active."
          echo "Keeping runner alive for the full 6-hour limit (or until cancellation)..."
          echo "============================================================"

          sleep 21600
