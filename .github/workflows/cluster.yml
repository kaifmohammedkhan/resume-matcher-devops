name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server

          echo "root:debugpassword123" | sudo chpasswd

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok2 CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -sSf https://get.openziti.io/install.bash | sudo bash -s zrok2

          echo "============================================================"
          echo "                    ZROK2 VERSION"
          echo "============================================================"

          command -v zrok2
          zrok2 version

      - name: Enable zrok2
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          zrok2 enable "${ZROK_TOKEN}"

          echo "zrok2 account successfully enabled."

      - name: Start zrok2 SSH Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "              STARTING ZROK2 SSH TUNNEL"
          echo "============================================================"

          zrok2 share public \
            --backend-mode proxy \
            22 > /tmp/zrok2-share.log 2>&1 &

          ZROK_PID=$!

          echo "zrok2 process started with PID: ${ZROK_PID}"

          sleep 10

          echo
          echo "============================================================"
          echo "              ZROK2 TUNNEL INFORMATION"
          echo "============================================================"

          cat /tmp/zrok2-share.log

          echo
          echo "============================================================"

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "ERROR: zrok2 tunnel process terminated."
            exit 1
          fi

          echo "zrok2 tunnel is active."
          echo "Keeping runner alive for the full 6-hour limit..."
          echo "============================================================"

          sleep 21600