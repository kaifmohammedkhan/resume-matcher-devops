name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server and Install Tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server jq curl ca-certificates

          echo "root:debugpassword123" | sudo chpasswd

          # Enable root login and password authentication.
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Explicit override for Ubuntu's sshd_config.d configuration.
          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-zrok-debug.conf > /dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          PubkeyAuthentication yes
          EOF

          sudo sshd -t
          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

          echo
          echo "SSH configuration validation:"
          sudo sshd -T | grep -E '^(port|permitrootlogin|passwordauthentication) '

      - name: Install zrok2 v2.0.8
        shell: bash
        run: |
          set -euo pipefail

          ZROK_VERSION="v2.0.8"
          ZROK_URL="https://github.com/openziti/zrok/releases/download/${ZROK_VERSION}/zrok2_linux_amd64.tar.gz"

          echo "============================================================"
          echo "                 INSTALLING ZROK2 ${ZROK_VERSION}"
          echo "============================================================"

          rm -rf /tmp/zrok2-install
          mkdir -p /tmp/zrok2-install

          cd /tmp/zrok2-install

          echo "Downloading:"
          echo "${ZROK_URL}"

          curl -fL --retry 5 --retry-delay 3 \
            -o zrok2.tar.gz \
            "${ZROK_URL}"

          echo
          echo "Downloaded archive:"
          ls -lh zrok2.tar.gz

          echo
          echo "Extracting..."
          tar -xzf zrok2.tar.gz

          echo
          echo "Extracted files:"
          find . -maxdepth 2 -type f -print

          if [ ! -f "./zrok2" ]; then
            echo "ERROR: zrok2 binary was not found after extraction."
            exit 1
          fi

          sudo install -o root -g root -m 0755 ./zrok2 /usr/local/bin/zrok2

          # Optional compatibility alias for scripts that still invoke zrok.
          sudo ln -sf /usr/local/bin/zrok2 /usr/local/bin/zrok

          cd /

          rm -rf /tmp/zrok2-install

          hash -r

          echo
          echo "============================================================"
          echo "                    ZROK2 INSTALLED"
          echo "============================================================"

          command -v zrok2
          zrok2 version

      - name: Verify zrok2 Share Capabilities
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                 ZROK2 SHARE CAPABILITIES"
          echo "============================================================"

          zrok2 share private --help || true

          echo
          echo "Installed version:"
          zrok2 version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"

          hash -r

          # zrok2 uses its own v2 configuration/environment directory.
          export ZROK2_API_ENDPOINT="https://api-v1.zrok.io"

          echo
          echo "Configuring zrok2 API endpoint..."
          zrok2 config set apiEndpoint "${ZROK2_API_ENDPOINT}"

          echo
          echo "Enabling fresh zrok2 environment..."
          zrok2 enable "${ZROK2_ENABLE_TOKEN}"

          echo
          echo "Current zrok2 environments:"
          zrok2 list environments --json || true

          echo
          echo "Scanning for stale runner environments..."

          ENV_TOKENS="$(
            zrok2 list environments --json |
              jq -r '
                .[]
                | select(
                    (.description // "")
                    | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")
                  )
                | .token
              ' || true
          )"

          if [ -n "${ENV_TOKENS}" ]; then
            echo "Matched stale environments:"

            while IFS= read -r ENV_TOKEN; do
              if [ -n "${ENV_TOKEN}" ]; then
                echo "Deleting environment: ${ENV_TOKEN}"
                zrok2 delete environment "${ENV_TOKEN}" || true
              fi
            done <<< "${ENV_TOKENS}"
          else
            echo "No stale runner environments matched."
          fi

          echo
          echo "Disabling cleanup environment..."

          zrok2 disable || true

          echo
          echo "Pre-cleanup finished successfully."

      - name: Enable Fresh zrok2 Environment
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          export ZROK2_API_ENDPOINT="https://api-v1.zrok.io"

          echo "============================================================"
          echo "                 ENABLING FRESH ZROK2"
          echo "============================================================"

          zrok2 config set apiEndpoint "${ZROK2_API_ENDPOINT}"
          zrok2 enable "${ZROK2_ENABLE_TOKEN}"

          echo
          echo "zrok2 account successfully enabled."

          echo
          echo "zrok2 status:"
          zrok2 status || true

      - name: Validate SSH Service
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                  VALIDATING SSH"
          echo "============================================================"

          sudo systemctl is-active --quiet ssh

          if ! sudo ss -ltn | grep -q ':22 '; then
            echo "ERROR: SSH is not listening on TCP/22."
            exit 1
          fi

          echo "SSH service is active."
          echo "TCP/22 is listening."

          echo
          echo "Local SSH test:"

          if sudo ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 \
            -o BatchMode=no \
            root@127.0.0.1 \
            'echo SSH_LOCAL_TEST_OK'
          then
            echo "Local SSH test succeeded."
          else
            echo "WARNING: Local SSH authentication test failed."
            echo "The SSH daemon itself is still listening."
          fi

      - name: Start Supported zrok2 Private Share
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "              ZROK2 PRIVATE SHARE CHECK"
          echo "============================================================"

          echo
          echo "IMPORTANT:"
          echo "zrok2 v2 does not support the old tcpTunnel backend."
          echo "The old command:"
          echo
          echo "  zrok share private --backend-mode tcpTunnel localhost:22"
          echo
          echo "must NOT be used with zrok2."

          echo
          echo "Available zrok2 private-share modes:"
          zrok2 share private --help

          echo
          echo "============================================================"
          echo "              SSH TUNNEL NOT STARTED"
          echo "============================================================"
          echo
          echo "The runner will remain alive for 6 hours."
          echo "Use this job for interactive diagnostics while the"
          echo "supported zrok2 access mechanism is configured separately."

          echo
          echo "Runner SSH endpoint:"
          echo "localhost:22"

          echo
          echo "Keeping runner alive..."

          sleep 21600

      - name: Cleanup zrok2 Environment
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "              ZROK2 FINAL CLEANUP"
          echo "============================================================"

          if command -v zrok2 >/dev/null 2>&1; then
            zrok2 disable || true
          fi

          echo "zrok2 cleanup completed."