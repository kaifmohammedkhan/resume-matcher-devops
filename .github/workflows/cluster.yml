name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server and Install Tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server jq

          echo "root:debugpassword123" | sudo chpasswd

          # Enable root login and password authentication
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Override any modern Ubuntu sshd_config.d restrictions
          sudo mkdir -p /etc/ssh/sshd_config.d
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-auth.conf
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config.d/99-auth.conf

          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -sSf https://openziti.io | sudo bash -s zrok

          echo "============================================================"
          echo "                    ZROK VERSION"
          echo "============================================================"

          command -v zrok
          zrok version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail
          
          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"
          
          # Set endpoint and authorize to pull the account context
          script -q -c "zrok config set apiEndpoint https://api-v1.zrok.io" /dev/null
          script -q -c "zrok enable ${ZROK_TOKEN}" /dev/null

          echo "Scanning and deleting matched runner profiles..."
          zrok list environments --json | \
          jq -r '.[] | select(.description | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")) | .token' | \
          xargs -I {} zrok delete environment {} || true
          
          # Tear down local state so the next step triggers a fresh registration
          script -q -c "zrok disable" /dev/null
          echo "Pre-cleanup finished successfully."

      - name: Enable and Run zrok SSH Tunnel with Auto-Cleanup
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          # Post-run graceful close
          cleanup() {
            echo
            echo "============================================================"
            echo "          DISABLING CURRENT ZROK ENVIRONMENT ON EXIT"
            echo "============================================================"
            script -q -c "zrok disable" /dev/null || true
          }
          trap cleanup EXIT INT TERM

          echo "Setting zrok API endpoint..."
          script -q -c "zrok config set apiEndpoint https://api-v1.zrok.io" /dev/null

          echo "Enabling fresh zrok instance..."
          script -q -c "zrok enable ${ZROK_TOKEN}" /dev/null
          echo "zrok account successfully enabled."

          echo "============================================================"
          echo "            STARTING ZROK SSH TUNNEL"
          echo "============================================================"

          script -q -c "zrok share private --backend-mode tcpTunnel localhost:22" /dev/null > /tmp/zrok-share.log 2>&1 &
          ZROK_PID=$!

          echo "zrok process started with PID: ${ZROK_PID}"
          sleep 10

          echo "============================================================"
          echo "            ZROK TUNNEL INFORMATION"
          echo "============================================================"
          cat /tmp/zrok-share.log
          echo "============================================================"

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "ERROR: zrok tunnel process terminated."
            exit 1
          fi

          echo "zrok tunnel is active."
          echo "Keeping runner alive for the full 6-hour limit (or until cancellation)..."
          echo "============================================================"

          sleep 21600
