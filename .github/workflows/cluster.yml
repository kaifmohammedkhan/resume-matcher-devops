name: Interactive Zrok Debug

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:
  
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Zrok
        run: |
          curl -sS https://get.openziti.io/install.bash | sudo bash -s zrok
          zrok2 version || zrok version

      - name: Run Interactive Zrok Debug Session
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -e

          # 1. Setup bash cleanup trap for runner exit/cancellation
          cleanup() {
            echo "============================================================"
            echo "                TEARING DOWN ZROK ENVIRONMENT               "
            echo "============================================================"
            zrok2 disable || zrok disable || true
          }
          trap cleanup EXIT INT TERM

          # 2. Configure SSH daemon for local access
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo service ssh start
          echo "runner:${{ secrets.DEBUG_SSH_PASSWORD || 'runnerpass' }}" | sudo chpasswd

          # 3. Purge stale environment if previously registered
          echo "Purging stale zrok environment..."
          zrok2 disable || zrok disable || true

          # 4. Enable Zrok in headless mode
          echo "============================================================"
          echo "                    ENABLING ZROK (HEADLESS)                "
          echo "============================================================"
          if command -v zrok2 &> /dev/null; then
            zrok2 enable "${ZROK_TOKEN}" --headless
          else
            zrok enable "${ZROK_TOKEN}" --headless
          fi

          # 5. Share private TCP connection to local SSH daemon (Port 22)
          echo "============================================================"
          echo "                STARTING ZROK PRIVATE TUNNEL                "
          echo "============================================================"
          if command -v zrok2 &> /dev/null; then
            zrok2 share private --headless 127.0.0.1:22
          else
            zrok share private 127.0.0.1:22
          fi