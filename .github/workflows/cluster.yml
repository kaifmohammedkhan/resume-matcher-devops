name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server and Install Tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            jq \
            curl \
            ca-certificates

          echo "root:debugpassword123" | sudo chpasswd

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          # Patching missing runtime directory context for Ubuntu OpenSSH setups
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd

          sudo tee /etc/ssh/sshd_config.d/99-zrok-debug.conf > /dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          PubkeyAuthentication yes
          EOF

          echo "Validating sshd configuration..."
          sudo sshd -t

          sudo systemctl restart ssh

          echo
          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true

          echo
          echo "SSH listening ports:"
          sudo ss -tlnp | grep ':22 ' || true

      - name: Install zrok2 CLI via Package Manager
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "              INSTALLING OFFICIAL ZROK PACKAGE"
          echo "============================================================"

          # The installer core script expects 'zrok' to map package dependencies correctly
          curl -sSf https://get.openziti.io/install.bash | sudo bash -s zrok

          # Force bash to register new binary paths
          hash -r

          # Create system wide structural alias for zrok2 compatibility layer
          if command -v zrok >/dev/null 2>&1; then
            sudo ln -sf $(which zrok) /usr/local/bin/zrok2
          fi

          hash -r

          echo "Verification:"
          zrok2 version || zrok version

      - name: Purge Stale Ghost Environments First
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          echo "============================================================"
          echo "      PRE-START CLEANUP: PURGING STALE GHOST ENVIRONMENTS"
          echo "============================================================"

          zrok2 config set apiEndpoint "https://zrok.io" || zrok config set apiEndpoint "https://zrok.io"
          zrok2 enable "${ZROK2_ENABLE_TOKEN}" || zrok enable "${ZROK2_ENABLE_TOKEN}"

          echo "Scanning and deleting matched runner profiles..."
          (zrok2 list environments --json || zrok list environments --json) | \
          jq -r '.[] | select(.description | test("DESKTOP-PQUITOR\\\\DELL@DESKTOP-PQUITOR|runner@")) | .token' | \
          xargs -I {} sh -c 'zrok2 delete environment {} || zrok delete environment {}' || true

          # Wipe local token state so the next configuration step runs fresh
          zrok2 disable || zrok disable || true
          echo "Pre-cleanup finished successfully."

      - name: Configure zrok2
        shell: bash
        env:
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK2_ENABLE_TOKEN}" ]; then
            echo "ERROR: ZROK_TOKEN secret is empty or unavailable."
            exit 1
          fi

          export ZROK2_API_ENDPOINT="https://zrok.io"

          echo "============================================================"
          echo "                  CONFIGURING ZROK2"
          echo "============================================================"

          zrok2 config set apiEndpoint "${ZROK2_API_ENDPOINT}" || zrok config set apiEndpoint "${ZROK2_API_ENDPOINT}"
          zrok2 enable "${ZROK2_ENABLE_TOKEN}" || zrok enable "${ZROK2_ENABLE_TOKEN}"
          zrok2 status || zrok status || true

      - name: Validate SSH Locally
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                  LOCAL SSH TEST"
          echo "============================================================"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            root@127.0.0.1 \
            'echo SSH_LOCAL_TEST_OK'

      - name: Keep Runner Alive
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "              INTERACTIVE DEBUG RUNNER"
          echo "============================================================"
          echo "Sleeping for 6 hours..."

          sleep 21600

      - name: Cleanup zrok2 Environment
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "              ZROK2 FINAL CLEANUP"
          echo "============================================================"

          if command -v zrok2 >/dev/null 2>&1; then
            zrok2 disable || true
          elif command -v zrok >/dev/null 2>&1; then
            zrok disable || true
          fi
