
name: Interactive Zrok Debug (6 Hours Max)

on:
  push:
    branches:
      - pre-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Generate a unique temporary SSH password.
          SSH_DEBUG_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${SSH_DEBUG_PASSWORD}"
          echo "root:${SSH_DEBUG_PASSWORD}" | sudo chpasswd
          unset SSH_DEBUG_PASSWORD

          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd

          sudo tee /etc/ssh/sshd_config.d/99-auth.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          EOF

          sudo sshd -t
          sudo systemctl restart ssh

          echo "============================================================"
          echo "                    SSH SERVER"
          echo "============================================================"

          sudo systemctl --no-pager status ssh || true
          sudo ss -tlnp | grep ':22 ' || true

          echo "SSH server configured successfully."

      - name: Install zrok CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -sSf https://get.openziti.io/install.bash \
            | sudo bash -s zrok

          sudo apt-get install -y zrok

          hash -r

          echo "============================================================"
          echo "                    ZROK VERSION"
          echo "============================================================"

          command -v zrok
          zrok version

          echo
          echo "============================================================"
          echo "                    ENABLE HELP"
          echo "============================================================"

          zrok enable --help

          echo
          echo "============================================================"
          echo "                    SHARE HELP"
          echo "============================================================"

          zrok share private --help

      - name: Configure zrok API Endpoint
        shell: bash
        run: |
          set -euo pipefail

          zrok config set apiEndpoint https://api-v1.zrok.io/

          echo "Configured API endpoint:"
          zrok config get apiEndpoint

      - name: Pre-Start Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                  PRE-START CLEANUP"
          echo "============================================================"

          # Avoid interactive enable/disable operations.
          # Remote environment deletion is intentionally skipped:
          # the previously attempted "list environments" command
          # is not supported by this CLI.

          echo "No remote cleanup attempted."
          echo "Proceeding to account authentication."

      - name: Enable zrok Environment
        shell: bash
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZROK_TOKEN:-}" ]; then
            echo "::error::ZROK_TOKEN is missing or empty."
            echo "Configure the ZROK_TOKEN repository Actions secret."
            exit 1
          fi

          # Check for whitespace-only values without printing the token.
          if [ -z "$(printf '%s' "${ZROK_TOKEN}" | tr -d '[:space:]')" ]; then
            echo "::error::ZROK_TOKEN contains only whitespace."
            exit 1
          fi

          echo "============================================================"
          echo "              ENABLING ZROK HEADLESS"
          echo "============================================================"

          echo "API endpoint:"
          zrok config get apiEndpoint

          # Do not enable shell tracing here: the token must remain secret.
          if zrok enable --headless "${ZROK_TOKEN}"; then
            echo "zrok environment enabled successfully."
          else
            result=$?

            echo
            echo "::error::zrok environment enablement failed."
            echo "Check the following without printing the token:"
            echo "1. ZROK_TOKEN is the correct zrok account enable token."
            echo "2. The token is current and has not been revoked."
            echo "3. The token belongs to the account on the configured API service."
            echo "4. The API endpoint is the intended service for this token."
            echo
            echo "HTTP 401 enableUnauthorized indicates that the service"
            echo "rejected authorization. Changing SSH settings will not fix it."

            exit "${result}"
          fi

      - name: Start zrok SSH Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "                STARTING PRIVATE SSH SHARE"
          echo "============================================================"

          # Validate options against the installed CLI.
          if ! SHARE_HELP="$(zrok share private --help 2>&1)"; then
            echo "::error::Unable to retrieve private share help."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          fi

          if ! printf '%s\n' "${SHARE_HELP}" | grep -q -- '--headless'; then
            echo "::error::Installed CLI does not advertise --headless for share."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          fi

          if ! printf '%s\n' "${SHARE_HELP}" | grep -q 'tcpTunnel'; then
            echo "::error::Installed CLI does not advertise tcpTunnel."
            printf '%s\n' "${SHARE_HELP}"
            exit 1
          fi

          rm -f /tmp/zrok-share.log

          zrok share private \
            --headless \
            --backend-mode tcpTunnel \
            127.0.0.1:22 \
            > /tmp/zrok-share.log 2>&1 &

          ZROK_PID=$!

          cleanup() {
            echo "Stopping zrok share..."
            kill "${ZROK_PID}" 2>/dev/null || true
            wait "${ZROK_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          echo "zrok share PID: ${ZROK_PID}"

          # Wait for initialization while checking for early failure.
          for attempt in $(seq 1 30); do
            if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
              echo "::error::zrok share process exited during startup."
              cat /tmp/zrok-share.log
              exit 1
            fi

            sleep 2
          done

          echo "============================================================"
          echo "                    ZROK SHARE LOG"
          echo "============================================================"

          cat /tmp/zrok-share.log

          if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
            echo "::error::zrok share terminated during startup."
            exit 1
          fi

          echo "Share process is still running."
          echo "Keeping the runner alive for up to six hours."

          # Monitor the share for the full permitted duration.
          for ((second = 0; second < 21600; second++)); do
            if ! kill -0 "${ZROK_PID}" 2>/dev/null; then
              echo "::error::zrok tunnel terminated unexpectedly."
              cat /tmp/zrok-share.log
              exit 1
            fi

            sleep 1
          done
