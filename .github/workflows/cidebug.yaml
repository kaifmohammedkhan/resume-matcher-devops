name: Pre-Main CI Debug

on:
  push:
    branches:
      - pre-main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Run Tests
        run: ./scripts/ci-test.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: ./scripts/ci-sonarcloud.sh
        continue-on-error: true

      - name: Download Trivy HTML Template
        run: curl --proto '=https' --tlsv1.2 -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy FS Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: template
          template: "@html.tpl"
          output: trivy-fs-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Build Local Image for Trivy Scan
        run: docker build -t app-local:latest .
        continue-on-error: true

      - name: Run Trivy Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: 'app-local:latest'
          format: template
          template: "@html.tpl"
          output: trivy-img-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: Install Gitleaks Binary
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Security Checks
        continue-on-error: true
        run: ./scripts/ci-security-checks.sh

      # Ensure report directory structure is flattened and available at root
      - name: Consolidate Security Reports
        if: always()
        run: |
          cp reports/security/security-report.html ./security-report.html 2>/dev/null || true
          cp reports/sonar-summary.html ./sonar-summary.html 2>/dev/null || true

      - name: Upload CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            test-summary.html
            sonar-summary.html
            trivy-fs-report.html
            trivy-img-report.html
            security-report.html

  send-email:
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Download CI Reports
        uses: actions/download-artifact@v4
        with:
          name: ci-reports

      - name: Verify Downloaded Reports
        run: ls -la

      - name: Send CI Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: ./scripts/ci-email.sh

  owasp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./scripts/ci-owasp.sh
        continue-on-error: true

      - name: Send OWASP Email
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: ./scripts/ci-email.sh