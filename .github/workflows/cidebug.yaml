name: Pre-Main CI Debug

on:
  push:
    branches:
      - pre-main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize line endings
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Run Tests
        run: ./scripts/ci-test.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: ./scripts/ci-sonarcloud.sh
        continue-on-error: true   # keep SonarCloud soft-fail

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy=0.50.2
          trivy --version

      - name: Trivy Scan
        run: ./scripts/ci-trivy.sh

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./scripts/ci-owasp.sh

      - name: Security Checks
        run: ./scripts/ci-security-checks.sh

      - name: Send CI Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: ./scripts/ci-email.sh