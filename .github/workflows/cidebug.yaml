name: Pre-Main CI Debug

on:
  push:
    branches:
      - pre-main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Run Tests
        run: ./scripts/ci-test.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: ./scripts/ci-sonarcloud.sh
        continue-on-error: true   # keep SonarCloud soft-fail

      - name: Download Trivy HTML Template
        run: curl --proto '=https' --tlsv1.2 -sSLf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy FS Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: template
          template: "@html.tpl"
          output: trivy-fs-report.html
          ignore-unfixed: true
          vuln-type: os,library

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./scripts/ci-owasp.sh

      - name: Security Checks
        run: ./scripts/ci-security-checks.sh

      - name: Send CI Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: ./scripts/ci-email.sh