name: CI Commit Signing & Gitleaks

on:
  workflow_call:

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # SETUP NODE + INSTALL DEPENDENCIES
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Nodemailer
        run: npm install nodemailer@9.0.3

      # ==========================================================
      # VERIFY COMMIT SIGNATURE VIA GITHUB API
      # ==========================================================
      - name: Verify Commit Signature
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;

          const options = {
            hostname: 'api.github.com',
            path: `/repos/${repo}/commits/${sha}`,
            headers: {
              'User-Agent': 'Node.js',
              'Authorization': `token ${token}`
            }
          };

          https.get(options, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                const commitData = JSON.parse(data);
                const verification = commitData.commit.verification || {};
                
                const isVerified = verification.verified === true;
                const reason = verification.reason || 'unknown';
                const signatureText = `Commit SHA: ${sha}\nVerified: ${isVerified}\nReason: ${reason}\nSignature Present: ${!!verification.signature}`;

                fs.writeFileSync('commit-signature.txt', signatureText);

                if (isVerified) {
                  console.log("✅ Commit signature verified via GitHub API");
                } else {
                  console.log(`⚠️ Commit signature status: ${reason}`);
                }
              } catch (err) {
                fs.writeFileSync('commit-signature.txt', `Failed to verify commit via API: ${err.message}`);
              }
            });
          }).on('error', (err) => {
            fs.writeFileSync('commit-signature.txt', `API request failed: ${err.message}`);
          });
          NODE

      # ==========================================================
      # RUN GITLEAKS
      # ==========================================================
      - name: Run Gitleaks
        if: always()
        id: gitleaks
        run: |
          mkdir -p reports/gitleaks
          gitleaks detect --source . \
            --report-format=json \
            --report-path reports/gitleaks/gitleaks-report.json \
            --no-banner

      # ==========================================================
      # GENERATE COMBINED HTML REPORT
      # ==========================================================
      - name: Generate Combined Security HTML Report
        if: always()
        run: |
          mkdir -p reports/security
          node <<'NODE'
          const fs = require("fs");

          let commitLog = "No signature log captured.";
          try {
            commitLog = fs.readFileSync("commit-signature.txt","utf8");
          } catch {}

          const commitStatus = commitLog.includes("Verified: true")
            ? "Commit signature verified ✓"
            : "Commit not signed ✗";

          let gitleaksReport = "No gitleaks report found.";
          try {
            const raw = fs.readFileSync("reports/gitleaks/gitleaks-report.json","utf8");
            gitleaksReport = JSON.stringify(JSON.parse(raw), null, 2);
          } catch {}

          const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Security Report</title>
            <style>
              body { background:#07111f; color:#f8fafc; font-family:Arial,sans-serif; padding:24px; }
              .panel { background:#0d1a2b; border:1px solid #263a56; border-radius:16px; padding:24px; max-width:900px; margin:auto; }
              h1 { font-size:24px; margin:0 0 12px; }
              .status { font-weight:bold; color:${commitStatus.includes("✓") ? "#34d399" : "#f87171"}; }
              pre { background:#102138; padding:12px; border-radius:8px; font-size:12px; overflow-x:auto; }
            </style>
          </head>
          <body>
            <div class="panel">
              <h1>Commit Signing Verification</h1>
              <div class="status">${commitStatus}</div>
              <h2>Raw Signature Output</h2>
              <pre>${commitLog}</pre>
            </div>
            <div class="panel" style="margin-top:20px;">
              <h1>Gitleaks Secret Scan</h1>
              <pre>${gitleaksReport}</pre>
            </div>
          </body>
          </html>`;
          fs.writeFileSync("reports/security/security-report.html", html);
          NODE

      # ==========================================================
      # UPLOAD HTML REPORT
      # ==========================================================
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security/security-report.html
          retention-days: 14

      # ==========================================================
      # EMAIL HTML REPORT
      # ==========================================================
      - name: Email Security Report
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          QA_EMAIL_TO: ${{ secrets.QA_EMAIL_TO }}
          QA_EMAIL_CC: ${{ secrets.QA_EMAIL_CC }}
        run: |
          node <<'NODE'
          const nodemailer = require("nodemailer");
          const fs = require("fs");

          const emailUser = process.env.EMAIL_USER;
          const emailPass = process.env.EMAIL_PASS;
          const emailTo = process.env.QA_EMAIL_TO;
          const emailCc = process.env.QA_EMAIL_CC || "";

          const htmlBody = fs.readFileSync("reports/security/security-report.html","utf8");

          const transporter = nodemailer.createTransport({
            service: "gmail",
            auth: { user: emailUser, pass: emailPass }
          });

          (async () => {
            await transporter.sendMail({
              from: emailUser,
              to: emailTo,
              cc: emailCc,
              subject: "Security Report - Commit Signing & Gitleaks",
              html: htmlBody,
              attachments: [
                { filename: "security-report.html", path: "reports/security/security-report.html" }
              ]
            });
            console.log("Security report emailed successfully.");
          })();
          NODE
