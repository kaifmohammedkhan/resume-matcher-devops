name: Jenkins Agent Runner

on:
  workflow_dispatch:
    inputs:
      jenkins_url:
        description: 'Jenkins Controller URL'
        required: true
      agent_name:
        description: 'Jenkins Agent Name'
        required: true
      agent_secret:
        description: 'Jenkins Agent Secret'
        required: true

jobs:
  run-jenkins-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Jenkins Agent JAR
        run: |
          curl -H "ngrok-skip-browser-warning: true" -sO "${{ inputs.jenkins_url }}/jnlpJars/agent.jar"

      - name: Run Jenkins Agent
        run: |
          java -jar agent.jar \
            -url "${{ inputs.jenkins_url }}" \
            -secret "${{ inputs.agent_secret }}" \
            -name "${{ inputs.agent_name }}" \
            -webSocket \
            -workDir "/home/runner/agent"