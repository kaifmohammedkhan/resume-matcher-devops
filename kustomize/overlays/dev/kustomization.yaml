apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Service patch (already working)
  - target:
      kind: Service
      name: resume-matcher-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: replace
        path: /spec/selector
        value:
          app: resume-matcher-ghcr
      - op: replace
        path: /spec/ports
        value:
          - name: http
            port: 3000
            targetPort: 3000
          - name: metrics
            port: 51113
            targetPort: 51113

  # Deployment patch (new)
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: resume-matcher-ghcr
