apiVersion: v1
kind: Service
metadata:
  name: resume-matcher-service
spec:
  type: LoadBalancer   # ✅ prod: external access via MetalLB
  selector:
    app: resume-matcher-ghcr
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 51113
      targetPort: 51113
