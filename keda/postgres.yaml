apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      serviceAccountName: postgres-sa
      automountServiceAccountToken: false

      # Ensure pod runs on the node where PVC was provisioned
      nodeSelector:
        kubernetes.io/hostname: kind-node-worker

      containers:
        - name: postgres
          image: postgres:15

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: db-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data

            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc

        - name: init-script
          configMap:
            name: resume-config