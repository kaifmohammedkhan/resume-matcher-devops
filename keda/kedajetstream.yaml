# NATS StatefulSet (memory-only JetStream)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: nats-system
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10.14
        args: ["-c", "/etc/nats-config/nats.conf"]
        ports:
        - name: client
          containerPort: 4222
        - name: cluster
          containerPort: 6222
        - name: monitor
          containerPort: 8222
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nats-config
      volumes:
      - name: config-volume
        configMap:
          name: nats-config

---
# ConfigMap with JetStream enabled (memory store)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats-system
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream: {
      max_mem_store: 1Gb
    }

---
# ClusterIP Service exposing monitoring port
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats-system
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: cluster
    port: 6222
    targetPort: 6222
  - name: monitor
    port: 8222
    targetPort: 8222

---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: nats-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: cluster
    port: 6222
    targetPort: 6222
  - name: monitor
    port: 8222
    targetPort: 8222

---
# KEDA ScaledObject with explicit connection safety fallback and rapid scale-down
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: resume-parser-jetstream
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-matcher-ghcr  # 🎯 Targets your main web application deployment
  minReplicaCount: 1         # 🌐 Keeps 1 pod alive 24/7 so port-forward tunnels don't drop
  maxReplicaCount: 15
  cooldownPeriod: 10      # KEDA specific countdown (10 seconds)
  pollingInterval: 10     # Scrape NATS rapidly every 10 seconds
  
  # Prevents KEDA from using the cooldown window on fresh object creation
  initialCooldownPeriod: 0

  # Ensure KEDA stays at 1 replica baseline if metrics cannot be scraped
  fallback:
    failureThreshold: 3
    replicas: 1

  # Overrides the default 5-minute Kubernetes engine lock
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0  # Drops native HPA delay completely
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15            # Scales down the active pods cleanly within 15s

  triggers:
  - type: nats-jetstream
    metadata:
      # KEDA uses lagThreshold
      lagThreshold: "5"
      
      # Target JetStream configuration parameters
      stream: "RESUMES"
      consumer: "resume-parser"
      account: "$G"
      
      # Cross-namespace monitoring path
      natsServerMonitoringEndpoint: "nats-headless.nats-system.svc.cluster.local:8222"