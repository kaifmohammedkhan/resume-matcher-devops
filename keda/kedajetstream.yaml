# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats-sa
  namespace: nats-system
automountServiceAccountToken: false

---
# NATS StatefulSet (memory-only JetStream)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: nats-system
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      serviceAccountName: nats-sa
      automountServiceAccountToken: false

      containers:
        - name: nats
          image: nats:2.10.14

          args:
            - "-c"
            - "/etc/nats-config/nats.conf"

          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"

          volumeMounts:
            - name: config-volume
              mountPath: /etc/nats-config

      volumes:
        - name: config-volume
          configMap:
            name: nats-config

---
# ConfigMap with JetStream enabled (memory store)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats-system
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream: {
      max_mem_store: 1Gb
    }

---
# ClusterIP Service exposing monitoring port
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats-system
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: cluster
      port: 6222
      targetPort: 6222
    - name: monitor
      port: 8222
      targetPort: 8222

---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: nats-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: cluster
      port: 6222
      targetPort: 6222
    - name: monitor
      port: 8222
      targetPort: 8222

---
# KEDA ScaledObject
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: resume-parser-jetstream
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-matcher-ghcr

  minReplicaCount: 1
  maxReplicaCount: 15
  cooldownPeriod: 10
  pollingInterval: 10
  initialCooldownPeriod: 0

  fallback:
    failureThreshold: 3
    replicas: 1

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  triggers:
    - type: nats-jetstream
      metadata:
        lagThreshold: "5"
        stream: "RESUMES"
        consumer: "resume-parser"
        account: "$G"
        natsServerMonitoringEndpoint: "nats-headless.nats-system.svc.cluster.local:8222"