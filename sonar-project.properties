sonar.projectKey=kaifmohamedkhan_resume-matcher-devops
sonar.organization=kaifmohammedkhan
sonar.host.url=https://sonarcloud.io

# Define your main source folder
sonar.sources=src

# Broaden test inclusions to catch .jsx files as well
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.test.jsx,**/*.spec.jsx

# Point directly to the lcov coverage report generated by Jest/Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude node_modules, build artifacts, configs, test files, and setup files
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,*.config.js,*.json,kubernetes/**,scripts/**,public/**,**/*.d.ts,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.test.jsx,**/*.spec.jsx,**/jest.polyfills.js,**/jest.setup.js

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true