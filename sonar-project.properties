sonar.projectKey=kaifmohamedkhan_resume-matcher-devops
sonar.organization=kaifmohammedkhan
sonar.host.url=https://sonarcloud.io

# ============================================================
# SOURCE ANALYSIS
# ============================================================

# Analyze the complete application repository.
# This allows SonarCloud to see:
# src/, lib/, api/, server.js, etc.
sonar.sources=.

# ============================================================
# TEST FILES
# ============================================================

# Do NOT mark the entire repository as tests.
# Only the actual test files are test files.
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.test.jsx,**/*.spec.jsx

# ============================================================
# JAVASCRIPT / TYPESCRIPT COVERAGE
# ============================================================

# Jest generates this file.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ============================================================
# SOURCE EXCLUSIONS
# ============================================================

# Files/directories that should not be treated as application
# source code by SonarCloud.
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/.git/**,\
**/.github/**,\
**/public/**,\
**/kubernetes/**,\
**/scripts/**,\
**/cypress/**,\
**/tests/**,\
**/*.config.js,\
**/*.json,\
**/*.test.js,\
**/*.spec.js,\
**/*.test.ts,\
**/*.test.jsx,\
**/*.spec.jsx,\
**/jest.polyfills.js,\
**/jest.setup.js

# ============================================================
# TEST EXCLUSIONS
# ============================================================

sonar.test.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**

# ============================================================
# ENCODING
# ============================================================

sonar.sourceEncoding=UTF-8

# ============================================================
# QUALITY GATE
# ============================================================

sonar.qualitygate.wait=true